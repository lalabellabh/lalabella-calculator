<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Café Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".wrap, .card">
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#f6efe6,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 80px; }
  header{ padding-left:56px; margin:6px 0 6px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar input,.bar select,.btn{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .btn.go{ background:linear-gradient(135deg,#c9506b,#9e2f4a); color:#fff; border:0; font-weight:700; }
  .btn.ok{ background:var(--ok); color:#fff; border:0; font-weight:700; }
  .card{ background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .card h2{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 10px; }
  .card label{ display:block; font-size:11.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
  .card input,.card select{ width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .g3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
  @media(max-width:620px){ .g2,.g3{ grid-template-columns:1fr; } }
  .pic{ width:44px; height:44px; flex:none; border-radius:10px; background:#f3ece6 center/cover no-repeat; border:1px dashed #d9c7bd; display:flex; align-items:center; justify-content:center; font-size:17px; color:#b9a49a; }
  .pic.has{ border-style:solid; border-color:#eadbd4; cursor:zoom-in; } .pic.can{ cursor:pointer; }
  .row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .nm{ flex:1; min-width:0; font-weight:700; font-size:14px; } .nm small{ display:block; font-weight:400; color:var(--dim); font-size:11.5px; }
  .grp{ font-size:12px; font-weight:800; color:#7a5a20; background:#faf5ef; padding:6px 10px; border-radius:8px; margin:10px 0 2px; }
  .zero{ color:var(--bad); } .soon{ color:#a8560b; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
  .msg{ font-size:12.5px; color:var(--dim); }
  .wrap{ max-width:1250px; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi{ background:var(--card,#fff); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .kpi b{ display:block; font-size:24px; font-family:'Space Grotesk',sans-serif; } .kpi span{ font-size:12px; color:var(--dim); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media(max-width:860px){ .grid2{ grid-template-columns:1fr; } }
  .tb{ width:100%; border-collapse:collapse; font-size:13px; } .tb td,.tb th{ padding:7px 6px; border-top:1px solid var(--line); text-align:left; } .tb th{ font-size:11px; color:var(--dim); text-transform:uppercase; border-top:0; }
  .tb td.r,.tb th.r{ text-align:right; } .bar{ height:6px; border-radius:3px; background:linear-gradient(90deg,#c9506b,#e0b75a); margin-top:3px; }
  .bars{ display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px; } .bars div{ flex:1; text-align:center; font-size:11px; color:var(--dim); } .bars i{ display:block; background:#c9506b; border-radius:6px 6px 0 0; margin:0 auto 4px; width:70%; }
  .note{ font-size:12px; color:var(--dim); margin-top:6px; }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<script src="shared/cafe-common.js"></script>
<div class="wrap">
  <header><h1>📊 Café Dashboard</h1><div class="sub">Fast moving, slow moving, low stock and expiry — from your stock counts and receiving.</div></header>
  <div id="tabs"></div>
  <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="margin:0">Period</label>
    <select id="days" style="max-width:180px"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="180">Last 6 months</option><option value="365">Last 12 months</option></select>
    <span class="note" id="info"></span></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card"><h2>🚀 Fast moving</h2><div id="fast"></div></div>
    <div class="card"><h2>🐢 Slow / not moving</h2><div id="slow"></div></div>
    <div class="card"><h2>⚠️ Low stock (runs out soon)</h2><div id="low"></div></div>
    <div class="card"><h2>⏰ Expiring soon / expired</h2><div id="exp"></div></div>
  </div>
  <div class="card"><h2>🛒 Receiving per month (lines)</h2><div id="months"></div></div>
</div>
<script>
(function(){
  var C = window.LBCafe, esc = C.esc, $ = function(id){ return document.getElementById(id); };
  $('tabs').innerHTML = C.tabs('cafe-dashboard.html');
  function dd(e, t){ return Math.round((new Date(e + 'T00:00:00') - new Date(t + 'T00:00:00')) / 86400000); }
  function tbl(head, rows, empty){ return rows.length ? '<table class="tb"><thead><tr>' + head + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>' : '<div class="empty">' + empty + '</div>'; }
  function nm(r){ return '<td>' + esc(r.name) + '<div class="note" style="margin:0">' + esc(r.category || '') + (r.code ? ' · ' + esc(r.code) : '') + '</div></td>'; }
  function load(){
    $('kpis').innerHTML = '<div class="empty">Loading…</div>';
    C.api({ action:'dashboard', days:$('days').value }).then(function(d){
      if(!d || !d.success){ $('kpis').innerHTML = '<div class="empty">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
      var R = d.rows, t = d.today;
      var moving = R.filter(function(r){ return r.perMonth > 0; }).sort(function(a, b){ return b.perMonth - a.perMonth; });
      var max = moving.length ? moving[0].perMonth : 1;
      var slow = R.filter(function(r){ return r.perMonth == null || r.perMonth === 0; });
      var low = R.filter(function(r){ return r.daysLeft != null && r.daysLeft <= 30; }).sort(function(a, b){ return a.daysLeft - b.daysLeft; });
      var out = R.filter(function(r){ return r.countDate && r.stock <= 0; });
      var ex = R.filter(function(r){ return r.expired || (r.nextExpiry && dd(r.nextExpiry, t) <= 60); }).sort(function(a, b){ return (a.nextExpiry || '0') < (b.nextExpiry || '0') ? -1 : 1; });
      $('info').textContent = d.counts + ' stock count(s) saved · ' + d.receiveLines + ' receiving line(s) · since ' + C.fd(d.since);
      $('kpis').innerHTML = [[R.length, 'Café items'], [moving.length, 'Moving items'], [low.length + out.length, 'Low / out of stock'], [ex.length, 'Expiring ≤ 60 days / expired'], [d.counts, 'Counts saved']].map(function(k){ return '<div class="kpi"><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('');
      $('fast').innerHTML = tbl('<th>Item</th><th class="r">Used / month</th><th class="r">Stock</th>', moving.slice(0, 12).map(function(r){ return '<tr>' + nm(r) + '<td class="r"><b>' + C.n3(r.perMonth) + '</b> ' + esc(r.unit) + '<div class="bar" style="width:' + Math.max(6, r.perMonth / max * 100) + '%;margin-left:auto"></div></td><td class="r">' + C.n3(r.stock) + '</td></tr>'; }),
        d.counts < 2 ? 'Need at least 2 stock counts to see what moves. Save this month\'s count, then next month\'s.' : 'Nothing used in this period.');
      $('slow').innerHTML = tbl('<th>Item</th><th class="r">Stock</th><th>Last count</th>', slow.map(function(r){ return '<tr>' + nm(r) + '<td class="r">' + C.n3(r.stock) + ' ' + esc(r.unit) + '</td><td>' + (r.countDate ? C.fd(r.countDate) : '<span class="soon">not counted</span>') + '</td></tr>'; }), 'All items are moving 👍');
      $('low').innerHTML = tbl('<th>Item</th><th class="r">Stock</th><th class="r">Days left</th>', out.map(function(r){ return '<tr>' + nm(r) + '<td class="r zero">0</td><td class="r zero">OUT</td></tr>'; }).concat(low.map(function(r){ return '<tr>' + nm(r) + '<td class="r">' + C.n3(r.stock) + ' ' + esc(r.unit) + '</td><td class="r ' + (r.daysLeft <= 7 ? 'zero' : 'soon') + '">' + r.daysLeft + '</td></tr>'; })), d.counts < 2 ? 'Shows after 2 counts.' : 'No low stock 👍');
      $('exp').innerHTML = tbl('<th>Item</th><th>Expiry</th><th class="r">Stock</th>', ex.map(function(r){ var x = r.nextExpiry ? dd(r.nextExpiry, t) : -1; return '<tr>' + nm(r) + '<td class="' + (r.expired ? 'zero' : 'soon') + '">' + (r.expired ? 'EXPIRED' : C.fd(r.nextExpiry) + ' (' + x + ' days)') + '</td><td class="r">' + C.n3(r.stock) + '</td></tr>'; }), 'Nothing expiring in 60 days 👍');
      var M = Object.keys(d.receivingByMonth || {}).sort().slice(-12), mx = Math.max.apply(null, M.map(function(m){ return d.receivingByMonth[m]; }).concat([1]));
      $('months').innerHTML = M.length ? '<div class="bars">' + M.map(function(m){ var v = d.receivingByMonth[m]; return '<div><b style="color:var(--ink)">' + v + '</b><i style="height:' + Math.max(4, v / mx * 100) + 'px"></i>' + m.slice(5) + '/' + m.slice(2, 4) + '</div>'; }).join('') + '</div>' : '<div class="empty">No receiving yet.</div>';
    }).catch(function(){ $('kpis').innerHTML = '<div class="empty">Connection problem.</div>'; });
  }
  $('days').onchange = load; load();
})();
</script>
</body>
</html>
