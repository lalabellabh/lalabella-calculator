<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".wrap, .gift, .ord">
<link rel="stylesheet" href="shared/glass-skin.css">
<script src="shared/glass-skin.js"></script>
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --rose:#c9506b; --red:#d32f2f; --ok:#2f7a4f; --line:#ecdfe3; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:#f7eef0; }
  .wrap{ max-width:1100px; margin:0 auto; padding:16px 16px 60px; }
  header{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin:6px 0 14px; padding-left:56px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .bar select,.bar button{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .bar .snd.on{ background:#2f7a4f; color:#fff; border-color:#2f7a4f; }
  .live{ font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#2ecc71; animation:bl 1s infinite alternate; }
  .dot.stale{ background:#e0a03a; animation:none; } .dot.off{ background:#d32f2f; animation:none; }
  @keyframes bl{ to{ opacity:.3; } }
  h2{ font-size:15px; margin:18px 0 8px; display:flex; align-items:center; gap:8px; }
  h2 .n{ background:var(--ink); color:#fff !important; border-radius:99px; padding:1px 9px; font-size:12px; }
  h2 .n.red{ background:var(--red); }
  .card{ background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:14px; padding:4px 12px; }
  .ord{ display:grid; grid-template-columns:120px 1fr 1fr 1.3fr 90px 110px; gap:10px; align-items:center; padding:11px 0; border-top:1px solid var(--line); font-size:13px; background:transparent; }
  .ord:first-child{ border-top:0; }
  .ord .no{ font-weight:800; font-size:16px; }
  .ord .br{ font-size:11.5px; font-weight:700; color:var(--rose); }
  .ord .m{ font-size:11.5px; color:var(--dim); }
  .ord.new{ background:linear-gradient(90deg,rgba(211,47,47,.10),transparent 60%); border-radius:10px; padding-left:8px; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 50%{ background-color:rgba(211,47,47,.08); } }
  .badge{ display:inline-block; background:var(--red); color:#fff !important; font-size:10.5px; font-weight:800; border-radius:6px; padding:2px 7px; margin-left:6px; letter-spacing:.05em; vertical-align:middle; animation:bl .7s infinite alternate; }
  .seen{ font-size:11px; color:var(--ok); font-weight:600; }
  .ack{ border:0; border-radius:9px; padding:8px 10px; font:inherit; font-size:12.5px; font-weight:700; background:var(--ok); color:#fff; cursor:pointer; width:100%; }
  .un{ display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
  .un:first-child{ border-top:0; }
  .un b{ font-size:15px; color:var(--red); }
  .empty{ color:var(--dim); font-size:13px; padding:14px 0; text-align:center; }
  .done .ord{ opacity:.6; }
  /* the gift */
  .gift{ position:fixed; inset:0; z-index:99999; display:none; align-items:center; justify-content:center; background:rgba(30,10,20,.55); padding:16px; }
  .gift.show{ display:flex; }
  .gbox{ background:#fff; border-radius:22px; width:min(420px,100%); padding:22px 20px 18px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.45); animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop{ from{ transform:scale(.4); opacity:0; } }
  .gico{ font-size:84px; line-height:1; display:inline-block; animation:shake 1s ease-in-out infinite; }
  @keyframes shake{ 0%,100%{ transform:rotate(0) scale(1); } 20%{ transform:rotate(-12deg) scale(1.08); } 40%{ transform:rotate(10deg) scale(1.08); } 60%{ transform:rotate(-6deg); } }
  .gbox h3{ margin:8px 0 2px; font-size:22px; color:var(--red); font-family:'Fraunces',serif; }
  .glist{ margin:10px 0 14px; text-align:left; max-height:40vh; overflow:auto; }
  .glist div{ border-top:1px solid var(--line); padding:7px 2px; font-size:13px; }
  .glist b{ font-size:16px; }
  .gbtn{ border:0; border-radius:12px; padding:12px; width:100%; font:inherit; font-weight:800; font-size:15px; background:linear-gradient(135deg,#2f7a4f,#3f9a65); color:#fff; cursor:pointer; }
  @media (max-width:760px){
    header{ padding-left:52px; }
    .ord{ grid-template-columns:1fr 1fr; gap:4px 10px; }
    .ord .addr{ grid-column:1/-1; }
    .ord .act{ grid-column:1/-1; }
  }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<div class="wrap">
  <header>
    <div>
      <h1>🎁 Live Orders</h1>
      <div class="sub">From lalabella.web.app · newest order given to a branch is always on top</div>
    </div>
    <div class="bar">
      <select id="br"><option value="All">All branches</option></select>
      <button id="snd" class="snd" title="Alarm sound">🔕 Sound off — tap to turn on</button>
      <button id="ackAll" title="Mark all NEW as seen">✓ All seen</button>
      <span class="live"><span class="dot" id="dot"></span><span id="liveTxt">Loading…</span></span>
    </div>
  </header>

  <h2>⚠️ Unassigned <span class="n red" id="nUn">0</span></h2>
  <div class="card" id="unList"><div class="empty">Loading…</div></div>

  <h2>🆕 Given to a branch <span class="n" id="nNew">0</span></h2>
  <div class="card" id="newList"><div class="empty">Loading…</div></div>

  <h2 style="color:var(--dim)">✔ Just moved on (processed in the last 6 h)</h2>
  <div class="card done" id="doneList"><div class="empty">—</div></div>
</div>

<div class="gift" id="gift"><div class="gbox">
  <div class="gico">🎁</div>
  <h3>NEW ORDER!</h3>
  <div class="sub" id="gsub"></div>
  <div class="glist" id="glist"></div>
  <button class="gbtn" id="gok">✓ Nakita ko</button>
</div></div>

<script>
(function(){
  var API = (window.LALABELLA_CONFIG && LALABELLA_CONFIG.ORDER_ASSIGN_FAST_API) || 'https://zoratiahjeldgsognfsj.supabase.co/functions/v1/orderassign-fast';
  var esc = window.lbEsc, $ = function(id){ return document.getElementById(id); };
  function token(){ try{ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }catch(e){ return ''; } }
  function me(){ try{ return JSON.parse(sessionStorage.getItem('lalabellaUser') || localStorage.getItem('lalabellaUser') || '{}') || {}; }catch(e){ return {}; } }
  function brKey(b){ b = String(b || '').toLowerCase().replace(/[^a-z]/g, ''); return b === 'galali' ? 'qalali' : b; }
  function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function ago(t){ var s = Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 1000)); if(s < 60) return s + 's ago'; if(s < 3600) return Math.round(s / 60) + ' min ago'; return Math.round(s / 3600) + ' h ago'; }

  // ---- branch picker: remembered; staff start on their own branch ----
  var BRS = ['Moda Mall', 'Qalali', 'Hamala'];
  BRS.forEach(function(b){ var o = document.createElement('option'); o.value = b; o.textContent = b; $('br').appendChild(o); });
  var u = me(), saved = ls('lbLiveBranch');
  var start = saved || (u.branch && String(u.role || '').toLowerCase() !== 'admin' ? (BRS.filter(function(b){ return brKey(b) === brKey(u.branch); })[0] || 'All') : 'All');
  $('br').value = start;
  $('br').onchange = function(){ ls('lbLiveBranch', $('br').value); giftShown = {}; render(); };
  var params = new URLSearchParams(location.search); if(params.get('branch')){ $('br').value = params.get('branch'); }

  // ---- alarm sound (browsers need one tap first) ----
  var ctx = null, soundOn = ls('lbLiveSound') === '1';
  function audio(){ try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if(ctx.state === 'suspended') ctx.resume(); }catch(e){} return ctx; }
  function paintSnd(){ $('snd').textContent = soundOn ? '🔔 Sound on' : '🔕 Sound off — tap to turn on'; $('snd').classList.toggle('on', soundOn); }
  $('snd').onclick = function(){ soundOn = !soundOn; ls('lbLiveSound', soundOn ? '1' : '0'); if(soundOn){ audio(); chime(); } paintSnd(); };
  document.addEventListener('pointerdown', function(){ if(soundOn) audio(); }, { once:true });
  paintSnd();
  function chime(){
    if(!soundOn) return; var c = audio(); if(!c) return;
    [784, 988, 1175, 1568, 1175, 1568].forEach(function(f, i){ var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i * .16;
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .32); });
  }
  var ringT = 0;
  function ringOn(){ if(ringT) return; chime(); ringT = setInterval(chime, 6000); }
  function ringOff(){ clearInterval(ringT); ringT = 0; }

  var DATA = null, giftShown = {};
  function mine(rows){ var b = $('br').value; return b === 'All' ? rows : rows.filter(function(o){ return brKey(o.branch) === brKey(b); }); }
  function ordRow(o, isDone){
    var isNew = !isDone && !o.ackAt;
    return '<div class="ord' + (isNew ? ' new' : '') + '">' +
      '<div><div class="no">' + esc(o.orderNo) + (isNew ? '<span class="badge">NEW</span>' : '') + '</div><div class="br">' + esc(o.branch || '—') + (o.tag ? ' · ' + esc(o.tag) : '') + '</div><div class="m">' + (isDone ? 'moved ' + ago(o.goneAt) : 'given ' + ago(o.assignedAt)) + '</div></div>' +
      '<div><div>' + esc(o.method || '') + '</div><div class="m">' + esc(o.date || '') + (o.time ? '<br>' + esc(o.time) : '') + '</div></div>' +
      '<div><div>' + esc(o.receiver || o.sender || '') + '</div><div class="m">' + esc(o.receiverPhone || o.senderPhone || '') + (o.sender && o.receiver && o.sender !== o.receiver ? '<br>from ' + esc(o.sender) : '') + '</div></div>' +
      '<div class="addr m">' + esc(o.address || '') + '</div>' +
      '<div><b>' + esc(o.price || '') + '</b></div>' +
      '<div class="act">' + (isDone ? '' : isNew ? '<button class="ack" data-ack="' + esc(o.id) + '">✓ Nakita ko</button>' : '<span class="seen">✓ Seen' + (o.ackBy ? ' by ' + esc(o.ackBy) : '') + '</span>') + '</div></div>';
  }
  function render(){
    if(!DATA) return;
    var un = DATA.unassigned || [];
    $('nUn').textContent = un.length;
    $('unList').innerHTML = un.length ? un.map(function(o){ return '<div class="un"><b>' + esc(o.orderNo) + '</b><span style="flex:1">' + esc(o.address || 'no address') + '</span><span class="m">' + (o.branch ? '→ ' + esc(o.branch) : esc(o.note || 'for manual assign')) + '</span></div>'; }).join('') : '<div class="empty">✅ No unassigned orders</div>';
    var rows = mine(DATA.orders || []);
    rows.sort(function(a, b){ var na = a.ackAt ? 1 : 0, nb = b.ackAt ? 1 : 0; if(na !== nb) return na - nb; return new Date(b.assignedAt) - new Date(a.assignedAt); });   // NEW first, newest on top
    $('nNew').textContent = rows.length;
    $('newList').innerHTML = rows.length ? rows.map(function(o){ return ordRow(o, false); }).join('') : '<div class="empty">No new orders for this branch</div>';
    var done = mine(DATA.recentlyDone || []);
    $('doneList').innerHTML = done.length ? done.slice(0, 12).map(function(o){ return ordRow(o, true); }).join('') : '<div class="empty">—</div>';
    // gift for NEW ones not yet shown in this tab
    var fresh = rows.filter(function(o){ return !o.ackAt && !giftShown[o.id]; });
    if(fresh.length){ fresh.forEach(function(o){ giftShown[o.id] = 1; }); showGift(rows.filter(function(o){ return !o.ackAt; })); }
    if(!rows.some(function(o){ return !o.ackAt; })){ ringOff(); $('gift').classList.remove('show'); }
    // live check
    var last = DATA.unassignedUpdated ? new Date(DATA.unassignedUpdated).getTime() : 0, age = (Date.now() - last) / 1000;
    $('dot').className = 'dot' + (!last || age > 300 ? ' off' : age > 90 ? ' stale' : '');
    $('liveTxt').textContent = !last ? 'Tampermonkey not reporting' : age > 300 ? 'Tampermonkey stopped ' + ago(last) + ' — open lalabella.web.app' : 'Live · checked ' + ago(last);
  }
  function showGift(list){
    $('gsub').textContent = list.length === 1 ? 'An order was given to ' + (list[0].branch || 'a branch') : list.length + ' new orders waiting';
    $('glist').innerHTML = list.slice(0, 8).map(function(o){ return '<div><b>' + esc(o.orderNo) + '</b> → ' + esc(o.branch || '—') + '<br><span class="m">' + esc(o.method || '') + ' · ' + esc(o.date || '') + ' ' + esc(o.time || '') + '</span></div>'; }).join('');
    $('gift').classList.add('show'); ringOn();
    try{ if(navigator.vibrate) navigator.vibrate([300, 150, 300]); }catch(e){}
  }
  function ack(body){
    var t = token(); var q = new URLSearchParams(body); q.set('action', 'ackLiveOrder'); q.set('token', t);
    return fetch(API, { method:'POST', body:q }).then(function(r){ return r.json(); });
  }
  $('gok').onclick = function(){
    $('gift').classList.remove('show'); ringOff();
    var ids = mine(DATA.orders || []).filter(function(o){ return !o.ackAt; }).map(function(o){ return o.id; });
    Promise.all(ids.map(function(id){ return ack({ id:id }); })).then(load);
  };
  $('ackAll').onclick = function(){ if(!confirm('Mark all NEW orders' + ($('br').value === 'All' ? '' : ' of ' + $('br').value) + ' as seen?')) return; ack({ all:'1', branch:$('br').value }).then(load); };
  document.addEventListener('click', function(e){ var b = e.target.closest('[data-ack]'); if(!b) return; b.disabled = true; ack({ id:b.getAttribute('data-ack') }).then(load); });

  var busy = false;
  function load(){
    if(busy) return; busy = true;
    fetch(API + '?action=getLiveOrders&token=' + encodeURIComponent(token()) + '&_=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.success){ DATA = d; render(); } else if(d && d.error){ $('liveTxt').textContent = d.error; }
    }).catch(function(){ $('liveTxt').textContent = 'Connection problem — retrying…'; $('dot').className = 'dot off'; }).then(function(){ busy = false; });
  }
  load(); setInterval(function(){ if(!document.hidden) load(); }, 5000);
  setInterval(function(){ if(DATA) render(); }, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
