<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella • Duty Schedule</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:linear-gradient(135deg,#fdf1f0,#eaf3ec);font:14px system-ui;color:#3a2530;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #f0d9d9;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #9e2f4a12}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}select,input,button{padding:11px;border:1px solid #f0d9d9;border-radius:10px;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:#c9506b;color:#fff;border:0}.muted{color:#8a7078;font-size:12px}.row{display:grid;grid-template-columns:1.3fr .8fr .6fr 2fr;gap:10px;padding:12px 4px;border-bottom:1px solid #f5e8e8;align-items:start}.head{font-weight:700;color:#8a7078;font-size:11px;text-transform:uppercase}@media(max-width:700px){.filters,.row{grid-template-columns:1fr}.head{display:none}}</style></head><body><main class="wrap"><div class="card"><div class="muted">LALABELLA SYSTEM • SUPABASE</div><h1>📅 Duty Schedule</h1><div id="who" class="muted">Checking session…</div></div><div class="card"><div class="filters"><select id="branch"><option value="All">All Branches</option></select><select id="employee"><option value="All">All Employees</option></select><input id="week" type="date"></div></div><div class="card"><div class="row head"><span>Employee</span><span>Branch</span><span>Day</span><span>Schedule</span></div><div id="list">Loading…</div></div><div class="card"><button id="out">Sign out</button></div></main><script>const $=id=>document.getElementById(id);let p,rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){let u=await sbAuth.getUser();if(!u)return location='login.html';p=await sbAuth.getProfile();if(!p)return location='login.html';$('who').textContent=`${p.full_name||u.email} • ${p.role} • ${p.branch||'All branches'}`;let r=await sb.from('duty_schedule').select('*').order('employee').order('day');if(r.error)throw r.error;rows=r.data||[];let bs=[...new Set(rows.map(x=>x.home_branch).filter(Boolean))].sort(),es=[...new Set(rows.map(x=>x.employee).filter(Boolean))].sort();$('branch').innerHTML='<option value="All">All Branches</option>'+bs.map(x=>`<option>${esc(x)}</option>`).join('');$('employee').innerHTML='<option value="All">All Employees</option>'+es.map(x=>`<option>${esc(x)}</option>`).join('');if(p.branch)$('branch').value=p.branch;render()}function render(){let b=$('branch').value,e=$('employee').value,w=$('week').value;let a=rows.filter(x=>(b==='All'||x.home_branch===b)&&(e==='All'||x.employee===e)&&(!w||String(x.week_of).slice(0,10)===w));$('list').innerHTML=a.map(x=>`<div class="row"><b>${esc(x.employee)}${x.role?`<br><span class="muted">${esc(x.role)}</span>`:''}</b><span>${esc(x.home_branch)}</span><b>${esc(x.day)}</b><span>${esc(x.schedule_detail)}</span></div>`).join('')||'<div class="muted">No schedule found.</div>'}$('branch').onchange=render;$('employee').onchange=render;$('week').onchange=render;$('out').onclick=async()=>{await sbAuth.signOut();location='login.html'};boot().catch(e=>{$('who').textContent=e.message||String(e)})</script></body></html>
