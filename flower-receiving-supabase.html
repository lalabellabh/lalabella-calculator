<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella · Flower Receiving</title>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script>
<style>
:root{--bg:#fff9fb;--card:#fff;--ink:#3d2932;--muted:#8d747d;--rose:#c84f72;--rose2:#e47d9a;--line:#eadbe1;--gold:#c79743;--green:#5c8c64}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#f9dce5,transparent 30%),linear-gradient(180deg,#fff9fb,#fff);color:var(--ink);font:14px Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}a{color:var(--rose);text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font:700 25px Georgia,serif}.badge{font-size:11px;color:var(--muted)}h1{font:600 42px Georgia,serif;margin:8px 0}.sub{color:var(--muted);margin-bottom:24px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 30px rgba(80,40,55,.07)}.title{font:700 18px Georgia,serif;margin-bottom:14px}label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--rose);box-shadow:0 0 0 3px #c84f7218}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff}.soft{background:#fff0f4;color:var(--rose)}.green{background:#edf7ef;color:#3f7047}.row{display:flex;gap:8px;align-items:end}.row>*:first-child{flex:1}.cart{margin-top:18px}.cartrow{display:grid;grid-template-columns:1fr 90px 90px 34px;gap:8px;align-items:center;border-top:1px solid #f1e5e9;padding:10px 0}.cartrow:first-child{border-top:0}.right{text-align:right}.total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:14px;margin-top:8px;font-weight:700;font-size:17px}.history{max-height:430px;overflow:auto}.hist{padding:10px 0;border-bottom:1px solid #f1e5e9}.msg{padding:10px 12px;border-radius:10px;background:#f8eef1;margin-top:12px;display:none}.msg.show{display:block}.danger{color:#a13a50}.small{font-size:11px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}@media(max-width:520px){.two,.three{grid-template-columns:1fr}.cartrow{grid-template-columns:1fr 75px 80px 30px}.wrap{padding:18px 12px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">🌹 Lalabella</div><div class="badge">Supabase Flower Receiving</div></div><a href="index.html">← Tools</a></div><h1>Flower Receiving</h1><div class="sub">Receive flowers into the new Supabase database. Google Sheets / Apps Script is not used by this page.</div>
<div class="grid"><main><section class="card"><div class="title">Receiving details</div><div class="three"><div><label>Branch</label><select id="branch"></select></div><div><label>Entry date</label><input id="entryDate" type="date"></div><div><label>Invoice no.</label><input id="invoiceNo" placeholder="INV-0001"></div></div><div class="two"><div><label>Supplier</label><select id="supplier"><option value="">Select supplier</option></select></div><div><label>Received by</label><select id="receivedBy"><option value="">Select staff</option></select></div></div><div class="two"><div><label>Tax %</label><input id="tax" type="number" step="0.01" value="10"></div><div><label>Invoice total (optional)</label><input id="invoiceTotal" type="number" step="0.001" placeholder="0.000"></div></div></section>
<section class="card" style="margin-top:18px"><div class="title">Add flower</div><div class="row"><div><label>Flower</label><select id="flower"><option value="">Loading catalog…</option></select></div><button class="btn green" id="add" type="button">Add</button></div><div class="two"><div><label>Quantity</label><input id="qty" type="number" min="0.001" step="0.001" value="1"></div><div><label>Rate / unit</label><input id="rate" type="number" min="0" step="0.001" value="0"></div></div><div class="small" id="flowerMeta"></div></section>
<section class="card cart"><div class="title">Receiving cart <span id="count" class="badge">0 items</span></div><div id="cart"><div class="small">No items added.</div></div><div class="total"><span>Calculated total</span><span id="grand">0.000 BD</span></div><button class="btn primary" id="save" style="width:100%;margin-top:16px" disabled>Save receiving</button><div id="msg" class="msg"></div></section></main>
<aside><section class="card"><div class="title">Recent receiving</div><div id="history" class="history"><div class="small">Loading…</div></div></section></aside></div></div>
<script>
let sb,profile,catalog=[],cart=[];
const $=id=>document.getElementById(id); const money=n=>(Number(n)||0).toFixed(3); const today=()=>new Date().toISOString().slice(0,10);
function show(text,bad=false){$('msg').textContent=text;$('msg').className='msg show'+(bad?' danger':'');}
async function boot(){try{await LalabellaSupabase.ready();sb=LalabellaSupabase.client;profile=await LalabellaAuth.getProfile();if(!profile){location.href='index.html';return} $('entryDate').value=today(); await Promise.all([loadBranches(),loadSuppliers(),loadStaff(),loadCatalog()]); await loadHistory()}catch(e){show(e.message||'Unable to start',true)}}
async function loadBranches(){let {data,error}=await sb.from('branch_config').select('name').order('name');if(error)throw error;let current=profile.branch||'';$('branch').innerHTML=data.map(x=>`<option ${x.name===current?'selected':''}>${esc(x.name)}</option>`).join('')}
async function loadSuppliers(){let {data,error}=await sb.from('flower_suppliers').select('supplier_name').order('supplier_name');if(error)throw error;$('supplier').innerHTML='<option value="">Select supplier</option>'+data.map(x=>`<option>${esc(x.supplier_name)}</option>`).join('')}
async function loadStaff(){let {data,error}=await sb.from('flower_staff').select('staff_name').order('staff_name');if(error)throw error;$('receivedBy').innerHTML='<option value="">Select staff</option>'+data.map(x=>`<option>${esc(x.staff_name)}</option>`).join('')}
async function loadCatalog(){let {data,error}=await sb.from('flower_item').select('id,flower_name,rate,item_code,origin,unit,stems_per_bunch,status').order('flower_name').order('id');if(error)throw error;catalog=data.filter(x=>(x.status||'Active').toLowerCase()==='active');$('flower').innerHTML='<option value="">Select flower</option>'+catalog.map((x,i)=>`<option value="${i}">${esc(x.flower_name)} — ${money(x.rate)} BD${x.origin?' · '+esc(x.origin):''}</option>`).join('')}
function selected(){let i=Number($('flower').value);return Number.isInteger(i)&&catalog[i]?catalog[i]:null}
$('flower').addEventListener('change',()=>{let x=selected();if(!x){$('rate').value=0;$('flowerMeta').textContent='';return}$('rate').value=x.rate??0;$('flowerMeta').textContent=[x.item_code,x.origin,x.unit,x.stems_per_bunch?x.stems_per_bunch+' stems/bunch':''].filter(Boolean).join(' · ')})
$('add').onclick=()=>{let x=selected(),q=Number($('qty').value),r=Number($('rate').value);if(!x||!q||q<=0||r<0)return show('Select a flower and valid quantity/rate.',true);cart.push({id:x.id,flower_name:x.flower_name,item_code:x.item_code,origin:x.origin,unit:x.unit,stems_per_bunch:x.stems_per_bunch,qty:q,rate:r,standard_rate:x.rate});render()}
function render(){let c=$('cart');$('count').textContent=cart.length+' item'+(cart.length===1?'':'s');if(!cart.length){c.innerHTML='<div class="small">No items added.</div>';$('grand').textContent='0.000 BD';$('save').disabled=true;return}c.innerHTML=cart.map((x,i)=>`<div class="cartrow"><div><b>${esc(x.flower_name)}</b><div class="small">${money(x.rate)} × ${x.qty} ${esc(x.unit||'')}</div></div><div class="right">${money(x.qty)}</div><div class="right">${money(x.qty*x.rate)}</div><button class="btn soft" onclick="removeItem(${i})">×</button></div>`).join('');let sub=cart.reduce((s,x)=>s+x.qty*x.rate,0);let tax=sub*(Number($('tax').value)||0)/100;$('grand').textContent=money(sub+tax)+' BD';$('save').disabled=false}
window.removeItem=i=>{cart.splice(i,1);render()};$('tax').oninput=render;
$('save').onclick=async()=>{if(!cart.length)return;let btn=$('save');btn.disabled=true;show('Saving…');try{let {data,error}=await sb.rpc('record_flower_receiving',{p_entry_date:$('entryDate').value,p_branch:$('branch').value,p_invoice_no:$('invoiceNo').value.trim()||null,p_supplier:$('supplier').value||null,p_received_by:$('receivedBy').value||null,p_tax_percent:Number($('tax').value)||0,p_invoice_total:Number($('invoiceTotal').value)||null,p_items:cart});if(error)throw error;show('Saved '+data.items+' flower item(s) successfully.');cart=[];render();$('invoiceNo').value='';$('invoiceTotal').value='';await loadHistory()}catch(e){show(e.message||'Save failed',true)}finally{btn.disabled=!cart.length}};
async function loadHistory(){let branch=$('branch').value;let {data,error}=await sb.from('flower_database').select('id,entry_date,invoice_no,supplier,flower_name,qty,rate,amount,received_by').eq('branch',branch).order('id',{ascending:false}).limit(30);if(error){$('history').innerHTML='<div class="small">'+esc(error.message)+'</div>';return}$('history').innerHTML=data.length?data.map(x=>`<div class="hist"><b>${esc(x.flower_name||'Flower')}</b> · ${money(x.qty)} × ${money(x.rate)}<div class="small">${esc(x.invoice_no||'No invoice')} · ${esc(x.supplier||'')} · ${esc(x.entry_date||'')} · ${money(x.amount)} BD</div></div>`).join(''):'<div class="small">No receiving records for this branch.</div>'}
$('branch').addEventListener('change',loadHistory);function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}boot();
</script></body></html>
