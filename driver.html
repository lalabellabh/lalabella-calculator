<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf1f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lalabella Driver">
<title>Lalabella Driver</title>
<link rel="manifest" href="driver.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="shared/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--rose:#c9506b;--rose-dark:#9e2f4a;--gold:#d9a441;--ink:#2f2024;--muted:#8a7078;--line:#f0dede;--ok:#2e8b57;--warn:#b9770e;--bad:#c0392b;}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
/* hamburger */
  .menuwrap{position:relative}
  .burger{width:44px;height:44px;border-radius:14px;border:1px solid var(--line,rgba(143,42,69,.18));background:rgba(255,255,255,.85);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 14px rgba(143,42,69,.12)}
  .burger span,.burger span::before,.burger span::after{display:block;width:20px;height:2.5px;border-radius:2px;background:#8f2a45;content:"";position:relative}
  .burger span::before{position:absolute;top:-6px}.burger span::after{position:absolute;top:6px}
  .menu{position:absolute;right:0;top:52px;min-width:220px;background:#fff;border:1px solid rgba(143,42,69,.18);border-radius:16px;box-shadow:0 18px 40px rgba(143,42,69,.22);padding:8px;z-index:50}
  .menu[hidden]{display:none !important}
  .menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;text-decoration:none;color:#3a1624;background:none;border:0;border-radius:10px;padding:12px 12px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer}
  .menu a:hover,.menu button:hover{background:rgba(201,80,107,.1)}
  .menu hr{border:0;border-top:1px solid rgba(143,42,69,.12);margin:6px 4px}

  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fdf1f0 0%,#f6e0da 45%,#eaf3ec 100%);font-family:'Space Grotesk',sans-serif;color:var(--ink)}
  body{padding:22px 16px 70px}
  .wrap{max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f1d38c,var(--gold));display:grid;place-items:center;font-size:18px}
  .brand b{font-family:'Fraunces',serif;font-size:17px}
  .who{font-size:12px;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(158,47,74,.07)}
  .card h2{font-family:'Fraunces',serif;font-size:18px;margin:0 0 12px}
  .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .ord{font-family:'Fraunces',serif;font-size:24px;font-weight:700;margin:2px 0 8px}
  .addr{font-size:15px;line-height:1.45;margin:2px 0 10px;word-break:break-word}
  .note{font-size:13px;color:var(--muted);margin:0 0 10px;word-break:break-word}
  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:#f1ecea;color:var(--muted)}
  .chip.ok{background:#e3f4ea;color:var(--ok)} .chip.warn{background:#fdf0d8;color:var(--warn)} .chip.bad{background:#fbe3e0;color:var(--bad)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdfc;color:var(--ink);width:100%;outline:none}
  input:focus{border-color:var(--rose)}
  button{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:13px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
  button.go{background:linear-gradient(135deg,#c9506b,#9e2f4a);border-color:transparent;color:#fff}
  button.fin{background:var(--ok);border-color:transparent;color:#fff}
  button.sure{background:var(--bad);border-color:transparent;color:#fff}
  button.link{width:auto;padding:8px 14px;font-size:12.5px;color:var(--muted)}
  button:disabled{opacity:.55}
  .hero{text-align:center;margin:18px 0 22px}
  .scene{position:relative;width:100%;max-width:340px;height:120px;margin:0 auto 14px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#fde6dd 0%,#fbd3cf 100%);box-shadow:0 14px 30px rgba(158,47,74,.18),inset 0 0 0 2px #fff}
  .scene .sun{position:absolute;right:34px;top:14px;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fff1c2,var(--gold));box-shadow:0 0 22px rgba(217,164,65,.7)}
  .scene .hills{position:absolute;left:-10%;right:-10%;bottom:30px;height:44px;background:radial-gradient(60px 40px at 20% 100%,#efb7bd 98%,transparent 100%),radial-gradient(80px 50px at 55% 100%,#e8a3ad 98%,transparent 100%),radial-gradient(55px 36px at 85% 100%,#efb7bd 98%,transparent 100%)}
  .scene .road{position:absolute;left:0;right:0;bottom:0;height:34px;background:#4a2f37}
  .scene .road i{position:absolute;left:0;right:0;top:15px;height:3px;background:repeating-linear-gradient(90deg,#f6dc9c 0 18px,transparent 18px 36px);animation:dash 0.7s linear infinite}
  .scene .pin{position:absolute;right:16px;bottom:30px;font-size:24px;animation:bob 1.2s ease-in-out infinite;z-index:2}
  .scene .truck{position:absolute;bottom:24px;left:0;font-size:38px;line-height:1;animation:drive 6s linear infinite;z-index:3}
  .scene .truck span{display:inline-block;transform:scaleX(-1);animation:bump .35s ease-in-out infinite}
  @keyframes drive{0%{transform:translateX(-60px)}100%{transform:translateX(380px)}}
  @keyframes dash{to{background-position:-36px 0}}
  @keyframes bump{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-2px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.scene .truck,.scene .road i,.scene .truck span,.scene .pin{animation:none}.scene .truck{left:40%}}
  .hero .badge{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(135deg,#f6dc9c,var(--gold));display:grid;place-items:center;font-size:38px;box-shadow:0 14px 30px rgba(217,164,65,.45),inset 0 -4px 8px rgba(0,0,0,.08);transform:rotate(-6deg)}
  .hero h1{font-family:'Fraunces',serif;font-size:40px;line-height:1;margin:0;letter-spacing:-.5px}
  .hero h1 em{font-style:normal;color:var(--rose)}
  .hero p{margin:10px 0 0;color:var(--muted);font-size:14px}
  .card.auth{padding:22px;border-radius:24px;box-shadow:0 20px 50px rgba(158,47,74,.14);border:1px solid #fff;background:rgba(255,255,255,.92)}
  .card.auth h2{font-size:22px}
  .field{position:relative}
  .field input{padding-left:44px;padding-right:46px;height:50px}
  .field .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.75;pointer-events:none}
  .field .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;padding:0;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px}
  .field .eye.on{color:var(--rose)}
  label.chk{display:flex;align-items:center;gap:9px;margin:14px 0 0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);font-weight:500;cursor:pointer}
  label.chk input{width:18px;height:18px;padding:0;accent-color:var(--rose)}
  button.go{box-shadow:0 8px 20px rgba(158,47,74,.3)}
  a.upd-bar{display:block;text-decoration:none;text-align:center;font-weight:700;font-size:13.5px;background:#fdf0d8;color:#7a5410;border:1px solid #f0d79a;border-radius:14px;padding:11px 12px;margin:0 0 14px}
  a.maps{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:11px;border-radius:12px;border:1px solid var(--line);color:var(--rose-dark);background:#fff8f7;margin:0 0 10px}
  .gps{font-size:12.5px;margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#f6f2ef;color:var(--ink)}
  .gps.good{background:#e3f4ea} .gps.weak{background:#fdf0d8} .gps.off{background:#fbe3e0}
  .keep{font-size:12.5px;background:#fdf0d8;color:#7a5410;border-radius:10px;padding:9px 11px;margin-bottom:14px;line-height:1.45}
  .msg{font-size:13px;color:var(--bad);margin:8px 0 0;min-height:1em}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 8px}
  .small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a id="updBar" class="upd-bar" hidden target="_blank" rel="noopener" href="get-driver-app.html?dl=1"></a>
  <div class="topbar">
    <div class="brand"><div class="logo">🚚</div><div><b>Lalabella Driver</b><div class="who" id="who"></div></div></div>
    <div class="menuwrap">
      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span></button>
      <nav class="menu" id="menu" hidden>
        <a href="driver.html">🚚 My deliveries</a>
        <a href="get-driver-app.html">📲 Get / update app</a>
        <hr>
        <button id="outBtn" hidden>🚪 Log out</button>
      </nav>
    </div>
  </div>

  <div id="loginView" hidden>
    <div class="hero">
      <div class="scene" aria-hidden="true">
        <div class="sun"></div>
        <div class="hills"></div>
        <div class="pin">📍</div>
        <div class="truck"><span>🚚</span></div>
        <div class="road"><i></i></div>
      </div>
      <h1>Lalabella<br><em>Driver</em></h1>
      <p>Deliver with care. Every order, on the map.</p>
    </div>
    <div class="card auth" id="loginCard">
      <h2>Welcome back</h2>
      <form id="loginForm" action="#" method="post" autocomplete="on" novalidate>
      <label for="u">Username</label>
      <div class="field"><span class="ico">👤</span><input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <label for="p">Password</label>
      <div class="field"><span class="ico">🔒</span><input id="p" name="password" type="password" autocomplete="current-password"><button type="button" class="eye" data-eye="p" aria-label="Show password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <label class="chk"><input type="checkbox" id="rem" checked> <span>Remember me on this phone</span></label>
      <button class="go" id="inBtn" type="submit" style="margin-top:14px">Log in</button>
      </form>
      <div class="msg" id="loginMsg"></div>
      <button class="link" id="toSign" style="width:100%;margin-top:6px">No account? <b>Sign up</b></button>
    </div>
    <div class="card auth" id="signCard" hidden>
      <h2>Create account</h2>
      <p class="small" style="margin:0 0 4px">The admin must approve your account before you can log in.</p>
      <label for="sN">Full name</label>
      <div class="field"><span class="ico">🪪</span><input id="sN" autocomplete="name" maxlength="60"></div>
      <label for="sU">Username</label>
      <div class="field"><span class="ico">👤</span><input id="sU" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" placeholder="letters and numbers, no spaces"></div>
      <label for="sP">Password (min 6)</label>
      <div class="field"><span class="ico">🔒</span><input id="sP" type="password" autocomplete="new-password" maxlength="100"><button type="button" class="eye" data-eye="sP" aria-label="Show password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button class="go" id="sBtn" style="margin-top:16px">Send sign-up</button>
      <div class="msg" id="signMsg"></div>
      <button class="link" id="toLogin" style="width:100%;margin-top:6px">Back to log in</button>
    </div>
  </div>

  <div id="mainView" hidden>
    <div class="keep" id="keep" hidden></div>
    <div id="list"><div class="empty">Loading…</div></div>
    <p class="small" id="foot"></p>
  </div>
</div>
<script>
(function(){
  'use strict';
  var API = (window.LB_CONFIG && LB_CONFIG.DELIVERY_API) || (LB_CONFIG.SUPABASE_URL + '/functions/v1/delivery-fast');
  var KEY = LB_CONFIG.SUPABASE_PUBLISHABLE_KEY;
  var SEND_EVERY_MS = 8000, TZ = 'Asia/Bahrain', TK = 'lbDriverToken', NK = 'lbDriverName';
  // Inside the Android driver app, a native service sends the GPS (it keeps working with the screen locked).
  var NATIVE = !!(window.LBDriverApp && window.LBDriverApp.setTracking);
  var moved = 0, lastStep = null, rows = [], fix = null, fixSentAt = 0, watchId = null, timer = null, nativeTimer = null, wakeLock = null, sentAt = 0, sending = false, geoErr = '';
  var confirmId = null, busy = {}, errs = {};

  function $(id){ return document.getElementById(id); }
  function store(k, v, sess){
    try { localStorage.removeItem(k); } catch(e){}
    try { sessionStorage.removeItem(k); } catch(e){}
    if (v == null) return;
    try { (sess ? sessionStorage : localStorage).setItem(k, v); } catch(e){}
  }
  function read(k){
    try { var a = localStorage.getItem(k); if (a) return a; } catch(e){}
    try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; }
  }
  function token(){ return read(TK); }
  function api(body){
    return fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: KEY }, body: JSON.stringify(Object.assign({ token: token() }, body)) })
      .then(function(r){ return r.json(); });
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtT(iso){ return iso ? new Date(iso).toLocaleTimeString('en-US', { timeZone: TZ, hour:'numeric', minute:'2-digit' }) : ''; }
  function chip(s){ return '<span class="chip ' + (s === 'On the way' ? 'warn' : s === 'Delivered' ? 'ok' : s === 'Cancelled' ? 'bad' : '') + '">' + esc(s) + '</span>'; }
  function active(){ return rows.filter(function(r){ return r.status === 'On the way'; }); }

  // ---------- login ----------
  function showLogin(msg){
    stopAll();
    document.querySelector('.topbar .brand').style.visibility = 'hidden';
    $('loginView').hidden = false; $('mainView').hidden = true; $('outBtn').hidden = true; $('who').textContent = '';
    $('loginMsg').style.color = ''; $('loginMsg').textContent = msg || '';
    try { var ru = localStorage.getItem('lbDriverUser'); if (ru && !$('u').value) $('u').value = ru; } catch(e){}
    try { if (navigator.credentials && window.PasswordCredential && !$('p').value) navigator.credentials.get({ password:true, mediation:'optional' }).then(function(c){ if (c && c.password && !$('p').value){ $('u').value = c.id; $('p').value = c.password; } }).catch(function(){}); } catch(e){}
  }
  function setEye(id, on){
    var i = $(id); i.type = on ? 'text' : 'password';
    var b = document.querySelector('[data-eye="' + id + '"]'); if (b){ b.classList.toggle('on', on); b.setAttribute('aria-label', on ? 'Hide password' : 'Show password'); }
  }
  function showMain(){
    document.querySelector('.topbar .brand').style.visibility = '';
    $('loginView').hidden = true; $('mainView').hidden = false; $('outBtn').hidden = false;
    $('who').textContent = read(NK);
  }
  function doLogin(){
    var u = $('u').value.trim(), p = $('p').value;
    var m = $('loginMsg'); m.textContent = '';
    if (!u || !p){ m.textContent = 'Write your username and password.'; return; }
    $('inBtn').disabled = true;
    fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: KEY }, body: JSON.stringify({ action:'login', username:u, password:p }) })
      .then(function(r){ return r.json(); })
      .then(function(r){
        $('inBtn').disabled = false;
        if (!r.success){ m.textContent = r.error || 'Could not log in.'; return; }
        var keep = $('rem').checked; store(TK, r.token, !keep); store(NK, r.name || u, !keep); try { if (keep) localStorage.setItem('lbDriverUser', u); else localStorage.removeItem('lbDriverUser'); } catch(e){} try { if (keep && window.PasswordCredential && navigator.credentials) navigator.credentials.store(new PasswordCredential({ id:u, password:p, name:r.name || u })); } catch(e){} $('p').value = ''; setEye('p', false);
        showMain(); $('list').innerHTML = '<div class="empty">Loading…</div>'; load();
      }).catch(function(){ $('inBtn').disabled = false; m.textContent = 'No internet. Try again.'; });
  }
  function showSign(on){ $('signCard').hidden = !on; $('loginCard').hidden = on; $('signMsg').textContent = ''; $('signMsg').style.color = ''; }
  function doSign(){
    var n = $('sN').value.trim(), u = $('sU').value.trim().toLowerCase(), p = $('sP').value, m = $('signMsg');
    m.style.color = ''; m.textContent = '';
    if (n.length < 2){ m.textContent = 'Write your name.'; return; }
    if (!/^[a-z0-9._-]{3,30}$/.test(u)){ m.textContent = 'Username: 3-30 letters, numbers, . _ - (no spaces).'; return; }
    if (p.length < 6){ m.textContent = 'Password must be at least 6 characters.'; return; }
    $('sBtn').disabled = true;
    fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: KEY }, body: JSON.stringify({ action:'signup', fullName:n, username:u, password:p }) })
      .then(function(r){ return r.json(); })
      .then(function(r){
        $('sBtn').disabled = false;
        if (!r.success){ m.textContent = r.error || 'Could not sign up.'; return; }
        $('sN').value = ''; $('sU').value = ''; $('sP').value = '';
        showSign(false);
        $('loginMsg').style.color = 'var(--ok)'; $('loginMsg').textContent = 'Sign-up sent. Wait for the admin to approve, then log in.';
      }).catch(function(){ $('sBtn').disabled = false; m.textContent = 'No internet. Try again.'; });
  }
  function doLogout(){
    var t = token();
    stopAll();
    store(TK, null); store(NK, null); rows = [];
    if (t) fetch(API, { method:'POST', headers:{ 'Content-Type':'application/json', apikey: KEY }, body: JSON.stringify({ action:'logout', token:t }) }).catch(function(){});
    showLogin('');
  }

  // ---------- GPS (browser) ----------
  function geoMsg(e){
    if (!e) return 'Could not get your location.';
    if (e.code === 1) return 'Location is blocked. Allow location for this app in your phone settings, then try again.';
    if (e.code === 2) return 'No GPS signal. Move near a window or outside.';
    if (e.code === 3) return 'GPS is taking too long. Try again.';
    return 'Could not get your location.';
  }
  function getOnce(ms){
    return new Promise(function(res, rej){
      if (!navigator.geolocation) return rej({ code: 0 });
      navigator.geolocation.getCurrentPosition(function(p){ res(p); }, rej, { enableHighAccuracy:true, timeout:ms || 15000, maximumAge:0 });
    });
  }
  function meters(a, b){
    var r = Math.PI / 180, R = 6371000, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
    var x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function setFix(lat, lng, acc, t){
    fix = { lat:lat, lng:lng, acc:acc || 0, t:t || Date.now() };
    geoErr = '';
    // Distance moved: count a step only when it is clearly bigger than the GPS wobble, so standing still stays at 0.
    if (fix.acc <= 50){
      if (!lastStep) lastStep = { lat:fix.lat, lng:fix.lng };
      else { var d = meters(lastStep, fix); if (d >= Math.max(8, fix.acc * 0.8)){ moved += d; lastStep = { lat:fix.lat, lng:fix.lng }; } }
    }
    renderGps();
  }
  function onFix(p){ setFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy, Date.now()); }
  function onGeoErr(e){ geoErr = geoMsg(e); renderGps(); }
  function keepMsg(){
    return NATIVE ? 'Tracking is on. You can lock the screen or use Google Maps. Do not close this app from the recent apps list.'
      : 'Keep this screen open and awake while you deliver. When the screen locks or you switch to another app, the phone may stop sending your location.';
  }
  function startTracking(){
    if (NATIVE){ nativeSync(); startNativePoll(); $('keep').textContent = keepMsg(); $('keep').hidden = false; return; }
    if (watchId != null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(onFix, onGeoErr, { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
    if (!timer) timer = setInterval(sendPings, SEND_EVERY_MS);
    getWake();
    $('keep').textContent = keepMsg(); $('keep').hidden = false;
    setTimeout(sendPings, 1500);
  }
  function stopTracking(){
    if (NATIVE){ try { window.LBDriverApp.setTracking('', API, KEY, '[]'); } catch(e){} if (nativeTimer){ clearInterval(nativeTimer); nativeTimer = null; } }
    if (watchId != null){ try { navigator.geolocation.clearWatch(watchId); } catch(e){} watchId = null; }
    if (timer){ clearInterval(timer); timer = null; }
    releaseWake();
    fix = null; fixSentAt = 0; lastStep = null; moved = 0;
    $('keep').hidden = true;
  }
  function stopAll(){ stopTracking(); }
  function getWake(){
    try { if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; }); }).catch(function(){}); } catch(e){}
  }
  function releaseWake(){ try { if (wakeLock) wakeLock.release(); } catch(e){} wakeLock = null; }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && watchId != null) getWake(); });

  function sendPings(){
    var act = active();
    if (!act.length){ stopTracking(); return; }
    if (!fix || sending || fix.t === fixSentAt) return;
    sending = true;
    var f = fix, stamp = f.t;
    Promise.all(act.map(function(r){
      return api({ action:'ping', id:r.id, lat:f.lat, lng:f.lng, accuracy:f.acc }).catch(function(){ return { success:false, net:true }; });
    })).then(function(rs){
      var stopped = false, ok = false, reauth = false;
      rs.forEach(function(x){ if (x.success) ok = true; if (x.stop) stopped = true; if (x.reauth) reauth = true; });
      if (ok){ sentAt = Date.now(); fixSentAt = stamp; }
      sending = false;
      if (reauth){ showLogin('Please log in again.'); return; }
      if (stopped) load(); else renderGps();
    });
  }

  // ---------- GPS (Android driver app) ----------
  function nativeSync(){
    if (!NATIVE) return;
    try {
      var ids = active().map(function(r){ return r.id; });
      window.LBDriverApp.setTracking(ids.length ? token() : '', API, KEY, JSON.stringify(ids));
    } catch(e){}
  }
  function startNativePoll(){
    if (nativeTimer) return;
    nativeTimer = setInterval(function(){
      try {
        var s = window.LBDriverApp.lastFix && window.LBDriverApp.lastFix();
        if (!s) return;
        var f = JSON.parse(s);
        if (f && f.lat != null && (!fix || f.t !== fix.nt)){ setFix(f.lat, f.lng, f.acc, Date.now()); fix.nt = f.t; if (f.sent) sentAt = f.sent; }
        else if (f && f.sent) sentAt = f.sent;
        if (f && f.err) { geoErr = f.err; renderGps(); }
      } catch(e){}
    }, 2000);
  }

  // ---------- screens ----------
  function renderGps(){
    var el = $('gpsLine');
    if (!el) return;
    var cls = 'gps', txt;
    if (geoErr){ cls += ' off'; txt = '⚠️ ' + geoErr; }
    else if (!fix){ cls += ' weak'; txt = '📡 Waiting for GPS…'; }
    else {
      var a = Math.round(fix.acc), ago = sentAt ? Math.max(0, Math.round((Date.now() - sentAt) / 1000)) : null;
      cls += a > 100 ? ' weak' : ' good';
      txt = '📍 GPS on · ±' + a + ' m · ' + (ago == null ? 'sending…' : 'sent ' + ago + ' s ago') + ' · moved ' + (moved >= 1000 ? (moved / 1000).toFixed(2) + ' km' : Math.round(moved) + ' m');
    }
    el.className = cls; el.textContent = txt;
  }
  function card(r){
    var h = '<div class="card"><div class="head"><div><div class="lab">Order</div><div class="ord">#' + esc(r.orderNo) + '</div></div>' + chip(r.status) + '</div>';
    h += '<div class="lab">Address</div><div class="addr">' + esc(r.address) + '</div>';
    if (r.note) h += '<p class="note">' + esc(r.note) + '</p>';
    if (r.status === 'Assigned' || r.status === 'On the way') h += '<a class="maps" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(r.address) + '">🧭 Open in Google Maps</a>';
    if (r.status === 'Assigned'){
      h += '<button class="go" data-a="start" data-id="' + r.id + '"' + (busy[r.id] ? ' disabled' : '') + '>▶ Start Delivery</button>';
    } else if (r.status === 'On the way'){
      h += '<div class="gps" id="gpsLine"></div>';
      if (!NATIVE && watchId == null) h += '<button class="go" data-a="resume" data-id="' + r.id + '" style="margin-bottom:10px">📡 Turn tracking back on</button>';
      if (busy[r.id]) h += '<button class="fin" data-a="done" data-id="' + r.id + '" disabled>Saving…</button>';
      else if (confirmId === r.id) h += '<button class="sure" data-a="done" data-id="' + r.id + '">Tap again to confirm: Delivered</button>';
      else h += '<button class="fin" data-a="done" data-id="' + r.id + '">✔ Delivered</button>';
      if (r.startedAt) h += '<div class="small" style="margin-top:8px">Started ' + esc(fmtT(r.startedAt)) + '</div>';
    } else if (r.status === 'Delivered'){
      h += '<div class="small">Delivered ' + esc(fmtT(r.deliveredAt)) + '</div>';
    }
    if (errs[r.id]) h += '<div class="msg">' + esc(errs[r.id]) + '</div>';
    return h + '</div>';
  }
  function render(){
    var el = $('list');
    if (!rows.length){ el.innerHTML = '<div class="empty">No deliveries for you right now.<br>When the admin assigns an order, it shows up here.</div>'; return; }
    var act = rows.filter(function(r){ return r.status !== 'Delivered'; }), done = rows.filter(function(r){ return r.status === 'Delivered'; });
    var h = act.map(card).join('');
    if (done.length) h += '<div class="lab" style="margin:16px 4px 8px">Delivered recently</div>' + done.map(card).join('');
    el.innerHTML = h;
    renderGps();
  }

  function load(){
    return api({ action:'mine' }).then(function(r){
      if (r.reauth){ showLogin('Please log in again.'); return; }
      if (!r.success){
        $('list').innerHTML = '<div class="empty">' + esc(r.error || 'Could not load your deliveries.') + '</div>';
        return;
      }
      rows = r.rows || [];
      confirmId = null;
      render();
      if (active().length){
        if (NATIVE){ nativeSync(); startNativePoll(); $('keep').textContent = keepMsg(); $('keep').hidden = false; }
        else if (watchId == null) autoResume();
      } else stopTracking();
    }).catch(function(){
      $('list').innerHTML = '<div class="empty">No internet. Check your connection and refresh.</div>';
    });
  }
  // If the page was reopened while a delivery is still On the way, turn tracking back on by itself when location is already allowed.
  function autoResume(){
    try {
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name:'geolocation' }).then(function(s){ if (s.state === 'granted'){ startTracking(); render(); } }).catch(function(){});
      }
    } catch(e){}
  }
  function nativeHasPerm(){ try { return window.LBDriverApp.hasPermission ? !!window.LBDriverApp.hasPermission() : true; } catch(e){ return true; } }
  function nativeFix(){
    try { var s = window.LBDriverApp.lastFix && window.LBDriverApp.lastFix(); var f = s ? JSON.parse(s) : null; if (f && f.lat != null && Date.now() - f.t < 60000) return { lat:f.lat, lng:f.lng, acc:f.acc }; } catch(e){}
    return null;
  }

  $('list').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-a]'); if (!b || b.disabled) return;
    var id = Number(b.getAttribute('data-id')), a = b.getAttribute('data-a');
    errs[id] = '';
    if (a === 'start'){
      if (NATIVE && !nativeHasPerm()){
        try { window.LBDriverApp.requestPermission(); } catch(e){}
        errs[id] = 'Allow location for this app (choose "While using the app"), then tap Start again.'; render(); return;
      }
      busy[id] = true; render();
      var pre = NATIVE ? Promise.resolve() : getOnce().then(onFix);
      pre.then(function(){ return api({ action:'start', id:id }); }).then(function(r){
        busy[id] = false;
        if (r.reauth){ showLogin('Please log in again.'); return; }
        if (!r.success){ errs[id] = r.error || 'Could not start.'; render(); return; }
        return load().then(function(){ startTracking(); render(); });
      }).catch(function(e){
        busy[id] = false;
        errs[id] = (e && typeof e.code === 'number') ? geoMsg(e) : 'No internet. Try again.';
        render();
      });
    } else if (a === 'resume'){
      getOnce().then(function(p){ onFix(p); startTracking(); render(); }).catch(function(e){ errs[id] = geoMsg(e); render(); });
    } else if (a === 'done'){
      if (confirmId !== id){ confirmId = id; render(); return; }
      busy[id] = true; render();
      var send = function(p){
        var body = { action:'done', id:id };
        if (p){ body.lat = p.lat; body.lng = p.lng; body.accuracy = p.acc; }
        return api(body).then(function(r){
          busy[id] = false;
          if (r.reauth){ showLogin('Please log in again.'); return; }
          if (!r.success){ errs[id] = r.error || 'Could not save. Try again.'; confirmId = null; render(); return; }
          return load();
        }).catch(function(){ busy[id] = false; confirmId = null; errs[id] = 'No internet. Try again.'; render(); });
      };
      var last = NATIVE ? nativeFix() : (fix ? { lat:fix.lat, lng:fix.lng, acc:fix.acc } : null);
      // Use the position we already have if it is fresh, so a slow GPS never keeps the driver waiting.
      if (NATIVE || (fix && Date.now() - fix.t < 30000)) send(last);
      else getOnce(6000).then(function(p){ return send({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }); }, function(){ return send(last); });
    }
  });

  $('loginForm').addEventListener('submit', function(e){ e.preventDefault(); doLogin(); });
  $('outBtn').addEventListener('click', function(){ $('menu').hidden = true; doLogout(); });
  $('burger').addEventListener('click', function(e){ e.stopPropagation(); var m = $('menu'); m.hidden = !m.hidden; $('burger').setAttribute('aria-expanded', String(!m.hidden)); });
  document.addEventListener('click', function(){ $('menu').hidden = true; });
  document.querySelectorAll('[data-eye]').forEach(function(b){ b.addEventListener('click', function(){ var id = b.getAttribute('data-eye'); setEye(id, $(id).type === 'password'); }); });
  $('toSign').addEventListener('click', function(){ showSign(true); });
  $('toLogin').addEventListener('click', function(){ showSign(false); });
  $('sBtn').addEventListener('click', doSign);

  setInterval(renderGps, 1000);
  setInterval(function(){ if (token() && !document.hidden && !$('mainView').hidden && (NATIVE || watchId == null)) load(); }, 30000);

  if (NATIVE && window.LBDriverApp.versionCode){
    try {
      var have = Number(window.LBDriverApp.versionCode()) || 0;
      fetch('downloads/driver-app-version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
        if ((Number(j.versionCode) || 0) > have){ var b = $('updBar'); b.textContent = '⬇️ New app version ' + (j.versionName || '') + ' is ready. Tap to download.'; b.hidden = false; }
      }).catch(function(){});
    } catch(e){}
  }

  if (token()){ showMain(); load(); } else showLogin('');
})();
</script>
</body>
