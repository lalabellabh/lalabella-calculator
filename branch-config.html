<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Branch Config</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:linear-gradient(145deg,#fdf1f0,#eaf3ec);font-family:Arial,sans-serif;color:#3a2530}.wrap{max-width:900px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #f0d9d9;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 25px #0000000d}h1{color:#9e2f4a}.branch{border:1px solid #f0d9d9;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:11px;color:#8a7078;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #f0d9d9;border-radius:9px;box-sizing:border-box}button{padding:11px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:#9e2f4a;color:white}.danger{background:#fdeaea;color:#a33}.muted{color:#8a7078;font-size:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{margin-top:10px;font-size:13px}.locked{opacity:.65}</style></head><body><div class="wrap"><div class="top"><a href="flower-tools.html">← Flower Tools</a><button id="logout">Logout</button></div><div class="card"><h1>Branch Configuration</h1><p class="muted">Manage branch coordinates and area keywords used by the Lalabella branch helper.</p><div id="access" class="status"></div><div id="list"></div><button id="add">＋ Add Branch</button><button id="save" class="primary">💾 Save Branches</button><div id="status" class="status"></div></div></div><script>let branches=[];let profile=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){ $('list').innerHTML=branches.map((b,i)=>`<div class="branch"><div class="grid"><div class="full"><label>Branch Name</label><input data-i="${i}" data-k="name" value="${esc(b.name)}"></div><div><label>Latitude</label><input data-i="${i}" data-k="latitude" value="${esc(b.latitude)}"></div><div><label>Longitude</label><input data-i="${i}" data-k="longitude" value="${esc(b.longitude)}"></div><div class="full"><label>Area Keywords (comma separated)</label><input data-i="${i}" data-k="keywords" value="${esc(b.keywords)}"></div></div><button class="danger" data-remove="${i}" style="margin-top:10px">Remove</button></div>`).join('');$('list').querySelectorAll('input').forEach(x=>x.oninput=()=>branches[+x.dataset.i][x.dataset.k]=x.value);$('list').querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{branches.splice(+x.dataset.remove,1);render()})}async function init(){profile=await sbAuth.getProfile();if(!profile){location.href='login.html';return}if(!['Admin','Manager'].includes(profile.role)){$('access').textContent='Admin/Manager access required.';$('save').disabled=true;$('add').disabled=true;return}$('access').textContent='Signed in as '+(profile.full_name||profile.username||'User')+' • '+profile.role;const {data,error}=await sb.from('branch_config').select('id,name,latitude,longitude,keywords').order('id');if(error){$('status').textContent=error.message;return}branches=(data||[]).map(x=>({id:x.id,name:x.name||'',latitude:x.latitude??'',longitude:x.longitude??'',keywords:x.keywords||''}));render()}$('add').onclick=()=>{branches.push({name:'',latitude:'',longitude:'',keywords:''});render()};$('save').onclick=async()=>{const clean=branches.filter(b=>b.name.trim()).map(b=>({name:b.name.trim(),latitude:Number(b.latitude),longitude:Number(b.longitude),keywords:b.keywords.trim()}));if(clean.some(b=>!Number.isFinite(b.latitude)||!Number.isFinite(b.longitude))){$('status').textContent='Invalid latitude/longitude.';return}const {error}=await sb.from('branch_config').delete().not('id','is',null);if(error){$('status').textContent=error.message;return}const ins=await sb.from('branch_config').insert(clean);$('status').textContent=ins.error?ins.error.message:'✓ Branch configuration saved.'};$('logout').onclick=async()=>{await sbAuth.signOut();location.href='login.html'};init();</script></body></html>
