<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flower Transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f6e0da; --mint:#eaf3ec;
    --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441; --leaf:#5f8f63;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9; --ok:#3d7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 5%, rgba(201,80,107,0.08), transparent 40%),
      radial-gradient(circle at 92% 12%, rgba(95,143,99,0.10), transparent 40%),
      linear-gradient(160deg, var(--blush) 0%, var(--mint) 100%);
    color:var(--ink); font-family:'Space Grotesk',sans-serif; min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:26px 18px 60px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-dim); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px; }
  .back-link:hover{ color:var(--rose-deep); }
  header{ text-align:center; margin-bottom:22px; padding:24px 18px; background:linear-gradient(135deg, #fff 0%, var(--blush) 60%, var(--blush-2) 100%); border-radius:18px; border:1px solid var(--line); box-shadow:0 8px 26px rgba(158,47,74,0.08); position:relative; overflow:hidden; }
  header::before{ content:'🌹'; position:absolute; font-size:64px; opacity:0.08; left:-12px; top:-16px; transform:rotate(-16deg); }
  .eyebrow{ font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; font-weight:600; position:relative; z-index:1; }
  h1{ font-family:'Great Vibes', cursive; font-weight:400; color:var(--rose-deep); font-size:clamp(2rem,7vw,2.6rem); margin:0; line-height:1; position:relative; z-index:1; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 4px 16px rgba(158,47,74,0.05); }
  .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 14px; }
  label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-dim); margin-bottom:5px; margin-top:12px; }
  label:first-child{ margin-top:0; }
  input[type=date], input[type=text], input[type=number], select{
    width:100%; background:var(--blush); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:14px; color:var(--ink); outline:none;
  }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .swap-row{ display:flex; align-items:center; gap:8px; }
  .swap-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    background:var(--blush); color:var(--rose-deep); font-size:15px; cursor:pointer; margin-top:12px;
  }
  .btn{ padding:12px 0; width:100%; border:none; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; margin-top:14px; }
  .btn-primary{ background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff; }
  .btn-primary:disabled{ opacity:0.5; }

  .preview-box{
    margin-top:14px; padding:12px 14px; border-radius:10px; border:1px dashed var(--line);
    background:var(--blush); font-size:12.5px;
  }
  .preview-row{ display:flex; justify-content:space-between; padding:2px 0; }

  .hist-row{ border-top:1px solid var(--blush-2); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-name{ font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .direction-badge{ display:inline-block; font-size:9px; font-weight:800; padding:2px 8px; border-radius:9px; text-transform:uppercase; margin-left:6px; }
  .direction-badge.out{ background:#fdecea; color:#c0392b; }
  .direction-badge.in{ background:var(--mint); color:var(--ok); }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:16px 0; }
  .loading{ text-align:center; padding:20px 0; color:var(--ink-dim); font-size:13px; }

  @media (min-width: 900px){
    .wrap{ max-width:1080px; padding:34px 30px 70px; }
    .layout{ display:flex; gap:18px; align-items:flex-start; }
    .col-main{ flex:1.3; display:flex; flex-direction:column; gap:16px; }
    .col-side{ flex:1; display:flex; flex-direction:column; gap:16px; position:sticky; top:24px; }
  }
</style>

   60px tall — without extra clearance it was sitting on top of (and
   hiding) each page's own title/back-link in that same corner. */

#lala-lock-overlay{position:fixed;inset:0;z-index:999999;background:linear-gradient(135deg,#fdf1f0,#f6e0da);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;}
#lala-lock-box{background:#fff;border-radius:18px;padding:32px 28px;box-shadow:0 12px 40px rgba(158,47,74,.18);text-align:center;max-width:300px;width:90%;}

#lala-lock-box p{color:#8a7078;font-size:12.5px;margin:0 0 18px;}
#lala-lock-input{width:100%;padding:12px;border:1px solid #f0d9d9;border-radius:10px;font-size:20px;text-align:center;letter-spacing:6px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;}
#lala-lock-input:focus{outline:none;border-color:#c9506b;}
#lala-lock-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9506b,#9e2f4a);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}

<body>

    <h2>Lalabella</h2>

<nav class="choco-drawer" id="chocoDrawer">
  <div class="choco-drawer-title">Quick Tools</div>
  <a href="#" id="chocoHomeLink">🏠 Home</a>
  <a href="notes.html?from=flower-tools">📝 Notes</a>
  <a href="order-form.html?from=flower-tools">🧾 Order Form</a>
  <a href="card-print.html?from=flower-tools">💌 Card Print</a>
  <div class="choco-music-box">

    <button id="chocoMusicToggleBtn">♫ Music</button>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <input type="text" id="chocoMusicSearchInput" placeholder="Or search a song name…" style="flex:1;margin-bottom:0;">
      <button id="chocoMusicSearchBtn" style="width:auto;padding:9px 12px;margin-top:0;">🔍</button>
    </div>

<audio id="chocoAudioPlayer" loop></audio>
<div id="chocoYtPlayerWrap" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;"></div>

<div class="wrap">
  <a class="back-link" href="flower-tools.html">&larr; Flower Tools</a>
  <a class="back-link" href="flower-dashboard.html" style="float:right;">🌷 Dashboard &rarr;</a>
  <header>
    <div class="eyebrow">Lalabella Flowers</div>
    <h1>Branch Transfer</h1>
  </header>

  <div class="layout">
    <div class="col-main">

      <div class="card">
        <div class="card-title">🔄 Log a Transfer</div>
        <div class="grid-2 swap-row">
          <div>
            <label>From Branch</label>
            <select id="fFrom">
              <option value="ModaMall">ModaMall</option>
              <option value="Hamala">Hamala</option>
              <option value="Galali">Galali</option>
            </select>
          </div>
          <button class="swap-btn" id="swapBtn" title="Swap">⇄</button>
          <div>
            <label>To Branch</label>
            <select id="fTo">
              <option value="ModaMall">ModaMall</option>
              <option value="Hamala" selected>Hamala</option>
              <option value="Galali">Galali</option>
            </select>
          </div>
        </div>

        <label>Flower Name</label>
        <input type="text" id="fFlower" list="flowerList" placeholder="e.g. Rose" />
        <datalist id="flowerList"></datalist>

        <div class="grid-2">
          <div>
            <label>Quantity</label>
            <input type="number" id="fQty" min="0" step="1" />
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="fDate" />
          </div>
        </div>

        <label>Transferred By</label>
        <input type="text" id="fBy" list="staffList" />
        <datalist id="staffList"></datalist>

        <label>Remarks</label>
        <input type="text" id="fRemarks" placeholder="optional" />

        <div class="preview-box" id="previewBox" style="display:none;">
          <div class="preview-row"><span>Legacy Rate</span><b id="pvRate">—</b></div>
          <div class="preview-row"><span>Value (snapshot)</span><b id="pvValue">—</b></div>
        </div>

        <button class="btn btn-primary" id="saveBtn">Log Transfer</button>
      </div>

    </div>

    <div class="col-side">
      <div class="card">
        <div class="card-title">📋 Recent Transfers</div>
        <div class="grid-2" style="margin-bottom:12px;">
          <select id="historyBranchFilter">
            <option value="All">All Branches</option>
            <option value="ModaMall">ModaMall</option>
            <option value="Hamala">Hamala</option>
            <option value="Galali">Galali</option>
          </select>
        </div>
        <div id="historyList"><div class="loading">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzC-h3iV0AJU0A3mKhj_0V5-yOeLoJYlupFlPnKHelbyhcSiqUbK6LTjgo4qZF03Bs/exec';
  let flowerLegacyRates = {};

  function fmtBD(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD'; }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  document.getElementById('swapBtn').addEventListener('click', ()=>{
    const fromEl = document.getElementById('fFrom');
    const toEl = document.getElementById('fTo');
    const tmp = fromEl.value;
    fromEl.value = toEl.value;
    toEl.value = tmp;
  });

  function updatePreview(){
    const box = document.getElementById('previewBox');
    const name = document.getElementById('fFlower').value.trim();
    const match = Object.keys(flowerLegacyRates).find(n => n.toLowerCase() === name.toLowerCase());
    if(!match){ box.style.display = 'none'; return; }
    const rate = flowerLegacyRates[match];
    const qty = parseFloat(document.getElementById('fQty').value) || 0;
    box.style.display = 'block';
    document.getElementById('pvRate').textContent = fmtBD(rate);
    document.getElementById('pvValue').textContent = fmtBD(rate * qty);
  }
  ['fFlower','fQty'].forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

  async function loadFlowerNames(){
    const t = Date.now();
    const [names, items] = await Promise.all([
      fetch(API_URL + '?action=getFlowerTransferList&_ts=' + t).then(r=>r.json()).catch(()=>[]),
      fetch(API_URL + '?action=getFlowerItems&_ts=' + t).then(r=>r.json()).catch(()=>[])
    ]);
    document.getElementById('flowerList').innerHTML = names.map(n => `<option value="${n}"></option>`).join('');
    flowerLegacyRates = {};
    items.forEach(it => {
      if((it.Origin||'').trim() === 'Legacy/Unknown'){
        flowerLegacyRates[(it.Flowers||'').trim()] = Number(it.Rate) || 0;
      }
    });
  }

  async function loadStaff(){
    const staff = await fetch(API_URL + '?action=getStaff&_ts=' + Date.now()).then(r=>r.json()).catch(()=>[]);
    document.getElementById('staffList').innerHTML = staff.map(s => `<option value="${s}"></option>`).join('');
  }

  function renderHistory(list){
    const el = document.getElementById('historyList');
    const filterBranch = document.getElementById('historyBranchFilter').value;
    if(!list || list.length === 0){
      el.innerHTML = '<div class="empty-note">Wala pang transfer na naka-log.</div>';
      return;
    }
    el.innerHTML = list.map(t => {
      let badge = '';
      if(filterBranch !== 'All'){
        if(t['From Branch'] === filterBranch) badge = '<span class="direction-badge out">Out</span>';
        else if(t['To Branch'] === filterBranch) badge = '<span class="direction-badge in">In</span>';
      }
      return `
        <div class="hist-row">
          <div class="hist-name">${t.Flower}${badge}</div>
          <div class="hist-meta">${fmtDate(t.Date)} · ${t['From Branch']} → ${t['To Branch']} · Qty ${t.Qty}</div>
          <div class="hist-meta">${t['Transfer No.'] || ''} · ${fmtBD(t.Value)} · ni ${t['Transferred By'] || '—'}</div>
        </div>
      `;
    }).join('');
  }

  async function loadHistory(){
    document.getElementById('historyList').innerHTML = '<div class="loading">Loading…</div>';
    const branch = document.getElementById('historyBranchFilter').value;
    const list = await fetch(API_URL + '?action=getTransferHistoryList&branch=' + branch + '&_ts=' + Date.now()).then(r=>r.json()).catch(()=>[]);
    renderHistory(list);
  }

  document.getElementById('historyBranchFilter').addEventListener('change', loadHistory);

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const fromBranch = document.getElementById('fFrom').value;
    const toBranch = document.getElementById('fTo').value;
    const flowerName = document.getElementById('fFlower').value.trim();
    const qty = document.getElementById('fQty').value;

    if(!flowerName || !qty || Number(qty) <= 0){
      alert('Please fill in Flower Name and a Quantity greater than 0.');
      return;
    }
    if(fromBranch === toBranch){
      alert('Hindi puwedeng magkapareho ang From at To Branch.');
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const params = new URLSearchParams({
      action: 'saveTransfer',
      fromBranch, toBranch, flowerName, qty,
      remarks: document.getElementById('fRemarks').value.trim(),
      transferredBy: document.getElementById('fBy').value.trim(),
      date: document.getElementById('fDate').value
    });

    try{
      const res = await fetch(API_URL + '?' + params.toString());
      const result = await res.json();
      if(result.error){
        alert(result.error);
      } else {
        alert('Na-log ang transfer! ' + result.transferNo + ' · Value: ' + fmtBD(result.value));
        document.getElementById('fFlower').value = '';
        document.getElementById('fQty').value = '';
        document.getElementById('fRemarks').value = '';
        document.getElementById('previewBox').style.display = 'none';
        await loadHistory();
      }
    }catch(e){
      alert('Hindi na-save. I-check ang connection mo.');
    }
    btn.disabled = false;
    btn.textContent = 'Log Transfer';
  });

  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  loadFlowerNames();
  loadStaff();
  loadHistory();
</script>
<script>
(function(){
  const btn=document.getElementById('chocoNavToggle');
  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');
  if(!btn||!backdrop||!drawer) return;
  function openDrawer(){ drawer.classList.add('show'); backdrop.classList.add('show'); }
  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);

  // Smart Home — goes to the Flower hub from a flower page, or the
  // Chocolate hub from a chocolate page.
  const homeLink=document.getElementById('chocoHomeLink');
  if(homeLink){
    const isFlowerPage = 'flower' === 'flower';
    homeLink.href = isFlowerPage ? 'flower-tools.html' : 'index.html';
    homeLink.textContent = isFlowerPage ? '🏠 Flower Tools' : '🏠 Chocolate Home';
  }
})();

// ---------- Shared music player (same saved sound as the rest of
// Lalabella on THIS device — set it once anywhere, it follows you
// across every page on this same browser/phone). ----------
(function(){
  const audio = document.getElementById('chocoAudioPlayer');
  const musicBtn = document.getElementById('chocoMusicToggleBtn');
  const urlInput = document.getElementById('chocoMusicUrlInput');
  const nowText = document.getElementById('chocoMusicNow');
  const searchInput = document.getElementById('chocoMusicSearchInput');
  const searchBtn = document.getElementById('chocoMusicSearchBtn');
  if(!audio || !musicBtn) return;
  let isPlaying = false;
  let ytVideoId = null;

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    return null;
  }
  function playYouTube(id){
    document.getElementById('chocoYtPlayerWrap').innerHTML =
      `<iframe width="200" height="150" src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
  }
  function stopYouTube(){ document.getElementById('chocoYtPlayerWrap').innerHTML = ''; }

  function saveSoundChoice(url, isYouTube){
    try{
      localStorage.setItem('lalabellaSoundUrl', url);
      localStorage.setItem('lalabellaSoundIsYouTube', isYouTube ? '1' : '0');
    }catch(e){}
  }

  function loadSavedSound(){
    try{
      const savedUrl = localStorage.getItem('lalabellaSoundUrl');
      const savedIsYT = localStorage.getItem('lalabellaSoundIsYouTube') === '1';
      if(!savedUrl) return;
      urlInput.value = savedUrl;
      if(savedIsYT){
        ytVideoId = extractYouTubeId(savedUrl);
      } else {
        audio.src = savedUrl;
      }
      // sessionStorage clears itself the moment the browser tab/window
      // closes — exactly the reset point we want. If this session has
      // already pressed ♫ once (on any page), every other page picks
      // right back up automatically; otherwise it stays silent until
      // tapped, same as a first-ever visit.
      const sessionPlaying = sessionStorage.getItem('lalabellaMusicSessionPlaying') === '1';
      if(sessionPlaying){
        if(savedIsYT){ playYouTube(ytVideoId); } else { audio.play().catch(()=>{}); }
        isPlaying = true;
        musicBtn.textContent = '♫ Playing';
        nowText.textContent = 'Playing: ' + (savedUrl.length > 40 ? savedUrl.slice(0,40) + '…' : savedUrl);
      } else {
        isPlaying = false;
        musicBtn.textContent = '♫ Music';
        nowText.textContent = 'Saved: ' + (savedUrl.length > 40 ? savedUrl.slice(0,40) + '…' : savedUrl) + ' (tap ♫ to play)';
      }
    }catch(e){}
  }
  loadSavedSound();

  function applyUrl(url){
    const id = extractYouTubeId(url);
    if(id){
      ytVideoId = id; audio.pause(); audio.removeAttribute('src');
      playYouTube(id);
      nowText.textContent = 'Now playing YouTube track';
      isPlaying = true; musicBtn.textContent = '♫ Playing';
      saveSoundChoice(url, true);
      sessionStorage.setItem('lalabellaMusicSessionPlaying', '1');
    } else {
      ytVideoId = null; stopYouTube();
      audio.src = url;
      nowText.textContent = 'Now loaded: ' + (url.length > 40 ? url.slice(0,40) + '…' : url);
      saveSoundChoice(url, false);
      audio.play().then(()=>{
        isPlaying = true; musicBtn.textContent = '♫ Playing';
        sessionStorage.setItem('lalabellaMusicSessionPlaying', '1');
      }).catch(()=>{ musicBtn.textContent = '♫ Tap to Play'; });
    }
  }

  musicBtn.addEventListener('click', ()=>{
    const url = urlInput.value.trim();
    if(url && url !== localStorage.getItem('lalabellaSoundUrl')){
      applyUrl(url);
      return;
    }
    // No new URL typed — just toggle play/pause of whatever's loaded.
    if(!audio.src && !ytVideoId) return;
    if(isPlaying){
      if(ytVideoId) stopYouTube(); else audio.pause();
      musicBtn.textContent = '♫ Music'; isPlaying = false;
      // Pausing here means "stop following me" — the next page won't
      // resume on its own until ♫ is pressed again.
      sessionStorage.setItem('lalabellaMusicSessionPlaying', '0');
    } else {
      if(ytVideoId) playYouTube(ytVideoId); else audio.play().catch(()=>{});
      musicBtn.textContent = '♫ Playing'; isPlaying = true;
      sessionStorage.setItem('lalabellaMusicSessionPlaying', '1');
    }
  });

  // "Search" doesn't auto-pick a video (no API key set up) — it opens
  // YouTube's own search in a new tab so you can pick the exact one,
  // then paste that video's link back into the URL box above.
  if(searchBtn && searchInput){
    searchBtn.addEventListener('click', ()=>{
      const q = searchInput.value.trim();
      if(!q) return;
      window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(q), '_blank');
    });
    searchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') searchBtn.click(); });
  }
})();
</script>

  if(localStorage.getItem('lalabellaAuth') === 'true'){
    var ov = document.getElementById('lala-lock-overlay');
    if(ov) ov.style.display = 'none';
    return;
  }
  function tryUnlock(){
    var val = document.getElementById('lala-lock-input').value;
    if(val === CORRECT){
      localStorage.setItem('lalabellaAuth', 'true');
      document.getElementById('lala-lock-overlay').style.display = 'none';
    } else {
      document.getElementById('lala-lock-error').style.display = 'block';
      document.getElementById('lala-lock-input').value = '';
    }
  }
  document.getElementById('lala-lock-input').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
  document.getElementById('lala-lock-btn').addEventListener('click', tryUnlock);
})();
</script>
