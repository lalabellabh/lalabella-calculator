<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella · Secure Login</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>:root{--bg:#090506;--card:#160b0f;--rose:#d77b91;--gold:#e6c47a;--cream:#f7eee5;--muted:#b39a98;--line:rgba(230,196,122,.25)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(170,45,78,.22),transparent 35%),linear-gradient(145deg,#070405,#12090b 52%,#080405);color:var(--cream);font:14px Inter,Arial,sans-serif}.card{width:min(430px,calc(100% - 30px));padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(22,11,15,.92);box-shadow:0 24px 70px rgba(0,0,0,.5)}.brand{text-align:center;color:var(--gold);letter-spacing:.28em;font-size:10px;text-transform:uppercase}.rose{text-align:center;font-size:42px;margin:10px 0}h1{font:600 38px Georgia,serif;text-align:center;margin:0 0 8px}.sub{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin-bottom:22px}label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0d0709;color:var(--cream);outline:none}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#f1d38c,#c79a4d);color:#24150c;font-weight:800;cursor:pointer}.secondary{background:transparent;color:var(--gold);border:1px solid var(--line)}.msg{display:none;margin-top:14px;padding:11px;border-radius:10px;background:#2a151b;color:#f3c9d2;font-size:12px;line-height:1.5}.msg.show{display:block}.note{margin-top:18px;color:#8f7775;font-size:10px;line-height:1.6;text-align:center}</style></head><body><main class="card"><div class="brand">Lalabella System</div><div class="rose">🌹</div><h1>Welcome back</h1><div class="sub">Secure sign-in for the new Supabase system.</div><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="name@company.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Sign In</button><button id="signup" class="secondary">Create Staff Account</button><div id="msg" class="msg"></div><div class="note">New accounts start as Staff with no branch assignment. An Admin/Manager must assign the branch before branch-restricted tools can be used.</div></main><script>const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t;$('msg').classList.add('show')}async function boot(){await LalabellaSupabase.ready();const u=await LalabellaAuth.getUser();if(u)location.href='index.html'}$('login').onclick=async()=>{try{await LalabellaSupabase.ready();const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('Enter your email and password.');await LalabellaAuth.signIn(email,password);location.href='index.html'}catch(e){msg(e.message||'Sign in failed.')}};$('signup').onclick=async()=>{try{const supabase=await LalabellaSupabase.client();const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8)return msg('Enter an email and a password with at least 8 characters.');const {data,error}=await supabase.auth.signUp({email,password,options:{data:{username:email.split('@')[0],full_name:email.split('@')[0]}}});if(error)throw error;msg(data.session?'Account created. You can sign in now.':'Account created. Check your email if confirmation is required.')}catch(e){msg(e.message||'Account creation failed.')}};boot().catch(e=>msg(e.message||'Unable to start.'));</script></body></html>
