<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella • Flower Transfer</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:linear-gradient(135deg,#fdf1f0,#eaf3ec);font:14px system-ui;color:#3a2530;padding:24px}.wrap{max-width:980px;margin:auto}.card{background:#fff;border:1px solid #f0d9d9;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #9e2f4a12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;font-size:11px;text-transform:uppercase;color:#8a7078}input,select,button{padding:11px;border:1px solid #f0d9d9;border-radius:10px;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:#c9506b;color:white;border:0}.muted{color:#8a7078;font-size:12px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #f5e8e8;padding:11px 0}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div class="muted">LALABELLA SYSTEM • SUPABASE</div><h1>🌷 Flower Transfer</h1><div id="who" class="muted">Checking session…</div></div><div class="grid"><section class="card"><h2>Transfer</h2><div class="fields"><label>From Branch<select id="from"></select></label><label>To Branch<select id="to"></select></label><label>Flower<select id="flower"></select></label><label>Quantity<input id="qty" type="number" min=".01" step=".01"></label><label>Date<input id="date" type="date"></label><label>Transfer No.<input id="no" placeholder="TR-0001"></label></div><label style="margin-top:12px">Remarks<input id="remarks" placeholder="Optional"></label><button class="primary" id="save">Log Transfer</button><div id="msg"></div></section><section class="card"><h2>Recent Transfers</h2><div id="history">Loading…</div></section></div><div class="card"><button id="out">Sign out</button></div></main><script>const $=id=>document.getElementById(id);let user,profile,branches=[],items=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(s,bad=false){$('msg').textContent=s;$('msg').style.color=bad?'#b42318':'#3d7a4f';$('msg').style.marginTop='10px'}async function boot(){user=await sbAuth.getUser();if(!user)return location='login.html';profile=await sbAuth.getProfile();if(!profile)return location='login.html';$('who').textContent=`${profile.full_name||user.email} • ${profile.role} • ${profile.branch||'No branch assigned'}`;let b=await sb.from('branch_config').select('id,name').order('name');if(b.error)throw b.error;branches=b.data||[];let i=await sb.from('flower_item').select('id,flower_name,rate,status').order('flower_name');if(i.error)throw i.error;items=i.data||[];render();$('date').value=new Date().toISOString().slice(0,10);await history()}function render(){let names=branches.map(x=>x.name);$('from').innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');$('to').innerHTML=names.map(n=>`<option>${esc(n)}</option>`).join('');if(profile.branch&&names.includes(profile.branch))$('from').value=profile.branch;$('to').value=names.find(n=>n!==$('from').value)||names[0]||'';$('flower').innerHTML=items.filter(x=>x.status==null||String(x.status).toLowerCase()!=='inactive').map(x=>`<option value="${x.id}">${esc(x.flower_name)}${x.rate!=null?' • '+Number(x.rate).toFixed(3)+' BD':''}</option>`).join('')}async function history(){let r=await sb.from('flower_transfer_history').select('*').order('transfer_date',{ascending:false}).order('id',{ascending:false}).limit(30);if(r.error)throw r.error;$('history').innerHTML=(r.data||[]).map(x=>`<div class="row"><span><b>${esc(x.flower_name)}</b><br><span class="muted">${esc(x.from_branch)} → ${esc(x.to_branch)} • ${esc(x.transfer_date)}</span></span><b>${Number(x.qty||0).toFixed(2)}</b></div>`).join('')||'<span class="muted">No transfers yet.</span>'} $('from').onchange=()=>{let f=$('from').value;$('to').value=branches.map(x=>x.name).find(n=>n!==f)||f};$('save').onclick=async()=>{try{let f=$('from').value,t=$('to').value;if(f===t)throw Error('From and To branch must be different');let item=items.find(x=>String(x.id)===$('flower').value);if(!item)throw Error('Select a flower');let r=await sb.rpc('record_flower_transfer',{p_transfer_date:$('date').value,p_transfer_no:$('no').value,p_from_branch:f,p_to_branch:t,p_flower_name:item.flower_name,p_qty:+$('qty').value,p_remarks:$('remarks').value,p_transferred_by:profile.full_name});if(r.error)throw r.error;msg(`Transfer saved • Value ${Number(r.data?.value||0).toFixed(3)} BD`);$('qty').value='';$('remarks').value='';await history()}catch(e){msg(e.message||String(e),true)}};$('out').onclick=async()=>{await sbAuth.signOut();location='login.html'};boot().catch(e=>msg(e.message||String(e),true))</script></body></html>
