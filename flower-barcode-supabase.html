<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Flower Barcode</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><style>body{margin:0;font-family:system-ui;background:linear-gradient(145deg,#fdf1f0,#eaf3ec);color:#3a2530}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;margin-bottom:18px}a{color:#9e2f4a;text-decoration:none}.card{background:#fff;border:1px solid #f0d9d9;border-radius:16px;padding:20px;box-shadow:0 8px 25px #9e2f4a12;margin-bottom:16px}h1{margin:0 0 5px}input{width:100%;padding:11px;border:1px solid #f0d9d9;border-radius:10px;box-sizing:border-box}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#9e2f4a;color:#fff}.tabs{display:flex;gap:8px}.tabs button{flex:1;background:#fff;color:#9e2f4a;border:1px solid #f0d9d9}.tabs button.active{background:#9e2f4a;color:#fff}.panel{display:none}.panel.active{display:block}.results{max-height:300px;overflow:auto}.result{padding:11px;border-bottom:1px solid #f6e0da;display:flex;justify-content:space-between;cursor:pointer}.meta{font-size:12px;color:#8a7078}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.label{border:1px dotted #999;padding:12px;text-align:center}.label svg{max-width:100%}@media(max-width:650px){.labels{grid-template-columns:1fr 1fr}.tabs{flex-direction:column}}@media print{body>*{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;inset:0;padding:8mm}.labels{grid-template-columns:repeat(3,1fr)}} </style></head><body><div class="wrap"><div class="top"><a href="flower-tools.html">← Flower Tools</a><a href="flower-dashboard.html">Dashboard →</a></div><div class="card"><h1>🌸 Flower Barcode</h1><div class="meta">Supabase catalog • No Google Sheets / Apps Script runtime</div></div><div class="tabs"><button class="active" data-panel="labels">Print Labels</button><button data-panel="lookup">Look Up Receiving</button></div><section id="labels" class="panel active"><div class="card"><input id="search" placeholder="Search flower name…"><div id="results" class="results"></div><div id="selected" class="meta" style="margin-top:12px">Select a flower.</div><label>Quantity</label><input id="qty" type="number" min="1" value="1"><label>Manual price (optional)</label><input id="price" type="number" min="0" step="0.001" placeholder="Use catalog rate"><div class="actions"><button id="preview">Preview Labels</button><button id="print">Print</button></div><div id="labelsOut" class="labels"></div></div></section><section id="lookup" class="panel"><div class="card"><input id="recvSearch" placeholder="Search receiving by flower, invoice, supplier…"><div id="recvOut" class="results">Loading…</div></div></section></div><script>(async()=>{const $=id=>document.getElementById(id);const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}let catalog=[],selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await sb.from('flower_item').select('id,flower_name,rate,item_code,origin,status').order('flower_name');if(r.error)throw r.error;catalog=r.data||[];render()}function render(){const q=$('search').value.trim().toLowerCase();const a=catalog.filter(x=>!q||String(x.flower_name).toLowerCase().includes(q)).slice(0,50);$('results').innerHTML=a.map(x=>`<div class="result" data-id="${x.id}"><span><b>${esc(x.flower_name)}</b><br><span class="meta">${esc(x.origin||'')} · ${esc(x.item_code||'')}</span></span><b>${(Number(x.rate)||0).toFixed(3)} BD</b></div>`).join('')||'<div class="meta">No flowers found.</div>'}$('search').oninput=render;$('results').onclick=e=>{const r=e.target.closest('.result');if(!r)return;selected=catalog.find(x=>String(x.id)===r.dataset.id);$('selected').innerHTML=`Selected: <b>${esc(selected.flower_name)}</b> · ${(Number(selected.rate)||0).toFixed(3)} BD`};function build(){if(!selected)return alert('Select a flower first.');const n=Math.max(1,Number($('qty').value)||1),p=$('price').value===''?Number(selected.rate)||0:Number($('price').value)||0;$('labelsOut').innerHTML=Array.from({length:n},()=>`<div class="label"><b>${esc(selected.flower_name)}</b><div>${p.toFixed(3)} BD</div><svg></svg><div class="meta">${esc(selected.item_code||selected.id)}</div></div>`).join('');$('labelsOut').querySelectorAll('svg').forEach(s=>{try{JsBarcode(s,String(selected.item_code||selected.id),{format:'CODE128',displayValue:true,height:42,fontSize:10,margin:4})}catch(e){}})}$('preview').onclick=build;$('print').onclick=()=>{build();setTimeout(()=>{document.querySelector('.wrap').classList.add('printable');window.print()},80)};window.onafterprint=()=>document.querySelector('.wrap').classList.remove('printable');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.panel).classList.add('active')});async function receiving(){const r=await sb.from('flower_database').select('entry_date,branch,invoice_no,supplier,flower_name,qty,rate,amount,received_by').order('entry_date',{ascending:false}).limit(200);if(r.error){$('recvOut').textContent=r.error.message;return}const data=r.data||[];function rr(){$('recvOut').innerHTML=data.filter(x=>!$('recvSearch').value.trim()||Object.values(x).some(v=>String(v??'').toLowerCase().includes($('recvSearch').value.trim().toLowerCase()))).map(x=>`<div class="result"><span><b>${esc(x.flower_name)}</b><br><span class="meta">${esc(x.entry_date)} · ${esc(x.branch)} · ${esc(x.invoice_no||'')}</span></span><span><b>${Number(x.qty)||0}</b><br><span class="meta">${(Number(x.amount)||0).toFixed(3)} BD</span></span></div>`).join('')||'<div class="meta">No receiving records found.</div>'}$('recvSearch').oninput=rr;rr()}try{await Promise.all([load(),receiving()])}catch(e){console.error(e);alert(e.message||'Unable to load Flower Barcode')}})();</script></body></html>
