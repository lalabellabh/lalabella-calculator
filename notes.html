<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f6e0da; --mint:#eaf3ec;
    --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441; --leaf:#5f8f63;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9; --ok:#3d7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 5%, rgba(201,80,107,0.08), transparent 40%),
      radial-gradient(circle at 92% 12%, rgba(95,143,99,0.10), transparent 40%),
      linear-gradient(160deg, var(--blush) 0%, var(--mint) 100%);
    color:var(--ink); font-family:'Space Grotesk',sans-serif; min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:26px 18px 60px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-dim); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px; }
  .back-link:hover{ color:var(--rose-deep); }
  header{ text-align:center; margin-bottom:22px; padding:24px 18px; background:linear-gradient(135deg, #fff 0%, var(--blush) 60%, var(--blush-2) 100%); border-radius:18px; border:1px solid var(--line); box-shadow:0 8px 26px rgba(158,47,74,0.08); position:relative; overflow:hidden; }
  header::before{ content:'📝'; position:absolute; font-size:60px; opacity:0.10; left:-10px; top:-14px; transform:rotate(-14deg); }
  .eyebrow{ font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; font-weight:600; position:relative; z-index:1; }
  h1{ font-family:'Great Vibes', cursive; font-weight:400; color:var(--rose-deep); font-size:clamp(2rem,7vw,2.6rem); margin:0; line-height:1; position:relative; z-index:1; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 4px 16px rgba(158,47,74,0.05); margin-bottom:16px; }
  .card h2{ margin:0 0 12px; font-family:'Fraunces',serif; font-weight:700; color:var(--rose-deep); font-size:18px; }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  label{ font-size:11px; color:var(--ink-dim); font-weight:600; }
  input, textarea{
    border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:14px;
    color:var(--ink); font-family:inherit; background:#fff; outline:none; width:100%;
  }
  input:focus, textarea:focus{ border-color:var(--rose); }
  textarea{ min-height:110px; resize:vertical; }
  .btn{ padding:11px 20px; border:none; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; }
  .btn-primary{ background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff; }
  .btn-ghost{ background:var(--blush); color:var(--ink-dim); border:1px solid var(--line); }

  .note{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; position:relative; }
  .note h3{ margin:0 0 4px; font-family:'Fraunces',serif; font-size:15px; color:var(--rose-deep); padding-right:26px; }
  .note p{ margin:0; font-size:13.5px; color:var(--ink); white-space:pre-wrap; line-height:1.5; }
  .note .meta{ font-size:10.5px; color:var(--ink-dim); margin-top:8px; font-family:'Space Mono',monospace; }
  .note .del{ position:absolute; top:12px; right:12px; width:24px; height:24px; border-radius:50%; border:none; background:var(--blush); color:#c0392b; cursor:pointer; font-size:12px; }
  .note .edit{ position:absolute; top:12px; right:42px; width:24px; height:24px; border-radius:50%; border:none; background:var(--blush); color:var(--rose-deep); cursor:pointer; font-size:12px; }
  .empty{ text-align:center; color:var(--ink-dim); font-size:13px; padding:30px 10px; }
</style>
<style>
#lala-lock-overlay{position:fixed;inset:0;z-index:999999;background:linear-gradient(135deg,#fdf1f0,#f6e0da);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;}
#lala-lock-box{background:#fff;border-radius:18px;padding:32px 28px;box-shadow:0 12px 40px rgba(158,47,74,.18);text-align:center;max-width:300px;width:90%;}
#lala-lock-box h2{font-family:'Great Vibes',cursive;color:#9e2f4a;font-size:2.2rem;margin:0 0 6px;}
#lala-lock-box p{color:#8a7078;font-size:12.5px;margin:0 0 18px;}
#lala-lock-input{width:100%;padding:12px;border:1px solid #f0d9d9;border-radius:10px;font-size:20px;text-align:center;letter-spacing:6px;margin-bottom:12px;box-sizing:border-box;font-family:inherit;}
#lala-lock-input:focus{outline:none;border-color:#c9506b;}
#lala-lock-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9506b,#9e2f4a);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
#lala-lock-error{color:#c0392b;font-size:12px;margin-top:10px;display:none;}
</style>
</head>
<body>
<div id="lala-lock-overlay">
  <div id="lala-lock-box">
    <h2>Lalabella</h2>
    <p>I-type ang password para magpatuloy</p>
    <div id="lala-lock-quote" style="font-size:11.5px;color:#c9506b;font-style:italic;margin-bottom:16px;line-height:1.5;"></div>
    <input type="password" id="lala-lock-input" inputmode="numeric" maxlength="10" placeholder="••••••" autocomplete="off">
    <button id="lala-lock-btn">Unlock</button>
    <div id="lala-lock-error">Maling password, subukan ulit.</div>
  </div>
</div>

<div class="wrap">
  <a class="back-link" id="backLink" href="index.html">&larr; Back</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Notes</h1>
  </header>

  <div class="card">
    <h2 id="formTitle">Add Note</h2>
    <div class="field"><label>Title</label><input id="noteTitle" placeholder="e.g. Supplier reminder"></div>
    <div class="field"><label>Message</label><textarea id="noteMessage" placeholder="Write your note here..."></textarea></div>
    <button class="btn btn-primary" id="saveNoteBtn">💾 Save Note</button>
    <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancel</button>
  </div>

  <div id="notesList"></div>
</div>

<script>
// ---------- Smart back button ----------
// Remembers whether you opened Notes from Flower Tools or from the
// Chocolate home page, so Back always returns you to the right place
// — even after a refresh, since the referrer alone isn't reliable.
const params = new URLSearchParams(window.location.search);
let cameFrom = params.get('from');
if(cameFrom){
  localStorage.setItem('lalabellaNotesFrom', cameFrom);
} else {
  cameFrom = localStorage.getItem('lalabellaNotesFrom');
}
const backLink = document.getElementById('backLink');
if(cameFrom === 'flower-tools'){
  backLink.href = 'flower-tools.html';
  backLink.textContent = '← Flower Tools';
} else {
  backLink.href = 'index.html';
  backLink.textContent = '← Chocolate Home';
}

// ---------- Notes storage (Google Sheet — shared across all devices) ----------
const FLOWER_API = 'https://script.google.com/macros/s/AKfycbzC-h3iV0AJU0A3mKhj_0V5-yOeLoJYlupFlPnKHelbyhcSiqUbK6LTjgo4qZF03Bs/exec';
let cachedNotes = [];

function loadNotes(){
  const list = document.getElementById('notesList');
  list.innerHTML = '<div class="empty">Loading notes…</div>';
  fetch(FLOWER_API + '?action=getNotes')
    .then(r => r.json())
    .then(notes => { cachedNotes = notes || []; renderNotes(); })
    .catch(() => { list.innerHTML = '<div class="empty">Could not load notes — check your connection.</div>'; });
}

function renderNotes(){
  const notes = cachedNotes;
  const list = document.getElementById('notesList');
  if(notes.length === 0){
    list.innerHTML = '<div class="empty">No notes yet — add your first one above.</div>';
    return;
  }
  list.innerHTML = notes.slice().reverse().map(n => `
    <div class="note" data-id="${n.ID}">
      <button class="edit" title="Edit">✎</button>
      <button class="del" title="Delete">✕</button>
      <h3>${escapeHtml(n.Title || '(Untitled)')}</h3>
      <p>${escapeHtml(n.Message || '')}</p>
      <div class="meta">${n.Created ? new Date(n.Created).toLocaleString() : ''}</div>
    </div>
  `).join('');
  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('.note').dataset.id;
      if(!confirm('Delete this note?')) return;
      btn.disabled = true;
      fetch(FLOWER_API, { method: 'POST', body: new URLSearchParams({ action:'deleteNote', id }) })
        .then(r => r.json())
        .then(()=>{ if(String(editingId) === id) cancelEdit(); loadNotes(); })
        .catch(()=> alert('Hindi na-delete — check ang internet connection mo.'));
    });
  });
  list.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('.note').dataset.id;
      const note = notes.find(n => String(n.ID) === id);
      if(!note) return;
      editingId = note.ID;
      document.getElementById('noteTitle').value = note.Title || '';
      document.getElementById('noteMessage').value = note.Message || '';
      document.getElementById('formTitle').textContent = 'Edit Note';
      document.getElementById('saveNoteBtn').textContent = '💾 Update Note';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      document.getElementById('noteTitle').scrollIntoView({ behavior:'smooth', block:'center' });
      document.getElementById('noteTitle').focus();
    });
  });
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let editingId = null;

function cancelEdit(){
  editingId = null;
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteMessage').value = '';
  document.getElementById('formTitle').textContent = 'Add Note';
  document.getElementById('saveNoteBtn').textContent = '💾 Save Note';
  document.getElementById('cancelEditBtn').style.display = 'none';
}
document.getElementById('cancelEditBtn').addEventListener('click', cancelEdit);

document.getElementById('saveNoteBtn').addEventListener('click', ()=>{
  const title = document.getElementById('noteTitle').value.trim();
  const message = document.getElementById('noteMessage').value.trim();
  if(!title && !message) return;
  const btn = document.getElementById('saveNoteBtn');
  btn.disabled = true;

  const action = editingId !== null ? 'updateNote' : 'addNote';
  const body = new URLSearchParams({ action, title, message });
  if(editingId !== null) body.set('id', editingId);

  fetch(FLOWER_API, { method: 'POST', body })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      if(res.error || !res.success){
        alert('Hindi na-save: ' + (res.error || 'Unknown error'));
        return;
      }
      cancelEdit();
      loadNotes();
    })
    .catch(()=>{
      btn.disabled = false;
      alert('Hindi na-save — check ang internet connection mo.');
    });
});

loadNotes();

</script>
<script>
(function(){
  var CORRECT = '525304';
  var QUOTES = [{"text": "The only way to do great work is to love what you do.", "author": "Steve Jobs"}, {"text": "Success is not final, failure is not fatal: it is the courage to continue that counts.", "author": "Winston Churchill"}, {"text": "Believe you can and you're halfway there.", "author": "Theodore Roosevelt"}, {"text": "It always seems impossible until it's done.", "author": "Nelson Mandela"}, {"text": "The future belongs to those who believe in the beauty of their dreams.", "author": "Eleanor Roosevelt"}, {"text": "Don't watch the clock; do what it does. Keep going.", "author": "Sam Levenson"}, {"text": "Every flower must grow through dirt.", "author": "Unknown"}, {"text": "Small steps every day lead to big results.", "author": "Unknown"}, {"text": "Great things never come from comfort zones.", "author": "Unknown"}, {"text": "Push yourself, because no one else is going to do it for you.", "author": "Unknown"}, {"text": "Dream it. Wish it. Do it.", "author": "Unknown"}, {"text": "Success doesn't just find you. You have to go out and get it.", "author": "Unknown"}, {"text": "The harder you work for something, the greater you'll feel when you achieve it.", "author": "Unknown"}, {"text": "Wake up with determination. Go to bed with satisfaction.", "author": "Unknown"}, {"text": "Do something today that your future self will thank you for.", "author": "Unknown"}, {"text": "Little things make big days.", "author": "Unknown"}, {"text": "It's going to be hard, but hard does not mean impossible.", "author": "Unknown"}, {"text": "Don't wait for opportunity. Create it.", "author": "Unknown"}, {"text": "Sometimes we're tested not to show our weaknesses, but to discover our strengths.", "author": "Unknown"}, {"text": "The key to success is to focus on goals, not obstacles.", "author": "Unknown"}];
  var q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  var qEl = document.getElementById('lala-lock-quote');
  if(qEl) qEl.textContent = '"' + q.text + '" — ' + q.author;

  if(localStorage.getItem('lalabellaAuth') === 'true'){
    var ov = document.getElementById('lala-lock-overlay');
    if(ov) ov.style.display = 'none';
    return;
  }
  function tryUnlock(){
    var val = document.getElementById('lala-lock-input').value;
    if(val === CORRECT){
      localStorage.setItem('lalabellaAuth', 'true');
      document.getElementById('lala-lock-overlay').style.display = 'none';
    } else {
      document.getElementById('lala-lock-error').style.display = 'block';
      document.getElementById('lala-lock-input').value = '';
    }
  }
  document.getElementById('lala-lock-input').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
  document.getElementById('lala-lock-btn').addEventListener('click', tryUnlock);
})();
</script>

</body>
</html>
