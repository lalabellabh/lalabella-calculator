<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>

<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#fbeff2,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 60px; }
  header{ padding-left:56px; margin:6px 0 12px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar select,.bar button{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .mode{ margin-left:auto; font-size:12.5px; display:flex; gap:6px; align-items:center; }
  .mode button.on{ background:var(--ok); color:#fff; border-color:var(--ok); }
  .card{ background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:14px; padding:4px 14px; }
  .sale{ border-top:1px solid var(--line); padding:11px 0; font-size:13px; }
  .sale:first-child{ border-top:0; }
  .sale.cx{ opacity:.55; }
  .top{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .top b{ font-size:15px; } .m{ color:var(--dim); font-size:11.5px; }
  .tag{ font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px; background:#f1e7ea; }
  .tag.f{ background:#fde3ea; } .tag.c{ background:#efe1d4; } .tag.x{ background:#eee; color:#888; }
  .items{ margin-top:4px; font-size:12.5px; }
  .short{ color:#a8560b; font-size:12px; margin-top:3px; }
  .cxbtn{ border:1px solid var(--bad); color:var(--bad); background:#fff; border-radius:9px; padding:5px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
  .pbtn{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:5px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; color:var(--ink); }
  #rp{ display:none; }
  #sumCard h3{ margin:0 0 8px; font-family:'Fraunces',serif; font-size:17px; }
  #sumCard .sg{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  #sumCard table, #rp table.st{ width:100%; border-collapse:collapse; font-size:13px; }
  #sumCard th, #rp table.st th{ text-align:left; border-bottom:2px solid #2f2024; padding:4px 2px; }
  #sumCard td, #rp table.st td{ padding:3px 2px; border-bottom:1px solid rgba(0,0,0,.06); }
  #sumCard td.n, #sumCard th.n, #rp table.st .n{ text-align:right; white-space:nowrap; }
  #sumCard tr.t td, #rp table.st tr.t td{ font-weight:800; border-top:2px solid #2f2024; border-bottom:0; }
  @media print{
    html, body{ margin:0 !important; padding:0 !important; height:0 !important; min-height:0 !important; overflow:hidden !important; background:#fff !important; }
    body *{ visibility:hidden !important; }
    #rp, #rp *{ visibility:visible !important; }
    #rp{ display:block !important; position:fixed; top:0; left:0; color:#000; font-family:'Space Grotesk',Arial,sans-serif; }
    #rp.th{ width:72mm; padding:2mm; font-family:'Courier New',monospace; font-size:11px; }
    #rp.a4{ width:100%; padding:0; font-size:13px; }
  }
  #rp h2{ margin:0; text-align:center; } #rp .c{ text-align:center; } #rp .l{ border-top:1px dashed #000; margin:5px 0; }
  #rp .r{ display:flex; justify-content:space-between; gap:8px; padding:2px 0; } #rp .t{ font-weight:800; font-size:1.25em; }
  #rp.a4 h2{ font-size:26px; } #rp.a4 .r{ padding:7px 0; border-bottom:1px solid #ddd; } #rp.a4 .l{ border-top:1px solid #bbb; margin:10px 0; }
  .edbtn{ border:1px solid var(--line); background:#fff; border-radius:9px; padding:5px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .ed-bg{ position:fixed; inset:0; z-index:2147483000; background:rgba(40,20,30,.45); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; }
  .ed{ background:#fff; border-radius:16px; width:min(520px,100%); padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .ed h3{ margin:0 0 4px; font-size:17px } .ed .sub{ font-size:12px; color:var(--dim); margin-bottom:12px }
  .ed label{ display:block; font-size:12px; font-weight:700; color:var(--dim); margin:10px 0 4px }
  .ed input,.ed select{ width:100%; box-sizing:border-box; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:8px 10px }
  .ed .it{ display:flex; gap:6px; align-items:center; margin-bottom:6px } .ed .it .n{ flex:1; font-size:13.5px } .ed .it input{ width:90px }
  .ed .it button{ border:0; background:#fde2e2; color:var(--bad); border-radius:8px; padding:6px 9px; cursor:pointer }
  .ed .acts{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px } .ed .acts button{ border:0; border-radius:10px; padding:9px 16px; font:inherit; font-weight:700; cursor:pointer }
  .ed .acts .sv{ background:#2f7a4f; color:#fff } .ed .note{ font-size:12px; color:var(--dim); margin-top:8px; line-height:1.4 }
  .tag.ed2{ background:#fff4d6; color:#8a6400 }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<div class="wrap">
  <header>
    <div id="backCalc" data-lb-pills style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
      <a href="flower-calc.html" data-k="flower" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">&larr; 🌸 Flower Calc</a>
      <a href="chocolate-calc.html" data-k="chocolate" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">&larr; 🍫 Chocolate Calc</a>
      <a href="mixed-calc.html" data-k="mixed" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">💐 Mixed Calc</a>
      <a href="flower-dashboard.html" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">🌷 Flower Dashboard</a>
      <a href="dashboard.html" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">🍫 Choco Dashboard</a>
      <a href="#" data-kind="flower" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">🧾 Flower Sales</a>
      <a href="#" data-kind="chocolate" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">🧾 Choco Sales</a>
      <a href="#" data-kind="" style="display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);color:#5a3a46;font-size:12px;font-weight:700;text-decoration:none;">🧾 All Sales</a>
    </div>
    <h1>🧾 Calc Sales</h1>
    <div class="sub">Every "✓ Sold" from the Flower Calc and Chocolate Calc — what was taken out of each branch's stock</div>
  </header>
  <div class="bar">
    <select id="br"><option value="">All branches</option><option>ModaMall</option><option>Hamala</option><option>Galali</option></select>
    <select id="kind"><option value="">Flower + Chocolate</option><option value="flower">🌸 Flower</option><option value="chocolate">🍫 Chocolate</option></select>
    <label style="font-size:12.5px">From <input type="date" id="from" style="font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:6px 8px"></label>
    <label style="font-size:12.5px">To <input type="date" id="to" style="font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:6px 8px"></label>
    <input id="q" placeholder="Search sale no., name, source…" style="font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:180px">
    <button id="ref">↻ Refresh</button>
    <span class="mode" id="modeBox" style="display:none">Stock is taken out by: <button data-mode="calc">Calc</button><button data-mode="odoo">Odoo</button></span>
  </div>
  <div id="sum" style="font-size:12.5px;color:var(--dim);margin:0 0 8px"></div>
  <div class="card" id="list"><div class="empty">Loading…</div></div>
  <div class="card" id="sumCard" style="margin-top:14px;display:none"></div>
</div>
<div id="rp"></div>
<script>
(function(){
  var API = (window.LB_CONFIG && LB_CONFIG.CALC_SALE_API) || 'https://zoratiahjeldgsognfsj.supabase.co/functions/v1/calcsale-fast';
  var esc = window.lbEsc, $ = function(id){ return document.getElementById(id); };
  function token(){ try{ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }catch(e){ return ''; } }
  var u = {}; try{ u = JSON.parse(sessionStorage.getItem('lalabellaUser') || localStorage.getItem('lalabellaUser') || '{}') || {}; }catch(e){}
  var admin = String(u.role || '').toLowerCase() === 'admin';
  function when(t){ var d = new Date(t); return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
  // Nov 21 (Bench): chocolate pieces also show the weight, e.g. "51 pcs (0.510 kg)"
  function chocQty(it){
    var kg = Number(it.kg) || 0;
    if(it.mode === 'pieces') return esc(it.amount) + ' pcs' + (kg > 0 ? ' (' + kg.toFixed(3) + ' kg)' : '');
    return kg.toFixed(3) + ' kg';
  }
  function itemText(s){
    return (s.items || []).map(function(it){
      if(s.kind === 'flower') return esc(it.name) + ' × ' + esc(it.qty);
      return esc(it.name) + ' — ' + chocQty(it);
    }).join(' · ') + (extrasOf(s).length ? '<div style="margin-top:3px;color:#7a5a20">🎀 Extras: ' + extrasOf(s).map(function(x){ return esc(x.desc) + ' ' + f3(x.price); }).join(' · ') + '</div>' : '');
  }
  // Nov 15 2026: the extras of a sale (older sales only know the extras total -> one "Extras" line)
  function extrasOf(s){
    if(s.extras && s.extras.length) return s.extras.map(function(x){ return { desc: x.desc, price: Number(x.price) || 0 }; });
    return (Number(s.extrasTotal) || 0) > 0.0005 ? [{ desc:'Extras', price:Number(s.extrasTotal) }] : [];
  }
  var SALES = [];
  function f3(n){ return (Number(n) || 0).toFixed(3); }
  // Reprint a sale (copy of the receipt) — Thermal or A4, one page
  function reprint(s, mode){
    var rows = (s.items || []).map(function(it){
      if(s.kind === 'flower') return '<div class="r"><span>' + esc(it.name) + ' x' + esc(it.qty) + '</span><span>' + f3((Number(it.qty) || 0) * (Number(it.rate) || 0)) + ' BD</span></div>';
      return '<div class="r"><span>' + esc(it.name) + ' — ' + chocQty(it) + '</span><span>' + f3(it.total) + ' BD</span></div>';
    }).join('') + extrasOf(s).map(function(x){ return '<div class="r"><span>' + esc(x.desc) + '</span><span>' + f3(x.price) + ' BD</span></div>'; }).join('');
    // Nov 21 (Bench): total kg per collection on the receipt
    if(s.kind !== 'flower' && CAT){
      var by = {}, all = 0; (s.items || []).forEach(function(it){ var g = it.cat || CAT['c:' + it.code] || CAT['n:' + String(it.name).toLowerCase()] || 'Other'; var k = chocKg(it); by[g] = (by[g] || 0) + k; all += k; });
      if(Object.keys(by).length) rows += '<div class="l"></div>' + Object.keys(by).sort().map(function(g){ return '<div class="r"><span>' + esc(g) + '</span><span>' + by[g].toFixed(3) + ' kg</span></div>'; }).join('') +
        '<div class="r" style="font-weight:800"><span>Total chocolate</span><span>' + all.toFixed(3) + ' kg</span></div>';
    }
    $('rp').className = mode;
    $('rp').innerHTML = '<h2>' + (s.kind === 'flower' ? 'Lalabella Flowers' : 'Lalabella') + '</h2><div class="c">' + esc(s.branch) + ' · ' + when(s.at) + '</div>' +
      '<div class="c">' + esc(s.saleNo) + (s.releaseNo ? ' · ' + esc(s.releaseNo) : '') + '</div>' +
      '<div class="c">' + esc(s.source || '') + (s.ref && s.ref !== s.source ? ' · ' + esc(s.ref) : '') + '</div><div class="l"></div>' + rows +
      '<div class="l"></div><div class="r t"><span>TOTAL</span><span>' + f3(s.total) + ' BD</span></div>' + (s.status !== 'Active' ? '<div class="c">** CANCELLED **</div>' : '') + '<div class="c" style="margin-top:6px">Thank you!</div>';
    var st = $('rpPage'); if(!st){ st = document.createElement('style'); st.id = 'rpPage'; document.head.appendChild(st); }
    if(mode === 'a4') st.textContent = '@page{ size:A4; margin:14mm; }';
    else { var r = $('rp'); r.style.cssText = 'display:block;position:fixed;left:-9999px;top:0;width:72mm;padding:2mm;box-sizing:border-box;font-family:Courier New,monospace;font-size:11px';
      var mm = Math.max(50, Math.ceil(r.getBoundingClientRect().height * 25.4 / 96) + 8); r.removeAttribute('style'); st.textContent = '@page{ size:76mm ' + mm + 'mm; margin:2mm; }'; }
    window.print();
  }
  // ---------- 📊 Summary like the POS report (Bench, Nov 21): chocolates per collection in kg, flowers per flower ----------
  var CAT = null;   // chocolate name / code -> collection
  function loadCats(){
    if(CAT) return Promise.resolve(CAT);
    var u = (window.LB_CONFIG && LB_CONFIG.CHOCOLATE_FAST_API) || 'https://zoratiahjeldgsognfsj.supabase.co/functions/v1/chocolate-fast';
    return fetch(u + '?action=getItems&token=' + encodeURIComponent(token())).then(function(r){ return r.json(); }).then(function(list){
      CAT = {}; (Array.isArray(list) ? list : (list && list.items) || []).forEach(function(it){ var c = it['Category'] || it.category || ''; if(it['Chocolate Name']) CAT['n:' + String(it['Chocolate Name']).toLowerCase()] = c; if(it['Product Code']) CAT['c:' + it['Product Code']] = c; });
      return CAT; }).catch(function(){ CAT = {}; return CAT; });
  }
  function chocKg(it){ var kg = Number(it.kg) || 0; if(kg > 0) return kg; var a = Number(it.amount) || 0;
    return it.mode === 'grams' ? a / 1000 : it.mode === 'kg' ? a : (it.gpp ? a * Number(it.gpp) / 1000 : 0); }
  var SUMHTML = '';
  function drawSummary(act){
    loadCats().then(function(cat){
      var cg = {}, fl = {}, ck = 0, cb = 0, fs = 0, fb = 0, ex = 0, nC = 0, nF = 0;
      act.forEach(function(s){
        ex += extrasOf(s).reduce(function(a, x){ return a + (Number(x.price) || 0); }, 0);
        (s.items || []).forEach(function(it){
          if(s.kind === 'flower'){ var q = Number(it.qty) || 0, b = q * (Number(it.rate) || 0), k = it.name; fl[k] = fl[k] || { q:0, b:0 }; fl[k].q += q; fl[k].b += b; fs += q; fb += b; nF++; }
          else { var g = cat['c:' + it.code] || cat['n:' + String(it.name).toLowerCase()] || 'Other'; var kg = chocKg(it), bd = Number(it.total) || 0;
            g = it.cat || g; cg[g] = cg[g] || { kg:0, b:0, pcs:0 }; cg[g].kg += kg; cg[g].b += bd; if(it.mode === 'pieces') cg[g].pcs += Number(it.amount) || 0; ck += kg; cb += bd; nC++; }
        });
      });
      if(!nC && !nF){ $('sumCard').style.display = 'none'; SUMHTML = ''; return; }
      var row = function(a, b, c){ return '<tr><td>' + a + '</td><td class="n">' + b + '</td><td class="n">' + c + '</td></tr>'; };
      var chocT = nC ? '<div><h3>🍫 Chocolate per collection</h3><table><tr><th>Collection</th><th class="n">Weight</th><th class="n">Amount</th></tr>' +
        Object.keys(cg).sort().map(function(k){ return row(esc(k) + (cg[k].pcs ? ' <span style="color:#8a7078;font-size:11.5px">(' + cg[k].pcs + ' pcs)</span>' : ''), cg[k].kg.toFixed(3) + ' kg', f3(cg[k].b) + ' BD'); }).join('') +
        '<tr class="t"><td>TOTAL chocolate</td><td class="n">' + ck.toFixed(3) + ' kg</td><td class="n">' + f3(cb) + ' BD</td></tr></table></div>' : '';
      var flT = nF ? '<div><h3>🌸 Flowers</h3><table><tr><th>Flower</th><th class="n">Stems</th><th class="n">Amount</th></tr>' +
        Object.keys(fl).sort().map(function(k){ return row(esc(k), String(Math.round(fl[k].q * 1000) / 1000), f3(fl[k].b) + ' BD'); }).join('') +
        '<tr class="t"><td>TOTAL flowers</td><td class="n">' + (Math.round(fs * 1000) / 1000) + '</td><td class="n">' + f3(fb) + ' BD</td></tr></table></div>' : '';
      var exT = ex > 0 ? '<div style="margin-top:8px;font-size:13px">🎀 Extras: <b>' + f3(ex) + ' BD</b> · Grand total: <b>' + f3(cb + fb + ex) + ' BD</b></div>' : '';
      var info = act.length + ' sale(s), not cancelled' + ($('br').value ? ' · ' + esc($('br').value) : ' · all branches') + (($('from').value || $('to').value) ? ' · ' + esc($('from').value || '…') + ' to ' + esc($('to').value || 'today') : ' · latest');
      SUMHTML = '<div class="sg">' + chocT + flT + '</div>' + exT;
      $('sumCard').innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b style="font-size:15px">📊 Summary</b><span style="font-size:12px;color:var(--dim)">' + info + '</span><button class="pbtn" id="sumPrint" style="margin-left:auto">🖨️ Print summary</button></div>' + SUMHTML;
      $('sumCard').style.display = '';
      $('sumPrint').onclick = function(){
        var tbl = SUMHTML.replace(/<table>/g, '<table class="st">');
        $('rp').className = 'a4';
        $('rp').innerHTML = '<h2 style="margin:0 0 4px">Lalabella — Sales summary</h2><div style="font-size:12px;margin-bottom:12px">' + info + '</div>' + tbl.replace('class="sg"', 'style="display:block"') + '<div style="margin-top:14px;font-size:11px;color:#666">Printed ' + new Date().toLocaleString('en-GB') + '</div>';
        var st = $('rpPage'); if(!st){ st = document.createElement('style'); st.id = 'rpPage'; document.head.appendChild(st); }
        st.textContent = '@page{ size:A4; margin:14mm; }'; window.print();
      };
    });
  }
  function load(){
    var q = new URLSearchParams({ action:'listSales', token:token(), branch:$('br').value, kind:$('kind').value, from:$('from').value, to:$('to').value, limit:($('from').value || $('to').value) ? '1000' : '200' });
    fetch(API + '?' + q).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.success){ $('list').innerHTML = '<div class="empty">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
      if(admin){ $('modeBox').style.display = 'flex'; document.querySelectorAll('#modeBox button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-mode') === d.mode); }); }
      var term = $('q').value.trim().toLowerCase();
      d.sales = d.sales.filter(function(s){ return !term || [s.saleNo, s.ref, s.source, s.branch, s.by, s.releaseNo].concat((s.items || []).map(function(it){ return it.name; })).join(' ').toLowerCase().indexOf(term) !== -1; });
      SALES = d.sales;
      var act = d.sales.filter(function(s){ return s.status === 'Active'; }), tot = act.reduce(function(a, s){ return a + (Number(s.total) || 0); }, 0);
      $('sum').textContent = d.sales.length + ' sale(s)' + (($('from').value || $('to').value) ? ' · ' + ($('from').value || '…') + ' to ' + ($('to').value || 'today') : ' · latest') + ' · Total (not cancelled): ' + tot.toFixed(3) + ' BD';
      $('list').innerHTML = d.sales.length ? d.sales.map(function(s, i){
        var cx = s.status !== 'Active';
        return '<div class="sale' + (cx ? ' cx' : '') + '"><div class="top"><b>' + esc(s.saleNo || '…') + '</b><span class="tag ' + (s.kind === 'flower' ? 'f' : 'c') + '">' + (s.kind === 'flower' ? '🌸 Flower' : '🍫 Chocolate') + '</span><span class="tag">' + esc(s.branch) + '</span>' + (s.source ? '<span class="tag">' + esc(s.source) + '</span>' : '') +(s.groupNo ? '<span class="tag" title="Flower + chocolate sold together (Mixed calc). Cancelling one cancels both.">🔗 Mixed ' + esc(s.groupNo) + '</span>' : '') +
          (cx ? '<span class="tag x">Cancelled by ' + esc(s.cancelledBy) + '</span>' : '') + '<span class="m">' + when(s.at) + ' · ' + esc(s.by) + (s.ref ? ' · ' + esc(s.ref) : '') + (s.releaseNo ? ' · ' + esc(s.releaseNo) : '') + (s.total ? ' · ' + Number(s.total).toFixed(3) + ' BD' : '') + '</span>' +
          '<span style="display:flex;gap:6px;margin-left:auto"><button class="pbtn" data-pr="th" data-i="' + i + '">🧾 Thermal</button><button class="pbtn" data-pr="a4" data-i="' + i + '">🖨️ A4</button></span>' +
          (admin && !cx ? '<button class="edbtn" data-ed="' + i + '">✏️ Edit</button><button class="cxbtn" data-cx="' + esc(s.id) + '" data-no="' + esc(s.saleNo) + '">Cancel (put back in stock)</button>' : '') + (admin ? '<button class="cxbtn" data-del="' + esc(s.id) + '" data-no="' + esc(s.saleNo) + '" title="Delete this sale (Admin)" style="margin-left:6px">🗑️ Delete</button>' : '') + '</div>' +
          (s.editedBy ? '<div style="font-size:11.5px;color:#8a6400;margin-top:2px">✏️ Edited by ' + esc(s.editedBy) + ' · ' + when(s.editedAt) + '</div>' : '') +
          '<div class="items">' + itemText(s) + '</div>' +
          (s.short && s.short.length ? '<div class="short">⚠ Not enough in the system: ' + s.short.map(function(x){ return esc(x.name) + ' (needed ' + esc(x.need) + ', had ' + esc(x.have) + ')'; }).join(' · ') + '</div>' : '') + '</div>';
      }).join('') : '<div class="empty">No calc sales yet.</div>';
      drawSummary(act);
    }).catch(function(){ $('list').innerHTML = '<div class="empty">Connection problem.</div>'; });
  }
  document.addEventListener('click', function(e){
    var pr = e.target.closest('[data-pr]'); if(pr){ var sv = SALES[Number(pr.getAttribute('data-i'))]; if(sv) reprint(sv, pr.getAttribute('data-pr')); return; }
    var ed = e.target.closest('[data-ed]'); if(ed){ var se = SALES[Number(ed.getAttribute('data-ed'))]; if(se) openEdit(se); return; }
    var dl = e.target.closest('[data-del]');
    if(dl){ var sx = (SALES || []).find(function(x){ return String(x.id) === dl.getAttribute('data-del'); }) || {};
      if(!confirm('DELETE ' + dl.getAttribute('data-no') + '?\n\n' + (sx.status === 'Active' ? 'It is still active: what it took out is put back in stock first, then the sale is removed.' : 'It is already cancelled: the sale is removed from the list.') + (sx.groupNo ? '\n\n🔗 Mixed order: the other sale of ' + sx.groupNo + ' is deleted too.' : '') + '\n\nA copy is kept for the Admin.')) return;
      dl.disabled = true;
      fetch(API, { method:'POST', body:new URLSearchParams({ action:'deleteSale', id:dl.getAttribute('data-del'), token:token() }) }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) alert(d.error || 'Failed.'); else if(d.deleted && d.deleted.length > 1) alert('Deleted: ' + d.deleted.join(', ')); load(); }).catch(function(){ alert('Connection problem.'); dl.disabled = false; }); return; }
    var b = e.target.closest('[data-cx]');
    if(b){ var mx = (SALES || []).find(function(x){ return String(x.id) === b.getAttribute('data-cx'); }) || {};
      if(!confirm('Cancel ' + b.getAttribute('data-no') + '? Everything it took out goes back into stock.' + (mx.groupNo ? '\n\n🔗 This is a Mixed order (flower + chocolate): the other sale of ' + mx.groupNo + ' is cancelled too.' : ''))) return; b.disabled = true;
      fetch(API, { method:'POST', body:new URLSearchParams({ action:'cancelSale', id:b.getAttribute('data-cx'), token:token() }) }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) alert(d.error || 'Failed.'); else if(d.alsoCancelled && d.alsoCancelled.length) alert('Also cancelled: ' + d.alsoCancelled.join(', ')); load(); }); return; }
    var m = e.target.closest('[data-mode]');
    if(m){ var v = m.getAttribute('data-mode'); if(!confirm(v === 'odoo' ? 'Let Odoo take sales out of stock? The "Sold" button in the calcs will stop.' : 'Let the calcs take sales out of stock again?')) return;
      fetch(API, { method:'POST', body:new URLSearchParams({ action:'setMode', mode:v, token:token() }) }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) alert(d.error || 'Failed.'); load(); }); }
  });
  // ---- Nov 2026: Edit a sale (wrong source / name / branch / qty) ----
  var SRC = ['Walk-in','Pick-up','Website order','WhatsApp','Corporate','Others'], BRS = ['ModaMall','Hamala','Galali'];
  function openEdit(s){
    var fl = s.kind === 'flower', bg = document.createElement('div'); bg.className = 'ed-bg';
    var items = fl ? (s.items || []).map(function(it){ return { name:it.name, qty:Number(it.qty) || 0 }; }) : [];
    var exs = extrasOf(s).map(function(x){ return { desc:x.desc, price:x.price }; });
    var rateOf = {}; (s.items || []).forEach(function(it){ rateOf[String(it.name).toLowerCase()] = Number(it.rate) || 0; });
    var chocItems = fl ? 0 : (s.items || []).reduce(function(a, it){ return a + (Number(it.total) || 0); }, 0);
    bg.innerHTML = '<div class="ed"><h3>✏️ Edit ' + esc(s.saleNo) + '</h3><div class="sub">' + (fl ? '🌸 Flower' : '🍫 Chocolate') + ' · ' + when(s.at) + ' · ' + esc(s.by) + '</div>' +
      '<label>Source</label><select data-f="source">' + SRC.map(function(x){ return '<option' + (x === s.source ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
      '<label>Sold to (invoice no. / name / phone)</label><input data-f="ref" maxlength="60" value="' + esc(s.ref || '') + '">' +
      '<label>Branch (stock is taken from here)</label><select data-f="branch">' + BRS.map(function(x){ return '<option' + (x === s.branch ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
      (fl ? 
        '<label>Flowers (qty in stems)</label><div data-items></div><div class="note">Tap a flower name to change it (e.g. Rose → S-Rose). Changing a flower or qty puts the old back into stock and takes the new out. The sale keeps its number and time.</div>'
        : '<label>Chocolates</label><div style="font-size:13px;line-height:1.5">' + itemText({ kind:'chocolate', items:s.items }) + '</div><div class="note">For chocolate the chocolates themselves cannot be changed here. Wrong chocolate or qty: Cancel the sale (it goes back to stock) and sell again from the Chocolate Calc.</div>') +
      '<label>🎀 Extras (vase, box, hand work…)</label><div data-extras></div>' +
      '<div data-tot style="margin-top:12px;padding:10px 12px;border-radius:10px;background:#f7f1e8;font-size:13px;line-height:1.6"></div>' +
      '<div class="acts"><button data-x>Close</button><button class="sv" data-sv>Save changes</button></div></div>';
    document.body.appendChild(bg);
    var paint = function(){ var box = bg.querySelector('[data-items]'); if(!box) return;
      box.innerHTML = items.map(function(it, k){ return '<div class="it"><input class="n" list="edFlowers" data-n="' + k + '" value="' + esc(it.name) + '" style="flex:1;width:auto" title="Tap to change the flower"><input type="number" min="0" step="1" inputmode="decimal" data-q="' + k + '" value="' + it.qty + '"><button data-rm="' + k + '" title="Remove">✕</button></div>'; }).join('') +
        '<button type="button" data-add style="border:1px dashed var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;width:100%">＋ Add flower</button>'; };
    if(fl && !document.getElementById('edFlowers')){ var dl = document.createElement('datalist'); dl.id = 'edFlowers'; document.body.appendChild(dl);
      fetch(API + '?action=flowerNames&token=' + encodeURIComponent(token())).then(function(r){ return r.json(); }).then(function(d){ if(d && d.success) dl.innerHTML = d.names.map(function(n){ return '<option value="' + esc(n) + '">'; }).join(''); }).catch(function(){}); }
    var paintEx = function(){ var box = bg.querySelector('[data-extras]');
      box.innerHTML = exs.map(function(x, k){ return '<div class="it"><input class="n" data-xd="' + k + '" value="' + esc(x.desc) + '" placeholder="e.g. Vase" style="flex:1;width:auto"><input type="number" min="0" step="0.001" inputmode="decimal" data-xp="' + k + '" value="' + f3(x.price) + '"><button data-xrm="' + k + '" title="Remove">✕</button></div>'; }).join('') +
        '<button type="button" data-xadd style="border:1px dashed var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;width:100%">＋ Add extra</button>'; };
    var paintTot = function(){
      var it = fl ? items.reduce(function(a, x){ var rt = rateOf[String(x.name).toLowerCase()]; return a + (rt == null ? 0 : rt * (Number(x.qty) || 0)); }, 0) : chocItems;
      var newOnes = fl ? items.filter(function(x){ return x.name && rateOf[String(x.name).toLowerCase()] == null; }).length : 0;
      var ex = exs.reduce(function(a, x){ return a + (Number(x.price) || 0); }, 0);
      bg.querySelector('[data-tot]').innerHTML = (fl ? 'Flowers' : 'Chocolates') + ': <b>' + f3(it) + ' BD</b>' + (newOnes ? ' <span style="color:var(--dim)">(+ new flower at its list rate)</span>' : '') +
        '<br>Extras: <b>' + f3(ex) + ' BD</b><br><span style="font-size:15px">TOTAL: <b>' + f3(it + ex) + ' BD</b></span>' + (Math.abs(it + ex - (Number(s.total) || 0)) > 0.0005 ? ' <span style="color:var(--dim)">(was ' + f3(s.total) + ')</span>' : ''); };
    paint(); paintEx(); paintTot();
    bg.addEventListener('input', function(ev){
      var xd = ev.target.getAttribute && ev.target.getAttribute('data-xd'); if(xd != null) exs[Number(xd)].desc = ev.target.value.trim();
      var xp = ev.target.getAttribute && ev.target.getAttribute('data-xp'); if(xp != null) exs[Number(xp)].price = Number(ev.target.value) || 0;
      setTimeout(paintTot, 0); var q = ev.target.getAttribute && ev.target.getAttribute('data-q'); if(q != null) items[Number(q)].qty = Number(ev.target.value) || 0;
      var nn = ev.target.getAttribute && ev.target.getAttribute('data-n'); if(nn != null) items[Number(nn)].name = ev.target.value.trim(); });
    bg.addEventListener('click', function(ev){
      if(ev.target === bg || ev.target.closest('[data-x]')){ bg.remove(); return; }
      var rm = ev.target.closest('[data-rm]'); if(rm){ items.splice(Number(rm.getAttribute('data-rm')), 1); paint(); paintTot(); return; }
      var xrm = ev.target.closest('[data-xrm]'); if(xrm){ exs.splice(Number(xrm.getAttribute('data-xrm')), 1); paintEx(); paintTot(); return; }
      if(ev.target.closest('[data-xadd]')){ exs.push({ desc:'', price:0 }); paintEx(); var lx = bg.querySelector('[data-xd="' + (exs.length - 1) + '"]'); if(lx) lx.focus(); return; }
      if(ev.target.closest('[data-add]')){ items.push({ name:'', qty:1 }); paint(); var last = bg.querySelector('[data-n="' + (items.length - 1) + '"]'); if(last) last.focus(); return; }
      var sv = ev.target.closest('[data-sv]'); if(!sv) return;
      var keep = items.filter(function(it){ return it.qty > 0 && it.name; });
      var dlist = document.getElementById('edFlowers'), known = dlist ? Array.prototype.map.call(dlist.options, function(o){ return o.value.toLowerCase(); }) : [];
      var bad = keep.filter(function(it){ return known.length && known.indexOf(it.name.toLowerCase()) === -1; });
      if(bad.length){ alert('Pick the flower from the list: ' + bad.map(function(it){ return it.name; }).join(', ')); return; }
      keep.forEach(function(it){ var k = known.indexOf(it.name.toLowerCase()); if(k >= 0) it.name = dlist.options[k].value; });
      if(fl && !keep.length){ alert('At least one flower must stay. To remove everything, use Cancel.'); return; }
      var body = { action:'editSale', id:s.id, token:token(), source:bg.querySelector('[data-f=source]').value, ref:bg.querySelector('[data-f=ref]').value.trim(), customer:s.customer || '' };
      body.branch = bg.querySelector('[data-f=branch]').value;
      if(fl){ body.items = JSON.stringify(keep); }
      else if(body.branch !== s.branch && !confirm('Move ' + s.saleNo + ' from ' + s.branch + ' to ' + body.branch + '?\nThe chocolates go back to ' + s.branch + ' stock and are taken from ' + body.branch + ' stock.')) return;
      var okX = function(x){ return x.desc && (x.price > 0 || (x.price === 0 && /free/i.test(x.desc))); };
      var exKeep = exs.filter(okX);
      if(exs.some(function(x){ return (x.desc && !okX(x)) || (!x.desc && x.price > 0); })){ alert('Each extra needs a name and a price (or remove it with ✕).'); return; }
      body.extrasList = JSON.stringify(exKeep);
      var lines = (fl ? '\n\n' + keep.map(function(it){ return '• ' + it.name + ' × ' + it.qty; }).join('\n') : '') + (exKeep.length ? '\n' + exKeep.map(function(x){ return '• ' + x.desc + ' ' + f3(x.price); }).join('\n') : '');
      if(!confirm('Save changes to ' + s.saleNo + '?' + lines)) return;
      sv.disabled = true; sv.textContent = 'Saving…';
      fetch(API, { method:'POST', body:new URLSearchParams(body) }).then(function(r){ return r.json(); }).then(function(d){
        if(!d.success){ alert(d.error || 'Not saved.'); sv.disabled = false; sv.textContent = 'Save changes'; return; }
        bg.remove(); load(); }).catch(function(){ alert('Connection problem.'); sv.disabled = false; sv.textContent = 'Save changes'; });
    });
  }
  $('br').onchange = load; $('kind').onchange = load; $('ref').onclick = load; $('from').onchange = load; $('to').onchange = load;
  var qt; $('q').oninput = function(){ clearTimeout(qt); qt = setTimeout(load, 350); };
  load();
})();
</script>
<script>
(function(){ try{
  var k = new URLSearchParams(location.search).get('kind') || (/chocolate-calc/.test(document.referrer) ? 'chocolate' : /flower-calc/.test(document.referrer) ? 'flower' : '');
  // Nov 25 2026 (Bench): 🧾 Flower / Choco / All Sales = filter this list right here
  document.querySelectorAll('#backCalc [data-kind]').forEach(function(b){ b.addEventListener('click', function(e){ e.preventDefault(); var sel = document.getElementById('kind'); if(!sel) return; sel.value = b.getAttribute('data-kind'); sel.dispatchEvent(new Event('change', { bubbles:true })); try{ var u = new URL(location.href); if(sel.value) u.searchParams.set('kind', sel.value); else u.searchParams.delete('kind'); history.replaceState(null, '', u); }catch(x){} }); });
  if(!k) return;
  var box = document.getElementById('backCalc'), a = box.querySelector('[data-k="' + k + '"]');
  if(a){ box.insertBefore(a, box.firstChild); a.style.background = '#a8405e'; a.style.color = '#fff'; }
  var sel = document.getElementById('kind'); if(sel && !sel.value){ sel.value = k; sel.dispatchEvent(new Event('change', { bubbles:true })); }
}catch(e){} })();
</script>
