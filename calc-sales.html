<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calc Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".wrap, .card, .sale">
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#fbeff2,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 60px; }
  header{ padding-left:56px; margin:6px 0 12px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar select,.bar button{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .mode{ margin-left:auto; font-size:12.5px; display:flex; gap:6px; align-items:center; }
  .mode button.on{ background:var(--ok); color:#fff; border-color:var(--ok); }
  .card{ background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:14px; padding:4px 14px; }
  .sale{ border-top:1px solid var(--line); padding:11px 0; font-size:13px; }
  .sale:first-child{ border-top:0; }
  .sale.cx{ opacity:.55; }
  .top{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .top b{ font-size:15px; } .m{ color:var(--dim); font-size:11.5px; }
  .tag{ font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px; background:#f1e7ea; }
  .tag.f{ background:#fde3ea; } .tag.c{ background:#efe1d4; } .tag.x{ background:#eee; color:#888; }
  .items{ margin-top:4px; font-size:12.5px; }
  .short{ color:#a8560b; font-size:12px; margin-top:3px; }
  .cxbtn{ margin-left:auto; border:1px solid var(--bad); color:var(--bad); background:#fff; border-radius:9px; padding:5px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<div class="wrap">
  <header>
    <h1>🧾 Calc Sales</h1>
    <div class="sub">Every "✓ Sold" from the Flower Calc and Chocolate Calc — what was taken out of each branch's stock</div>
  </header>
  <div class="bar">
    <select id="br"><option value="">All branches</option><option>ModaMall</option><option>Hamala</option><option>Galali</option></select>
    <select id="kind"><option value="">Flower + Chocolate</option><option value="flower">🌸 Flower</option><option value="chocolate">🍫 Chocolate</option></select>
    <button id="ref">↻ Refresh</button>
    <span class="mode" id="modeBox" style="display:none">Stock is taken out by: <button data-mode="calc">Calc</button><button data-mode="odoo">Odoo</button></span>
  </div>
  <div class="card" id="list"><div class="empty">Loading…</div></div>
</div>
<script>
(function(){
  var API = (window.LB_CONFIG && LB_CONFIG.CALC_SALE_API) || 'https://zoratiahjeldgsognfsj.supabase.co/functions/v1/calcsale-fast';
  var esc = window.lbEsc, $ = function(id){ return document.getElementById(id); };
  function token(){ try{ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }catch(e){ return ''; } }
  var u = {}; try{ u = JSON.parse(sessionStorage.getItem('lalabellaUser') || localStorage.getItem('lalabellaUser') || '{}') || {}; }catch(e){}
  var admin = String(u.role || '').toLowerCase() === 'admin';
  function when(t){ var d = new Date(t); return d.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
  function itemText(s){
    return (s.items || []).map(function(it){
      if(s.kind === 'flower') return esc(it.name) + ' × ' + esc(it.qty);
      return esc(it.name) + ' — ' + (it.mode === 'pieces' ? esc(it.amount) + ' pcs' : (Number(it.kg) || 0).toFixed(3) + ' kg');
    }).join(' · ');
  }
  function load(){
    var q = new URLSearchParams({ action:'listSales', token:token(), branch:$('br').value, kind:$('kind').value, limit:'200' });
    fetch(API + '?' + q).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.success){ $('list').innerHTML = '<div class="empty">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
      if(admin){ $('modeBox').style.display = 'flex'; document.querySelectorAll('#modeBox button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-mode') === d.mode); }); }
      $('list').innerHTML = d.sales.length ? d.sales.map(function(s){
        var cx = s.status !== 'Active';
        return '<div class="sale' + (cx ? ' cx' : '') + '"><div class="top"><b>' + esc(s.saleNo || '…') + '</b><span class="tag ' + (s.kind === 'flower' ? 'f' : 'c') + '">' + (s.kind === 'flower' ? '🌸 Flower' : '🍫 Chocolate') + '</span><span class="tag">' + esc(s.branch) + '</span>' +
          (cx ? '<span class="tag x">Cancelled by ' + esc(s.cancelledBy) + '</span>' : '') + '<span class="m">' + when(s.at) + ' · ' + esc(s.by) + (s.ref ? ' · ' + esc(s.ref) : '') + (s.releaseNo ? ' · ' + esc(s.releaseNo) : '') + (s.total ? ' · ' + Number(s.total).toFixed(3) + ' BD' : '') + '</span>' +
          (admin && !cx ? '<button class="cxbtn" data-cx="' + esc(s.id) + '" data-no="' + esc(s.saleNo) + '">Cancel (put back in stock)</button>' : '') + '</div>' +
          '<div class="items">' + itemText(s) + '</div>' +
          (s.short && s.short.length ? '<div class="short">⚠ Not enough in the system: ' + s.short.map(function(x){ return esc(x.name) + ' (needed ' + esc(x.need) + ', had ' + esc(x.have) + ')'; }).join(' · ') + '</div>' : '') + '</div>';
      }).join('') : '<div class="empty">No calc sales yet.</div>';
    }).catch(function(){ $('list').innerHTML = '<div class="empty">Connection problem.</div>'; });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-cx]');
    if(b){ if(!confirm('Cancel ' + b.getAttribute('data-no') + '? Everything it took out goes back into stock.')) return; b.disabled = true;
      fetch(API, { method:'POST', body:new URLSearchParams({ action:'cancelSale', id:b.getAttribute('data-cx'), token:token() }) }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) alert(d.error || 'Failed.'); load(); }); return; }
    var m = e.target.closest('[data-mode]');
    if(m){ var v = m.getAttribute('data-mode'); if(!confirm(v === 'odoo' ? 'Let Odoo take sales out of stock? The "Sold" button in the calcs will stop.' : 'Let the calcs take sales out of stock again?')) return;
      fetch(API, { method:'POST', body:new URLSearchParams({ action:'setMode', mode:v, token:token() }) }).then(function(r){ return r.json(); }).then(function(d){ if(!d.success) alert(d.error || 'Failed.'); load(); }); }
  });
  $('br').onchange = load; $('kind').onchange = load; $('ref').onclick = load;
  load();
})();
</script>
</body>
</html>
