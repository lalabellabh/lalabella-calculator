<!doctype html>
<html lang="en">
<head>
<script src="auth-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lalabella — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#c9506b; --rose-dark:#9e2f4a; --gold:#d9a441; --gold-light:#f1d38c;
    --ink:#2f2024; --muted:#8a7078; --line:#f0dede; --panel:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fdf1f0 0%,#f6e0da 45%,#eaf3ec 100%);font-family:'Space Grotesk',sans-serif;color:var(--ink);}
  body{padding:22px 16px 60px;}
  .wrap{max-width:560px;margin:0 auto;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:grid;place-items:center;font-weight:800;color:#3a2a10;}
  .brand b{font-family:'Fraunces',serif;font-size:15px;}
  .backlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:9px;background:#fff;}

  /* Photo hero */
  .photo-hero{background:linear-gradient(150deg,#3a1420,#5c1a28 55%,#7a2436);border-radius:22px;padding:34px 26px;text-align:center;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;}
  .photo-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(217,164,65,.2),transparent 55%);}
  .avatar-wrap{position:relative;z-index:1;width:104px;height:104px;margin:0 auto 14px;}
  .avatar-img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--gold-light);background:#4a2a30;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--gold-light);font-family:'Fraunces',serif;}
  .avatar-edit-btn{position:absolute;bottom:0;right:0;width:34px;height:34px;border-radius:50%;background:var(--gold);border:2px solid #fff;display:grid;place-items:center;cursor:pointer;font-size:15px;}
  .hero-name{position:relative;z-index:1;font-family:'Fraunces',serif;font-size:22px;font-weight:700;margin:0 0 4px;}
  .hero-role{position:relative;z-index:1;font-size:12px;color:rgba(255,255,255,.8);}
  .hero-branch-tag{position:relative;z-index:1;display:inline-block;margin-top:10px;font-size:11px;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:20px;}

  /* Sections */
  .section-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 6px 18px rgba(158,47,74,.06);}
  .section-title{font-family:'Fraunces',serif;font-size:16px;margin:0 0 16px;display:flex;align-items:center;gap:8px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fdf9f8;outline:none;box-sizing:border-box;}
  .field input:focus,.field select:focus{border-color:var(--rose);}
  .field input:disabled{color:var(--muted);background:#f4efee;}

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:38px;}
  .pw-toggle{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#a98a90;font-size:16px;}

  .save-btn{padding:12px 24px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .save-btn:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;margin-top:10px;display:none;}
  .msg.ok{color:#3d7a4f;}
  .msg.err{color:#c0392b;}

  .logout-btn{width:100%;padding:13px;border:1.5px solid #c0392b;border-radius:12px;background:#fff;color:#c0392b;font-weight:700;font-size:13px;cursor:pointer;}

  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">L</div><b>My Profile</b></div>
    <a class="backlink" href="index.html">← Back to Lalabella</a>
  </div>

  <div class="photo-hero">
    <div class="avatar-wrap">
      <div class="avatar-img" id="avatarImg">—</div>
      <div class="avatar-edit-btn" id="avatarEditBtn">📷</div>
      <input type="file" id="photoInput" accept="image/*">
    </div>
    <div class="hero-name" id="heroName">—</div>
    <div class="hero-role" id="heroRole">—</div>
    <div class="hero-branch-tag" id="heroBranch">—</div>
  </div>

  <div class="section-card">
    <h3 class="section-title">✏️ Edit Info</h3>
    <div class="field">
      <label>Username</label>
      <input type="text" id="usernameField" disabled>
    </div>
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="fullNameField">
    </div>
    <div class="field">
      <label>Branch</label>
      <select id="branchField">
        <option>ModaMall</option><option>Hamala</option><option>Galali</option>
      </select>
    </div>
    <button class="save-btn" id="saveInfoBtn">Save Changes</button>
    <div class="msg" id="infoMsg"></div>
  </div>

  <div class="section-card">
    <h3 class="section-title">🔒 Change Password</h3>
    <div class="field">
      <label>Current Password</label>
      <div class="pw-wrap">
        <input type="password" id="currentPw">
        <button type="button" class="pw-toggle" id="toggleCurrentPw">👁</button>
      </div>
    </div>
    <div class="field">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" id="newPw">
        <button type="button" class="pw-toggle" id="toggleNewPw">👁</button>
      </div>
    </div>
    <button class="save-btn" id="savePwBtn">Update Password</button>
    <div class="msg" id="pwMsg"></div>
  </div>

  <div class="section-card">
    <button class="logout-btn" id="logoutBtn">🚪 Log Out</button>
  </div>
</div>

<script>
const AUTH_API_URL = 'https://script.google.com/macros/s/AKfycbxKYKjmEfD7NXNmC5P9acKvvrTbUf3GE061VoKMUb0l_miYPVJ_JbpiyG7Nrjs2y2b2/exec';

function getToken(){ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }

function setupPwToggle(inputId, btnId){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  });
}
setupPwToggle('currentPw','toggleCurrentPw');
setupPwToggle('newPw','toggleNewPw');

async function loadProfile(){
  const token = getToken();
  try{
    const res = await fetch(AUTH_API_URL + '?action=getProfile&token=' + encodeURIComponent(token));
    const data = await res.json();
    if(!data.success){ return; }
    const p = data.profile;
    document.getElementById('heroName').textContent = p.fullName || p.username;
    document.getElementById('heroRole').textContent = p.role || 'Staff';
    document.getElementById('heroBranch').textContent = p.branch || '—';
    document.getElementById('usernameField').value = p.username;
    document.getElementById('fullNameField').value = p.fullName || '';
    document.getElementById('branchField').value = p.branch || 'ModaMall';

    const avatarEl = document.getElementById('avatarImg');
    if(p.photoDataUri){
      avatarEl.style.backgroundImage = `url('${p.photoDataUri}')`;
      avatarEl.style.backgroundSize = 'cover';
      avatarEl.style.backgroundPosition = 'center';
      avatarEl.textContent = '';
    } else {
      avatarEl.textContent = (p.fullName || p.username || '?').charAt(0).toUpperCase();
    }
  }catch(e){
    console.error('[Profile] load failed', e);
  }
}
loadProfile();

// ---------- Photo upload: compress client-side to keep it small ----------
document.getElementById('avatarEditBtn').addEventListener('click', () => {
  document.getElementById('photoInput').click();
});
document.getElementById('photoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev) => { img.src = ev.target.result; };
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const size = 200; // small square avatar keeps this to just a few KB
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const scale = Math.max(size/img.width, size/img.height);
    const w = img.width*scale, h = img.height*scale;
    ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
    saveProfile(null, null, compressedBase64);

    const avatarEl = document.getElementById('avatarImg');
    avatarEl.style.backgroundImage = `url('${compressedBase64}')`;
    avatarEl.style.backgroundSize = 'cover';
    avatarEl.style.backgroundPosition = 'center';
    avatarEl.textContent = '';
  };
  reader.readAsDataURL(file);
});

async function saveProfile(fullName, branch, photoBase64){
  const token = getToken();
  const params = new URLSearchParams({ action:'updateProfile', token });
  if(fullName) params.set('fullName', fullName);
  if(branch) params.set('branch', branch);
  if(photoBase64) params.set('photoBase64', photoBase64);
  const res = await fetch(AUTH_API_URL + '?' + params.toString());
  return res.json();
}

document.getElementById('saveInfoBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveInfoBtn');
  const msg = document.getElementById('infoMsg');
  btn.disabled = true; btn.textContent = 'Saving…';
  const fullName = document.getElementById('fullNameField').value.trim();
  const branch = document.getElementById('branchField').value;
  try{
    const data = await saveProfile(fullName, branch, null);
    btn.disabled = false; btn.textContent = 'Save Changes';
    msg.className = 'msg ' + (data.success ? 'ok' : 'err');
    msg.textContent = data.success ? 'Saved!' : (data.error || 'Failed to save.');
    msg.style.display = 'block';
    if(data.success){
      document.getElementById('heroName').textContent = fullName;
      document.getElementById('heroBranch').textContent = branch;
      const userStr = sessionStorage.getItem('lalabellaUser');
      if(userStr){
        const u = JSON.parse(userStr);
        u.fullName = fullName; u.branch = branch;
        sessionStorage.setItem('lalabellaUser', JSON.stringify(u));
        localStorage.setItem('lalabellaUser', JSON.stringify(u));
      }
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Save Changes';
    msg.className = 'msg err'; msg.textContent = 'Connection error.'; msg.style.display = 'block';
  }
});

document.getElementById('savePwBtn').addEventListener('click', async () => {
  const btn = document.getElementById('savePwBtn');
  const msg = document.getElementById('pwMsg');
  const currentPassword = document.getElementById('currentPw').value;
  const newPassword = document.getElementById('newPw').value;
  if(!currentPassword || !newPassword){
    msg.className = 'msg err'; msg.textContent = 'Both fields are required.'; msg.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = 'Updating…';
  const token = getToken();
  try{
    const res = await fetch(AUTH_API_URL + '?action=changePassword&token=' + encodeURIComponent(token)
      + '&currentPassword=' + encodeURIComponent(currentPassword) + '&newPassword=' + encodeURIComponent(newPassword));
    const data = await res.json();
    btn.disabled = false; btn.textContent = 'Update Password';
    msg.className = 'msg ' + (data.success ? 'ok' : 'err');
    msg.textContent = data.success ? 'Password updated!' : (data.error || 'Failed.');
    msg.style.display = 'block';
    if(data.success){
      document.getElementById('currentPw').value = '';
      document.getElementById('newPw').value = '';
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Update Password';
    msg.className = 'msg err'; msg.textContent = 'Connection error.'; msg.style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('lalabellaToken');
  sessionStorage.removeItem('lalabellaUser');
  localStorage.removeItem('lalabellaToken');
  localStorage.removeItem('lalabellaUser');
  window.location.href = 'index.html';
});
</script>
</body>
</html>
