<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — My Profile</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:#faf9f6;color:#403c3a;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between}.card{background:#fff;border:1px solid #e6e0dc;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 10px 30px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:11px;color:#827976;margin:0 0 6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e3dcd8;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;font-weight:700;cursor:pointer}.primary{background:#2f6570;color:#fff}.danger{background:#fff0f0;color:#a33}.muted{color:#827976;font-size:12px}.msg{margin-top:10px;font-size:13px}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#dcebed;display:grid;place-items:center;font-size:34px;color:#2f6570;margin-bottom:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a href="index.html">← Dashboard</a><button id="logout" class="danger">Logout</button></div><div class="card"><div id="avatar" class="avatar">L</div><h1 id="name">My Profile</h1><p id="role" class="muted"></p></div><div class="card"><h2>Profile Information</h2><div class="grid"><div><label>Email</label><input id="email" disabled></div><div><label>Username</label><input id="username" disabled></div><div><label>Full Name</label><input id="fullName"></div><div><label>Branch</label><select id="branch"><option value="">Unassigned</option><option>ModaMall</option><option>Hamala</option><option>Galali</option></select></div></div><p id="branchNote" class="muted"></p><button id="save" class="primary" style="margin-top:16px">Save Changes</button><div id="info" class="msg"></div></div><div class="card"><h2>Change Password</h2><p class="muted">Enter your current password to re-authenticate, then choose a new password.</p><div class="grid"><div><label>Current Password</label><input id="current" type="password"></div><div><label>New Password</label><input id="new" type="password" minlength="8"></div></div><button id="pw" class="primary" style="margin-top:16px">Update Password</button><div id="pwmsg" class="msg"></div></div></div><script>let user,profile;const $=x=>document.getElementById(x);async function init(){user=await sbAuth.getUser();profile=await sbAuth.getProfile();if(!user||!profile){location.href='login.html';return}$('email').value=user.email||'';$('username').value=profile.username||'';$('fullName').value=profile.full_name||'';$('branch').value=profile.branch||'';$('name').textContent=profile.full_name||profile.username||'My Profile';$('role').textContent=(profile.role||'Staff')+' • '+(profile.branch||'Unassigned');const canManage=['Admin','Manager'].includes(profile.role);$('branch').disabled=!canManage;$('branchNote').textContent=canManage?'Admin/Manager can manage branch assignment. Staff branch assignment is controlled by management.':'Your branch is assigned by Admin/Manager.';if(profile.photo_link){$('avatar').style.backgroundImage=`url('${profile.photo_link.replace(/'/g,"%27")}')`;$('avatar').style.backgroundSize='cover';$('avatar').textContent=''}}$('save').onclick=async()=>{const full_name=$('fullName').value.trim();const payload={full_name};if(['Admin','Manager'].includes(profile.role))payload.branch=$('branch').value||null;const {error}=await sb.from('profiles').update(payload).eq('id',user.id);$('info').textContent=error?error.message:'✓ Profile updated.';if(!error){profile=await sbAuth.getProfile();$('branch').value=profile.branch||'';$('name').textContent=full_name||profile.username||'My Profile';$('role').textContent=(profile.role||'Staff')+' • '+(profile.branch||'Unassigned')}}$('pw').onclick=async()=>{const current=$('current').value,newPassword=$('new').value;if(!current||newPassword.length<8){$('pwmsg').textContent='Current password and a new password of at least 8 characters are required.';return}const check=await sbAuth.signIn(user.email,current);if(check.error){$('pwmsg').textContent='Current password is incorrect.';return}const {error}=await sb.auth.updateUser({password:newPassword});$('pwmsg').textContent=error?error.message:'✓ Password updated.';if(!error){$('current').value='';$('new').value=''}}$('logout').onclick=async()=>{await sbAuth.signOut();location.href='login.html'};init();</script></body></html>
