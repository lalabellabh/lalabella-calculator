<!doctype html>
<html lang="en">
<head>
<script src="auth-guard.js?v=4"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lalabella — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#c9506b;--rose-dark:#9e2f4a;--gold:#d9a441;--gold-light:#f1d38c;--ink:#2f2024;--muted:#8a7078;--line:#f0dede;--panel:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fdf1f0 0%,#f6e0da 45%,#eaf3ec 100%);font-family:'Space Grotesk',sans-serif;color:var(--ink)}body{padding:24px 20px 70px}.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding:0 2px}.brand{display:flex;align-items:center;gap:10px}.brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:grid;place-items:center;font-weight:800;color:#3a2a10;font-size:17px}.brand b{font-family:'Fraunces',serif;font-size:18px}.backlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 14px;border-radius:9px;background:#fff;transition:.2s ease}.backlink:hover{border-color:var(--rose);color:var(--rose);transform:translateY(-1px)}
.profile-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}.profile-sidebar{position:sticky;top:24px}.profile-main{min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:20px}.desktop-label{grid-column:1/-1;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);font-weight:700;margin-bottom:-10px}
.photo-hero{min-height:500px;background:linear-gradient(150deg,#3a1420,#5c1a28 55%,#7a2436);border-radius:26px;padding:42px 28px;text-align:center;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;box-shadow:0 20px 55px rgba(91,29,43,.16)}.photo-hero:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(217,164,65,.2),transparent 55%)}.photo-hero:after{content:'PROFILE';position:absolute;right:-30px;bottom:24px;font-size:70px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.035);transform:rotate(-90deg)}
.avatar-wrap{position:relative;z-index:1;width:132px;height:132px;margin:0 auto 20px}.avatar-img{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--gold-light);background:#4a2a30;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--gold-light);font-family:'Fraunces',serif;box-shadow:0 0 0 8px rgba(241,211,140,.08),0 16px 35px rgba(0,0,0,.2)}.avatar-edit-btn{position:absolute;bottom:0;right:0;width:38px;height:38px;border-radius:50%;background:var(--gold);border:2px solid #fff;display:grid;place-items:center;cursor:pointer;font-size:16px}.hero-name{position:relative;z-index:1;font-family:'Fraunces',serif;font-size:28px;font-weight:700;margin:0 0 4px}.hero-role{position:relative;z-index:1;font-size:13px;color:rgba(255,255,255,.8)}.hero-branch-tag{position:relative;z-index:1;display:inline-block;margin-top:10px;font-size:11px;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:20px}
.section-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;margin:0;box-shadow:0 10px 28px rgba(158,47,74,.07);transition:.2s ease}.section-card:hover{box-shadow:0 14px 34px rgba(158,47,74,.09)}.section-card:first-of-type,.section-card:last-child{grid-column:1/-1}.section-title{font-family:'Fraunces',serif;font-size:19px;margin:0 0 16px;display:flex;align-items:center;gap:8px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}.field input,.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fdf9f8;outline:none}.field input:focus,.field select:focus{border-color:var(--rose)}.field input:disabled{color:var(--muted);background:#f4efee}.pw-wrap{position:relative}.pw-wrap input{padding-right:38px}.pw-toggle{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#a98a90;font-size:16px}.save-btn{padding:13px 26px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;font-weight:700;font-size:13px;cursor:pointer}.save-btn:disabled{opacity:.6;cursor:default}.msg{font-size:12.5px;margin-top:10px;display:none}.msg.ok{color:#3d7a4f}.msg.err{color:#c0392b}.logout-btn{width:100%;padding:13px;border:1.5px solid #c0392b;border-radius:12px;background:#fff;color:#c0392b;font-weight:700;font-size:13px;cursor:pointer}input[type=file]{display:none}
.crop-backdrop{position:fixed;inset:0;background:rgba(40,20,25,.6);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.crop-backdrop.show{display:flex}.crop-modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.crop-title{font-family:'Fraunces',serif;font-size:17px;margin-bottom:14px;text-align:center}.crop-stage{position:relative;width:260px;height:260px;margin:0 auto;border-radius:16px;overflow:hidden;background:#2a1a1e;touch-action:none;cursor:grab}.crop-stage.dragging{cursor:grabbing}.crop-stage img{position:absolute;top:0;left:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}.crop-circle-mask{position:absolute;top:50%;left:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2000px rgba(20,10,12,.6);border:2px solid rgba(255,255,255,.85)}.crop-zoom-row{display:flex;align-items:center;gap:10px;margin-top:16px}.crop-zoom-label{font-size:14px}.crop-zoom-row input[type=range]{flex:1;accent-color:var(--rose)}.crop-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}.crop-actions{display:flex;gap:10px;margin-top:18px}.crop-cancel-btn{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-weight:600;cursor:pointer;font-size:13px}.crop-save-btn{flex:1;padding:11px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;font-weight:700;cursor:pointer;font-size:13px}
/* DESKTOP POLISH + ANIMATION */
body{position:relative;overflow-x:hidden}
body:before,body:after{content:'';position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.45}
body:before{width:420px;height:420px;right:-140px;top:80px;background:radial-gradient(circle,rgba(217,164,65,.22),transparent 68%);animation:floatOrb 10s ease-in-out infinite}
body:after{width:500px;height:500px;left:-220px;bottom:-170px;background:radial-gradient(circle,rgba(201,80,107,.16),transparent 68%);animation:floatOrb 13s ease-in-out infinite reverse}
.wrap{width:min(96vw,1380px);max-width:1380px;margin:0 auto}.topbar{padding:8px 4px 0;margin-bottom:34px;animation:fadeDown .7s ease both}.brand{gap:13px}.brand .logo{width:48px;height:48px;border-radius:15px;box-shadow:0 10px 25px rgba(217,164,65,.22);animation:logoPulse 4s ease-in-out infinite}.brand b{font-size:21px}.backlink{padding:11px 17px;border-radius:12px;box-shadow:0 8px 22px rgba(70,30,40,.06)}
.profile-layout{grid-template-columns:390px minmax(0,1fr);gap:30px}.profile-sidebar{top:20px}.profile-main{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.desktop-label{font-size:11px;letter-spacing:.2em;margin-bottom:-8px}
.photo-hero{min-height:680px;border-radius:32px;padding:54px 34px;box-shadow:0 28px 70px rgba(91,29,43,.2),inset 0 1px rgba(255,255,255,.12);background-size:180% 180%;animation:heroGradient 12s ease-in-out infinite,fadeUp .8s .08s ease both}.photo-hero:before{background:radial-gradient(circle at 80% 12%,rgba(241,211,140,.3),transparent 34%),radial-gradient(circle at 12% 85%,rgba(255,255,255,.08),transparent 38%);animation:glowMove 7s ease-in-out infinite alternate}.photo-hero:after{font-size:84px;right:-42px;bottom:48px}
.avatar-wrap{width:166px;height:166px;margin-bottom:28px}.avatar-wrap:before{content:'';position:absolute;inset:-12px;border:1px solid rgba(241,211,140,.34);border-radius:50%;animation:ringPulse 3s ease-in-out infinite}.avatar-wrap:after{content:'';position:absolute;inset:-20px;border:1px dashed rgba(255,255,255,.16);border-radius:50%;animation:spinSlow 18s linear infinite}.avatar-img{width:166px;height:166px;font-size:54px;box-shadow:0 0 0 10px rgba(241,211,140,.08),0 22px 45px rgba(0,0,0,.28);transition:transform .35s ease,box-shadow .35s ease}.avatar-wrap:hover .avatar-img{transform:scale(1.035);box-shadow:0 0 0 12px rgba(241,211,140,.11),0 25px 50px rgba(0,0,0,.32)}.avatar-edit-btn{width:44px;height:44px;box-shadow:0 8px 20px rgba(0,0,0,.22);transition:transform .2s ease,background .2s ease}.avatar-edit-btn:hover{transform:scale(1.1) rotate(8deg);background:#edbd4f}.hero-name{font-size:34px;text-shadow:0 4px 18px rgba(0,0,0,.18);animation:textReveal .7s .25s both}.hero-role{font-size:14px}.hero-branch-tag{margin-top:14px;padding:8px 17px;box-shadow:inset 0 1px rgba(255,255,255,.16);backdrop-filter:blur(8px)}.hero-branch-tag:before{content:'●';display:inline-block;margin-right:6px;color:#8ff0a2;font-size:8px;vertical-align:2px;animation:statusBlink 1.8s ease-in-out infinite}
.section-card{position:relative;overflow:hidden;border-radius:24px;padding:30px;box-shadow:0 14px 36px rgba(158,47,74,.08);transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;animation:fadeUp .75s ease both}.section-card:nth-of-type(3){animation-delay:.12s}.section-card:nth-of-type(4){animation-delay:.2s}.section-card:nth-of-type(5){animation-delay:.28s}.section-card:hover{transform:translateY(-5px);box-shadow:0 22px 50px rgba(158,47,74,.13);border-color:#e7c8ce}.section-card:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold),#83a98a);transform:scaleX(0);transform-origin:left;transition:transform .45s ease}.section-card:hover:before{transform:scaleX(1)}.section-title{font-size:21px;margin-bottom:20px}.field{margin-bottom:17px}.field input,.field select{padding:15px 16px;border-radius:12px;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}.field input:focus,.field select:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(201,80,107,.09);transform:translateY(-1px)}.save-btn{padding:14px 28px;border-radius:13px;box-shadow:0 10px 22px rgba(158,47,74,.17);transition:transform .2s ease,box-shadow .2s ease}.save-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(158,47,74,.23)}.logout-btn{padding:14px;border-radius:13px;transition:all .2s ease}.logout-btn:hover{background:#fff5f6;transform:translateY(-2px);box-shadow:0 10px 24px rgba(192,57,43,.1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}@keyframes textReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes floatOrb{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-22px,0) scale(1.06)}}@keyframes logoPulse{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}@keyframes heroGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes glowMove{from{transform:translate3d(-12px,-8px,0) scale(1)}to{transform:translate3d(18px,12px,0) scale(1.08)}}@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.045);opacity:1}}@keyframes spinSlow{to{transform:rotate(360deg)}}@keyframes statusBlink{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:1050px) and (min-width:860px){.wrap{width:94vw}.profile-layout{grid-template-columns:320px minmax(0,1fr);gap:22px}.photo-hero{min-height:620px}.profile-main{gap:18px}.section-card{padding:24px}}
@media(max-width:859px){body{padding:22px 16px 60px}.wrap{max-width:560px;width:auto}.topbar{margin-bottom:22px}.brand .logo{width:34px;height:34px;border-radius:10px;font-size:15px}.brand b{font-size:15px}.backlink{padding:7px 12px}.profile-layout{display:block}.profile-sidebar{position:static}.profile-main{display:block}.desktop-label{display:none}.photo-hero{min-height:0;border-radius:22px;padding:34px 26px;margin-bottom:20px;animation:none}.avatar-wrap{width:104px;height:104px;margin-bottom:14px}.avatar-wrap:before,.avatar-wrap:after{display:none}.avatar-img{width:104px;height:104px;font-size:34px;box-shadow:none}.avatar-edit-btn{width:34px;height:34px;font-size:15px}.hero-name{font-size:22px}.hero-role{font-size:12px}.hero-branch-tag{font-size:11px;padding:4px 12px}.section-card{border-radius:18px;padding:22px;margin-bottom:18px;animation:none}.section-title{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><div class="brand"><div class="logo">L</div><b>My Profile</b></div><a class="backlink" href="index.html">← Back to Lalabella</a></div>
<div class="profile-layout"><aside class="profile-sidebar"><div class="photo-hero"><div class="avatar-wrap"><div class="avatar-img" id="avatarImg">—</div><div class="avatar-edit-btn" id="avatarEditBtn">📷</div><input type="file" id="photoInput" accept="image/*"></div><div class="hero-name" id="heroName">—</div><div class="hero-role" id="heroRole">—</div><div class="hero-branch-tag" id="heroBranch">—</div></div></aside>
<main class="profile-main"><div class="desktop-label">Account settings</div><div class="crop-backdrop" id="cropBackdrop"><div class="crop-modal"><div class="crop-title">Adjust your photo</div><div class="crop-stage" id="cropStage"><img id="cropImg" alt=""><div class="crop-circle-mask"></div></div><div class="crop-zoom-row"><span class="crop-zoom-label">🔍</span><input type="range" id="cropZoom" min="100" max="300" value="100"></div><div class="crop-hint">Drag the photo to reposition it</div><div class="crop-actions"><button class="crop-cancel-btn" id="cropCancelBtn">Cancel</button><button class="crop-save-btn" id="cropSaveBtn">Use This Photo</button></div></div></div>
<div class="section-card"><h3 class="section-title">✏️ Edit Info</h3><div class="field"><label>Username</label><input type="text" id="usernameField" disabled></div><div class="field"><label>Full Name</label><input type="text" id="fullNameField"></div><div class="field"><label>Branch</label><select id="branchField"><option>ModaMall</option><option>Hamala</option><option>Galali</option></select></div><button class="save-btn" id="saveInfoBtn">Save Changes</button><div class="msg" id="infoMsg"></div></div>
<div class="section-card"><h3 class="section-title">🔒 Change Password</h3><div class="field"><label>Current Password</label><div class="pw-wrap"><input type="password" id="currentPw"><button type="button" class="pw-toggle" id="toggleCurrentPw">👁</button></div></div><div class="field"><label>New Password</label><div class="pw-wrap"><input type="password" id="newPw"><button type="button" class="pw-toggle" id="toggleNewPw">👁</button></div></div><button class="save-btn" id="savePwBtn">Update Password</button><div class="msg" id="pwMsg"></div></div>
<div class="section-card"><button class="logout-btn" id="logoutBtn">🚪 Log Out</button></div></main></div></div>
<script>
const AUTH_API_URL='https://script.google.com/macros/s/AKfycbxuH9jp_GYVK2VyEEvQiEiXVH58U3RBWV8p7i5Pu7plE1O2cDsFBgdVgEwLiV-On9w/exec';
function getToken(){return window.LALABELLA_TOKEN||sessionStorage.getItem('lalabellaToken')||localStorage.getItem('lalabellaToken')||''}function setupPwToggle(inputId,btnId){const input=document.getElementById(inputId),btn=document.getElementById(btnId);btn.addEventListener('click',()=>{const showing=input.type==='text';input.type=showing?'password':'text';btn.textContent=showing?'👁':'🙈'})}setupPwToggle('currentPw','toggleCurrentPw');setupPwToggle('newPw','toggleNewPw');
async function loadProfile(){const token=getToken();try{const res=await fetch(AUTH_API_URL+'?action=getProfile&token='+encodeURIComponent(token));const data=await res.json();if(!data.success)return;const p=data.profile;document.getElementById('heroName').textContent=p.fullName||p.username;document.getElementById('heroRole').textContent=p.role||'Staff';document.getElementById('heroBranch').textContent=p.branch||'—';document.getElementById('usernameField').value=p.username;document.getElementById('fullNameField').value=p.fullName||'';document.getElementById('branchField').value=p.branch||'ModaMall';const avatarEl=document.getElementById('avatarImg');if(p.photoDataUri){avatarEl.style.backgroundImage=`url('${p.photoDataUri}')`;avatarEl.style.backgroundSize='cover';avatarEl.style.backgroundPosition='center';avatarEl.textContent=''}else{avatarEl.textContent=(p.fullName||p.username||'?').charAt(0).toUpperCase()}}catch(e){console.error('[Profile] load failed',e)}}loadProfile();
document.getElementById('avatarEditBtn').addEventListener('click',()=>document.getElementById('photoInput').click());const cropBackdrop=document.getElementById('cropBackdrop'),cropStage=document.getElementById('cropStage'),cropImg=document.getElementById('cropImg'),cropZoom=document.getElementById('cropZoom');let cropState={naturalW:0,naturalH:0,baseScale:1,scale:1,offsetX:0,offsetY:0};const STAGE_SIZE=260;function applyCropTransform(){const s=cropState.baseScale*cropState.scale;cropImg.style.width=cropState.naturalW*s+'px';cropImg.style.height=cropState.naturalH*s+'px';cropImg.style.transform=`translate(${cropState.offsetX}px,${cropState.offsetY}px)`}function clampOffset(){const s=cropState.baseScale*cropState.scale,w=cropState.naturalW*s,h=cropState.naturalH*s,minX=STAGE_SIZE-w,maxX=0,minY=STAGE_SIZE-h,maxY=0;cropState.offsetX=Math.min(maxX,Math.max(minX,cropState.offsetX));cropState.offsetY=Math.min(maxY,Math.max(minY,cropState.offsetY))}
document.getElementById('photoInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{cropState.naturalW=img.width;cropState.naturalH=img.height;cropState.baseScale=Math.max(STAGE_SIZE/img.width,STAGE_SIZE/img.height);cropState.scale=1;cropState.offsetX=(STAGE_SIZE-img.width*cropState.baseScale)/2;cropState.offsetY=(STAGE_SIZE-img.height*cropState.baseScale)/2;cropImg.src=ev.target.result;cropZoom.value=100;applyCropTransform();cropBackdrop.classList.add('show')};img.src=ev.target.result};reader.readAsDataURL(file);e.target.value=''});cropZoom.addEventListener('input',()=>{cropState.scale=Number(cropZoom.value)/100;clampOffset();applyCropTransform()});let dragging=false,dragStartX=0,dragStartY=0,startOffsetX=0,startOffsetY=0;cropStage.addEventListener('pointerdown',e=>{dragging=true;cropStage.classList.add('dragging');dragStartX=e.clientX;dragStartY=e.clientY;startOffsetX=cropState.offsetX;startOffsetY=cropState.offsetY;cropStage.setPointerCapture(e.pointerId)});cropStage.addEventListener('pointermove',e=>{if(!dragging)return;cropState.offsetX=startOffsetX+(e.clientX-dragStartX);cropState.offsetY=startOffsetY+(e.clientY-dragStartY);clampOffset();applyCropTransform()});cropStage.addEventListener('pointerup',()=>{dragging=false;cropStage.classList.remove('dragging')});cropStage.addEventListener('pointercancel',()=>{dragging=false;cropStage.classList.remove('dragging')});document.getElementById('cropCancelBtn').addEventListener('click',()=>cropBackdrop.classList.remove('show'));
document.getElementById('cropSaveBtn').addEventListener('click',()=>{const size=200,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d'),s=cropState.baseScale*cropState.scale,exportScale=size/STAGE_SIZE;ctx.drawImage(cropImg,cropState.offsetX*exportScale,cropState.offsetY*exportScale,cropState.naturalW*s*exportScale,cropState.naturalH*s*exportScale);const compressedBase64=canvas.toDataURL('image/jpeg',.7);saveProfile(null,null,compressedBase64);const avatarEl=document.getElementById('avatarImg');avatarEl.style.backgroundImage=`url('${compressedBase64}')`;avatarEl.style.backgroundSize='cover';avatarEl.style.backgroundPosition='center';avatarEl.textContent='';cropBackdrop.classList.remove('show')});
async function saveProfile(fullName,branch,photoBase64){const token=getToken(),params=new URLSearchParams({action:'updateProfile',token});if(fullName)params.set('fullName',fullName);if(branch)params.set('branch',branch);if(photoBase64)params.set('photoBase64',photoBase64);const res=await fetch(AUTH_API_URL+'?'+params.toString());return res.json()}
document.getElementById('saveInfoBtn').addEventListener('click',async()=>{const btn=document.getElementById('saveInfoBtn'),msg=document.getElementById('infoMsg');btn.disabled=true;btn.textContent='Saving…';const fullName=document.getElementById('fullNameField').value.trim(),branch=document.getElementById('branchField').value;try{const data=await saveProfile(fullName,branch,null);btn.disabled=false;btn.textContent='Save Changes';msg.className='msg '+(data.success?'ok':'err');msg.textContent=data.success?'Saved!':(data.error||'Failed to save.');msg.style.display='block';if(data.success){document.getElementById('heroName').textContent=fullName;document.getElementById('heroBranch').textContent=branch;const userStr=sessionStorage.getItem('lalabellaUser');if(userStr){const u=JSON.parse(userStr);u.fullName=fullName;u.branch=branch;sessionStorage.setItem('lalabellaUser',JSON.stringify(u));localStorage.setItem('lalabellaUser',JSON.stringify(u))}}}catch(e){btn.disabled=false;btn.textContent='Save Changes';msg.className='msg err';msg.textContent='Connection error.';msg.style.display='block'}});
document.getElementById('savePwBtn').addEventListener('click',async()=>{const btn=document.getElementById('savePwBtn'),msg=document.getElementById('pwMsg'),currentPassword=document.getElementById('currentPw').value,newPassword=document.getElementById('newPw').value;if(!currentPassword||!newPassword){msg.className='msg err';msg.textContent='Both fields are required.';msg.style.display='block';return}btn.disabled=true;btn.textContent='Updating…';const token=getToken();try{const res=await fetch(AUTH_API_URL+'?action=changePassword&token='+encodeURIComponent(token)+'&currentPassword='+encodeURIComponent(currentPassword)+'&newPassword='+encodeURIComponent(newPassword));const data=await res.json();btn.disabled=false;btn.textContent='Update Password';msg.className='msg '+(data.success?'ok':'err');msg.textContent=data.success?'Password updated!':(data.error||'Failed.');msg.style.display='block';if(data.success){document.getElementById('currentPw').value='';document.getElementById('newPw').value=''}}catch(e){btn.disabled=false;btn.textContent='Update Password';msg.className='msg err';msg.textContent='Connection error.';msg.style.display='block'}});
document.getElementById('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('lalabellaToken');sessionStorage.removeItem('lalabellaUser');localStorage.removeItem('lalabellaToken');localStorage.removeItem('lalabellaUser');window.location.href='index.html'});
</script></body></html>
