<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Happy Teacher's Day Card - Lalabella</title>
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<meta name="lb-theme-keep" content="#sheet, .sheet, .slot, .card, .name">
<script src="auth-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&family=Caveat:wght@600&family=Kalam:wght@400&family=Indie+Flower&family=Shadows+Into+Light&family=Dancing+Script:wght@600&family=Great+Vibes&family=Pacifico&family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--teal:#1f8a8a;--teal-dark:#166b6b;--ink:#2a2a2a;--muted:#7a7266;--line:#e8d9bf;--bg:#f3efe8;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e6e0d6;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .top a{color:var(--teal);text-decoration:none;font-weight:700;font-size:15px}
  .top h1{font-size:17px;margin:0;font-weight:700}
  .nav-toggle{width:38px;height:38px;flex:0 0 38px;border-radius:10px;border:1px solid #e6e0d6;background:#fff;color:var(--teal);font-size:19px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav-backdrop{position:fixed;inset:0;z-index:9205;background:rgba(22,70,70,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s ease}
  .nav-backdrop.show{opacity:1;pointer-events:auto}
  .side-drawer{position:fixed;top:0;left:0;bottom:0;width:min(310px,82vw);z-index:9206;background:#fdfbf7;border-right:1px solid #e6e0d6;box-shadow:12px 0 40px rgba(22,70,70,.18);transform:translateX(-100%);transition:transform .25s ease;padding:18px 14px 24px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .side-drawer.show{transform:translateX(0)}
  .side-drawer .hub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
  .side-drawer .hub-grid a{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:12px 4px;min-height:72px;font-size:11px;background:#fff;border:1px solid #e6e0d6}
  .side-drawer .hub-grid .hub-icon{font-size:20px}
  .side-drawer a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
  .side-drawer a:hover{background:rgba(31,138,138,.10);color:var(--teal-dark)}
  .side-drawer .drawer-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:10px 12px 4px}

  .panel{max-width:760px;margin:14px auto;background:#fff;border-radius:14px;padding:16px;border:1px solid #e6e0d6}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .field{flex:1 1 200px;display:flex;flex-direction:column;gap:5px}
  .field.small{flex:0 1 170px}
  label{font-size:12px;font-weight:600;color:var(--muted)}
  input[type=text],select{font:inherit;font-size:15px;padding:9px 10px;border:1px solid #d8d0c2;border-radius:10px;background:#fff;width:100%}
  input[type=text]:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
  .checks{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:14px}
  .checks label{color:var(--ink);font-weight:600;display:flex;gap:6px;align-items:center}
  .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
  .primary{background:var(--teal);color:#fff}
  .primary:hover{background:var(--teal-dark)}
  .ghost{background:#efe9df;color:var(--ink)}
  .hint{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
  .slotrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .slotrow .field label{font-size:11px}

  .stage{padding:0 10px 40px;display:flex;justify-content:center;overflow:hidden}
  .sheet-wrap{transform-origin:top center}
  .sheet{position:relative;width:210mm;height:297mm;background:#fff;box-shadow:0 2px 12px rgba(60,40,10,.15)}
  .slot{position:absolute;width:98mm;height:116mm}
  .card{position:absolute;inset:0;background-size:cover;background-position:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cut .card{outline:0.15mm solid #cdbb9c;outline-offset:-0.1mm}

  .name{position:absolute;left:10mm;width:78mm;top:42mm;height:9mm;
        display:flex;align-items:center;justify-content:center;gap:2.2mm;
        color:#262626;overflow:hidden;border-radius:1mm}
  .name .fromlabel{flex:0 0 auto;font-family:Georgia,'Times New Roman',serif;font-style:italic;
        font-size:3.4mm;color:#8a766a;white-space:nowrap}
  .name .namelines{display:flex;flex-direction:column;justify-content:center;overflow:hidden;min-width:0}
  .name .ln{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-align:left;line-height:1.1;outline:none;unicode-bidi:plaintext;
        font-family:var(--name-font,'Gochi Hand'),'Gochi Hand','Comic Sans MS',cursive}
  .name .l1{font-size:5mm}
  .name .l2{font-size:2.6mm}
  .name.one .l2{display:none}
  .name .l1:empty::before{content:'Name';color:#c9bba4}
  .editing .name .l2:empty::before{content:'2nd line';color:#c9bba4}
  .editing .name .ln{cursor:text}
  .editing .name:hover,.editing .name:focus-within{background:rgba(31,138,138,.10)}

  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    .top,.panel,.nav-backdrop,.side-drawer{display:none!important}
    .stage{padding:0;overflow:visible;display:block}
    .sheet-wrap{transform:none!important;height:auto!important}
    html,body{width:210mm;height:297mm;overflow:hidden}
    .sheet{box-shadow:none;height:296mm;overflow:hidden}
    .name .ln:empty::before{content:''!important}
    .editing .name:hover,.editing .name:focus-within{background:none}
  }
</style>
</head>
<body>

<div class="top">
  <button class="nav-toggle" id="navToggle" aria-label="Open menu">☰</button>
  <a href="javascript:history.back()" aria-label="Back">‹ Back</a>
  <h1>Happy Teacher's Day card</h1>
</div>
<div class="nav-backdrop" id="navBackdrop"></div>
<nav class="side-drawer" id="sideDrawer">
  <div data-lb-menu data-hub-class="hub-grid" data-title-class="drawer-title"></div>
</nav>
<script src="shared/nav.js"></script>
<script>
(function(){
  var t=document.getElementById('navToggle'),d=document.getElementById('sideDrawer'),b=document.getElementById('navBackdrop');
  function close(){d.classList.remove('show');b.classList.remove('show')}
  t.addEventListener('click',function(){d.classList.toggle('show');b.classList.toggle('show')});
  b.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
})();
</script>

<div class="panel">
  <div class="row">
    <div class="field">
      <label for="allName">From: name (all cards)</label>
      <input type="text" id="allName" placeholder="e.g. Ms. Sara" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <label for="allName2">2nd line (optional)</label>
      <input type="text" id="allName2" placeholder="e.g. KG 2C" maxlength="40" autocomplete="off">
    </div>
    <div class="field small">
      <label for="fontSel">Font</label>
      <select id="fontSel"></select>
    </div>
    <div class="field small">
      <label for="designSel">Card design</label>
      <select id="designSel">
        <option value="alt-gb">Alternate (Girl, Boy...)</option>
        <option value="alt-bg">Alternate (Boy, Girl...)</option>
        <option value="girl">All Girl</option>
        <option value="boy">All Boy</option>
      </select>
    </div>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="perCard"> Different name per card</label>
    <label><input type="checkbox" id="cutLines" checked> Show cut lines</label>
  </div>
  <p class="hint" id="perHint" hidden>Tap a card's name on the sheet below to type a different name for that card. Press Enter to type a 2nd line under it.</p>
  <div class="btns">
    <button class="primary" id="printBtn">Print</button>
    <button class="ghost" id="clearBtn">Clear names</button>
  </div>
  <p class="hint">Card size 11.6 &times; 9.8 cm, 4 per A4 sheet. In the print dialog set paper to A4, scale 100% (Actual size), margins None.</p>
</div>

<div class="stage">
  <div class="sheet-wrap" id="wrap">
    <div class="sheet cut" id="sheet"></div>
  </div>
</div>

  var IMAGES = { girl: GIRL, boy: BOY };

  var MX = 7, MY = 13, W = 98, H = 116, GAP = 4;
  var slots = [
    {x: MX,           y: MY},
    {x: MX + W + GAP, y: MY},
    {x: MX,           y: MY + H + GAP},
    {x: MX + W + GAP, y: MY + H + GAP}
  ];

  var sheet = document.getElementById('sheet');
  var cards = [];
  var names = [];

  slots.forEach(function(s, i){
    var slot = document.createElement('div');
    slot.className = 'slot';
    slot.style.left = s.x + 'mm';
    slot.style.top = s.y + 'mm';
    slot.innerHTML = '<div class="card"><div class="name one">' +
      '<span class="fromlabel">From:</span><div class="namelines">' +
      '<div class="ln l1" dir="auto" spellcheck="false"></div>' +
      '<div class="ln l2" dir="auto" spellcheck="false"></div></div></div></div>';
    sheet.appendChild(slot);
    cards.push(slot.querySelector('.card'));
    var n = slot.querySelector('.name');
    var l1 = n.querySelector('.l1'), l2 = n.querySelector('.l2');
    [l1, l2].forEach(function(ln){
      ln.addEventListener('input', function(){ fit(n); });
      ln.addEventListener('paste', function(e){
        e.preventDefault();
        var t = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g,' ');
        document.execCommand('insertText', false, t);
      });
    });
    l1.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); n.classList.add('force2'); fit(n); l2.focus(); }
    });
    l2.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); l2.blur(); }
      else if (e.key === 'Backspace' && l2.textContent === '') {
        e.preventDefault(); n.classList.remove('force2'); fit(n); l1.focus();
      }
    });
    l2.addEventListener('blur', function(){ n.classList.remove('force2'); fit(n); });
    names.push(n);
  });

  var designSel = document.getElementById('designSel');
  function applyDesign(){
    var v = designSel.value;
    cards.forEach(function(c, i){
      var pick = v === 'girl' ? 'girl' : v === 'boy' ? 'boy'
        : v === 'alt-bg' ? (i % 2 === 0 ? 'boy' : 'girl')
        : (i % 2 === 0 ? 'girl' : 'boy');
      c.style.backgroundImage = 'url(' + IMAGES[pick] + ')';
    });
  }
  designSel.addEventListener('change', applyDesign);
  applyDesign();

  var FONTS = [
    ['Gochi Hand','Gochi Hand (same as card)'],
    ['Patrick Hand','Patrick Hand'],
    ['Caveat','Caveat'],
    ['Kalam','Kalam'],
    ['Indie Flower','Indie Flower'],
    ['Shadows Into Light','Shadows Into Light'],
    ['Dancing Script','Dancing Script'],
    ['Great Vibes','Great Vibes (script)'],
    ['Pacifico','Pacifico'],
    ['Amiri','Amiri (Arabic)'],
    ['Aref Ruqaa','Aref Ruqaa (Arabic)']
  ];
  var fontSel = document.getElementById('fontSel');
  FONTS.forEach(function(f){
    var o = document.createElement('option');
    o.value = f[0]; o.textContent = f[1];
    o.style.fontFamily = "'" + f[0] + "'";
    fontSel.appendChild(o);
  });
  function setFont(name){
    sheet.style.setProperty('--name-font', "'" + name + "'");
    var done = function(){ fitAll(); };
    if (document.fonts && document.fonts.load) {
      document.fonts.load("20px '" + name + "'").then(done, done);
    } else { done(); }
  }
  var savedFont = null;
  try { savedFont = localStorage.getItem('lbSeedsFont'); } catch(e) {}
  if (savedFont && FONTS.some(function(f){ return f[0] === savedFont; })) fontSel.value = savedFont;
  fontSel.addEventListener('change', function(){
    try { localStorage.setItem('lbSeedsFont', fontSel.value); } catch(e) {}
    setFont(fontSel.value);
  });

  function fitLine(el, size, min){
    el.style.fontSize = size + 'mm';
    while (el.scrollWidth > el.clientWidth + 1 && size > min) {
      size -= 0.2; el.style.fontSize = size + 'mm';
    }
  }
  function fit(n){
    var l1 = n.querySelector('.l1'), l2 = n.querySelector('.l2');
    var two = l2.textContent.trim() !== '' || n.classList.contains('force2');
    n.classList.toggle('one', !two);
    if (two) { fitLine(l1, 3.4, 1.8); fitLine(l2, 2.6, 1.6); }
    else fitLine(l1, 5, 2.2);
  }
  function fitAll(){ names.forEach(fit); }

  var allName = document.getElementById('allName');
  var allName2 = document.getElementById('allName2');
  var perCard = document.getElementById('perCard');
  function applyAll(){
    var v1 = allName.value.trim(), v2 = allName2.value.trim();
    names.forEach(function(n){
      n.querySelector('.l1').textContent = v1;
      n.querySelector('.l2').textContent = v2;
      fit(n);
    });
  }
  allName.addEventListener('input', applyAll);
  allName2.addEventListener('input', applyAll);

  perCard.addEventListener('change', function(){
    var on = perCard.checked;
    sheet.classList.toggle('editing', on);
    document.getElementById('perHint').hidden = !on;
    names.forEach(function(n){
      n.querySelectorAll('.ln').forEach(function(ln){ ln.contentEditable = on ? 'true' : 'false'; });
    });
  });

  document.getElementById('cutLines').addEventListener('change', function(e){
    sheet.classList.toggle('cut', e.target.checked);
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    allName.value = ''; allName2.value = '';
    names.forEach(function(n){ n.querySelectorAll('.ln').forEach(function(ln){ ln.textContent = ''; }); fit(n); });
  });

  document.getElementById('printBtn').addEventListener('click', function(){
    document.activeElement && document.activeElement.blur();
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){
      fitAll(); window.print();
    });
  });

  var wrap = document.getElementById('wrap');
  function scale(){
    var pxW = sheet.offsetWidth, pxH = sheet.offsetHeight;
    var avail = Math.min(document.documentElement.clientWidth - 20, 900);
    var s = Math.min(1, avail / pxW);
    wrap.style.transform = 'scale(' + s + ')';
    wrap.style.height = (pxH * s) + 'px';
  }
  window.addEventListener('resize', scale);
  scale();
  setFont(fontSel.value);
  if (document.fonts) document.fonts.ready.then(fitAll);
})();
</script>
</body>
