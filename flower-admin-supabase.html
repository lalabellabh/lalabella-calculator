<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Flower Admin</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:linear-gradient(145deg,#fdf4f2,#edf5ed);color:#35242b;font:14px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.top a{color:#8d2944;text-decoration:none;font-weight:700}.muted{color:#806d74;font-size:12px}header,.card{background:#fff;border:1px solid #ead7d9;border-radius:16px;padding:20px;margin:14px 0}header{background:#12090b;color:#fff}h1{margin:0;font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:13px 0 5px;font-size:11px;text-transform:uppercase;color:#806d74}input,select{width:100%;padding:11px;border:1px solid #ead7d9;border-radius:9px;background:#fdf5f3;box-sizing:border-box}.btn{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:#9e2f4a;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px}.show{display:block}.ok{background:#eaf5ec;color:#36724a}.bad{background:#fbeaea;color:#a83232}.table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #ead7d9;text-align:left}.table th{color:#806d74}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;gap:8px}}</style></head><body><div class="wrap"><div class="top"><a href="flower-tools.html">← Flower Tools</a><span class="muted" id="userBox">Checking session…</span></div><header><h1>Flower Admin</h1><div class="muted" style="color:#c8aaa8">Manage the FlowerItem master catalog</div></header><div class="card"><b>Edit Flower</b><p class="muted">Admin/Manager only. Company rate changes are recorded in the master catalog; receiving and stock movements use their dedicated transaction tools.</p><label>Flower</label><select id="item"><option>Loading…</option></select><div class="grid"><div><label>Flower Name</label><input id="name"></div><div><label>Item Code</label><input id="code"></div><div><label>Origin</label><input id="origin"></div><div><label>Unit</label><input id="unit"></div><div><label>Stems per Bunch</label><input id="stems" type="number" min="0" step="1"></div><div><label>Company Rate (BHD)</label><input id="rate" type="number" min="0" step="0.001"></div><div><label>Minimum Stock</label><input id="min" type="number" min="0" step="1"></div><div><label>Status</label><select id="status"><option>Active</option><option>Inactive</option></select></div></div><button class="btn" id="save">Save Changes</button><div id="msg" class="msg"></div></div><div class="card"><b>Catalog</b><input id="search" placeholder="Search flower, item code, origin…"><table class="table"><thead><tr><th>Flower</th><th>Code</th><th>Origin</th><th>Unit</th><th>Rate</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let sb,items=[];const $=x=>document.getElementById(x);function show(t,ok=false){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'bad')}async function init(){try{sb=await window.LalabellaSupabase.createClient();const u=await window.LalabellaAuth.getUser();if(!u){location.href='login.html';return}const p=await window.LalabellaAuth.getProfile();$('userBox').textContent=(p?.full_name||u.email)+' · '+(p?.role||'Staff');if(!['Admin','Manager'].includes(p?.role)){show('Access denied — Admin or Manager role required.');$('save').disabled=true;return}await load()}catch(e){show(e.message||'Unable to load Flower Admin')}}async function load(){const r=await sb.from('flower_item').select('*').order('flower_name');if(r.error)throw r.error;items=r.data||[];render();const s=$('item');s.innerHTML='<option value="">— Select flower —</option>'+items.map(x=>`<option value="${x.id}">${esc(x.flower_name)} · ${esc(x.origin||'—')} · ${esc(x.item_code||'No code')}</option>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.toLowerCase();$('rows').innerHTML=items.filter(x=>(x.flower_name||'').toLowerCase().includes(q)||(x.item_code||'').toLowerCase().includes(q)||(x.origin||'').toLowerCase().includes(q)).map(x=>`<tr><td>${esc(x.flower_name)}</td><td>${esc(x.item_code||'')}</td><td>${esc(x.origin||'')}</td><td>${esc(x.unit||'')}</td><td>${Number(x.rate||0).toFixed(3)}</td><td>${esc(x.status||'')}</td></tr>`).join('')}$('search').oninput=render;$('item').onchange=()=>{const x=items.find(i=>String(i.id)===$('item').value);if(!x)return;[['name','flower_name'],['code','item_code'],['origin','origin'],['unit','unit'],['stems','stems_per_bunch'],['rate','rate'],['min','min_stock'],['status','status']].forEach(([a,b])=>$(a).value=x[b]??'')};$('save').onclick=async()=>{const id=$('item').value;if(!id)return show('Select a flower first.');const x=items.find(i=>String(i.id)===id);const patch={flower_name:$('name').value.trim(),item_code:$('code').value.trim()||null,origin:$('origin').value.trim()||null,unit:$('unit').value.trim()||null,stems_per_bunch:$('stems').value===''?null:Number($('stems').value),rate:Number($('rate').value||0),min_stock:$('min').value===''?null:Number($('min').value),status:$('status').value,last_updated_date:new Date().toISOString().slice(0,10)};if(!patch.flower_name)return show('Flower Name is required.');$('save').disabled=true;try{const r=await sb.from('flower_item').update(patch).eq('id',id);if(r.error)throw r.error;show('Saved successfully.',true);await load();$('item').value=id;$('item').dispatchEvent(new Event('change'))}catch(e){show(e.message||'Save failed')}finally{$('save').disabled=false}};init();</script></body></html>
