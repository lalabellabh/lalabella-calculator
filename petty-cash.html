<!doctype html>
<html lang="en">
<head>
<script src="auth-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lalabella — Petty Cash & Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --rose:#c9506b; --rose-dark:#9e2f4a; --gold:#d9a441; --gold-light:#f1d38c;
    --cream:#fdf1f0; --ink:#2f2024; --muted:#8a7078; --line:#f0dede;
    --panel:#ffffff; --good:#3d7a4f; --bad:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fdf1f0 0%,#f6e0da 45%,#eaf3ec 100%);font-family:'Space Grotesk',Arial,sans-serif;color:var(--ink);}
  body{padding:22px 16px 60px;}
  .wrap{max-width:900px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:grid;place-items:center;font-weight:800;color:#3a2a10;}
  .brand b{font-family:'Fraunces',serif;font-size:15px;letter-spacing:.02em;}
  .backlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:9px;background:#fff;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:12px 0;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted);}
  .tab-btn.active{background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;border-color:transparent;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  select{width:auto;padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none;margin-bottom:18px;}

  .balance-card{background:linear-gradient(150deg,#3a1420,#5c1a28 55%,#7a2436);border-radius:18px;padding:22px;margin-bottom:20px;text-align:center;}
  .balance-card .label{color:var(--gold-light);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
  .balance-card .amount{color:#fff;font-family:'Fraunces',serif;font-size:34px;font-weight:700;}
  .balance-card .amount.negative{color:#f1a6b8;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:20px;box-shadow:0 6px 18px rgba(158,47,74,.06);}
  .card h2{font-family:'Fraunces',serif;font-size:16px;margin:0 0 14px;}
  label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fdf9f8;color:var(--ink);outline:none;box-sizing:border-box;margin-bottom:14px;}
  input:focus{border-color:var(--rose);}
  .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .type-toggle button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);}
  .type-toggle button.active{background:var(--rose);color:#fff;border-color:var(--rose);}
  .save-btn{padding:12px 20px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .save-btn:disabled{opacity:.6;}
  .msg{font-size:12.5px;margin-top:10px;display:none;}
  .msg.error{color:var(--bad);display:block;}
  .msg.success{color:var(--good);display:block;}

  .txn-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px;}
  .txn-row:last-child{border-bottom:none;}
  .txn-main{font-size:13px;}
  .txn-date{font-size:10.5px;color:var(--muted);}
  .txn-amt{font-weight:700;font-size:13.5px;white-space:nowrap;}
  .txn-amt.expense{color:var(--bad);}
  .txn-amt.topup{color:var(--good);}
  .send-btn{font-size:11px;padding:6px 12px;border-radius:8px;border:1px solid var(--rose);background:#fff;color:var(--rose-dark);cursor:pointer;white-space:nowrap;}
  .sent-badge{font-size:10.5px;color:var(--good);font-weight:700;}
  .empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:13px;}

  .denom-grid{display:grid;grid-template-columns:1fr 70px 90px;gap:6px 10px;align-items:center;margin-bottom:6px;}
  .denom-grid .d-label{font-size:13px;font-weight:600;}
  .denom-grid input{margin-bottom:0;padding:8px 10px;text-align:center;}
  .denom-grid .d-subtotal{font-size:12px;color:var(--muted);text-align:right;}
  .denom-total{text-align:right;font-weight:700;font-size:15px;color:var(--rose-dark);padding:8px 0;border-top:1px solid var(--line);margin-top:4px;}
  .print-btn{font-size:11.5px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">💰</div><b>Petty Cash & Cash</b></div>
    <a class="backlink" href="index.html">← Back to Lalabella</a>
  </div>

  <select id="branchSelect">
    <option value="All">All Branches</option>
    <option value="ModaMall">ModaMall</option>
    <option value="Hamala">Hamala</option>
    <option value="Galali">Galali</option>
  </select>

  <div class="tabs">
    <button class="tab-btn active" data-tab="petty">💵 Petty Cash</button>
    <button class="tab-btn" data-tab="cash">🏦 Cash</button>
  </div>

  <!-- PETTY CASH TAB -->
  <div class="tab-panel active" id="pettyTab">
    <div class="balance-card">
      <div class="label">Petty Cash Balance</div>
      <div class="amount" id="pettyBalance">—</div>
      <div id="targetLine" style="color:rgba(255,255,255,.65);font-size:11.5px;margin-top:6px;"></div>
      <div style="margin-top:10px;"><a href="#" id="toggleTargetLink" style="color:var(--gold-light);font-size:11px;text-decoration:none;">⚙️ Set target amount</a></div>
    </div>

    <div class="card" id="pcTargetCard" style="display:none;">
      <h2>⚙️ Target Amount</h2>
      <label>Set the standard petty cash float for this branch (e.g. 150)</label>
      <input type="number" step="0.001" min="0" id="pcTarget" placeholder="e.g. 150.000">
      <button class="save-btn" id="pcTargetSaveBtn">Save Target</button>
      <div class="msg" id="pcTargetMsg"></div>
    </div>

    <div class="card">
      <h2>➕ Add Entry</h2>
      <div class="type-toggle">
        <button type="button" class="active" data-type="expense" id="typeExpenseBtn">Expense</button>
        <button type="button" data-type="topup" id="typeTopupBtn">Top-up</button>
      </div>
      <label>Date</label>
      <input type="date" id="pcDate">
      <label>What was it used for?</label>
      <input type="text" id="pcPurpose" placeholder="e.g. Office supplies">
      <label>Amount (BD)</label>
      <input type="number" step="0.001" min="0.001" id="pcAmount" placeholder="0.000">
      <label>Your Name</label>
      <input type="text" id="pcEnteredBy" placeholder="Your name">
      <button class="save-btn" id="pcSaveBtn">Save Entry</button>
      <div class="msg" id="pcMsg"></div>
    </div>

    <div class="card">
      <h2>📋 History</h2>
      <div id="pcHistory"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- CASH TAB -->
  <div class="tab-panel" id="cashTab">
    <div class="balance-card">
      <div class="label">Cash On Hand (not yet sent)</div>
      <div class="amount" id="cashBalance">—</div>
    </div>

    <div class="card">
      <h2>➕ Log Daily Cash Count</h2>
      <label>Date</label>
      <input type="date" id="ccDate">

      <label style="margin-top:4px;">📄 Notes (BD)</label>
      <div id="denomNotes"></div>

      <label style="margin-top:14px;">🪙 Coins (Fils)</label>
      <div id="denomCoins"></div>

      <div class="denom-total">Total: <span id="denomGrandTotal">0.000 BD</span></div>

      <label style="margin-top:14px;">Counted By</label>
      <input type="text" id="ccCountedBy" placeholder="Your name">
      <button class="save-btn" id="ccSaveBtn">Save Count</button>
      <div class="msg" id="ccMsg"></div>
    </div>

    <div class="card">
      <h2>📋 History</h2>
      <div id="ccHistory"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
const PETTYCASH_API_URL = 'https://script.google.com/macros/s/AKfycbxz53pJEQIEOgvfUIxwhcOcdZtu7An4qXwShP7a58bVjvJSPm8ORs4eP6lv-kdKJBdT/exec';

function getToken(){
  return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';
}
function fmtBD(n){ return Number(n).toFixed(3) + ' BD'; }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
  });
});

document.getElementById('branchSelect').addEventListener('change', ()=>{ loadPettyCash(); loadCashCounts(); });

const today = new Date().toISOString().slice(0,10);
document.getElementById('pcDate').value = today;
document.getElementById('ccDate').value = today;

/* ---------- Denomination breakdown (Bahraini Dinar) ---------- */
const NOTE_DENOMS = [
  { value: 20, label: 'BD 20' },
  { value: 10, label: 'BD 10' },
  { value: 5, label: 'BD 5' },
  { value: 1, label: 'BD 1' }
];
const COIN_DENOMS = [
  { value: 0.500, label: '500 fils' },
  { value: 0.100, label: '100 fils' },
  { value: 0.050, label: '50 fils' },
  { value: 0.025, label: '25 fils' },
  { value: 0.010, label: '10 fils' },
  { value: 0.005, label: '5 fils' }
];

function renderDenomRow(container, d){
  const row = document.createElement('div');
  row.className = 'denom-grid';
  row.innerHTML = `<div class="d-label">${d.label}</div>
    <input type="number" min="0" step="1" class="denom-count" data-value="${d.value}" data-label="${d.label}" placeholder="0">
    <div class="d-subtotal">0.000 BD</div>`;
  const input = row.querySelector('.denom-count');
  const subtotalEl = row.querySelector('.d-subtotal');
  input.addEventListener('input', ()=>{
    const count = Number(input.value) || 0;
    subtotalEl.textContent = (count * d.value).toFixed(3) + ' BD';
    updateGrandTotal();
  });
  container.appendChild(row);
}
NOTE_DENOMS.forEach(d => renderDenomRow(document.getElementById('denomNotes'), d));
COIN_DENOMS.forEach(d => renderDenomRow(document.getElementById('denomCoins'), d));

function updateGrandTotal(){
  let total = 0;
  document.querySelectorAll('.denom-count').forEach(inp=>{
    total += (Number(inp.value) || 0) * Number(inp.dataset.value);
  });
  document.getElementById('denomGrandTotal').textContent = total.toFixed(3) + ' BD';
  return total;
}
function collectBreakdown(){
  return Array.from(document.querySelectorAll('.denom-count'))
    .map(inp => ({ value: Number(inp.dataset.value), label: inp.dataset.label, count: Number(inp.value) || 0 }))
    .filter(b => b.count > 0);
}
function resetDenomInputs(){
  document.querySelectorAll('.denom-count').forEach(inp=>{ inp.value = ''; });
  document.querySelectorAll('.d-subtotal').forEach(el=>{ el.textContent = '0.000 BD'; });
  updateGrandTotal();
}

/* ---------- PETTY CASH ---------- */
let pcType = 'expense';
document.getElementById('typeExpenseBtn').addEventListener('click', ()=>{
  pcType = 'expense';
  document.getElementById('typeExpenseBtn').classList.add('active');
  document.getElementById('typeTopupBtn').classList.remove('active');
});
document.getElementById('typeTopupBtn').addEventListener('click', ()=>{
  pcType = 'topup';
  document.getElementById('typeTopupBtn').classList.add('active');
  document.getElementById('typeExpenseBtn').classList.remove('active');
});

async function loadPettyCash(){
  const branch = document.getElementById('branchSelect').value;
  const hist = document.getElementById('pcHistory');
  const targetCard = document.getElementById('pcTargetCard');
  const toggleLink = document.getElementById('toggleTargetLink');
  targetCard.style.display = 'none'; // always start collapsed, whichever branch is picked
  toggleLink.style.display = (branch === 'All') ? 'none' : 'inline';
  try{
    const res = await fetch(PETTYCASH_API_URL + '?action=getPettyCash&branch=' + encodeURIComponent(branch) + '&token=' + encodeURIComponent(getToken()));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const balEl = document.getElementById('pettyBalance');
    balEl.textContent = fmtBD(data.balance);
    balEl.classList.toggle('negative', data.balance < 0);

    const targetLine = document.getElementById('targetLine');
    if(branch !== 'All' && data.targetAmount !== null){
      document.getElementById('pcTarget').value = data.targetAmount || '';
      const diff = data.targetAmount - data.balance;
      targetLine.textContent = diff > 0
        ? `Target: ${fmtBD(data.targetAmount)} · Kulang ng ${fmtBD(diff)} para ma-topup`
        : `Target: ${fmtBD(data.targetAmount)} · Nasa target na`;
    } else {
      targetLine.textContent = '';
    }

    window.lastPettyCashTxns = data.transactions; // for the print-report button below
    if(!data.transactions.length){ hist.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
    hist.innerHTML = data.transactions.map(t => `
      <div class="txn-row">
        <div>
          <div class="txn-main">${t.purpose}</div>
          <div class="txn-date">${fmtDate(t.date)} · ${t.branch} · ${t.enteredBy||'—'}</div>
        </div>
        <div class="txn-amt ${t.type}">${t.type === 'topup' ? '+' : '−'}${fmtBD(t.amount)}</div>
      </div>
    `).join('');
  }catch(e){
    hist.innerHTML = '<div class="empty">Could not load — check your connection.</div>';
  }
}
loadPettyCash();

document.getElementById('toggleTargetLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const card = document.getElementById('pcTargetCard');
  card.style.display = (card.style.display === 'none') ? 'block' : 'none';
});
document.getElementById('pcTargetSaveBtn').addEventListener('click', async ()=>{
  const branch = document.getElementById('branchSelect').value;
  const targetAmount = document.getElementById('pcTarget').value;
  const msg = document.getElementById('pcTargetMsg');
  msg.className = 'msg';
  if(branch === 'All'){ msg.textContent = 'Pumili ng specific na branch.'; msg.className = 'msg error'; return; }
  if(targetAmount === '' || Number(targetAmount) < 0){ msg.textContent = 'Ilagay ang tamang amount.'; msg.className = 'msg error'; return; }

  const btn = document.getElementById('pcTargetSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const params = new URLSearchParams({ action: 'setPettyCashTarget', branch, targetAmount, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ msg.textContent = data.error || 'Failed.'; msg.className = 'msg error'; btn.disabled=false; btn.textContent='Save Target'; return; }
    msg.textContent = 'Na-update ang target!'; msg.className = 'msg success';
    loadPettyCash();
  }catch(e){
    msg.textContent = 'Connection error.'; msg.className = 'msg error';
  }
  btn.disabled = false; btn.textContent = 'Save Target';
});

document.getElementById('pcSaveBtn').addEventListener('click', async ()=>{
  const branch = document.getElementById('branchSelect').value;
  const date = document.getElementById('pcDate').value;
  const purpose = document.getElementById('pcPurpose').value.trim();
  const amount = document.getElementById('pcAmount').value;
  const enteredBy = document.getElementById('pcEnteredBy').value.trim();
  const msg = document.getElementById('pcMsg');
  msg.className = 'msg';

  if(branch === 'All'){ msg.textContent = 'Pumili ng specific na branch.'; msg.className = 'msg error'; return; }
  if(!purpose || !amount || Number(amount) <= 0){ msg.textContent = 'Kumpletuhin ang purpose at amount.'; msg.className = 'msg error'; return; }

  const btn = document.getElementById('pcSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const params = new URLSearchParams({ action: 'addPettyCashEntry', branch, date, purpose, amount, type: pcType, enteredBy, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ msg.textContent = data.error || 'Failed.'; msg.className = 'msg error'; btn.disabled=false; btn.textContent='Save Entry'; return; }
    msg.textContent = 'Naka-save na!'; msg.className = 'msg success';
    document.getElementById('pcPurpose').value = '';
    document.getElementById('pcAmount').value = '';
    loadPettyCash();
  }catch(e){
    msg.textContent = 'Connection error.'; msg.className = 'msg error';
  }
  btn.disabled = false; btn.textContent = 'Save Entry';
});

/* ---------- CASH ---------- */
async function loadCashCounts(){
  const branch = document.getElementById('branchSelect').value;
  const hist = document.getElementById('ccHistory');
  try{
    const res = await fetch(PETTYCASH_API_URL + '?action=getCashCounts&branch=' + encodeURIComponent(branch) + '&token=' + encodeURIComponent(getToken()));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    document.getElementById('cashBalance').textContent = fmtBD(data.balance);
    window.lastCashCounts = data.counts; // for the print button below

    if(!data.counts.length){ hist.innerHTML = '<div class="empty">No counts logged yet.</div>'; return; }
    hist.innerHTML = data.counts.map(c => `
      <div class="txn-row">
        <div>
          <div class="txn-main">${fmtBD(c.amount)}</div>
          <div class="txn-date">${fmtDate(c.date)} · ${c.branch} · ${c.countedBy||'—'}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="print-btn" data-id="${c.id}">🖨️ Print</button>
          ${c.sentToQalali
            ? `<span class="sent-badge">✓ Sent ${fmtDate(c.sentDate)}</span>`
            : `<button class="send-btn" data-id="${c.id}">Send to Qalali</button>`}
        </div>
      </div>
    `).join('');
    hist.querySelectorAll('.send-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> markSent(btn.dataset.id, btn));
    });
    hist.querySelectorAll('.print-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> printCashCount(btn.dataset.id));
    });
  }catch(e){
    hist.innerHTML = '<div class="empty">Could not load — check your connection.</div>';
  }
}
loadCashCounts();

function printCashCount(id){
  const c = (window.lastCashCounts || []).find(x => String(x.id) === String(id));
  if(!c) return;
  const rows = c.breakdown.map(b => `
    <tr><td>${b.label}</td><td style="text-align:center;">${b.count}</td><td style="text-align:right;">${(b.value*b.count).toFixed(3)} BD</td></tr>
  `).join('');

  // Petty Cash history for this same branch, shown together below the
  // cash count so both totals can be seen and cross-checked at once
  // (e.g. a Petron/fuel expense that explains part of the cash used).
  const pettyTxns = (window.lastPettyCashTxns || []).filter(t => t.branch === c.branch);
  const pettyRows = pettyTxns.map(t => `
    <tr>
      <td>${fmtDate(t.date)}</td>
      <td>${t.purpose}</td>
      <td>${t.type === 'topup' ? 'Top-up' : 'Expense'}</td>
      <td>${t.enteredBy || '—'}</td>
      <td style="text-align:right;">${t.type === 'topup' ? '+' : '−'}${fmtBD(t.amount)}</td>
    </tr>
  `).join('');
  const pettyNetHtml = pettyTxns.length ? `
    <h3 style="font-family:'Fraunces',serif;margin-top:24px;">Petty Cash History — ${c.branch}</h3>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <thead><tr style="border-bottom:2px solid #000;"><th style="text-align:left;">Date</th><th style="text-align:left;">Purpose</th><th style="text-align:left;">Type</th><th style="text-align:left;">By</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>${pettyRows}</tbody>
    </table>
  ` : '';

  document.getElementById('printArea').innerHTML = `
    <h2 style="font-family:'Fraunces',serif;">Lalabella — Cash Count</h2>
    <p>${c.branch} · ${fmtDate(c.date)} · Counted by: ${c.countedBy||'—'}</p>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:2px solid #000;"><th style="text-align:left;">Denomination</th><th>Pieces</th><th style="text-align:right;">Subtotal</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="border-top:2px solid #000;font-weight:700;"><td colspan="2">TOTAL</td><td style="text-align:right;">${fmtBD(c.amount)}</td></tr></tfoot>
    </table>
    ${pettyNetHtml}
  `;
  window.print();
}

async function markSent(id, btn){
  if(!confirm('Confirm na na-send na ang cash na ito sa Qalali branch?')) return;
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const params = new URLSearchParams({ action: 'markSentToQalali', id, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ alert(data.error || 'Failed.'); btn.disabled=false; btn.textContent='Send to Qalali'; return; }
    loadCashCounts();
  }catch(e){
    alert('Connection error.');
    btn.disabled = false; btn.textContent = 'Send to Qalali';
  }
}

document.getElementById('ccSaveBtn').addEventListener('click', async ()=>{
  const branch = document.getElementById('branchSelect').value;
  const date = document.getElementById('ccDate').value;
  const breakdown = collectBreakdown();
  const countedBy = document.getElementById('ccCountedBy').value.trim();
  const msg = document.getElementById('ccMsg');
  msg.className = 'msg';

  if(branch === 'All'){ msg.textContent = 'Pumili ng specific na branch.'; msg.className = 'msg error'; return; }
  if(!breakdown.length){ msg.textContent = 'Ilagay ang bilang ng kahit isang denomination.'; msg.className = 'msg error'; return; }

  const btn = document.getElementById('ccSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const params = new URLSearchParams({ action: 'addCashCount', branch, date, breakdown: JSON.stringify(breakdown), countedBy, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ msg.textContent = data.error || 'Failed.'; msg.className = 'msg error'; btn.disabled=false; btn.textContent='Save Count'; return; }
    msg.textContent = 'Naka-save na! Total: ' + Number(data.amount).toFixed(3) + ' BD'; msg.className = 'msg success';
    resetDenomInputs();
    loadCashCounts();
  }catch(e){
    msg.textContent = 'Connection error.'; msg.className = 'msg error';
  }
  btn.disabled = false; btn.textContent = 'Save Count';
});
</script>
</body>
</html>
