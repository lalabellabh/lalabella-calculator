<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lalabella — Petty Cash & Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --rose:#c9506b; --rose-dark:#8f2944; --rose-deep:#4a1627;
    --gold:#d9a441; --gold-light:#f3d993;
    --cream:#fff8f6; --ink:#302229; --muted:#8b737b; --line:#efdadd;
    --panel:rgba(255,255,255,.78); --good:#3d7a4f; --bad:#c0392b;
    --shadow:0 18px 50px rgba(91,35,52,.10);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;min-height:100%;
    background:
      radial-gradient(circle at 8% 8%,rgba(201,80,107,.15),transparent 28%),
      radial-gradient(circle at 92% 14%,rgba(217,164,65,.14),transparent 24%),
      radial-gradient(circle at 70% 90%,rgba(95,143,99,.12),transparent 30%),
      linear-gradient(145deg,#fff8f6 0%,#f8e8e5 48%,#edf5ef 100%);
    font-family:'Space Grotesk',Arial,sans-serif;color:var(--ink);
  }
  body{padding:22px 16px 60px;position:relative;overflow-x:hidden;}
  body::before,body::after{
    content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(2px);z-index:0;
  }
  body::before{width:360px;height:360px;left:-210px;top:180px;background:rgba(201,80,107,.12);}
  body::after{width:300px;height:300px;right:-170px;bottom:40px;background:rgba(95,143,99,.10);}
  .wrap{max-width:980px;margin:0 auto;position:relative;z-index:1;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin:0 0 18px;flex-wrap:wrap;gap:14px;
    padding:14px 16px;border:1px solid rgba(255,255,255,.85);
    border-radius:22px;background:rgba(255,255,255,.62);
    box-shadow:0 10px 30px rgba(91,35,52,.07);
    backdrop-filter:blur(16px);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{
    width:44px;height:44px;border-radius:15px;
    background:linear-gradient(145deg,#f5dc91,#c9952d);
    display:grid;place-items:center;font-weight:800;font-size:21px;
    box-shadow:0 9px 22px rgba(183,135,39,.22);
  }
  .brand b{font-family:'Fraunces',serif;font-size:19px;letter-spacing:.01em;display:block;}
  .brand::after{
    content:"Branch cash control · Petty cash · Daily count";
    display:block;font-size:10px;color:var(--muted);margin-left:-2px;margin-top:22px;
  }
  .backlink{
    font-size:11px;color:var(--rose-dark);text-decoration:none;
    border:1px solid rgba(201,80,107,.18);padding:9px 13px;border-radius:12px;
    background:rgba(255,255,255,.75);font-weight:700;
  }
  .backlink:hover{background:#fff;box-shadow:0 6px 16px rgba(158,47,74,.10);}

  #branchSelect{
    width:100%;max-width:240px;padding:11px 14px;margin:0 0 16px;
    border:1px solid rgba(201,80,107,.18);border-radius:13px;
    font-size:12.5px;font-family:inherit;background:rgba(255,255,255,.82);
    color:var(--ink);outline:none;box-shadow:0 7px 20px rgba(91,35,52,.05);
  }
  #branchSelect:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(201,80,107,.10);}

  .tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;
    padding:5px;border:1px solid rgba(255,255,255,.85);border-radius:16px;
    background:rgba(255,255,255,.52);box-shadow:0 8px 22px rgba(91,35,52,.06);
  }
  .tab-btn{
    position:relative;padding:12px 10px;border:0;border-radius:12px;background:transparent;
    font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted);transition:.2s;
  }
  .tab-btn.active{
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    color:#fff;box-shadow:0 8px 20px rgba(158,47,74,.20);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:pcFade .22s ease;}
  @keyframes pcFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .balance-card{
    position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 88% 10%,rgba(243,217,147,.28),transparent 24%),
      radial-gradient(circle at 8% 100%,rgba(255,255,255,.10),transparent 30%),
      linear-gradient(145deg,#38111e,#641c30 58%,#8e2d49);
    border:1px solid rgba(255,255,255,.10);border-radius:24px;
    padding:25px 24px;margin-bottom:18px;text-align:left;
    box-shadow:0 22px 45px rgba(91,20,43,.18);min-height:150px;
  }
  .balance-card::after{
    content:"";position:absolute;width:110px;height:110px;border:1px solid rgba(243,217,147,.22);
    border-radius:50%;right:-24px;bottom:-34px;box-shadow:0 0 0 16px rgba(243,217,147,.04),0 0 0 32px rgba(243,217,147,.025);
  }
  .balance-card .label{color:var(--gold-light);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px;font-weight:700;}
  .balance-card .amount{color:#fff;font-family:'Fraunces',serif;font-size:38px;font-weight:700;line-height:1;}
  .balance-card .amount.negative{color:#ffb1c1;}
  #targetLine{color:rgba(255,255,255,.70)!important;font-size:11px!important;margin-top:9px!important;}
  #toggleTargetLink{display:inline-flex!important;align-items:center;gap:5px;color:var(--gold-light)!important;font-size:10.5px!important;margin-top:4px;}

  .card{
    position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.86);
    border-radius:20px;padding:20px 21px;margin-bottom:18px;
    box-shadow:var(--shadow);backdrop-filter:blur(15px);
  }
  .card h2{
    font-family:'Fraunces',serif;font-size:17px;margin:0 0 15px;
    color:#4b2632;display:flex;align-items:center;gap:7px;
  }
  label{display:block;font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700;}
  input{
    width:100%;padding:11px 13px;border:1px solid #eadbdd;border-radius:11px;
    font-size:13px;font-family:inherit;background:rgba(255,250,249,.88);color:var(--ink);
    outline:none;margin-bottom:13px;transition:.18s;
  }
  input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(201,80,107,.09);background:#fff;}
  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px;}
  .type-toggle button{
    padding:10px 0;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.78);
    font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);transition:.18s;
  }
  .type-toggle button.active{background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;border-color:transparent;box-shadow:0 7px 16px rgba(158,47,74,.16);}
  .save-btn{
    padding:11px 18px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 8px 18px rgba(158,47,74,.16);transition:.18s;
  }
  .save-btn:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(158,47,74,.20);}
  .save-btn:disabled{opacity:.6;transform:none;}
  .msg{font-size:11.5px;margin-top:9px;display:none;padding:8px 10px;border-radius:9px;}
  .msg.error{color:var(--bad);background:rgba(192,57,43,.07);display:block;}
  .msg.success{color:var(--good);background:rgba(61,122,79,.08);display:block;}

  .txn-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;border-bottom:1px solid rgba(239,218,221,.75);gap:12px;
  }
  .txn-row:last-child{border-bottom:none;}
  .txn-main{font-size:12.5px;font-weight:600;}
  .txn-date{font-size:10px;color:var(--muted);margin-top:3px;}
  .txn-amt{font-weight:800;font-size:13px;white-space:nowrap;}
  .txn-amt.expense{color:var(--bad);}
  .txn-amt.topup{color:var(--good);}
  .send-btn,.print-btn{
    font-size:10.5px;padding:7px 10px;border-radius:9px;
    border:1px solid rgba(201,80,107,.24);background:rgba(255,255,255,.8);
    color:var(--rose-dark);cursor:pointer;white-space:nowrap;font-weight:700;
  }
  .send-btn:hover,.print-btn:hover{background:#fff;box-shadow:0 5px 13px rgba(158,47,74,.08);}
  .sent-badge{font-size:10px;color:var(--good);font-weight:700;}
  .delete-btn{background:none;border:none;color:var(--bad);font-size:14px;cursor:pointer;padding:4px;opacity:.65;}
  .delete-btn:hover{opacity:1;}
  .empty{text-align:center;padding:32px 20px;color:var(--muted);font-size:12px;}

  .denom-grid{
    display:grid;grid-template-columns:1fr 78px 95px;gap:7px 10px;
    align-items:center;margin-bottom:6px;padding:5px 0;
  }
  .denom-grid .d-label{font-size:12.5px;font-weight:700;}
  .denom-grid input{margin-bottom:0;padding:8px 10px;text-align:center;}
  .denom-grid .d-subtotal{font-size:11px;color:var(--muted);text-align:right;font-weight:600;}
  .denom-total{
    text-align:right;font-weight:800;font-size:14px;color:var(--rose-dark);
    padding:10px 0;border-top:1px solid var(--line);margin-top:6px;
  }

  /* Desktop: keep the dashboard compact — balance on top, form + history side-by-side. */
  @media(min-width:760px){
    .wrap{max-width:1040px;}
    .tab-panel.active{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:18px;
      align-items:start;
    }
    .tab-panel.active > .balance-card{
      grid-column:1 / -1;
    }
    .tab-panel.active > .card{
      grid-column:auto;
      margin-bottom:0;
    }
    #pettyTab > #pcTargetCard{
      grid-column:1 / -1;
    }
    .balance-card{min-height:168px;}
  }

  /* Laptop / desktop dashboard: fit the first screen without a browser scrollbar. */
  @media(min-width:901px) and (min-height:650px){
    html,body{height:100%;overflow:hidden;}
    body{padding:10px 14px 18px;}
    .wrap{height:calc(100vh - 28px);max-width:1100px;}
    .topbar{margin-bottom:10px;padding:9px 13px;border-radius:18px;gap:10px;}
    .brand{gap:9px;}
    .brand .logo{width:38px;height:38px;border-radius:12px;font-size:18px;}
    .brand b{font-size:17px;}
    .brand::after{font-size:9px;margin-top:19px;}
    #branchSelect{max-width:210px;padding:8px 12px;margin-bottom:9px;}
    .tabs{margin-bottom:10px;padding:4px;}
    .tab-btn{padding:9px 10px;}
    .balance-card{min-height:122px;padding:18px 20px;margin-bottom:12px;border-radius:20px;}
    .balance-card .amount{font-size:32px;}
    #targetLine{margin-top:6px!important;}
    #toggleTargetLink{margin-top:2px;}
    .card{padding:15px 17px;margin-bottom:12px;border-radius:17px;}
    .card h2{font-size:15px;margin-bottom:10px;}
    input{padding:8px 11px;margin-bottom:9px;font-size:12px;}
    label{font-size:9px;margin-bottom:4px;}
    .type-toggle{margin-bottom:9px;}
    .type-toggle button{padding:8px 0;}
    .save-btn{padding:9px 15px;font-size:11.5px;}
    .txn-row{padding:8px 3px;}
    .empty{padding:20px 14px;}
    .denom-grid{padding:2px 0;gap:4px 9px;}
    .denom-grid input{padding:6px 8px;}
    .denom-total{padding:7px 0;margin-top:3px;}
    #pettyTab > .card:last-child,
    #cashTab > .card:last-child{max-height:calc(100vh - 410px);overflow:auto;}
  }

  /* Give every functional box its own visual treatment instead of plain white panels. */
  .card{
    overflow:hidden;
    background:
      linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,247,246,.78));
  }
  .card::before{
    content:"";
    position:absolute;
    left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,var(--rose),var(--gold));
    opacity:.85;
  }
  #pettyTab > #pcTargetCard{
    background:linear-gradient(145deg,rgba(255,248,231,.94),rgba(255,255,255,.78));
  }
  #pettyTab > .card:nth-child(3){
    background:
      radial-gradient(circle at 100% 0%,rgba(201,80,107,.10),transparent 34%),
      linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,241,244,.82));
  }
  #pettyTab > .card:nth-child(4){
    background:
      radial-gradient(circle at 0% 100%,rgba(95,143,99,.10),transparent 34%),
      linear-gradient(145deg,rgba(255,255,255,.96),rgba(244,250,246,.82));
  }
  #cashTab > .card:nth-child(2){
    background:
      radial-gradient(circle at 100% 0%,rgba(217,164,65,.12),transparent 35%),
      linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,249,235,.84));
  }
  #cashTab > .card:nth-child(3){
    background:
      radial-gradient(circle at 0% 100%,rgba(95,143,99,.10),transparent 34%),
      linear-gradient(145deg,rgba(255,255,255,.96),rgba(244,250,246,.82));
  }
  @media(max-width:600px){
    body{padding:14px 11px 45px;}
    .topbar{padding:12px;border-radius:18px;}
    .brand b{font-size:16px;}
    .brand::after{font-size:8px;margin-top:20px;}
    .brand .logo{width:40px;height:40px;}
    .balance-card{padding:21px 19px;border-radius:20px;}
    .balance-card .amount{font-size:32px;}
    .card{padding:17px 15px;border-radius:17px;}
    .txn-row{align-items:flex-start;}
    .denom-grid{grid-template-columns:1fr 68px 82px;}
  }
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
</style>
<style id="chocoSharedNavStyles">
.choco-nav-toggle{
  position:fixed; top:16px; left:16px; z-index:9210;
  width:44px; height:44px; border-radius:12px; border:1px solid rgba(158,47,74,0.16);
  background:rgba(255,255,255,0.9); color:#9e2f4a; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  box-shadow:0 5px 16px rgba(158,47,74,.14);
}
.choco-nav-backdrop{
  position:fixed; inset:0; z-index:9205; background:rgba(60,30,30,0.35); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.choco-nav-backdrop.show{ opacity:1; pointer-events:auto; }
.choco-drawer{
  position:fixed; top:0; left:0; bottom:0; width:min(320px,80vw); z-index:9206;
  background:rgba(255,255,255,.94);
  border-right:1px solid #f0dede; box-shadow:12px 0 40px rgba(158,47,74,.14);
  transform:translateX(-100%); transition:transform .25s ease;
  padding:70px 16px 20px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  font-family:Arial,sans-serif; backdrop-filter:blur(18px);
}
.choco-drawer.show{ transform:translateX(0); }
.choco-hub-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
.choco-hub-grid a{
  flex-direction:column; text-align:center; gap:4px; padding:12px 4px;
  font-size:10.5px; background:rgba(201,80,107,0.05); border:1px solid #f0dede;
  min-height:76px; justify-content:center; white-space:nowrap;
}
.choco-hub-grid a span.hub-icon{ font-size:20px; }
.choco-drawer a{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
  color:#2f2024; text-decoration:none; font-size:14px; font-weight:600;
}
.choco-drawer a:hover{ background:rgba(201,80,107,0.08); }
.choco-drawer .choco-drawer-title{
  color:#9e2f4a; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  padding:0 12px 8px; opacity:0.8;
}
.wrap{ padding-top:76px !important; }
</style>
</head>
<body>

<button class="choco-nav-toggle" id="chocoNavToggle" aria-label="Open menu">☰</button>
<div class="choco-nav-backdrop" id="chocoNavBackdrop"></div>
<nav class="choco-drawer" id="chocoDrawer">
  <div data-lb-menu></div>
</nav>
<script src="shared/nav.js"></script>
<script>
(function(){
  const btn=document.getElementById('chocoNavToggle');
  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');
  if(!btn||!backdrop||!drawer) return;
  function openDrawer(){ drawer.classList.add('show'); backdrop.classList.add('show'); }
  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);
})();
</script>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">💰</div><b>Petty Cash & Cash</b></div>
    <a class="backlink" href="index.html">← Back to Lalabella</a>
  </div>

  <select id="branchSelect">
    <option value="All">All Branches</option>
    <option value="ModaMall">ModaMall</option>
    <option value="Hamala">Hamala</option>
    <option value="Galali">Galali</option>
  </select>

  <div class="tabs">
    <button class="tab-btn active" data-tab="petty">💵 Petty Cash</button>
    <button class="tab-btn" data-tab="cash">🏦 Cash</button>
  </div>

  <!-- PETTY CASH TAB -->
  <div class="tab-panel active" id="pettyTab">
    <div class="balance-card">
      <div class="label">Petty Cash Balance</div>
      <div class="amount" id="pettyBalance">—</div>
      <div id="targetLine" style="color:rgba(255,255,255,.65);font-size:11.5px;margin-top:6px;"></div>
      <div style="margin-top:10px;"><a href="#" id="toggleTargetLink" style="color:var(--gold-light);font-size:11px;text-decoration:none;">⚙️ Set target amount</a></div>
    </div>

    <div class="card" id="pcTargetCard" style="display:none;">
      <h2>⚙️ Target Amount</h2>
      <label>Set the standard petty cash float for this branch (e.g. 150)</label>
      <input type="number" step="0.001" min="0" id="pcTarget" placeholder="e.g. 150.000">
      <button class="save-btn" id="pcTargetSaveBtn">Save Target</button>
      <div class="msg" id="pcTargetMsg"></div>
    </div>

    <div class="card">
      <h2>➕ Add Entry</h2>
      <div class="type-toggle">
        <button type="button" class="active" data-type="expense" id="typeExpenseBtn">Expense</button>
        <button type="button" data-type="topup" id="typeTopupBtn">Top-up</button>
      </div>
      <label>Date</label>
      <input type="date" id="pcDate">
      <label>What was it used for?</label>
      <input type="text" id="pcPurpose" placeholder="e.g. Office supplies">
      <label>Amount (BD)</label>
      <input type="number" step="0.001" min="0.001" id="pcAmount" placeholder="0.000">
      <label>Your Name</label>
      <input type="text" id="pcEnteredBy" placeholder="Your name">
      <button class="save-btn" id="pcSaveBtn">Save Entry</button>
      <div class="msg" id="pcMsg"></div>
    </div>

    <div class="card">
      <h2>📋 History</h2>
      <div id="pcHistory"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- CASH TAB -->
  <div class="tab-panel" id="cashTab">
    <div class="balance-card">
      <div class="label">Cash On Hand (not yet sent)</div>
      <div class="amount" id="cashBalance">—</div>
    </div>

    <div class="card">
      <h2>➕ Log Daily Cash Count</h2>
      <label>Date</label>
      <input type="date" id="ccDate">

      <label style="margin-top:4px;">📄 Notes (BD)</label>
      <div id="denomNotes"></div>

      <label style="margin-top:14px;">🪙 Coins (Fils)</label>
      <div id="denomCoins"></div>

      <div class="denom-total">Total: <span id="denomGrandTotal">0.000 BD</span></div>

      <label style="margin-top:14px;">Counted By</label>
      <input type="text" id="ccCountedBy" placeholder="Your name">
      <button class="save-btn" id="ccSaveBtn">Save Count</button>
      <div class="msg" id="ccMsg"></div>
    </div>

    <div class="card">
      <h2>📋 History</h2>
      <div id="ccHistory"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<div id="printArea" style="display:none;"></div>

<style>
  @media print{ #printArea{ display:block !important; } }
</style>

<script>
const PETTYCASH_API_URL = LB_CONFIG.PETTY_CASH_API;

function getToken(){
  return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';
}
function fmtBD(n){ return Number(n).toFixed(3) + ' BD'; }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
  });
});

document.getElementById('branchSelect').addEventListener('change', ()=>{ loadPettyCash(); loadCashCounts(); });

const today = new Date().toISOString().slice(0,10);
document.getElementById('pcDate').value = today;
document.getElementById('ccDate').value = today;

/* ---------- Denomination breakdown (Bahraini Dinar) ---------- */
const NOTE_DENOMS = [
  { value: 20, label: 'BD 20' },
  { value: 10, label: 'BD 10' },
  { value: 5, label: 'BD 5' },
  { value: 1, label: 'BD 1' }
];
const COIN_DENOMS = [
  { value: 0.500, label: '500 fils' },
  { value: 0.100, label: '100 fils' },
  { value: 0.050, label: '50 fils' },
  { value: 0.025, label: '25 fils' },
  { value: 0.010, label: '10 fils' },
  { value: 0.005, label: '5 fils' }
];

function renderDenomRow(container, d){
  const row = document.createElement('div');
  row.className = 'denom-grid';
  row.innerHTML = `<div class="d-label">${d.label}</div>
    <input type="number" min="0" step="1" class="denom-count" data-value="${d.value}" data-label="${d.label}" placeholder="0">
    <div class="d-subtotal">0.000 BD</div>`;
  const input = row.querySelector('.denom-count');
  const subtotalEl = row.querySelector('.d-subtotal');
  input.addEventListener('input', ()=>{
    const count = Number(input.value) || 0;
    subtotalEl.textContent = (count * d.value).toFixed(3) + ' BD';
    updateGrandTotal();
  });
  container.appendChild(row);
}
NOTE_DENOMS.forEach(d => renderDenomRow(document.getElementById('denomNotes'), d));
COIN_DENOMS.forEach(d => renderDenomRow(document.getElementById('denomCoins'), d));

function updateGrandTotal(){
  let total = 0;
  document.querySelectorAll('.denom-count').forEach(inp=>{
    total += (Number(inp.value) || 0) * Number(inp.dataset.value);
  });
  document.getElementById('denomGrandTotal').textContent = total.toFixed(3) + ' BD';
  return total;
}
function collectBreakdown(){
  return Array.from(document.querySelectorAll('.denom-count'))
    .map(inp => ({ value: Number(inp.dataset.value), label: inp.dataset.label, count: Number(inp.value) || 0 }))
    .filter(b => b.count > 0);
}
function resetDenomInputs(){
  document.querySelectorAll('.denom-count').forEach(inp=>{ inp.value = ''; });
  document.querySelectorAll('.d-subtotal').forEach(el=>{ el.textContent = '0.000 BD'; });
  updateGrandTotal();
}

/* ---------- PETTY CASH ---------- */
let pcType = 'expense';
document.getElementById('typeExpenseBtn').addEventListener('click', ()=>{
  pcType = 'expense';
  document.getElementById('typeExpenseBtn').classList.add('active');
  document.getElementById('typeTopupBtn').classList.remove('active');
});
document.getElementById('typeTopupBtn').addEventListener('click', ()=>{
  pcType = 'topup';
  document.getElementById('typeTopupBtn').classList.add('active');
  document.getElementById('typeExpenseBtn').classList.remove('active');
});

async function loadPettyCash(){
  const branch = document.getElementById('branchSelect').value;
  const hist = document.getElementById('pcHistory');
  const targetCard = document.getElementById('pcTargetCard');
  const toggleLink = document.getElementById('toggleTargetLink');
  targetCard.style.display = 'none'; // always start collapsed, whichever branch is picked
  toggleLink.style.display = (branch === 'All') ? 'none' : 'inline';
  try{
    const res = await fetch(PETTYCASH_API_URL + '?action=getPettyCash&branch=' + encodeURIComponent(branch) + '&token=' + encodeURIComponent(getToken()));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const balEl = document.getElementById('pettyBalance');
    balEl.textContent = fmtBD(data.balance);
    balEl.classList.toggle('negative', data.balance < 0);

    const targetLine = document.getElementById('targetLine');
    if(branch !== 'All' && data.targetAmount !== null){
      document.getElementById('pcTarget').value = data.targetAmount || '';
      const diff = data.targetAmount - data.balance;
      targetLine.textContent = diff > 0
        ? `Target: ${fmtBD(data.targetAmount)} · ${fmtBD(diff)} short of target (top-up needed)`
        : `Target: ${fmtBD(data.targetAmount)} · Target reached`;
    } else {
      targetLine.textContent = '';
    }

    window.lastPettyCashTxns = data.transactions;
    if(!data.transactions.length){ hist.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
    hist.innerHTML = data.transactions.map(t => `
      <div class="txn-row">
        <div>
          <div class="txn-main">${t.purpose}</div>
          <div class="txn-date">${fmtDate(t.date)} · ${t.branch} · ${t.enteredBy||'—'}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div class="txn-amt ${t.type}">${t.type === 'topup' ? '+' : '−'}${fmtBD(t.amount)}</div>
          <button class="delete-btn" data-id="${t.id}" title="Delete">🗑️</button>
        </div>
      </div>
    `).join('');
    hist.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> deletePettyCashEntry(btn.dataset.id));
    });
  }catch(e){
    hist.innerHTML = '<div class="empty">Could not load — check your connection.</div>';
  }
}
loadPettyCash();

async function deletePettyCashEntry(id){
  if(!confirm('Are you sure you want to delete this entry?')) return;
  try{
    const params = new URLSearchParams({ action: 'deletePettyCashEntry', id, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ alert(data.error || 'Failed to delete.'); return; }
    loadPettyCash();
  }catch(e){
    alert('Connection error.');
  }
}

document.getElementById('toggleTargetLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const card = document.getElementById('pcTargetCard');
  card.style.display = (card.style.display === 'none') ? 'block' : 'none';
});
document.getElementById('pcTargetSaveBtn').addEventListener('click', async ()=>{
  const branch = document.getElementById('branchSelect').value;
  const targetAmount = document.getElementById('pcTarget').value;
  const msg = document.getElementById('pcTargetMsg');
  msg.className = 'msg';
  if(branch === 'All'){ msg.textContent = 'Please select a specific branch.'; msg.className = 'msg error'; return; }
  if(targetAmount === '' || Number(targetAmount) < 0){ msg.textContent = 'Please enter a valid amount.'; msg.className = 'msg error'; return; }

  const btn = document.getElementById('pcTargetSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const params = new URLSearchParams({ action: 'setPettyCashTarget', branch, targetAmount, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ msg.textContent = data.error || 'Failed.'; msg.className = 'msg error'; btn.disabled=false; btn.textContent='Save Target'; return; }
    msg.textContent = 'Target updated!'; msg.className = 'msg success';
    loadPettyCash();
  }catch(e){
    msg.textContent = 'Connection error.'; msg.className = 'msg error';
  }
  btn.disabled = false; btn.textContent = 'Save Target';
});

document.getElementById('pcSaveBtn').addEventListener('click', async ()=>{
  const branch = document.getElementById('branchSelect').value;
  const date = document.getElementById('pcDate').value;
  const purpose = document.getElementById('pcPurpose').value.trim();
  const amount = document.getElementById('pcAmount').value;
  const enteredBy = document.getElementById('pcEnteredBy').value.trim();
  const msg = document.getElementById('pcMsg');
  msg.className = 'msg';

  if(branch === 'All'){ msg.textContent = 'Please select a specific branch.'; msg.className = 'msg error'; return; }
  if(!purpose || !amount || Number(amount) <= 0){ msg.textContent = 'Please fill in the purpose and amount.'; msg.className = 'msg error'; return; }

  const btn = document.getElementById('pcSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const params = new URLSearchParams({ action: 'addPettyCashEntry', branch, date, purpose, amount, type: pcType, enteredBy, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ msg.textContent = data.error || 'Failed.'; msg.className = 'msg error'; btn.disabled=false; btn.textContent='Save Entry'; return; }
    msg.textContent = 'Saved!'; msg.className = 'msg success';
    document.getElementById('pcPurpose').value = '';
    document.getElementById('pcAmount').value = '';
    loadPettyCash();
  }catch(e){
    msg.textContent = 'Connection error.'; msg.className = 'msg error';
  }
  btn.disabled = false; btn.textContent = 'Save Entry';
});

/* ---------- CASH ---------- */
async function loadCashCounts(){
  const branch = document.getElementById('branchSelect').value;
  const hist = document.getElementById('ccHistory');
  try{
    const res = await fetch(PETTYCASH_API_URL + '?action=getCashCounts&branch=' + encodeURIComponent(branch) + '&token=' + encodeURIComponent(getToken()));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    document.getElementById('cashBalance').textContent = fmtBD(data.balance);
    window.lastCashCounts = data.counts; // for the print button below

    if(!data.counts.length){ hist.innerHTML = '<div class="empty">No counts logged yet.</div>'; return; }
    hist.innerHTML = data.counts.map(c => `
      <div class="txn-row">
        <div>
          <div class="txn-main">${fmtBD(c.amount)}</div>
          <div class="txn-date">${fmtDate(c.date)} · ${c.branch} · ${c.countedBy||'—'}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="print-btn" data-id="${c.id}">🖨️ Print</button>
          ${c.sentToQalali
            ? `<span class="sent-badge">✓ Sent ${fmtDate(c.sentDate)}</span>`
            : `<button class="send-btn" data-id="${c.id}">Send to Qalali</button><button class="delete-btn" data-id="${c.id}" title="Delete">🗑️</button>`}
        </div>
      </div>
    `).join('');
    hist.querySelectorAll('.send-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> markSent(btn.dataset.id, btn));
    });
    hist.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteCashCount(btn.dataset.id));
    });
    hist.querySelectorAll('.print-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> printCashCount(btn.dataset.id));
    });
  }catch(e){
    hist.innerHTML = '<div class="empty">Could not load — check your connection.</div>';
  }
}
loadCashCounts();

async function deleteCashCount(id){
  if(!confirm('Are you sure you want to delete this cash count?')) return;
  try{
    const params = new URLSearchParams({ action: 'deleteCashCount', id, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ alert(data.error || 'Failed to delete.'); return; }
    loadCashCounts();
  }catch(e){
    alert('Connection error.');
  }
}

async function printCashCount(id){
  const c = (window.lastCashCounts || []).find(x => String(x.id) === String(id));
  if(!c) return;
  const rows = c.breakdown.map(b => `
    <tr><td style="padding:4px 8px 4px 0;">${b.label}</td><td style="text-align:center;padding:4px 8px;">${b.count}</td><td style="text-align:right;padding:4px 0 4px 8px;">${(b.value*b.count).toFixed(3)} BD</td></tr>
  `).join('');

  // Petty Cash history for this same branch, shown together below the
  // cash count so both totals can be seen and cross-checked at once
  // (e.g. a Petron/fuel expense that explains part of the cash used).
  const pettyTxns = (window.lastPettyCashTxns || []).filter(t => t.branch === c.branch);
  const pettyRows = pettyTxns.map(t => `
    <tr>
      <td>${fmtDate(t.date)}</td>
      <td>${t.purpose}</td>
      <td>${t.type === 'topup' ? 'Top-up' : 'Expense'}</td>
      <td>${t.enteredBy || '—'}</td>
      <td style="text-align:right;">${t.type === 'topup' ? '+' : '−'}${fmtBD(t.amount)}</td>
    </tr>
  `).join('');

  // Fetch the CURRENT petty cash balance for this exact branch — not
  // computed from whatever's cached, since the dropdown up top might
  // currently be showing a different branch entirely. This keeps the
  // printed remaining-balance accurate regardless of what's selected.
  let currentBalance = null;
  try{
    const res = await fetch(PETTYCASH_API_URL + '?action=getPettyCash&branch=' + encodeURIComponent(c.branch) + '&token=' + encodeURIComponent(getToken()));
    const data = await res.json();
    if(!data.error) currentBalance = data.balance;
  }catch(e){}

  const balanceHtml = currentBalance !== null
    ? `<div style="text-align:right;font-weight:700;font-size:14px;margin-top:8px;">Petty Cash Remaining Balance: ${fmtBD(currentBalance)}</div>`
    : '';

  const pettyNetHtml = pettyTxns.length ? `
    <h3 style="font-family:'Fraunces',serif;margin-top:24px;">Petty Cash History — ${c.branch}</h3>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
      <thead><tr style="border-bottom:2px solid #000;"><th style="text-align:left;">Date</th><th style="text-align:left;">Purpose</th><th style="text-align:left;">Type</th><th style="text-align:left;">By</th><th style="text-align:right;">Amount</th></tr></thead>
      <tbody>${pettyRows}</tbody>
    </table>
    ${balanceHtml}
  ` : balanceHtml;

  document.getElementById('printArea').innerHTML = `
    <h2 style="font-family:'Fraunces',serif;">Lalabella — Cash Count</h2>
    <p>${c.branch} · ${fmtDate(c.date)} · Counted by: ${c.countedBy||'—'}</p>
    <table style="width:420px;border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:2px solid #000;"><th style="text-align:left;padding:4px 8px 4px 0;">Denomination</th><th style="padding:4px 8px;">Pieces</th><th style="text-align:right;padding:4px 0 4px 8px;">Subtotal</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="border-top:2px solid #000;font-weight:700;"><td colspan="2" style="padding:4px 8px 4px 0;">TOTAL</td><td style="text-align:right;padding:4px 0 4px 8px;">${fmtBD(c.amount)}</td></tr></tfoot>
    </table>
    ${pettyNetHtml}
  `;
  window.print();
}

async function markSent(id, btn){
  if(!confirm('Confirm that this cash has been sent to Qalali branch?')) return;
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const params = new URLSearchParams({ action: 'markSentToQalali', id, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ alert(data.error || 'Failed.'); btn.disabled=false; btn.textContent='Send to Qalali'; return; }
    loadCashCounts();
  }catch(e){
    alert('Connection error.');
    btn.disabled = false; btn.textContent = 'Send to Qalali';
  }
}

document.getElementById('ccSaveBtn').addEventListener('click', async ()=>{
  const branch = document.getElementById('branchSelect').value;
  const date = document.getElementById('ccDate').value;
  const breakdown = collectBreakdown();
  const countedBy = document.getElementById('ccCountedBy').value.trim();
  const msg = document.getElementById('ccMsg');
  msg.className = 'msg';

  if(branch === 'All'){ msg.textContent = 'Please select a specific branch.'; msg.className = 'msg error'; return; }
  if(!breakdown.length){ msg.textContent = 'Please enter the count for at least one denomination.'; msg.className = 'msg error'; return; }

  const btn = document.getElementById('ccSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const params = new URLSearchParams({ action: 'addCashCount', branch, date, breakdown: JSON.stringify(breakdown), countedBy, token: getToken() });
    const res = await fetch(PETTYCASH_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ msg.textContent = data.error || 'Failed.'; msg.className = 'msg error'; btn.disabled=false; btn.textContent='Save Count'; return; }
    msg.textContent = 'Saved! Total: ' + Number(data.amount).toFixed(3) + ' BD'; msg.className = 'msg success';
    resetDenomInputs();
    loadCashCounts();
  }catch(e){
    msg.textContent = 'Connection error.'; msg.className = 'msg error';
  }
  btn.disabled = false; btn.textContent = 'Save Count';
});
</script>
