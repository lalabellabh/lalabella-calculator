<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Chocolate Release</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--i:#1c2b45;--d:#66728a;--g:#c68a1f;--p:#f3ede0;--p2:#e9e0c8;--l:#c9bfa0;--ok:#3d7a4f;--bad:#8a2424}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff,#eee5d1 70%);color:var(--i);font-family:'Space Grotesk',sans-serif}.bar{height:9px;background:repeating-linear-gradient(-45deg,#c68a1f,#c68a1f 18px,#e8c46a 18px,#e8c46a 36px)}main{max-width:1050px;margin:auto;padding:28px 18px 70px}.back{color:var(--d);text-decoration:none;font-size:12px;text-transform:uppercase}.head{text-align:center;margin:24px 0}.ey{color:var(--g);font-size:11px;letter-spacing:.35em;font-weight:700}.head h1{font:900 clamp(2rem,6vw,3.2rem)/1 'Fraunces',serif;margin:10px 0}.head p{color:var(--d);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--p2);padding:5px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:12px;font-weight:700;color:var(--d)}.tabs .active{background:var(--i);color:#fff}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--l);padding:20px;border-radius:5px;margin-bottom:18px}.card h2{font:600 19px 'Fraunces',serif;margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--d);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--l);background:var(--p);font:inherit;color:var(--i);border-radius:3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search{display:flex;gap:8px}.search input{flex:1}.results{display:none;max-height:220px;overflow:auto;border:1px solid var(--l);margin-top:6px}.result{padding:10px;border-bottom:1px solid var(--l);cursor:pointer}.result:hover{background:var(--p)}.meta{font-size:11px;color:var(--d)}.stock{margin-top:7px;padding:9px;background:var(--p);font-size:12px}.cartrow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--l);padding:11px 0}.rm{border:0;background:none;color:var(--bad);cursor:pointer;font-size:18px}.btn{border:0;background:var(--i);color:#fff;padding:12px 15px;font-weight:700;cursor:pointer;border-radius:3px}.btn:disabled{opacity:.45}.add{width:100%;margin-top:10px}.extra{display:flex;gap:7px}.extra input:first-child{flex:1}.extra input:nth-child(2){width:130px}.total{display:flex;justify-content:space-between;align-items:center;padding:17px;background:var(--i);color:#fff;margin-top:15px}.grand{font:900 29px 'Fraunces',serif;color:#e8c46a}.status{text-align:center;color:var(--d);font-size:12px;margin-top:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.history{max-height:560px;overflow:auto}.hist{border-top:1px solid var(--l);padding:11px 0}.hist:first-child{border-top:0}.histtop{display:flex;justify-content:space-between;gap:8px}.pill{font-size:9px;padding:3px 7px;border-radius:10px;background:#e3f0e6;color:var(--ok);font-weight:700}@media(max-width:750px){.layout{grid-template-columns:1fr}.two{grid-template-columns:1fr}.extra{display:grid;grid-template-columns:1fr}.extra input:nth-child(2){width:100%}}</style></head><body><div class="bar"></div><main><a class="back" href="index.html">← Back to Tools</a><header class="head"><div class="ey">LALABELLA</div><h1>Chocolate Release</h1><p>Transactional stock-out · Supabase PostgreSQL · branch protected</p></header><div class="tabs" id="tabs"><button class="active" data-b="ModaMall">ModaMall</button><button data-b="Hamala">Hamala</button><button data-b="Galali">Galali</button></div><div class="layout"><section><div class="card"><h2>Release Details</h2><div class="two"><div class="field"><label>Release Date</label><input id="date" type="date"></div><div class="field"><label>Transaction</label><select id="type"><option>Retail Sale</option><option>Wholesale</option><option>Internal Use</option><option>Damage</option><option>Transfer</option><option>Other</option></select></div></div><div class="two"><div class="field"><label>Release No.</label><input id="releaseNo" placeholder="Auto"></div><div class="field"><label>Prepared By</label><select id="prepared"></select></div></div><div class="two"><div class="field"><label>Customer / Department</label><input id="customer"></div><div class="field" id="toWrap" style="display:none"><label>To Branch</label><select id="to"><option>ModaMall</option><option>Hamala</option><option>Galali</option></select></div></div><div class="field"><label>Remarks</label><textarea id="remarks" rows="2"></textarea></div></div><div class="card"><h2>Add Chocolate</h2><div class="search"><input id="search" placeholder="Search chocolate or product code"><button class="btn" id="find">Search</button></div><div class="results" id="results"></div><div class="field"><label>Batch</label><select id="batch"><option value="">Select chocolate first</option></select><div class="stock" id="stock">Available stock: —</div></div><div class="two"><div class="field"><label>Quantity</label><input id="qty" type="number" min="0" step=".001"></div><div class="field"><label>Unit</label><select id="unit"><option>Kg</option><option>Piece</option><option>Box</option><option>Can</option></select></div></div><button class="btn add" id="add">Add Item</button></div><div class="card"><h2>Release Items</h2><div id="cart"><div class="meta">No items yet.</div></div><div class="field"><label>Extra</label><div class="extra"><input id="extraDesc" placeholder="e.g. Vase / Hand Work"><input id="extraAmount" type="number" min="0" step=".001" placeholder="BD"></div><button class="btn add" id="addExtra">Add Extra</button></div><div class="total"><span>GRAND TOTAL</span><span class="grand" id="total">0.000 BD</span></div><button class="btn add" id="save">Save Release</button><div class="status" id="status">Checking Supabase…</div></div></section><aside><div class="card"><h2>Recent Releases — <span id="branchLabel">ModaMall</span></h2><div class="history" id="history"></div></div></aside></div></main><script>
(async()=>{const $=id=>document.getElementById(id);let sb,branch='ModaMall',items=[],batches=[],cart=[],extras=[],selected=null,prepared=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' BD';const today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=today;function status(t,bad=false){$('status').textContent=t;$('status').className='status '+(bad?'bad':'')}
async function load(){const [a,b,c]=await Promise.all([sb.from('chocolate_item_list').select('*').order('chocolate_name'),sb.from('chocolate_received_by').select('name').order('id'),sb.from('chocolate_release_database').select('*').eq('branch',branch).order('release_date',{ascending:false}).limit(100)]);for(const q of [a,b,c])if(q.error)throw q.error;items=a.data||[];prepared=(b.data||[]).map(x=>x.name);$('prepared').innerHTML=prepared.map(x=>`<option>${esc(x)}</option>`).join('');renderHistory(c.data||[])}
function findItems(){const q=$('search').value.trim().toLowerCase();const r=$('results');const list=items.filter(x=>[x.chocolate_name,x.product_code,x.brand,x.category].some(v=>String(v||'').toLowerCase().includes(q)));r.innerHTML=list.slice(0,30).map(x=>`<div class="result" data-id="${x.id}"><b>${esc(x.chocolate_name)}</b><div class="meta">${esc(x.product_code||'')} · ${esc(x.category||'')} · ${x.grams||0}g/pc · ${fmt(x.standard_price_per_kg)}/kg</div></div>`).join('')||'<div class="meta" style="padding:12px">No matches.</div>';r.style.display='block';r.querySelectorAll('.result').forEach(el=>el.onclick=()=>choose(items.find(x=>String(x.id)===el.dataset.id)))}
async function choose(x){selected=x;if(!x)return;$('search').value=x.chocolate_name;$('results').style.display='none';const q=await sb.from('chocolate_database').select('id,batch_no,expiry_date,current_stock,price_per_kg,unit').eq('branch',branch).eq('chocolate_name',x.chocolate_name).gt('current_stock',0).order('expiry_date',{ascending:true});if(q.error){status(q.error.message,true);return}batches=q.data||[];$('batch').innerHTML=batches.map(b=>`<option value="${b.id}">${esc(b.batch_no||'—')} · ${b.current_stock} ${esc(b.unit||'')} · exp ${esc(b.expiry_date||'—')}</option>`).join('')||'<option value="">No available stock</option>';updateStock()}
function updateStock(){const b=batches.find(x=>String(x.id)===$('batch').value);$('stock').textContent=b?`Available: ${b.current_stock} ${b.unit||''} · ${fmt(b.price_per_kg)}/kg · Expiry ${b.expiry_date||'—'}`:'Available stock: —'}
$('find').onclick=findItems;$('search').onkeydown=e=>{if(e.key==='Enter')findItems()};$('batch').onchange=updateStock;$('type').onchange=e=>$('toWrap').style.display=e.target.value==='Transfer'?'block':'none';
$('add').onclick=()=>{const b=batches.find(x=>String(x.id)===$('batch').value),q=Number($('qty').value);if(!b||!q||q<=0)return alert('Select a batch and enter quantity.');if(q>Number(b.current_stock))return alert('Quantity exceeds available stock.');const price=Number(b.price_per_kg)||0;cart.push({database_id:b.id,chocolate_name:selected.chocolate_name,product_code:selected.product_code||'',batch_no:b.batch_no||'',qty:q,unit:$('unit').value,price,total:q*price});$('qty').value='';renderCart()};
$('addExtra').onclick=()=>{const d=$('extraDesc').value.trim(),a=Number($('extraAmount').value);if(!d||a<=0)return;extras.push({description:d,amount:a});$('extraDesc').value='';$('extraAmount').value='';renderCart()};function renderCart(){if(!cart.length&&!extras.length){$('cart').innerHTML='<div class="meta">No items yet.</div>';$('total').textContent='0.000 BD';return}$('cart').innerHTML=cart.map((x,i)=>`<div class="cartrow"><div><b>${esc(x.chocolate_name)}</b><div class="meta">${x.qty} ${esc(x.unit)} · ${esc(x.batch_no)}</div></div><div>${fmt(x.total)} <button class="rm" data-i="${i}">×</button></div></div>`).join('')+extras.map((x,i)=>`<div class="cartrow"><div>${esc(x.description)}</div><div>${fmt(x.amount)} <button class="rm" data-e="${i}">×</button></div></div>`).join('');$('cart').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);renderCart()});$('cart').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{extras.splice(+b.dataset.e,1);renderCart()});$('total').textContent=fmt(cart.reduce((s,x)=>s+x.total,0)+extras.reduce((s,x)=>s+x.amount,0))}
$('tabs').onclick=async e=>{const b=e.target.closest('button');if(!b)return;branch=b.dataset.b;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));$('branchLabel').textContent=branch;selected=null;batches=[];$('batch').innerHTML='<option>Select chocolate first</option>';await load()};
$('save').onclick=async()=>{if(!cart.length)return alert('Add at least one chocolate.');const u=await sb.auth.getUser();if(u.error||!u.data.user)return location.href='index.html';let rn=$('releaseNo').value.trim();if(!rn){const p=branch==='ModaMall'?'MM':branch==='Hamala'?'HM':'GL';rn=`${p}-REL-${today.replaceAll('-','')}-${Date.now().toString().slice(-4)}`}$('save').disabled=true;$('save').textContent='Saving…';try{const {data,error}=await sb.rpc('record_chocolate_release',{p_release_no:rn,p_transaction_type:$('type').value,p_branch:branch,p_customer_department:$('customer').value.trim(),p_prepared_by:$('prepared').value,p_release_date:$('date').value,p_remarks:$('remarks').value.trim(),p_to_branch:$('type').value==='Transfer'?$('to').value:null,p_items:cart,p_extras:extras});if(error)throw error;status(`Saved ${data.release_no} · ${data.items} item(s) · ${fmt(data.grand_total)} ✓`);cart=[];extras=[];renderCart();await load()}catch(e){console.error(e);status(e.message||'Release failed',true);alert(e.message||'Release failed')}finally{$('save').disabled=false;$('save').textContent='Save Release'}};
function renderHistory(list){$('history').innerHTML=list.length?list.map(e=>`<div class="hist"><div class="histtop"><b>${esc(e.chocolate_name||'—')}</b><span class="pill">${esc(e.release_no||'')}</span></div><div class="meta">${esc(e.release_date||'—')} · ${e.qty_release||0} ${esc(e.unit||'')} · ${fmt(e.total)}</div><div class="meta">Batch: ${esc(e.batch_no||'—')} · By: ${esc(e.prepared_by||'—')}</div></div>`).join(''):'<div class="meta">No releases for this branch.</div>'}
try{sb=await window.LalabellaSupabase.ready();const u=await sb.auth.getUser();if(u.error||!u.data.user){location.href='index.html';return}await load()}catch(e){console.error(e);status(e.message||'Supabase connection failed',true)}})();</script></body></html>
