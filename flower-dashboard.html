<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="lb-theme-keep" content="#app">
<title>Flower Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/glass-dash.css">
<style>
  /* Flower layout: tall stock list on the left, 3 panels on the right */
  #app .main.f4{ grid-template-columns:1.05fr 1fr 1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"cat ov al" "cat mv mv"; }
  @media (min-width:900px) and (max-width:1250px){
    #app .main.f4{ grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); grid-template-areas:"cat ov" "cat al" "mv mv"; }
  }
  @media (max-width:899px){
    #app .main.f4{ display:flex; flex-direction:column; }
  }
  #app .footbar .btn{ white-space:nowrap; flex:none; }
  @media (min-width:1251px){ #app .kpis.k8{ grid-template-columns:repeat(8,minmax(0,1fr)); } }
  @media (min-width:900px) and (max-width:1250px){ #app .kpis.k8{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
</style>

<style id="chocoSharedNavStyles">
.choco-nav-toggle{
  position:fixed; top:16px; left:20px; z-index:9210;
  width:44px; height:44px; border-radius:12px; border:1px solid rgba(158,47,74,0.16);
  background:rgba(255,255,255,0.92); color:#9e2f4a; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  box-shadow:0 5px 16px rgba(158,47,74,.14);
}
.choco-nav-backdrop{
  position:fixed; inset:0; z-index:9205; background:rgba(60,30,40,0.28); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.choco-nav-backdrop.show{ opacity:1; pointer-events:auto; }
.choco-drawer{
  position:fixed; top:0; left:0; bottom:0; width:min(270px,80vw); z-index:9206;
  background:rgba(255,255,255,.96);
  border-right:1px solid #f0dede; box-shadow:12px 0 40px rgba(158,47,74,.14);
  transform:translateX(-100%); transition:transform .25s ease;
  padding:70px 16px 20px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  font-family:Arial,sans-serif;
}
.choco-drawer.show{ transform:translateX(0); }
.choco-drawer a{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
  color:#3a2530; text-decoration:none; font-size:14px; font-weight:600;
}
.choco-drawer a:hover{ background:rgba(201,80,107,.08); }
.choco-drawer .choco-drawer-title{
  color:#9e2f4a; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  padding:0 12px 8px; opacity:0.8;
}
.choco-hub-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
.choco-hub-grid a{
  flex-direction:column; text-align:center; gap:4px; padding:12px 4px;
  font-size:10.5px; background:rgba(201,80,107,.05); border:1px solid #f0dede;
  min-height:76px; justify-content:center; white-space:nowrap;
}
.choco-hub-grid a span.hub-icon{ font-size:20px; }
</style>
</head>
<body>

<button class="choco-nav-toggle" id="chocoNavToggle" aria-label="Open menu">☰</button>
<div class="choco-nav-backdrop" id="chocoNavBackdrop"></div>
<nav class="choco-drawer" id="chocoDrawer">
  <div data-lb-menu></div>
</nav>
<script src="shared/nav.js"></script>

<div id="app" data-lb-theme-skip data-mode="light">

  <div class="topbar glass">
    <div class="ttl">
      <h1>🌸 Flower Dashboard</h1>
      <div class="sub"><a href="flower-tools.html">&larr; Flower Tools</a> · <a href="flower-receiving.html">📦 Receiving</a> · <a href="flower-stock-count.html">📋 Stock Count</a></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="branchTabs">
      <button class="on" data-branch="All">All</button>
      <button data-branch="ModaMall">ModaMall</button>
      <button data-branch="Hamala">Hamala</button>
      <button data-branch="Galali">Galali</button>
    </div>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
    <div class="note" id="lastRefreshedNote"></div>
  </div>

  <div class="kpis k8" id="kpis"></div>

  <div class="main f4">
    <section class="panel glass p-cat">
      <div class="ph"><h2>🔎 Live Stock Levels</h2><span class="cnt" id="stCnt">0</span></div>
      <input type="text" class="search" id="stSearch" placeholder="Type a flower name (e.g. Rose)…" autocomplete="off">
      <div class="scroll" id="stScroll"></div>
    </section>

    <section class="panel glass p-ov">
      <div class="ph"><h2>🌿 Budget &amp; This Week</h2><button class="gear" id="gearBtn" title="Set weekly budget">⚙</button></div>
      <div class="scroll" id="ovScroll"></div>
    </section>

    <section class="panel glass p-al">
      <div class="ph"><h2>🚨 Alerts</h2>
        <div class="tabs" id="alTabs">
          <button data-t="low" class="on">Low stock<span class="b" id="alLowN">0</span></button>
          <button data-t="apr">Rate approvals<span class="b" id="alAprN">0</span></button>
        </div>
      </div>
      <div class="scroll" id="alScroll"></div>
      <div class="footbar" id="aprFoot" style="display:none">
        <input type="text" class="field" id="approverName" placeholder="Your name (required)">
        <button class="btn primary" id="saveAllBtn" disabled>💾 Save All (0)</button>
      </div>
    </section>

    <section class="panel glass p-mv">
      <div class="ph"><h2>📋 Activity</h2>
        <div class="tabs" id="mvTabs">
          <button data-t="rcv" class="on">Recent receiving</button>
          <button data-t="tr">Transfers</button>
          <button data-t="hist">Rate changes</button>
          <button data-t="br">Branches</button>
        </div>
      </div>
      <div class="scroll" id="mvScroll"></div>
    </section>
  </div>

  <div class="overlay" id="budgetOverlay">
    <div class="modal glass">
      <h3>Set Weekly Budget</h3>
      <label>ModaMall (BD)</label><input class="field" type="number" id="budgetModaMall" min="0" step="0.001">
      <label>Hamala (BD)</label><input class="field" type="number" id="budgetHamala" min="0" step="0.001">
      <label>Galali (BD)</label><input class="field" type="number" id="budgetGalali" min="0" step="0.001">
      <div class="acts"><button class="btn" id="closeBudgetBtn">Close</button><button class="btn primary" id="saveBudgetBtn">Save</button></div>
    </div>
  </div>

  <div class="loading" id="loadingMsg">Loading…</div>
</div>

<script>
(function(){
  const API_URL = LB_CONFIG.FLOWER_FAST_API;
  const app = document.getElementById('app');

  /* ---------- light / dark follows the Settings choice ---------- */
  function applyMode(){ app.setAttribute('data-mode', (window.LBTheme && LBTheme.isDark && LBTheme.isDark()) ? 'dark' : 'light'); }
  window.addEventListener('lb:theme-changed', applyMode);
  document.addEventListener('DOMContentLoaded', applyMode);
  applyMode(); setTimeout(applyMode, 300);

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtBD  = n => Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD';
  const fmtNum = n => Number(n || 0).toLocaleString('en-US',{maximumFractionDigits:2});
  const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? esc(d) : dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
  const empty = t => `<div class="empty">${t}</div>`;
  const rows = (list, fn, t) => (!list || !list.length) ? empty(t) : list.map(fn).join('');
  const statusCls = s => s === 'OVER BUDGET' ? 'bad' : (s === 'WARNING' ? 'warn' : 'ok');
  // Stock is counted in stems (a bunch counts as its stems), so a "Bunch" item is shown in stems.
  const unitLabel = u => String(u || '').toLowerCase() === 'bunch' ? 'stems' : (u || '');

  /* ---------- state that survives re-renders ---------- */
  const ui = { branch:'All', alTab:'low', mvTab:'rcv', q:'', queue:{}, approver:'' };
  let data = null, rateHistory = [], transfers = [], distinctCount = null;

  function keepScroll(ids, fn){
    const pos = {};
    ids.forEach(id => { const el = document.getElementById(id); if(el) pos[id] = el.scrollTop; });
    fn();
    ids.forEach(id => { const el = document.getElementById(id); if(el && pos[id]) el.scrollTop = pos[id]; });
  }

  /* ---------- loading (saved copy first; refresh is manual so approvals are never disturbed) ---------- */
  const CACHE_PREFIX = 'lbDash:flower2:';
  let loadSeq = 0;
  const readCache = k => { try{ const c = JSON.parse(localStorage.getItem(CACHE_PREFIX + k) || 'null'); return c && c.v ? c : null; }catch(e){ return null; } };
  const writeCache = (k, v) => { try{ localStorage.setItem(CACHE_PREFIX + k, JSON.stringify({ t:Date.now(), v })); }catch(e){} };
  const setNote = t => { document.getElementById('lastRefreshedNote').textContent = t; };
  const timeStr = ms => new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const loadingEl = document.getElementById('loadingMsg');

  function applyExtras(hist, holland, items){
    rateHistory = Array.isArray(hist) ? hist : [];
    const flowerItems = Array.isArray(items) ? items : [];
    const names = new Set(flowerItems.map(it => String(it.Flowers||'').trim().toLowerCase()).filter(Boolean));
    const hollandOnly = new Set((Array.isArray(holland) ? holland : []).map(h => String(h['Flower Name']||'').trim().toLowerCase()).filter(n => n && !names.has(n)));
    distinctCount = names.size + hollandOnly.size;
  }

  async function loadData(){
    const seq = ++loadSeq, branch = ui.branch;
    let cachedDash = readCache('dash:' + branch);
    const cachedExtra = readCache('extra');
    if(cachedDash){
      try{
        if(cachedExtra){ rateHistory = cachedExtra.v.rateHistory || []; transfers = cachedExtra.v.transfers || []; distinctCount = cachedExtra.v.count; }
        data = cachedDash.v; loadingEl.style.display = 'none'; render();
        setNote('Showing saved data from ' + timeStr(cachedDash.t) + ' · updating…');
      }catch(e){ cachedDash = null; data = null; }
    }
    if(!cachedDash){ loadingEl.style.display = ''; loadingEl.textContent = 'Loading…'; setNote(''); }

    const t = Date.now();
    const extras = Promise.all([
      fetch(API_URL + '?action=getRateChangeHistory&_ts=' + t).then(r=>r.json()).catch(()=>[]),
      fetch(API_URL + '?action=getHollandTracking&_ts=' + t).then(r=>r.json()).catch(()=>[]),
      fetch(API_URL + '?action=getFlowerItems&_ts=' + t).then(r=>r.json()).catch(()=>[]),
      fetch(API_URL + '?action=getTransferHistoryList&branch=All&_ts=' + t, { headers: { apikey: LB_CONFIG.SUPABASE_PUBLISHABLE_KEY } }).then(r=>r.json()).catch(()=>null)
    ]).then(([h, ho, it, tr])=>{
      if(seq !== loadSeq) return;
      applyExtras(h, ho, it);
      if(Array.isArray(tr)) transfers = tr;
      writeCache('extra', { rateHistory, transfers, count: distinctCount });
      if(data) render();
    });

    try{
      const dash = await fetch(
        API_URL + '?action=getFlowerDashboard&branch=' + encodeURIComponent(branch) +
          '&token=' + encodeURIComponent(window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || '') + '&_ts=' + t,
        { headers: { apikey: LB_CONFIG.SUPABASE_PUBLISHABLE_KEY } }
      ).then(r=>r.json());
      if(seq !== loadSeq) return;
      if(dash && dash.error) throw new Error(dash.error);
      data = dash; loadingEl.style.display = 'none'; render();
      writeCache('dash:' + branch, dash);
      setNote('Updated ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    }catch(e){
      if(seq !== loadSeq) return;
      console.error(e);
      if(cachedDash) setNote('Could not refresh — showing saved data from ' + timeStr(cachedDash.t) + '. Tap Refresh to try again.');
      else { loadingEl.style.display = ''; loadingEl.textContent = 'Could not load dashboard data.'; }
    }
    await extras;
  }

  /* ---------- controls ---------- */
  document.getElementById('branchTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    ui.branch = b.dataset.branch;
    document.querySelectorAll('#branchTabs button').forEach(x => x.classList.toggle('on', x === b));
    loadData();
  });
  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn'); btn.disabled = true; btn.textContent = 'Refreshing...';
    try{ await loadData(); } finally { btn.disabled = false; btn.textContent = '↻ Refresh'; }
  });
  document.getElementById('alTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return; ui.alTab = b.dataset.t; renderAlerts(); syncTabs();
  });
  document.getElementById('mvTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return; ui.mvTab = b.dataset.t; renderActivity(); syncTabs();
  });
  document.getElementById('stSearch').addEventListener('input', function(){ ui.q = this.value.trim().toLowerCase(); renderStock(); });
  document.getElementById('kpis').addEventListener('click', e=>{
    const k = e.target.closest('[data-goto]'); if(!k) return; ui.alTab = k.dataset.goto; renderAlerts(); syncTabs();
  });
  document.getElementById('approverName').addEventListener('input', function(){ ui.approver = this.value; });

  // approve / reject only QUEUE the decision; "Save All" sends everything and reloads once
  document.getElementById('alScroll').addEventListener('click', e=>{
    const btn = e.target.closest('[data-queue]'); if(!btn) return;
    const row = btn.dataset.row, act = btn.dataset.queue;
    if(ui.queue[row] === act) delete ui.queue[row]; else ui.queue[row] = act;
    keepScroll(['alScroll'], renderAlerts);
  });
  document.getElementById('saveAllBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('saveAllBtn'), rowsQ = Object.keys(ui.queue);
    if(!rowsQ.length) return;
    const approvedBy = document.getElementById('approverName').value.trim();
    if(!approvedBy){ alert('Please enter your name (Approved By) before saving.'); document.getElementById('approverName').focus(); return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    let failed = false;
    try{
      for(const row of rowsQ){
        const params = new URLSearchParams({ action: ui.queue[row], row, approvedBy });
        const result = await (await fetch(API_URL + '?' + params.toString())).json();
        if(result.error){ alert(row + ': ' + result.error); failed = true; }
      }
      ui.queue = {};
      await loadData();
    }catch(err){
      alert('Not everything was saved. Please check your connection and try again.');
      failed = true;
    }
    renderAlerts();
    if(failed) setNote('Some decisions were not saved — please check and try again.');
  });

  /* weekly budget */
  const overlay = document.getElementById('budgetOverlay');
  document.getElementById('gearBtn').addEventListener('click', ()=>{
    const bud = (data && data.topSummary && data.topSummary.weeklyBudget) ? data.topSummary.weeklyBudget : {};
    // single branch: pre-fill that branch's own limit; "All": leave blank so one branch's budget is never overwritten by the combined total
    if(ui.branch !== 'All') document.getElementById('budget' + ui.branch).value = bud.weeklyLimit || '';
    overlay.classList.add('show');
  });
  document.getElementById('closeBudgetBtn').addEventListener('click', ()=> overlay.classList.remove('show'));
  document.getElementById('saveBudgetBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('saveBudgetBtn'), branches = ['ModaMall','Hamala','Galali'];
    const toSave = branches.filter(b => document.getElementById('budget' + b).value !== '');
    if(!toSave.length){ alert('Enter an amount for at least one branch.'); return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    try{
      for(const b of toSave){
        const val = parseFloat(document.getElementById('budget' + b).value) || 0;
        const r = await (await fetch(API_URL + '?action=setWeeklyBudget&branch=' + b + '&value=' + val)).json();
        if(r && r.error) throw new Error(r.error);
      }
    }catch(e){ alert('Not saved. Please check your connection.'); }
    btn.disabled = false; btn.textContent = 'Save';
    overlay.classList.remove('show');
    branches.forEach(b => { document.getElementById('budget' + b).value = ''; });
    await loadData();
  });

  function syncTabs(){
    document.querySelectorAll('#alTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === ui.alTab));
    document.querySelectorAll('#mvTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === ui.mvTab));
  }

  /* ---------- rendering ---------- */
  function render(){
    if(!data) return;
    keepScroll(['stScroll','ovScroll','alScroll','mvScroll'], ()=>{ renderKpis(); renderStock(); renderOverview(); renderAlerts(); renderActivity(); syncTabs(); });
  }

  function kpi(ic, label, value, sub, accent, cls, goto){
    return `<div class="kpi glass ${cls||''} ${goto?'click':''}" style="--accent:${accent}" ${goto?`data-goto="${goto}"`:''}>
      <div class="k-ic">${ic}</div><div class="k-lb">${label}</div><div class="k-v">${value}</div><div class="k-s">${sub||''}</div></div>`;
  }
  function renderKpis(){
    const s = data.topSummary || {}, b = s.weeklyBudget || {}, aprN = (data.pendingApprovals || []).length, lowN = (data.lowStockList || []).length;
    const bCls = b.status === 'OVER BUDGET' ? 'danger' : (b.status === 'WARNING' ? 'warn' : '');
    document.getElementById('kpis').innerHTML =
      kpi('🌸','Available flowers', fmtNum(s.currentAvailableFlowers), ((distinctCount !== null || data.distinctFlowerCount != null) ? fmtNum(distinctCount !== null ? distinctCount : data.distinctFlowerCount) + ' flower names' : ''), 'var(--rose)') +
      kpi('📥','Received this week', fmtNum(s.newReceivedThisWeekQty), 'stems / pieces', 'var(--teal)') +
      kpi('🌹','Company value', fmtBD(s.companyInventoryValue), 'at legacy rate', 'var(--plum)') +
      kpi('🧾','Company-policy value', fmtBD(s.currentInventoryCost), 'supplier cost x3 x1.10', 'var(--sky)') +
      kpi('🛒',"Today's purchases", fmtBD(s.todayPurchases), 'incl. VAT', 'var(--amber)') +
      kpi('🔁',"Today's transfers", fmtNum(s.todaysTransfers), 'this week ' + fmtNum((data.quickStats || {}).transferredThisWeek), 'var(--gold)') +
      kpi('🌿','Weekly budget', (b.percentUsed || 0) + '%', esc(b.status || '') + ' · ' + fmtBD(b.remaining) + ' left', 'var(--ok)', bCls) +
      kpi('⚠️','Low stock / approvals', fmtNum(lowN) + ' / ' + fmtNum(aprN), 'tap to view', 'var(--bad)', (aprN > 0 || lowN > 0) ? 'warn' : '', aprN > 0 ? 'apr' : 'low');
  }

  function renderStock(){
    const all = data ? (data.itemStockLevels || []) : [];
    const list = ui.q ? all.filter(i => String(i.name||'').toLowerCase().includes(ui.q)) : all;
    document.getElementById('stCnt').textContent = ui.q ? list.length + ' / ' + all.length : String(all.length);
    document.getElementById('stScroll').innerHTML = rows(list, it => `<div class="row"><div class="nm">${esc(it.name)}</div>
      <div class="rt ${Number(it.stock) < 0 ? 'neg' : ''}">${fmtNum(it.stock)} ${esc(unitLabel(it.unit))}</div></div>`, ui.q ? 'No match.' : 'No stock data yet.');
  }

  function renderOverview(){
    const s = data.topSummary || {}, b = s.weeklyBudget || {}, q = data.quickStats || {}, la = data.lastActivity || {};
    const pct = Math.min(100, b.percentUsed || 0), over = (b.actual || 0) > (b.weeklyLimit || 0);
    const p = la.lastPurchase, c = la.lastStockCount, t = la.lastTransfer;
    let h = `<div class="wk"><div><div class="t"><span>${fmtBD(b.actual)} of ${fmtBD(b.weeklyLimit)}</span><span class="pill ${statusCls(b.status)}">${esc(b.status || '—')} · ${b.percentUsed || 0}%</span></div>
        <div class="bar ${over ? '' : 'ok'}"><i style="width:${pct}%"></i></div></div>
        <div class="t" style="margin:0"><span>Remaining</span><b>${fmtBD(b.remaining)}</b></div></div>
      <div class="sect">This week</div>
      <div class="kv"><span>Purchased</span><b>${fmtNum(q.purchasedThisWeek)}</b></div>
      <div class="kv"><span>Used</span><b>${fmtNum(q.usedThisWeek)}</b></div>
      <div class="kv"><span>Used cost</span><b>${fmtBD(q.usedCostThisWeek)}</b></div>
      <div class="kv"><span>Wasted</span><b>${fmtNum(q.wastedThisWeek)}</b></div>
      <div class="kv"><span>Wasted cost</span><b>${fmtBD(q.wastedCostThisWeek)}</b></div>
      <div class="kv"><span>Transfers</span><b>${fmtNum(q.transferredThisWeek)}</b></div>
      <div class="sect">Last activity</div>
      <div class="row"><div class="nm">Last purchase</div><div class="rt">${p ? esc(p.Flower) + ' · Qty ' + esc(p.Qty) + ' · ' + esc(p.Supplier || '—') + ' · ' + fmtDate(p.Date) : '<span style="color:var(--dim)">No purchases yet</span>'}</div></div>
      <div class="row"><div class="nm">Last stock count</div><div class="rt">${c ? esc(c.Branch) + ' · ' + fmtDate(c.Date) + ' · Count ' + fmtNum(c.TotalPhysicalCount) : '<span style="color:var(--dim)">No stock count yet</span>'}</div></div>
      <div class="row"><div class="nm">Last transfer</div><div class="rt">${t ? esc(t.Flower) + ' · ' + esc(t.Qty) + ' · ' + esc(t.From) + ' → ' + esc(t.To) + ' · ' + fmtDate(t.Date) : '<span style="color:var(--dim)">No transfers yet</span>'}</div></div>`;
    document.getElementById('ovScroll').innerHTML = h;
  }

  function renderAlerts(){
    const low = data.lowStockList || [], apr = data.pendingApprovals || [], qn = Object.keys(ui.queue).length;
    document.getElementById('alLowN').textContent = fmtNum(low.length);
    document.getElementById('alAprN').textContent = fmtNum(apr.length);
    const foot = document.getElementById('aprFoot');
    foot.style.display = (ui.alTab === 'apr' && apr.length) ? '' : 'none';
    const sb = document.getElementById('saveAllBtn');
    if(!sb.textContent.startsWith('Saving')){ sb.disabled = qn === 0; sb.textContent = '💾 Save All (' + qn + ')'; }
    const nameEl = document.getElementById('approverName'); if(nameEl.value !== ui.approver) nameEl.value = ui.approver;
    let h;
    if(ui.alTab === 'apr'){
      h = rows(apr, a => {
        const qd = ui.queue[a.Row], pctD = (Number(a.PercentDiff) || 0) * 100;
        return `<div class="apr"><div class="top"><div class="nm" style="font-weight:600">${esc(a.Flower)} <span class="sub2">(${esc(a.Origin || 'N/A')})</span><div class="sub2">${esc(a.ItemCode || '')} · ${esc(a.Unit || '')}</div></div>
          <span class="pill ${qd ? (qd === 'approveRate' ? 'ok' : 'bad') : 'warn'}">${qd === 'approveRate' ? 'Queued: Approve' : qd === 'rejectRate' ? 'Queued: Reject' : 'Pending'}</span></div>
          <div class="rates"><span>Current: ${fmtBD(a.CurrentRate)}</span><span style="color:var(--rose);font-weight:700">→ Suggested: ${fmtBD(a.SuggestedRate)}</span><span>(${pctD >= 0 ? '+' : ''}${pctD.toFixed(1)}%)</span></div>
          <div class="acts"><button class="btn sm ok ${qd === 'approveRate' ? 'on' : ''}" data-row="${esc(a.Row)}" data-queue="approveRate">✓ Approve</button>
          <button class="btn sm bad ${qd === 'rejectRate' ? 'on' : ''}" data-row="${esc(a.Row)}" data-queue="rejectRate">✕ Reject</button></div></div>`;
      }, 'No company rates waiting for approval.');
    } else {
      h = rows(low, r => `<div class="row"><div class="nm">${esc(r.Flower)}<div class="mt">${esc(r.Branch)}</div></div>
        <div class="rt">${fmtNum(r.AvailableQty)} / ${fmtNum(r.MinStock)}</div></div>`, 'Nothing below Min Stock right now.');
    }
    document.getElementById('alScroll').innerHTML = h;
  }

  function renderActivity(){
    let h;
    if(ui.mvTab === 'tr'){
      // Newest first. With one branch selected, show what that branch SENT and what it RECEIVED.
      const b = ui.branch;
      const list = (transfers || []).filter(t => b === 'All' || t['From Branch'] === b || t['To Branch'] === b)
        .slice().sort((x, y) => new Date(y.Date) - new Date(x.Date) || String(y['Transfer No.']).localeCompare(String(x['Transfer No.'])));
      h = rows(list, t => {
        const incoming = b !== 'All' && t['To Branch'] === b, outgoing = b !== 'All' && t['From Branch'] === b;
        const head = incoming ? `<span class="pill ok">⬇ Received from ${esc(t['From Branch'])}</span>`
          : outgoing ? `<span class="pill warn">⬆ Sent to ${esc(t['To Branch'])}</span>`
          : `<span class="pill ok">${esc(t['From Branch'])} → ${esc(t['To Branch'])}</span>`;
        return `<div class="row"><div class="nm">${esc(t.Flower)} · ${esc(fmtNum(t.Qty))} ${head}
          <div class="mt">${fmtDate(t.Date)} · ${esc(t['Transfer No.'] || '')} · by ${esc(t['Transferred By'] || '—')}${t.Remarks ? ' · ' + esc(t.Remarks) : ''}</div></div>
          <div class="rt">${incoming ? '+' : outgoing ? '−' : ''}${esc(fmtNum(t.Qty))}</div></div>`;
      }, 'No transfers yet.');
    } else if(ui.mvTab === 'hist'){
      h = rows(rateHistory, x => `<div class="row"><div class="nm">${esc(x.Flower)} <span class="mt">(${esc(x.Origin || 'N/A')})</span>
        <div class="mt">${fmtDate(x.Date)} · ${fmtBD(x.OldRate)} → ${fmtBD(x.NewRate)} · ni ${esc(x.ApprovedBy || '—')}</div></div>
        <div class="rt"><span class="pill ${x.Status === 'Approved' ? 'ok' : 'bad'}">${esc(x.Status)}</span></div></div>`, 'No processed rate changes yet.');
    } else if(ui.mvTab === 'br'){
      const bs = data.branchSummary || [], mx = Math.max(...bs.map(b => Number(b.inventoryValue)||0), 1);
      h = rows(bs, b => `<div style="padding:9px 2px;border-top:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(b.branch)}</b><span class="pill ${statusCls(b.status)}">${b.percentUsed}% · ${esc(b.status)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin:5px 0 4px"><span>${fmtNum(b.availableFlowers)} available</span><span>${fmtBD(b.inventoryValue)}</span></div>
        <div class="bar teal"><i style="width:${Math.max(0,Math.min(100,(Number(b.inventoryValue)||0)/mx*100))}%"></i></div>
        <div style="color:var(--dim);font-size:11px;margin-top:4px">Low stock ${fmtNum(b.lowStockItems)} · budget ${fmtBD(b.actualThisWeek)} of ${fmtBD(b.weeklyBudget)}</div></div>`, 'No branch data.');
    } else {
      h = rows(data.recentReceiving, e => `<div class="row"><div class="nm">${esc(e.Flower || '—')} <span class="mt">(${esc(e.Origin || 'N/A')})</span>
        <div class="mt">${fmtDate(e.Date)} · ${esc(e.Branch || '')} · Qty ${esc(e.Qty)} ${esc(e.Unit || '')}</div>
        <div class="mt">Supplier: ${esc(e.Supplier || '—')} · Received by: ${esc(e['Received By'] || '—')}</div></div>
        <div class="rt">${fmtBD(e.Subtotal)}</div></div>`, 'No flower receiving logged yet.');
    }
    document.getElementById('mvScroll').innerHTML = h;
  }

  loadData();
})();
</script>

<script>
(function(){
  const btn=document.getElementById('chocoNavToggle');
  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');
  if(!btn||!backdrop||!drawer) return;
  function openDrawer(){ drawer.classList.add('show'); backdrop.classList.add('show'); }
  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);
})();
</script>

<script src="joyboy-bubble.js"></script>
</body>
</html>
