<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flower Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0;
    --blush-2:#f6e0da;
    --mint:#eaf3ec;
    --rose:#c9506b;
    --rose-deep:#9e2f4a;
    --gold:#d9a441;
    --leaf:#5f8f63;
    --ink:#3a2530;
    --ink-dim:#8a7078;
    --line:#f0d9d9;
    --ok:#3d7a4f;
    --warn:#c68a1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 18%, rgba(255,190,210,.22), transparent 22%),
      radial-gradient(circle at 92% 28%, rgba(255,225,130,.20), transparent 22%),
      radial-gradient(circle at 18% 82%, rgba(190,145,255,.16), transparent 24%),
      radial-gradient(circle at 82% 88%, rgba(255,170,190,.18), transparent 24%),
      linear-gradient(145deg, #dcefd5 0%, #b9dfb5 48%, #e6f1c9 100%);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:26px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
  }
  .back-link:hover{ color:var(--rose-deep); }

  header{
    text-align:center; margin-bottom:22px; padding:24px 18px;
    background:linear-gradient(135deg, #fff 0%, var(--blush) 60%, var(--blush-2) 100%);
    border-radius:18px; border:1px solid var(--line);
    box-shadow:0 8px 26px rgba(158,47,74,0.08);
    position:relative; overflow:hidden;
  }
  header::before{
    content:'🌹'; position:absolute; font-size:64px; opacity:0.08;
    left:-12px; top:-16px; transform:rotate(-16deg);
  }
  header::after{
    content:'🌷'; position:absolute; font-size:56px; opacity:0.09;
    right:-8px; bottom:-14px; transform:rotate(14deg);
  }
  .eyebrow{
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold);
    margin-bottom:6px; font-weight:600; position:relative; z-index:1;
  }
  h1{
    font-family:'Great Vibes', cursive; font-weight:400; color:var(--rose-deep);
    font-size:clamp(2.1rem,8vw,2.8rem); margin:0; line-height:1;
    position:relative; z-index:1;
  }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px;
    margin-bottom:18px; background:#fff; padding:5px; border-radius:14px;
    border:1px solid var(--line);
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px;
    color:var(--ink-dim); cursor:pointer; border-radius:10px; transition:all .2s ease;
  }
  .branch-tab.active{
    background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff;
    box-shadow:0 3px 10px rgba(158,47,74,0.25);
  }

  .refresh-link{
    background:#fff; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:9px 16px; border-radius:20px; cursor:pointer; margin-bottom:14px;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-bottom:18px; box-shadow:0 4px 16px rgba(158,47,74,0.05);
  }
  .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  .gear-btn{
    margin-left:auto; background:none; border:1px solid var(--line); color:var(--ink-dim);
    width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .gear-btn:hover{ color:var(--rose-deep); border-color:var(--rose); }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(58,37,48,0.5);
    align-items:center; justify-content:center; z-index:80; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:16px; padding:24px; width:100%; max-width:360px; }
  .modal h3{ font-family:'Fraunces',serif; margin:0 0 16px; }
  .modal label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-dim); margin-bottom:5px; margin-top:12px; }
  .modal label:first-of-type{ margin-top:0; }
  .modal input{ width:100%; background:var(--blush); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--ink); outline:none; }
  .modal .submit-btn{ width:100%; margin-top:18px; padding:12px 0; background:linear-gradient(135deg, var(--rose), var(--rose-deep)); color:#fff; border:none; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; }
  .modal .modal-close{ width:100%; margin-top:8px; padding:10px 0; background:none; border:none; color:var(--ink-dim); font-size:12px; cursor:pointer; }

  .card.provisional{ border-color:var(--warn); background:linear-gradient(160deg,#fbf1de,#fff); }
  .provisional-note{
    font-size:11.5px; color:var(--warn); background:#fdf6e8; border:1px dashed var(--warn);
    border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.5;
  }

  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi-cell{
    background:var(--blush); border:1px solid var(--line); border-radius:12px;
    padding:12px; border-left:4px solid var(--rose);
  }
  .kpi-cell.leaf{ border-left-color:var(--leaf); }
  .kpi-cell.gold{ border-left-color:var(--gold); }
  .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-dim); }
  .kpi-value{ font-family:'Space Mono',monospace; font-weight:700; font-size:18px; margin-top:5px; }

  .budget-bar{ height:8px; background:var(--blush-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .budget-fill{ height:100%; background:var(--leaf); transition:width .3s ease; }
  .budget-fill.over{ background:var(--rose); }
  .budget-text{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:6px; }

  .hist-row{ border-top:1px solid var(--blush-2); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-name{ font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:16px 0; }

  /* ---------- Phase 2: Rate Approval / Branch Table / Low Stock ---------- */
  .card.warning{ border-color:#c0392b; background:linear-gradient(160deg,#fdecea,#fff); }
  .approval-row{
    border-top:1px solid #f4d5d1; padding:12px 0; font-size:12.5px;
  }
  .approval-row:first-child{ border-top:none; }
  .approval-flower{ font-weight:700; }
  .approval-badge{
    display:inline-block; font-size:9px; font-weight:800; letter-spacing:.04em;
    padding:2px 8px; border-radius:9px; margin-left:6px; text-transform:uppercase;
    background:#c0392b; color:#fff;
  }
  .approval-meta{ color:var(--ink-dim); font-size:11px; margin-top:3px; }
  .approval-rates{ display:flex; gap:14px; margin-top:5px; font-family:'Space Mono',monospace; font-size:11.5px; }
  .approval-rates .arrow-change{ color:var(--rose-deep); font-weight:700; }
  .approval-actions{ display:flex; gap:8px; margin-top:10px; }
  .approve-btn, .reject-btn{
    flex:1; padding:9px 0; border:none; border-radius:10px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .approve-btn{ background:linear-gradient(135deg, var(--leaf), #3f6b45); color:#fff; }
  .reject-btn{ background:#fff; border:1px solid #c0392b; color:#c0392b; }
  .approve-btn:disabled, .reject-btn:disabled{ opacity:0.5; pointer-events:none; }

  .mini-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .mini-table th{
    text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-dim); padding:0 6px 8px; font-weight:600;
  }
  .mini-table td{ padding:8px 6px; border-top:1px solid var(--blush-2); }
  .mini-table tr:first-child td{ border-top:none; }
  .status-pill{
    display:inline-block; font-size:9px; font-weight:800; padding:2px 8px;
    border-radius:9px; text-transform:uppercase;
  }
  .status-pill.ok{ background:var(--mint); color:var(--ok); }
  .status-pill.warning{ background:#fbf1de; color:var(--warn); }
  .status-pill.over{ background:#fdecea; color:#c0392b; }

  .lowstock-row{ border-top:1px solid var(--blush-2); padding:10px 0; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; }
  .lowstock-scroll{ max-height:280px; overflow-y:auto; }
  .lowstock-row:first-child{ border-top:none; }
  .lowstock-deficit{ color:#c0392b; font-family:'Space Mono',monospace; font-weight:700; font-size:11.5px; }

  .activity-block{ border-top:1px solid var(--blush-2); padding:10px 0; font-size:12px; }
  .activity-block:first-child{ border-top:none; }
  .activity-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); margin-bottom:3px; font-weight:700; }
  .loading{ text-align:center; padding:20px 0; color:var(--ink-dim); font-size:13px; }

  @media (min-width: 900px){
    .wrap{ max-width:1080px; padding:34px 30px 70px; }
    .branch-tabs{ max-width:480px; }
    .layout{ display:flex; gap:18px; align-items:flex-start; }
    .col-main{ flex:1.3; display:flex; flex-direction:column; gap:18px; }
    .col-side{ flex:1; display:flex; flex-direction:column; gap:18px; position:sticky; top:24px; }
  }


  /* Simple header refresh button - replaces the old floating balloon */
  .refresh-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); color:var(--rose-deep);
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:9px 16px; border-radius:20px; cursor:pointer; margin-bottom:14px;
  }
  .refresh-btn:hover{ border-color:var(--rose); }
  .refresh-btn.busy{ opacity:0.75; pointer-events:none; }
  .refresh-btn .icon{ display:inline-block; font-size:14px; }

  .dash-tools{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .dash-tool{background:#fff;border:1px solid var(--line);color:var(--ink-dim);font-size:11px;padding:8px 13px;border-radius:20px;cursor:pointer}
  .dash-tool:hover{color:var(--rose-deep);border-color:var(--rose)}
  .music-on{background:var(--blush);color:var(--rose-deep);border-color:var(--rose)}
  .music-panel{
    display:none; position:fixed; top:64px; right:16px; z-index:80;
    width:min(320px,calc(100vw - 32px)); background:#fff; border:1px solid var(--line);
    border-radius:16px; padding:16px; box-shadow:0 20px 50px rgba(90,40,55,.2);
  }
  .music-panel.show{ display:block; }
  .music-panel label{ display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .music-panel input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--blush); color:var(--ink); font-family:'Space Grotesk',sans-serif; font-size:12px; outline:none;
  }
  .music-panel .hint{ font-size:10px; color:var(--ink-dim); margin-top:8px; line-height:1.5; }
  .music-panel .apply-btn{
    margin-top:10px; width:100%; padding:9px 0; background:linear-gradient(135deg, var(--gold), #c8873a);
    color:#241608; border:none; border-radius:10px; font-weight:700; font-size:11px; cursor:pointer;
  }
  .music-now{ font-size:10px; color:var(--ink-dim); margin-top:10px; padding-top:10px; border-top:1px solid var(--blush-2); word-break:break-all; }


  .garden-side{
    position:fixed; z-index:1; pointer-events:none; opacity:.82;
    font-size:34px; line-height:1; filter:drop-shadow(0 4px 5px rgba(45,90,50,.12));
  }
  .garden-left{left:4px;top:18%}
  .garden-right{right:4px;bottom:16%}
  .garden-top{right:9%;top:7%;font-size:25px}
  .garden-side span{display:block;margin:10px 0}
  .garden-vine{
    position:fixed;z-index:1;pointer-events:none;color:rgba(45,110,55,.5);
    font-size:46px;line-height:.7;
  }
  .vine-left{left:-8px;bottom:4%}
  .vine-right{right:-8px;top:38%}
  @media(max-width:600px){
    .garden-side{font-size:24px;opacity:.55}
    .garden-left{left:-4px;top:22%}
    .garden-right{right:-4px;bottom:20%}
    .garden-top{right:7%;top:10%;font-size:20px}
    .garden-vine{font-size:32px;opacity:.35}
  }

</style>

<div class="wrap">
  <a class="back-link" href="flower-tools.html">&larr; Flower Tools</a>
  <a class="back-link" href="flower-receiving.html" style="float:right;">📦 Receiving &rarr;</a>

    <div class="eyebrow">Lalabella Flowers</div>
    <h1>Flower Dashboard</h1>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="All">All</button>
    <button class="branch-tab" data-branch="ModaMall">ModaMall</button>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzC-h3iV0AJU0A3mKhj_0V5-yOeLoJYlupFlPnKHelbyhcSiqUbK6LTjgo4qZF03Bs/exec';
  let currentBranch = 'All';
  let data = null;

  function fmtBD(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD'; }
  function fmtNum(n){ return Number(n||0).toLocaleString('en-US'); }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  function renderRecentReceiving(list){
    if(!list || list.length === 0){
      return '<div class="empty-note">No flower receiving logged yet.</div>';
    }
    return list.map(e => `
      <div class="hist-row">
        <div style="font-weight:600;">${e.Flower || '—'} <span style="color:var(--ink-dim); font-weight:400;">(${e.Origin || 'N/A'})</span></div>
        <div class="hist-meta" style="color:var(--ink-dim); font-size:11.5px; margin-top:3px;">${fmtDate(e.Date)} · ${e.Branch || ''} · Qty ${e.Qty} ${e.Unit || ''} · ${fmtBD(e.Subtotal)}</div>
        <div class="hist-meta" style="color:var(--ink-dim); font-size:11.5px;">Supplier: ${e.Supplier || '—'} · Received by: ${e['Received By'] || '—'}</div>

  function fmtDateShort(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  function statusClass(status){
    if(status === 'OVER BUDGET') return 'over';
    if(status === 'WARNING') return 'warning';
    return 'ok';
  }

  function renderRateHistory(list){
    return `
      <div class="card">
        <div class="card-title">📜 Rate Change History</div>
        ${(!list || list.length === 0) ? '<div class="empty-note">Wala pang naprosesong rate changes.</div>' : list.map(h => `
          <div class="hist-row">
            <div class="hist-name">${h.Flower} <span style="color:var(--ink-dim); font-weight:400;">(${h.Origin || 'N/A'})</span>
              <span class="status-pill ${h.Status === 'Approved' ? 'ok' : 'over'}" style="margin-left:6px;">${h.Status}</span>

            <div class="hist-meta">${fmtDateShort(h.Date)} · ${fmtBD(h.OldRate)} → ${fmtBD(h.NewRate)} · ni ${h.ApprovedBy || '—'}</div>

  function renderRateApprovals(list){

        <div class="card-title">⚠️ Company Rate Approval Required</div>

            <div class="approval-meta">${a.ItemCode || ''} · ${a.Unit || ''}</div>
            <div class="approval-rates">
              <span>Current: ${fmtBD(a.CurrentRate)}</span>
              <span class="arrow-change">→ Suggested: ${fmtBD(a.SuggestedRate)}</span>
              <span>(${a.PercentDiff >= 0 ? '+' : ''}${(a.PercentDiff*100).toFixed(1)}%)</span>
            </div>
            <div class="approval-actions">
              <button class="approve-btn" data-row="${a.Row}" data-action="approveRate">✓ Approve</button>
              <button class="reject-btn" data-row="${a.Row}" data-action="rejectRate">✕ Reject</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderTopSummary(s, budget){
    const pct = Math.min(100, budget.percentUsed || 0);
    const over = (budget.actual || 0) > (budget.weeklyLimit || 0);
    return `
      <div class="card">
        <div class="card-title">🌸 Current Available Flowers</div>
        <div class="kpi-grid">
          <div class="kpi-cell">
            <div class="kpi-label">Available (all flowers)</div>
            <div class="kpi-value">${fmtNum(s.currentAvailableFlowers)}</div>
          </div>
          <div class="kpi-cell leaf">
            <div class="kpi-label">New Received This Week</div>
            <div class="kpi-value">${fmtNum(s.newReceivedThisWeekQty)}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🌹 Company Inventory Value</div>
        <div class="kpi-grid">
          <div class="kpi-cell gold">
            <div class="kpi-label">Company Value (Legacy Rate)</div>
            <div class="kpi-value">${fmtBD(s.companyInventoryValue)}</div>
          </div>
          <div class="kpi-cell">
            <div class="kpi-label">Current Inventory Cost</div>
            <div class="kpi-value">${fmtBD(s.currentInventoryCost)}</div>
          </div>
        </div>
        <div class="budget-text" style="margin-top:10px;"><span>Standard ×3 Reference</span><b>${fmtBD(s.standardX3Reference)}</b></div>
      </div>

      <div class="card">
        <div class="card-title">📅 Today &amp; This Week</div>
        <div class="kpi-grid">
          <div class="kpi-cell">
            <div class="kpi-label">Today's Purchases</div>
            <div class="kpi-value">${fmtBD(s.todayPurchases)}</div>

          <div class="kpi-cell leaf">
            <div class="kpi-label">Today's Transfers</div>

      <div class="card">
        <div class="card-title">🌿 Weekly Budget <span class="status-pill ${statusClass(budget.status)}" style="margin-left:auto;">${budget.status}</span> <button class="gear-btn" id="gearBtn" title="Set weekly budget">⚙</button></div>
        <div class="budget-text"><span>${fmtBD(budget.actual)} of ${fmtBD(budget.weeklyLimit)}</span><span>${budget.percentUsed||0}%</span></div>
        <div class="budget-bar"><div class="budget-fill ${over?'over':''}" style="width:${pct}%"></div></div>
        <div class="budget-text"><span>Remaining</span><span>${fmtBD(budget.remaining)}</span></div>

  function renderQuickStats(q){
    return `
      <div class="card">
        <div class="card-title">📊 Quick Statistics</div>
        <div class="kpi-grid">
          <div class="kpi-cell">
            <div class="kpi-label">Purchased This Week</div>
            <div class="kpi-value">${fmtNum(q.purchasedThisWeek)}</div>
          </div>
          <div class="kpi-cell leaf">
            <div class="kpi-label">Used This Week</div>
            <div class="kpi-value">${fmtNum(q.usedThisWeek)}</div>
          </div>
          <div class="kpi-cell gold">
            <div class="kpi-label">Wasted This Week</div>
            <div class="kpi-value">${fmtNum(q.wastedThisWeek)}</div>
          </div>
          <div class="kpi-cell">
            <div class="kpi-label">Wasted Cost</div>
            <div class="kpi-value">${fmtBD(q.wastedCostThisWeek)}</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderLastActivity(a){
    const p = a.lastPurchase;
    const c = a.lastStockCount;
    return `
      <div class="card">
        <div class="card-title">🕓 Last Activity</div>
        <div class="activity-block">
          <div class="activity-label">Last Supplier Purchase</div>
          ${p ? `${p.Flower} · Qty ${p.Qty} · ${p.Supplier || '—'} · ${fmtDateShort(p.Date)}` : 'No purchases yet.'}
        </div>
        <div class="activity-block">
          <div class="activity-label">Last Stock Count</div>
          ${c ? `${c.Branch} · ${fmtDateShort(c.Date)} · Count ${fmtNum(c.TotalPhysicalCount)} · Value ${fmtBD(c.TotalCostLegacyRate)}` : 'No stock count yet.'}
        </div>
      </div>
    `;
  }

  function renderBranchSummary(list){
    return `
      <div class="card">
        <div class="card-title">🏬 Branch Summary</div>
        <table class="mini-table">
          <thead><tr><th>Branch</th><th>Avail.</th><th>Value</th><th>Low Stock</th><th>Budget</th></tr></thead>
          <tbody>
            ${list.map(b => `
              <tr>
                <td><b>${b.branch}</b></td>
                <td>${fmtNum(b.availableFlowers)}</td>
                <td>${fmtBD(b.inventoryValue)}</td>
                <td>${b.lowStockItems}</td>
                <td>${b.percentUsed}% <span class="status-pill ${statusClass(b.status)}">${b.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderLowStock(list){
    return `
      <div class="card">
        <div class="card-title">🚨 Low Stock Monitoring ${list.length ? '<span style="color:var(--ink-dim); font-weight:400; font-size:12px;">(' + list.length + ')</span>' : ''}</div>
        <div class="lowstock-scroll">
          ${list.length === 0 ? '<div class="empty-note">Nothing below Min Stock right now.</div>' : list.map(r => `
            <div class="lowstock-row">
              <div><b>${r.Flower}</b> <span style="color:var(--ink-dim);">· ${r.Branch}</span></div>
              <div class="lowstock-deficit">${r.AvailableQty} / ${r.MinStock}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function render(){
    if(!data) return;
    const el = document.getElementById('dashboardContent');
    const s = data.topSummary || {};
    const budget = s.weeklyBudget || {};
    const q = data.quickStats || {};

    el.innerHTML = `
      ${renderRateApprovals(data.pendingApprovals)}
      <div class="layout">
        <div class="col-main">
          ${renderTopSummary(s, budget)}
          ${renderQuickStats(q)}
        </div>
        <div class="col-side">
          ${renderLastActivity(data.lastActivity || {})}
          ${renderBranchSummary(data.branchSummary || [])}
          ${renderLowStock(data.lowStockList || [])}
          ${renderRateHistory(rateHistory)}
          <div class="card">
            <div class="card-title">🌸 Flower Catalog</div>
            <div class="kpi-cell">
              <div class="kpi-label">Distinct Flower Names</div>
              <div class="kpi-value">${fmtNum(data.distinctFlowerCount)}</div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">📋 Recent Receiving</div>
            <div id="recentReceivingList" style="max-height:280px; overflow-y:auto;">
              ${renderRecentReceiving(data.recentReceiving)}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  let rateHistory = [];

  async function loadData(){
    document.getElementById('dashboardContent').innerHTML = '<div class="loading">Loading…</div>';
    try{
      const t = Date.now();
      const [dashData, histData] = await Promise.all([
        fetch(API_URL + '?action=getFlowerDashboard&branch=' + currentBranch + '&_ts=' + t).then(r=>r.json()),
        fetch(API_URL + '?action=getRateChangeHistory&_ts=' + t).then(r=>r.json()).catch(()=>[])
      ]);
      data = dashData;
      rateHistory = histData;
      render();
    }catch(e){
      document.getElementById('dashboardContent').innerHTML = '<div class="loading">Could not load dashboard data.</div>';
      console.error(e);
    }
  }

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    loadData();
  });


  /* Manual refresh only — no automatic refresh, no drag/pull gesture */
  let refreshBusy = false;

  function playRefreshChime(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [659.25, 880.00];
      notes.forEach((freq, i)=>{
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        const start = ctx.currentTime + i * 0.08;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(0.05, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        o.connect(g).connect(ctx.destination);
        o.start(start); o.stop(start + 0.35);
      });
    }catch(_){}
  }

  async function manualRefresh(sourceBtn){
    if(refreshBusy) return;
    refreshBusy = true;
    sourceBtn.classList.add('busy');
    playRefreshChime();

    const iconEl = sourceBtn.querySelector('.icon');
    const bloomFrames = ['🌼','🌸','🌺','🌷'];
    let frameIdx = 0;
    const bloomTimer = setInterval(()=>{
      frameIdx = (frameIdx + 1) % bloomFrames.length;
      iconEl.textContent = bloomFrames[frameIdx];
    }, 220);

    try { await loadData(); }
    finally {
      clearInterval(bloomTimer);
      iconEl.textContent = '🌼';
      sourceBtn.classList.remove('busy');
      refreshBusy = false;
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', ()=>{
    manualRefresh(document.getElementById('refreshBtn'));
  });

  /* Music panel:
     - Tap Music -> show URL box
     - Play Music -> hide panel and show Playing
     - Tap Playing -> pause
     - Double-click Playing -> reopen URL editor
     Shares the exact same implementation and localStorage keys as
     index.html, so a sound chosen there also plays here. */
  const audio = document.getElementById('audioPlayer');
  const soundBtn = document.getElementById('soundBtn');
  const musicPanel = document.getElementById('musicPanel');
  let isPlaying = false;
  let ytVideoId = null;

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function playYouTube(id){
    document.getElementById('ytPlayerWrap').innerHTML =
      `<iframe width="200" height="150" src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
  }
  function stopYouTube(){ document.getElementById('ytPlayerWrap').innerHTML = ''; }

  function saveSoundChoice(url, isYouTube){
    try{
      localStorage.setItem('lalabellaSoundUrl', url);
      localStorage.setItem('lalabellaSoundIsYouTube', isYouTube ? '1' : '0');
    }catch(e){}
  }

  function loadSavedSound(){
    try{
      const savedUrl = localStorage.getItem('lalabellaSoundUrl');
      const savedIsYT = localStorage.getItem('lalabellaSoundIsYouTube') === '1';
      if(!savedUrl) return;
      if(savedIsYT){
        ytVideoId = extractYouTubeId(savedUrl);
        document.getElementById('musicNow').textContent = 'Saved: YouTube track (tap ♫ to play)';
      } else {
        audio.src = savedUrl;
        document.getElementById('musicNow').textContent = 'Saved: ' + (savedUrl.length > 46 ? savedUrl.slice(0,46) + '…' : savedUrl);
      }
      document.getElementById('musicUrlInput').value = savedUrl;
      soundBtn.textContent = '♫ Music';
      isPlaying = false;
    }catch(e){}
  }
  loadSavedSound();

  soundBtn.addEventListener('click', ()=>{
    if(!audio.src && !ytVideoId){
      musicPanel.classList.toggle('show');
      return;
    }
    if(isPlaying){
      if(ytVideoId) stopYouTube(); else audio.pause();
      soundBtn.textContent = '♫ Music';
      isPlaying = false;
    } else {
      if(ytVideoId) playYouTube(ytVideoId); else audio.play().catch(()=>{});
      soundBtn.textContent = '♫ Playing';
      isPlaying = true;
    }
  });

  soundBtn.addEventListener('contextmenu', (e)=>{
    e.preventDefault();
    musicPanel.classList.toggle('show');
  });

  document.getElementById('musicApplyBtn').addEventListener('click', ()=>{
    const url = document.getElementById('musicUrlInput').value.trim();
    if(!url){ alert('Paste a sound URL first.'); return; }

    const id = extractYouTubeId(url);
    if(id){
      ytVideoId = id;
      audio.pause(); audio.removeAttribute('src');
      playYouTube(id);
      document.getElementById('musicNow').textContent = 'Now playing YouTube track';
      isPlaying = true;
      soundBtn.textContent = '♫ Playing';
      musicPanel.classList.remove('show');
      saveSoundChoice(url, true);
      return;
    }

    ytVideoId = null;
    stopYouTube();
    audio.src = url;
    document.getElementById('musicNow').textContent = 'Now loaded: ' + (url.length > 46 ? url.slice(0,46) + '…' : url);
    saveSoundChoice(url, false);
    audio.play().then(()=>{
      isPlaying = true;
      soundBtn.textContent = '♫ Playing';
      musicPanel.classList.remove('show');
    }).catch(()=>{
      soundBtn.textContent = '♫ Tap to Play';
    });
  });

  document.addEventListener('click', (e)=>{
    if(musicPanel.classList.contains('show') && !musicPanel.contains(e.target) && e.target !== soundBtn){
      musicPanel.classList.remove('show');
    }
  });

  /* Weekly Budget edit modal — gear button lives inside the re-rendered
     card, so we use event delegation on the document instead of binding
     directly (a direct bind would be lost every time render() runs). */
  const budgetModalOverlay = document.getElementById('budgetModalOverlay');

  document.addEventListener('click', (e)=>{
    if(e.target.closest('#gearBtn')){
      const bud = (data && data.weeklyBudget) ? data.weeklyBudget : {};
      // Pre-fill with the CURRENTLY selected branch's own value when a
      // single branch is active; when viewing "All", the three fields
      // stay blank so you don't accidentally overwrite one branch's
      // budget with the combined "All" total.
      if(currentBranch !== 'All'){
        document.getElementById('budget' + currentBranch).value = bud.weeklyLimit || '';
      }
      budgetModalOverlay.classList.add('show');
    }
  });

  /* Approve/Reject rate — same event-delegation approach as the gear
     button, since these buttons live inside the re-rendered Rate
     Approval card. */
  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('.approve-btn, .reject-btn');
    if(!btn) return;

    const row = btn.dataset.row;
    const actionName = btn.dataset.action;
    const label = actionName === 'approveRate' ? 'aprubahan' : 'i-reject';
    if(!confirm('Sigurado ka bang gusto mong ' + label + ' ang rate na ito?')) return;

    const approvedBy = prompt('Pangalan mo (para sa record):') || '';

    const rowEl = btn.closest('.approval-row');
    rowEl.querySelectorAll('button').forEach(b => b.disabled = true);

    try{
      const params = new URLSearchParams({ action: actionName, row: row, approvedBy: approvedBy });
      const res = await fetch(API_URL + '?' + params.toString());
      const result = await res.json();
      if(result.error){
        alert(result.error);
        rowEl.querySelectorAll('button').forEach(b => b.disabled = false);
      } else {
        await loadData();
      }
    }catch(err){
      alert('Hindi na-save. I-check ang connection mo.');
      rowEl.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  });

  document.getElementById('closeBudgetModalBtn').addEventListener('click', ()=>{
    budgetModalOverlay.classList.remove('show');
  });

  document.getElementById('saveBudgetBtn').addEventListener('click', async ()=>{
    const saveBtn = document.getElementById('saveBudgetBtn');
    const branches = ['ModaMall', 'Hamala', 'Galali'];
    const toSave = branches.filter(b => document.getElementById('budget' + b).value !== '');

    if(toSave.length === 0){
      alert('Maglagay ng halaga sa kahit isang branch.');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    try{
      for(const b of toSave){
        const val = parseFloat(document.getElementById('budget' + b).value) || 0;
        await fetch(API_URL + '?action=setWeeklyBudget&branch=' + b + '&value=' + val);
      }
    }catch(e){
      alert('Hindi na-save. I-check ang connection mo.');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
    budgetModalOverlay.classList.remove('show');
    document.getElementById('budgetModaMall').value = '';
    document.getElementById('budgetHamala').value = '';
    document.getElementById('budgetGalali').value = '';
    await loadData();
  });

  loadData();
</script>
<script>
(function(){

  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');

  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);

  // Smart Home — goes to the Flower hub from a flower page, or the
  // Chocolate hub from a chocolate page.

    const isFlowerPage = 'flower' === 'flower';

  }
})();

// ---------- Shared music player (same saved sound as the rest of
// Lalabella on THIS device — set it once anywhere, it follows you
// across every page on this same browser/phone). ----------
(function(){
  const audio = document.getElementById('chocoAudioPlayer');
  const musicBtn = document.getElementById('chocoMusicToggleBtn');
  const urlInput = document.getElementById('chocoMusicUrlInput');
  const nowText = document.getElementById('chocoMusicNow');
  const searchInput = document.getElementById('chocoMusicSearchInput');
  const searchBtn = document.getElementById('chocoMusicSearchBtn');
  if(!audio || !musicBtn) return;
  let isPlaying = false;
  let ytVideoId = null;

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    return null;
  }
  function playYouTube(id){
    document.getElementById('chocoYtPlayerWrap').innerHTML =
      `<iframe width="200" height="150" src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
  }
  function stopYouTube(){ document.getElementById('chocoYtPlayerWrap').innerHTML = ''; }

  function saveSoundChoice(url, isYouTube){
    try{
      localStorage.setItem('lalabellaSoundUrl', url);
      localStorage.setItem('lalabellaSoundIsYouTube', isYouTube ? '1' : '0');
    }catch(e){}
  }

  function loadSavedSound(){
    try{
      const savedUrl = localStorage.getItem('lalabellaSoundUrl');
      const savedIsYT = localStorage.getItem('lalabellaSoundIsYouTube') === '1';
      if(!savedUrl) return;
      urlInput.value = savedUrl;
      if(savedIsYT){
        ytVideoId = extractYouTubeId(savedUrl);
        nowText.textContent = 'Saved: YouTube track';
        playYouTube(ytVideoId);
        isPlaying = true;
      } else {
        audio.src = savedUrl;
        nowText.textContent = 'Saved: ' + (savedUrl.length > 40 ? savedUrl.slice(0,40) + '…' : savedUrl);
        audio.play().then(()=>{ isPlaying = true; musicBtn.textContent = '♫ Playing'; })
          .catch(()=>{ musicBtn.textContent = '♫ Tap to Play'; });
      }
      if(isPlaying) musicBtn.textContent = '♫ Playing';
    }catch(e){}
  }
  loadSavedSound();

  function applyUrl(url){
    const id = extractYouTubeId(url);
    if(id){
      ytVideoId = id; audio.pause(); audio.removeAttribute('src');
      playYouTube(id);
      nowText.textContent = 'Now playing YouTube track';
      isPlaying = true; musicBtn.textContent = '♫ Playing';
      saveSoundChoice(url, true);
    } else {
      ytVideoId = null; stopYouTube();
      audio.src = url;
      nowText.textContent = 'Now loaded: ' + (url.length > 40 ? url.slice(0,40) + '…' : url);
      saveSoundChoice(url, false);
      audio.play().then(()=>{ isPlaying = true; musicBtn.textContent = '♫ Playing'; })
        .catch(()=>{ musicBtn.textContent = '♫ Tap to Play'; });
    }
  }

  musicBtn.addEventListener('click', ()=>{
    const url = urlInput.value.trim();
    if(url && url !== localStorage.getItem('lalabellaSoundUrl')){
      applyUrl(url);
      return;
    }
    // No new URL typed — just toggle play/pause of whatever's loaded.
    if(!audio.src && !ytVideoId) return;
    if(isPlaying){
      if(ytVideoId) stopYouTube(); else audio.pause();
      musicBtn.textContent = '♫ Music'; isPlaying = false;
    } else {
      if(ytVideoId) playYouTube(ytVideoId); else audio.play().catch(()=>{});
      musicBtn.textContent = '♫ Playing'; isPlaying = true;
    }
  });

  // "Search" doesn't auto-pick a video (no API key set up) — it opens
  // YouTube's own search in a new tab so you can pick the exact one,
  // then paste that video's link back into the URL box above.
  if(searchBtn && searchInput){
    searchBtn.addEventListener('click', ()=>{
      const q = searchInput.value.trim();
      if(!q) return;
      window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(q), '_blank');
    });
    searchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') searchBtn.click(); });
  }
})();
</script>

</body>
</html>
