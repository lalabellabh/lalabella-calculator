<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella Item Inventory</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:#0b0c10;color:#f5efe7;font:14px system-ui;padding:24px}main{max-width:1000px;margin:auto}.card{background:#151820;border:1px solid #303542;border-radius:16px;padding:18px;margin:12px 0}button,select,input{padding:10px;border-radius:9px;border:1px solid #303542;background:#0b0c10;color:#fff}button{cursor:pointer;font-weight:700}.active,.primary{background:#a93652}.tabs{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;color:#aaa;font-size:12px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #292d36}.muted{color:#aaa;font-size:12px}.msg{padding:10px;margin-top:10px;border-radius:8px;background:#17351f}.bad{background:#461c22}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}}</style></head><body><main><div class="card"><div class="muted">LALABELLA SYSTEM • SUPABASE</div><h1>📦 Item Inventory</h1><div id="who" class="muted">Checking session…</div></div><div class="card"><div id="branches"></div></div><div class="tabs"><button class="active" data-p="stock">Stock</button><button data-p="receive">Receive</button><button data-p="release">Release</button><button data-p="transfer">Transfer</button><button data-p="count">Count</button></div><section id="stock"><div class="card"><input id="search" placeholder="Search item…"><div id="list"></div></div></section><section id="receive" hidden><div class="grid"><div class="card"><h2>Receive</h2><div class="fields"><label>Item<select id="ri"></select></label><label>Qty<input id="rq" type="number" min=".01" step=".01"></label></div><button class="primary" id="rb">Save</button><div id="rm"></div></div><div class="card"><h2>Recent</h2><div id="rh"></div></div></div></section><section id="release" hidden><div class="grid"><div class="card"><h2>Release</h2><div class="fields"><label>Item<select id="xi"></select></label><label>Qty<input id="xq" type="number" min=".01" step=".01"></label></div><label>Reason<input id="xr" placeholder="Event / damage / use"></label><button class="primary" id="xb">Save</button><div id="xm"></div></div><div class="card"><h2>Recent</h2><div id="xh"></div></div></div></section><section id="transfer" hidden><div class="grid"><div class="card"><h2>Transfer</h2><div class="fields"><label>Item<select id="ti"></select></label><label>Qty<input id="tq" type="number" min=".01" step=".01"></label><label>Destination<select id="tb"></select></label></div><button class="primary" id="tt">Transfer</button><div id="tm"></div></div><div class="card"><h2>Recent</h2><div id="th"></div></div></div></section><section id="count" hidden><div class="grid"><div class="card"><h2>Physical Count</h2><div class="fields"><label>Item<select id="ci"></select></label><label>Counted Qty<input id="cq" type="number" min="0" step=".01"></label></div><button class="primary" id="cb">Save Count</button><div id="cm"></div></div><div class="card"><h2>Recent</h2><div id="ch"></div></div></div></section><div class="card"><button id="out">Sign out</button></div></main><script>let u,p,branch,branches=[],items=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function say(id,s,b=true){$(id).textContent=s;$(id).className='msg'+(b?'':' bad')}async function boot(){u=await sbAuth.getUser();if(!u)return location='login.html';p=await sbAuth.getProfile();if(!p)return location='login.html';$('who').textContent=`${p.full_name||u.email} • ${p.role} • ${p.branch||'No branch assigned'}`;let r=await sb.from('branch_config').select('id,name').order('name');if(r.error)throw r.error;branches=r.data||[];branch=p.branch||branches[0]?.name||'';drawBranches();await load()}function drawBranches(){$('branches').innerHTML=branches.map(b=>`<button class="${b.name===branch?'active':''}" data-b="${esc(b.name)}">${esc(b.name)}</button>`).join('');document.querySelectorAll('#branches button').forEach(b=>b.onclick=async()=>{if(p.role==='Admin'||p.role==='Manager'){branch=b.dataset.b;drawBranches();await load()}})}async function load(){let q=sb.from('item_inventory').select('*').eq('branch',branch).order('item_name');let r=await q;if(r.error)throw r.error;items=r.data||[];draw();['ri','xi','ti','ci'].forEach(id=>$(id).innerHTML=items.map(x=>`<option value="${x.id}">${esc(x.item_name)} (${Number(x.qty||0).toFixed(2)} ${esc(x.unit||'')})</option>`).join(''));$('tb').innerHTML=branches.filter(b=>b.name!==branch).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('')}function draw(){let s=$('search').value.toLowerCase();$('list').innerHTML=items.filter(x=>`${x.item_name} ${x.item_code} ${x.category}`.toLowerCase().includes(s)).map(x=>`<div class="row"><span><b>${esc(x.item_name)}</b><br><span class="muted">${esc(x.item_code||'')} • ${esc(x.category||'')}</span></span><b>${Number(x.qty||0).toFixed(2)} ${esc(x.unit||'')}</b></div>`).join('')||'<span class="muted">No items.</span>'}async function rpc(fn,args,id){try{let r=await sb.rpc(fn,args);if(r.error)throw r.error;say(id,'Saved successfully.');await load();await history()}catch(e){say(id,e.message||String(e),false)}}$('rb').onclick=()=>rpc('record_item_receiving',{p_item_id:+$('ri').value,p_qty:+$('rq').value,p_received_by:p.full_name},'rm');$('xb').onclick=()=>rpc('record_item_release',{p_item_id:+$('xi').value,p_qty:+$('xq').value,p_reason_event:$('xr').value,p_released_by:p.full_name},'xm');$('tt').onclick=()=>rpc('record_item_transfer',{p_item_id:+$('ti').value,p_qty:+$('tq').value,p_to_branch:$('tb').value,p_transferred_by:p.full_name},'tm');$('cb').onclick=()=>rpc('record_item_count',{p_item_id:+$('ci').value,p_counted_qty:+$('cq').value,p_counted_by:p.full_name},'cm');async function history(){for(let [t,id,stamp] of [['item_receiving_history','rh','received_at'],['item_release_history','xh','released_at'],['item_transfer_history','th','transferred_at'],['item_count_history','ch','counted_at']]){let r=await sb.from(t).select('*').eq('branch',branch).order(stamp,{ascending:false}).limit(15);$(id).innerHTML=(r.data||[]).map(x=>`<div class="row"><span>${esc(x.item_name)}</span><span>${Number(x.qty_received??x.qty_released??x.qty??x.counted_qty??0).toFixed(2)}</span></div>`).join('')||'<span class="muted">No history.</span>'}}$('search').oninput=draw;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(x=>x.hidden=true);$(b.dataset.p).hidden=false});$('out').onclick=async()=>{await sbAuth.signOut();location='login.html'};boot().catch(e=>say('who',e.message||String(e),false))</script></body></html>
