name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing secret KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5 || true

      - name: Copy to downloads/
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/Lalabella.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lalabella-apk
          path: downloads/Lalabella.apk

      - name: Commit APK to the site
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/Lalabella.apk
          git diff --cached --quiet || (git commit -m "Update Lalabella.apk (widget build)" && git push)
