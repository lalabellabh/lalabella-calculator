name: One-shot cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add cache-busting version to Chocolate Calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chocolate-calc.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="auth-guard.js"></script>'
          new = '<script src="auth-guard.js?v=4"></script>'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Updated chocolate-calc.html')
          elif new in s:
              print('Already cache-busted')
          else:
              raise SystemExit('auth-guard script tag not found')
          PY

      - name: Commit and push, then remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chocolate-calc.html
          git rm .github/workflows/one-shot-cache-bust.yml
          git commit -m "Cache-bust auth guard on chocolate calculator"
          git push

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/${{ github.repository }}/pages/builds
