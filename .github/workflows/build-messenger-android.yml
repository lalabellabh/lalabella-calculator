name: Build Messenger Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-messenger/**'
      - '.github/workflows/build-messenger-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing secret KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: android-messenger
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check signature
        run: |
          APK=android-messenger/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -5 || true

      - name: Copy to downloads/
        run: |
          mkdir -p downloads
          cp android-messenger/app/build/outputs/apk/release/app-release.apk downloads/LalabellaMessenger.apk

      - name: Write version info (the app and the website use it to announce updates)
        run: |
          VC=$(grep -oE "versionCode +[0-9]+" android-messenger/app/build.gradle | grep -oE "[0-9]+" | head -1)
          VN=$(grep -oE "def appVer = '[^']+'" android-messenger/app/build.gradle | grep -oE "[0-9]+(\.[0-9]+)+" | head -1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then echo "Could not read the version"; exit 1; fi
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$VC" "$VN" > downloads/messenger-app-version.json
          cat downloads/messenger-app-version.json

      - uses: actions/upload-artifact@v4
        with:
          name: LalabellaMessenger-apk
          path: downloads/LalabellaMessenger.apk

      - name: Commit APK to the site
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/LalabellaMessenger.apk downloads/messenger-app-version.json
          git diff --cached --quiet && exit 0
          git commit -m "Update LalabellaMessenger.apk"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
