<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lalabella Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f9dfe0; --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9; --green:#3d9a5f; --paper:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:linear-gradient(160deg,var(--blush) 0%,var(--blush-2) 100%); color:var(--ink); font-family:'Space Grotesk',sans-serif; }

  .page{ max-width:1180px; margin:0 auto; padding:16px 14px 18px; height:100dvh; display:flex; flex-direction:column; }
  .topline{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; padding-left:52px; }
  .back-link{ color:var(--ink-dim); text-decoration:none; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .back-link:hover{ color:var(--rose-deep); }

  /* music (kept from the old chat) */
  .music-bar{ display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:30px; padding:5px 10px 5px 5px; max-width:330px; min-width:0; }
  .music-toggle-btn{ width:28px; height:28px; border-radius:50%; border:none; cursor:pointer; background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#fff; font-size:11px; flex-shrink:0; }
  .music-info{ flex:1; min-width:0; }
  .music-title{ font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-sub{ font-size:9.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-url-toggle{ background:none; border:none; color:var(--rose-deep); font-size:10.5px; cursor:pointer; text-decoration:underline; flex-shrink:0; }
  .music-url-panel{ display:none; position:absolute; right:14px; top:58px; z-index:50; width:min(340px,92vw); background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:0 14px 34px rgba(158,47,74,.18); }
  .music-url-panel.show{ display:block; }
  .music-url-panel label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--rose-deep); display:block; margin-bottom:6px; }
  .music-url-panel input{ width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:12.5px; outline:none; background:var(--blush); }
  .music-url-panel .hint{ font-size:10px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  .music-url-panel .apply-btn{ margin-top:10px; width:100%; padding:9px 0; background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:11.5px; cursor:pointer; }

  .layout{ flex:1; min-height:0; display:flex; gap:16px; }

  /* ---- team sidebar ---- */
  .team{ display:none; width:270px; flex-shrink:0; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(158,47,74,.08); flex-direction:column; overflow:hidden; }
  .team-head{ padding:16px 18px 10px; border-bottom:1px solid var(--line); }
  .team-head h2{ font-family:'Fraunces',serif; font-size:17px; margin:0; }
  .team-head .count{ font-size:11px; color:var(--green); font-weight:600; margin-top:2px; }
  .team-list{ flex:1; overflow-y:auto; padding:8px; }
  .person{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; }
  .person:hover{ background:var(--blush); }
  .person .pname{ font-size:13px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .person .psub{ font-size:10.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-sep{ font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); padding:10px 10px 4px; }

  /* ---- avatar ---- */
  .av{ position:relative; width:36px; height:36px; flex-shrink:0; border-radius:50%; background:linear-gradient(135deg,#f3b0bf,var(--rose)); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; overflow:visible; }
  .av img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .av.sm{ width:30px; height:30px; font-size:11px; }
  .av .dot{ position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; background:#c9bfc2; border:2px solid #fff; }
  .av .dot.on{ background:var(--green); }

  /* ---- chat panel ---- */
  .chat-panel{ flex:1; min-width:0; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(158,47,74,.08); display:flex; flex-direction:column; overflow:hidden; }
  .chat-head{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#fff,#fdf6f6); }
  .chat-head h1{ font-family:'Fraunces',serif; font-size:19px; margin:0; }
  .chat-status{ font-size:10px; letter-spacing:.08em; margin-top:2px; }
  .chat-status.online{ color:var(--green); } .chat-status.offline{ color:var(--rose-deep); }
  .online-strip{ display:flex; gap:6px; margin-left:auto; align-items:center; overflow:hidden; }
  .online-strip .more{ font-size:11px; color:var(--ink-dim); margin-left:2px; }

  .chat-messages{ flex:1; overflow-y:auto; padding:16px 16px 8px; scroll-behavior:auto; }
  .day-sep{ text-align:center; margin:14px 0 10px; }
  .day-sep span{ font-size:10.5px; color:var(--ink-dim); background:var(--blush); border-radius:20px; padding:4px 12px; }
  .msg{ display:flex; gap:8px; align-items:flex-end; margin-top:10px; }
  .msg.cont{ margin-top:3px; }
  .msg.me{ flex-direction:row-reverse; }
  .msg .av-slot{ width:30px; flex-shrink:0; }
  .msg.me .av-slot{ display:none; }
  .msg .body{ max-width:min(72%,520px); display:flex; flex-direction:column; }
  .msg.me .body{ align-items:flex-end; }
  .msg .who{ font-size:11px; font-weight:600; color:var(--rose-deep); margin:0 0 3px 4px; }
  .msg .who small{ font-weight:400; color:var(--ink-dim); margin-left:4px; }
  .bubble-row{ display:flex; align-items:center; gap:6px; }
  .msg.me .bubble-row{ flex-direction:row-reverse; }
  .bubble{ padding:9px 13px; border-radius:16px 16px 16px 5px; background:var(--blush); font-size:13.5px; line-height:1.5; word-break:break-word; white-space:pre-wrap; }
  .msg.me .bubble{ background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#fff; border-radius:16px 16px 5px 16px; }
  .bubble .t{ display:block; font-size:9.5px; opacity:.6; margin-top:3px; text-align:right; }
  .del-btn{ opacity:0; border:none; background:#fff; border:1px solid var(--line); color:#b23a3a; border-radius:50%; width:26px; height:26px; font-size:12px; cursor:pointer; flex-shrink:0; transition:opacity .15s; }
  .msg:hover .del-btn, .msg.show-del .del-btn{ opacity:1; }
  .empty-chat{ text-align:center; color:var(--ink-dim); font-size:13px; padding:40px 10px; }

  .chat-form{ display:flex; gap:8px; align-items:flex-end; padding:12px; border-top:1px solid var(--line); background:#fff; }
  .chat-form textarea{ flex:1; min-width:0; resize:none; max-height:120px; padding:11px 14px; border-radius:16px; border:1px solid var(--line); outline:none; background:var(--blush); color:var(--ink); font-family:inherit; font-size:13.5px; line-height:1.4; }
  .chat-form textarea:focus{ border-color:var(--rose); }
  .chat-form button{ width:46px; height:44px; border:none; border-radius:14px; cursor:pointer; background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#fff; font-size:17px; }
  .chat-form button:disabled{ opacity:.6; }

  @media (min-width:900px){
    .team{ display:flex; }
    .online-strip{ display:none; }
  }
  @media (max-width:560px){
    .page{ padding:12px 10px 10px; }
    .music-bar .music-info{ display:none; }
    .msg .body{ max-width:82%; }
  }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>

<div class="page">
  <div class="topline">
    <a class="back-link" href="index.html">&larr; Back to Tools</a>
    <div class="music-bar">
      <button class="music-toggle-btn" id="musicToggleBtn">▶</button>
      <div class="music-info">
        <div class="music-title" id="musicTitle">No sound source set</div>
        <div class="music-sub" id="musicSub">Tap "Set Sound" to add one</div>
      </div>
      <button class="music-url-toggle" id="musicUrlToggleBtn">Set Sound</button>
    </div>
  </div>

  <div class="music-url-panel" id="musicUrlPanel">
    <label>Sound URL — YouTube link or direct mp3</label>
    <input type="text" id="musicUrlInput" placeholder="Paste a YouTube link or an mp3 URL" />
    <div class="hint">Paste a YouTube video link (easiest), or a direct mp3 link you own the rights to. On phones, sound needs a tap to start — that's a browser rule, not a bug.</div>
    <button class="apply-btn" id="musicUrlApplyBtn">Play This Sound</button>
    <div class="music-now" id="musicNow" style="font-size:10px; color:var(--ink-dim); margin-top:8px;"></div>
  </div>
  <audio id="audioPlayer" loop></audio>
  <div id="ytPlayerWrap" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;"></div>

  <div class="layout">
    <aside class="team">
      <div class="team-head">
        <h2>👥 Team</h2>
        <div class="count" id="onlineCount">—</div>
      </div>
      <div class="team-list" id="teamList"></div>
    </aside>

    <div class="chat-panel">
      <div class="chat-head">
        <span style="font-size:22px;">🌹</span>
        <div>
          <h1>Lalabella Chat</h1>
          <div class="chat-status offline" id="chatStatus">CONNECTING…</div>
        </div>
        <div class="online-strip" id="onlineStrip" title="Online now"></div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" id="chatForm">
        <textarea id="chatInput" rows="1" maxlength="1000" placeholder="Write a message…" title="Enter to send · Shift+Enter for a new line"></textarea>
        <button type="submit" aria-label="Send">➤</button>
      </form>
    </div>
  </div>
</div>

<script>
// Staff chat — stored in our own database (Supabase, via the Auth backend).
// No Firebase. Shows each person's profile photo and who is online.
(function(){
  const API = LB_CONFIG.AUTH_API;
  const POLL_MS = 4000, PEOPLE_MS = 60000;
  const status = document.getElementById('chatStatus');
  const box = document.getElementById('chatMessages');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('chatInput');
  let me = '', isAdmin = false, lastId = 0, delSince = '', busy = false, firstLoad = true;
  let people = {};                 // username -> {name, avatar, online, position}
  let lastMsg = null;              // for grouping
  const nodes = {};                // id -> element

  function token(){ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }
  async function call(params){
    const p = new URLSearchParams(Object.assign({}, params, { token: token(), _ts: Date.now() }));
    const res = await fetch(API + '?' + p.toString());
    return res.json();
  }
  function setStatus(online, text){
    status.textContent = text || (online ? '● ONLINE' : 'OFFLINE');
    status.classList.toggle('online', !!online); status.classList.toggle('offline', !online);
  }
  function initials(name){ return String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
  function avatarEl(username, fallbackName, small, withDot){
    const p = people[username] || {};
    const el = document.createElement('div');
    el.className = 'av' + (small ? ' sm' : '');
    el.dataset.user = username;
    if(p.avatar){ const img = document.createElement('img'); img.src = p.avatar; img.alt = ''; el.appendChild(img); }
    else el.textContent = initials(p.name || fallbackName || username);
    if(withDot){ const d = document.createElement('span'); d.className = 'dot' + (p.online ? ' on' : ''); el.appendChild(d); }
    return el;
  }
  function refreshAvatarsInChat(){
    box.querySelectorAll('.av[data-user]').forEach(old => {
      const fresh = avatarEl(old.dataset.user, old.textContent, old.classList.contains('sm'), false);
      old.replaceWith(fresh);
    });
  }

  // ---------- sounds ----------
  let audioCtx = null;
  function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
  function beep(kind){
    try{
      ensureAudio();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = kind === 'send' ? 720 : 560;
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.05, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + (kind === 'send' ? 0.22 : 0.32));
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(now + 0.35);
    }catch(e){}
  }
  document.addEventListener('pointerdown', ensureAudio, { once:true, passive:true });

  // ---------- messages ----------
  function dayLabel(d){
    const today = new Date(); today.setHours(0,0,0,0);
    const x = new Date(d); x.setHours(0,0,0,0);
    const diff = Math.round((today - x) / 86400000);
    if(diff === 0) return 'Today';
    if(diff === 1) return 'Yesterday';
    return new Date(d).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }
  function add(v){
    if(!v || !v.text || v.id <= lastId) return;
    lastId = v.id;
    const empty = box.querySelector('.empty-chat'); if(empty) empty.remove();
    const t = new Date(v.time);
    const mine = v.username === me;

    if(!lastMsg || new Date(lastMsg.time).toDateString() !== t.toDateString()){
      const sep = document.createElement('div'); sep.className = 'day-sep';
      const sp = document.createElement('span'); sp.textContent = dayLabel(t); sep.appendChild(sp);
      box.appendChild(sep); lastMsg = null;
    }
    const cont = lastMsg && lastMsg.username === v.username && (t - new Date(lastMsg.time)) < 5 * 60000;

    const row = document.createElement('div');
    row.className = 'msg' + (mine ? ' me' : '') + (cont ? ' cont' : '');
    row.dataset.id = v.id;
    const slot = document.createElement('div'); slot.className = 'av-slot';
    if(!mine && !cont) slot.appendChild(avatarEl(v.username, v.name, true, false));
    row.appendChild(slot);

    const body = document.createElement('div'); body.className = 'body';
    if(!mine && !cont){
      const who = document.createElement('div'); who.className = 'who';
      who.textContent = v.name || v.username;
      const pos = (people[v.username] || {}).position;
      if(pos){ const sm = document.createElement('small'); sm.textContent = pos; who.appendChild(sm); }
      body.appendChild(who);
    }
    const br = document.createElement('div'); br.className = 'bubble-row';
    const b = document.createElement('div'); b.className = 'bubble';
    b.appendChild(document.createTextNode(v.text));
    const tm = document.createElement('span'); tm.className = 't';
    tm.textContent = t.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    b.appendChild(tm);
    br.appendChild(b);
    if(mine || isAdmin){
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del-btn'; del.title = 'Delete message'; del.textContent = '🗑';
      del.addEventListener('click', (ev)=>{ ev.stopPropagation(); deleteMsg(v.id); });
      br.appendChild(del);
      b.addEventListener('click', ()=> row.classList.toggle('show-del'));   // tap to show on phones
    }
    body.appendChild(br);
    row.appendChild(body);
    box.appendChild(row);
    nodes[v.id] = row;
    lastMsg = v;

    if(!mine && !firstLoad) beep('receive');
    try{ localStorage.setItem('lalabellaChatLastSeenId', String(lastId)); }catch(e){}
  }
  function removeMsg(id){
    const row = nodes[id]; if(!row) return;
    // keep the next message's name/avatar visible if it was grouped under this one
    const next = row.nextElementSibling;
    if(next && next.classList.contains('cont') && !row.classList.contains('cont')){ next.classList.remove('cont'); }
    const prev = row.previousElementSibling;
    row.remove(); delete nodes[id];
    // drop a day label that no longer has any messages under it
    if(prev && prev.classList.contains('day-sep')){
      const after = prev.nextElementSibling;
      if(!after || after.classList.contains('day-sep')) prev.remove();
    }
  }
  async function deleteMsg(id){
    if(!confirm('Delete this message for everyone?')) return;
    try{
      const d = await call({ action:'chatDelete', id });
      if(!d.success){ alert(d.error || 'Could not delete.'); return; }
      removeMsg(id);
    }catch(e){ alert('Connection error — please try again.'); }
  }

  async function poll(){
    if(busy) return;
    busy = true;
    try{
      const params = lastId ? { action:'chatList', sinceId:lastId } : { action:'chatList', limit:100 };
      if(delSince) params.delSince = delSince;
      const d = await call(params);
      if(!d.success) throw new Error(d.error || 'failed');
      me = d.me || me; isAdmin = !!d.isAdmin;
      if(d.serverTime) delSince = d.serverTime;
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
      (d.messages || []).forEach(add);
      (d.deletedIds || []).forEach(removeMsg);
      if(firstLoad && !lastId && !box.children.length){
        box.innerHTML = '<div class="empty-chat">No messages yet — say hi to the team 🌹</div>';
      }
      if(firstLoad || nearBottom) box.scrollTop = box.scrollHeight;
      firstLoad = false;
      setStatus(true);
    }catch(e){ setStatus(false, 'RECONNECTING…'); }
    busy = false;
  }

  // ---------- team / online ----------
  function renderTeam(list){
    const online = list.filter(p => p.online), offline = list.filter(p => !p.online);
    document.getElementById('onlineCount').textContent = '● ' + online.length + ' online';
    const tl = document.getElementById('teamList'); tl.innerHTML = '';
    const section = (title, arr) => {
      if(!arr.length) return;
      const h = document.createElement('div'); h.className = 'team-sep'; h.textContent = title; tl.appendChild(h);
      arr.forEach(p => {
        const row = document.createElement('div'); row.className = 'person';
        row.appendChild(avatarEl(p.username, p.name, false, true));
        const txt = document.createElement('div'); txt.style.minWidth = '0';
        const n = document.createElement('div'); n.className = 'pname'; n.textContent = p.name + (p.username === me ? ' (you)' : '');
        const s = document.createElement('div'); s.className = 'psub';
        s.textContent = p.online ? (p.position ? p.position + ' · Active now' : 'Active now') : (p.position ? p.position + ' · ' : '') + lastSeenText(p.lastSeen);
        txt.appendChild(n); txt.appendChild(s); row.appendChild(txt); tl.appendChild(row);
      });
    };
    section('Online now', online); section('Offline', offline);

    const strip = document.getElementById('onlineStrip'); strip.innerHTML = '';
    online.slice(0, 5).forEach(p => { const a = avatarEl(p.username, p.name, true, true); a.title = p.name; strip.appendChild(a); });
    if(online.length > 5){ const m = document.createElement('span'); m.className = 'more'; m.textContent = '+' + (online.length - 5); strip.appendChild(m); }
  }
  function lastSeenText(iso){
    if(!iso) return 'Offline';
    const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if(mins < 60) return 'seen ' + mins + 'm ago';
    const h = Math.round(mins / 60);
    if(h < 24) return 'seen ' + h + 'h ago';
    return 'seen ' + new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  }
  async function loadPeople(){
    try{
      const d = await call({ action:'chatPeople' });
      if(!d.success) return;
      const hadAvatars = Object.values(people).some(p => p.avatar);
      people = {}; d.people.forEach(p => { people[p.username] = p; });
      renderTeam(d.people);
      if(!hadAvatars) refreshAvatarsInChat();
    }catch(e){}
  }

  // ---------- send ----------
  function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener('submit', async (e)=>{
    e.preventDefault(); ensureAudio();
    const text = input.value.trim(); if(!text) return;
    const btn = form.querySelector('button'); btn.disabled = true;
    try{
      const d = await call({ action:'chatSend', text });
      if(!d.success) throw new Error(d.error || 'failed');
      input.value = ''; autosize(); input.focus(); beep('send');
      await poll();
      box.scrollTop = box.scrollHeight;
    }catch(err){ setStatus(false, 'SEND ERROR — try again'); }
    btn.disabled = false;
  });

  setInterval(()=>{ if(!document.hidden) poll(); }, POLL_MS);
  setInterval(()=>{ if(!document.hidden) loadPeople(); }, PEOPLE_MS);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ poll(); loadPeople(); } });
  loadPeople().then(poll);
})();
</script>

<script>
  const musicPanel = document.getElementById('musicUrlPanel');
  const audio = document.getElementById('audioPlayer');
  const soundBtn = document.getElementById('musicToggleBtn');
  let isPlaying = false;
  let ytVideoId = null;

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function playYouTube(id){
    const wrap = document.getElementById('ytPlayerWrap');
    wrap.innerHTML = `<iframe width="200" height="150" src="https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
  }
  function stopYouTube(){
    document.getElementById('ytPlayerWrap').innerHTML = '';
  }

  function saveSoundChoice(url, isYouTube){
    try{
      localStorage.setItem('lalabellaSoundUrl', url);
      localStorage.setItem('lalabellaSoundIsYouTube', isYouTube ? '1' : '0');
    }catch(e){}
  }

  function loadSavedSound(){
    try{
      const savedUrl = localStorage.getItem('lalabellaSoundUrl');
      const savedIsYT = localStorage.getItem('lalabellaSoundIsYouTube') === '1';
      if(!savedUrl) return;
      if(savedIsYT){
        ytVideoId = extractYouTubeId(savedUrl);
        document.getElementById('musicNow').textContent = 'Saved: YouTube track (tap ▶ to play)';
      } else {
        audio.src = savedUrl;
        document.getElementById('musicNow').textContent = 'Saved: ' + (savedUrl.length > 46 ? savedUrl.slice(0,46) + '…' : savedUrl);
      }
      document.getElementById('musicUrlInput').value = savedUrl;
      document.getElementById('musicTitle').textContent = 'Saved sound ready';
      document.getElementById('musicSub').textContent = 'Tap ▶ to play';
    }catch(e){}
  }
  loadSavedSound();

  soundBtn.addEventListener('click', ()=>{
    if(!audio.src && !ytVideoId){
      musicPanel.classList.toggle('show');
      return;
    }
    if(isPlaying){
      if(ytVideoId) stopYouTube(); else audio.pause();
      soundBtn.textContent = '▶';
      isPlaying = false;
    } else {
      if(ytVideoId) playYouTube(ytVideoId); else audio.play().catch(()=>{});
      soundBtn.textContent = '⏸';
      isPlaying = true;
    }
  });

  document.getElementById('musicUrlToggleBtn').addEventListener('click', ()=>{
    musicPanel.classList.toggle('show');
  });

  document.getElementById('musicUrlApplyBtn').addEventListener('click', ()=>{
    const url = document.getElementById('musicUrlInput').value.trim();
    if(!url){ alert('Paste a sound URL first.'); return; }

    const id = extractYouTubeId(url);
    if(id){
      ytVideoId = id;
      audio.pause(); audio.removeAttribute('src');
      playYouTube(id);
      document.getElementById('musicTitle').textContent = 'Now playing YouTube track';
      document.getElementById('musicSub').textContent = 'Tap ⏸ to stop';
      isPlaying = true;
      soundBtn.textContent = '⏸';
      musicPanel.classList.remove('show');
      saveSoundChoice(url, true);
      return;
    }

    ytVideoId = null;
    stopYouTube();
    audio.src = url;
    document.getElementById('musicTitle').textContent = 'Now playing';
    document.getElementById('musicSub').textContent = url.length > 40 ? url.slice(0,40) + '…' : url;
    saveSoundChoice(url, false);
    audio.play().then(()=>{
      isPlaying = true;
      soundBtn.textContent = '⏸';
      musicPanel.classList.remove('show');
    }).catch(()=>{
      soundBtn.textContent = '▶';
    });
  });

  document.addEventListener('click', (e)=>{
    if(musicPanel.classList.contains('show') && !musicPanel.contains(e.target) && e.target !== soundBtn && !e.target.closest('#musicUrlToggleBtn')){
      musicPanel.classList.remove('show');
    }
  });
</script>

</body>
</html>
