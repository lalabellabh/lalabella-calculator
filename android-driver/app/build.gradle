plugins {
    id 'com.android.application'
}

// Version people see. Bump this and versionCode together for every release.
def appVer = '1.0.0'

android {
    namespace 'com.mysystemlla.driver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mysystemlla.driver'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName appVer
    }

    signingConfigs {
        release {
            // Filled by the GitHub Actions workflow from repository secrets (never stored in the repo).
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
