<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella • Flower Dashboard</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:linear-gradient(135deg,#fdf1f0,#eaf3ec);font:14px system-ui;color:#3a2530;padding:24px}.wrap{max-width:1100px;margin:auto}.hero,.card{background:#fff;border:1px solid #f0d9d9;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #9e2f4a12}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:28px;font-weight:800;color:#9e2f4a}.muted{color:#8a7078;font-size:12px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f5e8e8}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="muted">LALABELLA SYSTEM • SUPABASE</div><h1>🌷 Flower Dashboard</h1><div id="who" class="muted">Checking session…</div></section><section class="cards"><div class="card"><div class="muted">Catalog</div><div class="stat" id="catalog">—</div><div class="muted">flower items</div></div><div class="card"><div class="muted">Receiving</div><div class="stat" id="receiving">—</div><div class="muted">records</div></div><div class="card"><div class="muted">Transfers</div><div class="stat" id="transfers">—</div><div class="muted">records</div></div><div class="card"><div class="muted">Stock Counts</div><div class="stat" id="counts">—</div><div class="muted">records</div></div></section><section class="card"><h2>Recent Receiving</h2><div id="recent">Loading…</div></section><section class="card"><button id="out">Sign out</button></section></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function count(t,branch){let q=sb.from(t).select('*',{count:'exact',head:true});if(branch&&t!=='flower_item'&&t!=='flower_transfer_history')q=q.eq('branch',branch);if(branch&&t==='flower_transfer_history')q=q.or(`from_branch.eq.${branch},to_branch.eq.${branch}`);let r=await q;if(r.error)throw r.error;return r.count||0}async function boot(){let u=await sbAuth.getUser();if(!u)return location='login.html';let p=await sbAuth.getProfile();if(!p)return location='login.html';$('who').textContent=`${p.full_name||u.email} • ${p.role} • ${p.branch||'All branches'}`;let b=p.branch||null;[$('catalog').textContent,$('receiving').textContent,$('transfers').textContent,$('counts').textContent]=await Promise.all([count('flower_item'),count('flower_database',b),count('flower_transfer_history',b),count('flower_stock_history',b)]);let q=sb.from('flower_database').select('entry_date,flower_name,qty,rate,supplier,branch').order('id',{ascending:false}).limit(10);if(b)q=q.eq('branch',b);let r=await q;if(r.error)throw r.error;$('recent').innerHTML=(r.data||[]).map(x=>`<div class="row"><span><b>${esc(x.flower_name)}</b><br><span class="muted">${esc(x.branch)} • ${esc(x.supplier||'')}</span></span><b>${Number(x.qty||0).toFixed(2)}</b></div>`).join('')||'<span class="muted">No records.</span>'}$('out').onclick=async()=>{await sbAuth.signOut();location='login.html'};boot().catch(e=>{$('who').textContent=e?.message||e?.error_description||JSON.stringify(e)||'Dashboard failed to load.'})</script></body></html>
