<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Chocolate Calculator</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--c:#0d0806;--c2:#1a100c;--g:#e8c46a;--gh:#ffdd7a;--t:#f5ecdf;--d:#8a7568;--l:#332218}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24140d 0,var(--c) 48%);color:var(--t);font-family:'Space Grotesk',sans-serif;min-height:100vh}.r{height:10px;background:repeating-linear-gradient(-45deg,var(--g),var(--g) 18px,var(--gh) 18px,var(--gh) 36px)}.wrap{max-width:720px;margin:auto;padding:42px 20px 70px}.back{color:var(--d);text-decoration:none;font-size:12px;text-transform:uppercase}.back:hover{color:var(--g)}header{text-align:center;margin:30px 0}.ey{color:var(--g);font-size:11px;letter-spacing:.35em;font-weight:700}h1{font:900 clamp(2.4rem,8vw,4rem)/.95 'Fraunces',serif;margin:12px 0}h1 em{color:var(--g)}.sub{color:var(--d);font-size:14px}.search{display:flex;gap:8px}.search input,.extra input{flex:1;background:var(--c2);border:2px solid var(--l);padding:16px;color:var(--t);outline:0;font-size:15px}.search input:focus,.extra input:focus{border-color:var(--g)}button{font-family:inherit;cursor:pointer}.clear{background:transparent;border:1px solid var(--l);color:var(--d);padding:0 16px}.cats{display:flex;gap:7px;overflow:auto;padding:12px 0}.cat{border:1px solid var(--l);background:transparent;color:var(--d);border-radius:20px;padding:8px 13px;white-space:nowrap}.cat.active,.cat:hover{background:var(--g);color:var(--c);border-color:var(--g)}.results{border:1px solid var(--l);display:none;max-height:310px;overflow:auto}.item{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--l)}.item:hover{background:var(--c2)}.name{font-weight:700}.meta{font-size:11px;color:var(--d);margin-top:4px}.price{color:var(--g);font-weight:700;white-space:nowrap}.card{display:none;margin-top:18px;border:2px solid var(--g);background:var(--c2);padding:22px}.head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--l);padding-bottom:16px}.change{background:transparent;border:1px solid var(--l);color:var(--d);padding:7px 10px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.mode{padding:12px;border:1px solid var(--l);background:transparent;color:var(--d)}.mode.active{background:var(--g);color:var(--c)}.amount{width:100%;background:var(--c);border:2px solid var(--l);color:var(--t);padding:15px;font-size:18px}.total,.grand{display:flex;justify-content:space-between;align-items:center;padding:18px;margin-top:14px;background:var(--c);border:1px solid var(--l)}.big{font:900 32px 'Fraunces',serif;color:var(--gh)}.add,.print,.share,.extra button{width:100%;padding:14px;margin-top:10px;border:0;background:var(--g);color:var(--c);font-weight:700}.add:disabled{opacity:.35}.list{display:none;margin-top:24px}.row{display:flex;justify-content:space-between;padding:13px 12px;border-bottom:1px solid var(--l)}.rm{background:none;border:0;color:var(--d);font-size:20px}.extra{margin-top:16px;padding:15px;border:1px solid var(--l)}.extra h2{font:600 18px 'Fraunces',serif;margin:0 0 10px}.extra form{display:flex;gap:7px}.extra button{margin:0;width:130px}.status{margin-top:12px;text-align:center;color:var(--d);font-size:12px}.danger{color:#e88b78}@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.extra form{display:block}.extra button{width:100%;margin-top:7px}.search{display:block}.clear{width:100%;padding:11px;margin-top:7px}}@media print{body{background:#fff;color:#111}.r,.back,.search,.cats,.results,.card,.status{display:none!important}.wrap{max-width:80mm;padding:8mm}.list{display:block!important}.extra{border:1px solid #ccc}.big{color:#111}}</style></head><body><div class="r"></div><main class="wrap"><a class="back" href="index.html">← Back to Tools</a><header><div class="ey">LALABELLA</div><h1>Chocolate <em>Calculator</em></h1><p class="sub">Pieces, grams or kilograms — calculated directly from the Supabase catalog.</p></header><div class="search"><input id="q" placeholder="Type chocolate name, code or category…" autocomplete="off"><button class="clear" id="clear">Clear</button></div><div class="cats" id="cats"></div><div class="results" id="results"></div><section class="card" id="card"><div class="head"><div><div class="name" id="selName"></div><div class="meta" id="selMeta"></div></div><button class="change" id="change">Change</button></div><div class="modes"><button class="mode active" data-mode="pieces">Pieces</button><button class="mode" data-mode="grams">Grams</button><button class="mode" data-mode="kg">Kg</button></div><input class="amount" id="amount" type="number" min="0" step="0.001" placeholder="How many pieces?"><div class="total"><div><div class="meta">CURRENT TOTAL</div><div class="meta" id="kg">—</div></div><div class="big" id="total">0.000 BD</div></div><button class="add" id="add" disabled>Add to List</button></section><section class="list" id="list"><h2 style="font:600 20px 'Fraunces',serif">Order List <button id="clearList" style="float:right;background:none;border:0;color:var(--d);font-size:11px">CLEAR ALL</button></h2><div id="rows"></div><div class="extra"><h2>Extras</h2><form id="extraForm"><input id="extraName" placeholder="e.g. Vase"><input id="extraAmount" type="number" min="0" step="0.001" placeholder="0.000 BD"><button>Add Extra</button></form><div id="extras"></div></div><div class="grand"><div><div class="meta">GRAND TOTAL</div><div class="meta" id="count">0 items</div></div><div class="big" id="grand">0.000 BD</div></div><button class="print" id="print">Print / Save as PDF</button><button class="share" id="share" style="display:none">📤 Send to WhatsApp</button></section><div class="status" id="status">Loading Supabase catalog…</div></main><script>(async()=>{const $=id=>document.getElementById(id),fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' BD';let data=[],selected=null,mode='pieces',cart=[],extras=[],cat=null;const status=$('status');try{const sb=await window.LalabellaSupabase.ready();const {data:u,error:ue}=await sb.auth.getUser();if(ue||!u.user){location.href='index.html';return}const {data:d,error}=await sb.from('chocolate_item_list').select('id,chocolate_name,product_code,brand,category,standard_price_per_kg,grams').order('chocolate_name');if(error)throw error;data=(d||[]).map(x=>({id:x.id,name:x.chocolate_name,code:x.product_code||'N/A',brand:x.brand||'N/A',category:x.category||'Uncategorized',price:Number(x.standard_price_per_kg)||0,grams:Number(x.grams)||0}));status.textContent=data.length+' chocolate items loaded from Supabase';renderCats()}catch(e){console.error(e);status.textContent='Could not load catalog: '+(e.message||'connection error');status.className='status danger';return}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderCats(){const cs=[...new Set(data.map(x=>x.category))].filter(Boolean);$('cats').innerHTML=cs.map(c=>`<button class="cat ${cat===c?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');$('cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=cat===b.dataset.c?null:b.dataset.c;renderCats();renderResults(cat?data.filter(x=>x.category===cat):data)})}function renderResults(list){const r=$('results');r.innerHTML='';list.slice(0,30).forEach(x=>{const el=document.createElement('div');el.className='item';el.innerHTML=`<div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category)} · ${esc(x.code)} · ${x.grams||0}g/pc</div></div><div class="price">${fmt(x.price)}/kg</div>`;el.onclick=()=>select(x);r.appendChild(el)});if(!list.length)r.innerHTML='<div class="meta" style="padding:16px">No chocolates found.</div>';r.style.display='block'}$('q').oninput=e=>{cat=null;renderCats();const q=e.target.value.toLowerCase().trim();renderResults(q?data.filter(x=>[x.name,x.code,x.category,x.brand].some(v=>String(v).toLowerCase().includes(q))):[])};$('clear').onclick=()=>{$('q').value='';$('results').style.display='none';$('card').style.display='none';selected=null};$('change').onclick=()=>{$('q').value='';$('results').style.display='none';$('card').style.display='none';selected=null;$('q').focus()};function select(x){selected=x;$('selName').textContent=x.name;$('selMeta').textContent=`${x.code} · ${x.grams}g per piece · ${fmt(x.price)}/kg`;$('card').style.display='block';$('q').value=x.name;$('results').style.display='none';$('amount').value='';setMode('pieces');$('amount').focus()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('amount').placeholder=m==='pieces'?'How many pieces?':m==='grams'?'How many grams?':'How many kg?';$('amount').value='';calc()}$('amount').oninput=calc;function calc(){const n=Number($('amount').value);if(!selected||!n||n<0){$('kg').textContent='—';$('total').textContent='0.000 BD';$('add').disabled=true;return}const kg=mode==='pieces'?n*selected.grams/1000:mode==='grams'?n/1000:n;$('kg').textContent=kg.toFixed(3)+' kg';$('total').textContent=fmt(kg*selected.price);$('add').disabled=false}$('add').onclick=()=>{const n=Number($('amount').value);const kg=mode==='pieces'?n*selected.grams/1000:mode==='grams'?n/1000:n;cart.push({name:selected.name,amount:n,mode,kg,total:kg*selected.price});selected=null;$('q').value='';$('card').style.display='none';renderCart()};function renderCart(){$('list').style.display=cart.length||extras.length?'block':'none';$('rows').innerHTML=cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${x.amount} ${x.mode} · ${x.kg.toFixed(3)} kg</div></div><div>${fmt(x.total)} <button class="rm" data-i="${i}">×</button></div></div>`).join('');$('rows').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.i),1);renderCart()});$('extras').innerHTML=extras.map((x,i)=>`<div class="row"><div>${esc(x.name)}</div><div>${fmt(x.amount)} <button class="rm" data-e="${i}">×</button></div></div>`).join('');$('extras').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{extras.splice(Number(b.dataset.e),1);renderCart()});const total=cart.reduce((s,x)=>s+x.total,0)+extras.reduce((s,x)=>s+x.amount,0);$('grand').textContent=fmt(total);$('count').textContent=cart.length+(cart.length===1?' item':' items');$('share').style.display=navigator.share?'block':'none')}$('clearList').onclick=()=>{cart=[];extras=[];renderCart()};$('extraForm').onsubmit=e=>{e.preventDefault();const n=$('extraName').value.trim(),a=Number($('extraAmount').value);if(!n||!a||a<=0)return;extras.push({name:n,amount:a});$('extraName').value='';$('extraAmount').value='';renderCart()};$('print').onclick=()=>window.print();$('share').onclick=async()=>{try{const text=['Lalabella Chocolate Order',...cart.map(x=>`${x.name} — ${x.amount} ${x.mode} — ${fmt(x.total)}`),...extras.map(x=>`${x.name} — ${fmt(x.amount)}`),'Grand Total: '+$('grand').textContent].join('\n');await navigator.share({text})}catch(e){console.log(e)}}})();</script></body></html>
