<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Café Items &amp; Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".wrap, .card">
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#f6efe6,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 80px; }
  header{ padding-left:56px; margin:6px 0 6px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar input,.bar select,.btn{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .btn.go{ background:linear-gradient(135deg,#c9506b,#9e2f4a); color:#fff; border:0; font-weight:700; }
  .btn.ok{ background:var(--ok); color:#fff; border:0; font-weight:700; }
  .card{ background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .card h2{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 10px; }
  .card label{ display:block; font-size:11.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
  .card input,.card select{ width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .g3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
  @media(max-width:620px){ .g2,.g3{ grid-template-columns:1fr; } }
  .pic{ width:44px; height:44px; flex:none; border-radius:10px; background:#f3ece6 center/cover no-repeat; border:1px dashed #d9c7bd; display:flex; align-items:center; justify-content:center; font-size:17px; color:#b9a49a; }
  .pic.has{ border-style:solid; border-color:#eadbd4; cursor:zoom-in; } .pic.can{ cursor:pointer; }
  .row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .nm{ flex:1; min-width:0; font-weight:700; font-size:14px; } .nm small{ display:block; font-weight:400; color:var(--dim); font-size:11.5px; }
  .grp{ font-size:12px; font-weight:800; color:#7a5a20; background:#faf5ef; padding:6px 10px; border-radius:8px; margin:10px 0 2px; }
  .zero{ color:var(--bad); } .soon{ color:#a8560b; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
  .msg{ font-size:12.5px; color:var(--dim); }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<script src="shared/cafe-common.js"></script>
<div class="wrap">
  <header><h1>☕ Café Items &amp; Stock</h1><div class="sub">The café list (cups, coffee, syrups…) with pictures. Stock = last count + what was received after it.</div></header>
  <div id="tabs"></div>
  <div class="bar">
    <input id="q" placeholder="Search…" style="flex:1;min-width:160px">
    <select id="grp"><option value="">All groups</option></select>
    <button id="add" class="btn go" style="display:none">＋ Add item</button>
  </div>
  <div class="card" id="list"><div class="empty">Loading…</div></div>
</div>
<script>
(function(){
  var C = window.LBCafe, esc = C.esc, $ = function(id){ return document.getElementById(id); }, D = null;
  $('tabs').innerHTML = C.tabs('cafe-inventory.html');
  function groups(){ var g = []; (D ? D.items : []).forEach(function(i){ if(i.category && g.indexOf(i.category) === -1) g.push(i.category); }); return g; }
  function load(){ C.api({ action:'items' }).then(function(d){
    if(!d || !d.success){ $('list').innerHTML = '<div class="empty">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
    D = d; $('add').style.display = d.admin ? '' : 'none';
    var cur = $('grp').value; $('grp').innerHTML = '<option value="">All groups</option>' + groups().map(function(g){ return '<option' + (g === cur ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('');
    draw(); }).catch(function(){ $('list').innerHTML = '<div class="empty">Connection problem.</div>'; }); }
  function draw(){
    var t = $('q').value.trim().toLowerCase(), g = $('grp').value, last = null;
    var L = D.items.filter(function(i){ return (!g || i.category === g) && (!t || (i.name + ' ' + i.category + ' ' + i.code).toLowerCase().indexOf(t) !== -1); });
    $('list').innerHTML = L.length ? L.map(function(i){
      var head = i.category !== last ? '<div class="grp">' + esc(i.category || 'Other') + '</div>' : ''; last = i.category;
      var pic = '<div class="pic' + (i.photo ? ' has' : '') + (D.admin ? ' can' : '') + '" data-pic="' + i.id + '"' + (i.photo ? ' style="background-image:url(\'' + esc(i.photo) + '\')"' : '') + ' title="' + (i.photo ? 'Tap to see' : (D.admin ? 'Add a picture' : 'No picture yet')) + '">' + (i.photo ? '' : (D.admin ? '＋' : '☕')) + '</div>';
      var exp = i.nextExpiry ? ' · exp ' + C.fd(i.nextExpiry) : '';
      return head + '<div class="row">' + pic + '<div class="nm">' + esc(i.name) + '<small>' + esc(i.unit) + (i.code ? ' · 📦 ' + esc(i.code) : '') + (i.countDate ? ' · counted ' + C.fd(i.countDate) : ' · not counted yet') + (i.received ? ' · +' + C.n3(i.received) + ' received after' : '') + exp + '</small></div>' +
        '<div style="text-align:right;font-weight:800;font-size:15px;min-width:90px"' + (i.stock > 0 ? '' : ' class="zero"') + '>' + C.n3(i.stock) + ' <span style="font-size:11.5px;font-weight:600;color:var(--dim)">' + esc(i.unit) + '</span></div>' +
        (D.admin ? '<button class="btn" data-ed="' + i.id + '" title="Edit item" style="padding:6px 9px">✏️</button>' : '') + '</div>';
    }).join('') : '<div class="empty">No items' + (t || g ? ' for this search' : ' yet') + '.</div>';
  }
  $('q').oninput = function(){ if(D) draw(); }; $('grp').onchange = function(){ if(D) draw(); };
  $('add').onclick = function(){ C.itemForm(null, groups(), load); };
  $('list').addEventListener('click', function(e){
    var ed = e.target.closest('[data-ed]'); if(ed){ C.itemForm(D.items.find(function(x){ return String(x.id) === ed.getAttribute('data-ed'); }), groups(), load); return; }
    var pc = e.target.closest('[data-pic]'); if(!pc) return; var it = D.items.find(function(x){ return String(x.id) === pc.getAttribute('data-pic'); });
    if(it.photo) C.zoom(it.photo); else if(D.admin) C.itemForm(it, groups(), load);
  });
  load();
})();
</script>
</body>
</html>
