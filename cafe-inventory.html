<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Café Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".card">
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#f6efe6,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 80px; }
  header{ padding-left:56px; margin:6px 0 6px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar input,.bar select,.btn{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .btn.go{ background:linear-gradient(135deg,#c9506b,#9e2f4a); color:#fff; border:0; font-weight:700; }
  .btn.ok{ background:var(--ok); color:#fff; border:0; font-weight:700; }
  .card{ background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .card h2{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 10px; }
  .card label{ display:block; font-size:11.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
  .card input,.card select{ width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .g3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
  @media(max-width:620px){ .g2,.g3{ grid-template-columns:1fr; } }
  .pic{ width:44px; height:44px; flex:none; border-radius:10px; background:#f3ece6 center/cover no-repeat; border:1px dashed #d9c7bd; display:flex; align-items:center; justify-content:center; font-size:17px; color:#b9a49a; }
  .pic.has{ border-style:solid; border-color:#eadbd4; cursor:zoom-in; } .pic.can{ cursor:pointer; }
  .row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .nm{ flex:1; min-width:0; font-weight:700; font-size:14px; } .nm small{ display:block; font-weight:400; color:var(--dim); font-size:11.5px; }
  .grp{ font-size:12px; font-weight:800; color:#7a5a20; background:#faf5ef; padding:6px 10px; border-radius:8px; margin:10px 0 2px; }
  .zero{ color:var(--bad); } .soon{ color:#a8560b; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
  .msg{ font-size:12.5px; color:var(--dim); }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .ic{ display:flex; flex-direction:column; gap:7px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; }
  .ic .ph{ position:relative; width:100%; aspect-ratio:1/1; border-radius:10px; background:#f6efe6; border:1px dashed #e3d3c8; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:30px; overflow:hidden; }
  .ic .ph img{ width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
  .ic .xrm{ position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; border:0; background:rgba(255,255,255,.92); color:var(--bad); font-size:11px; font-weight:700; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .ic .nm{ font-weight:700; font-size:13px; line-height:1.25; }
  .ic .ct{ font-size:11px; color:var(--dim); }
  .ic .cd{ font-size:11px; color:#6b4226; font-weight:700; font-family:monospace; }
  .ic svg.bc{ display:block; width:100%; height:58px; margin-top:4px; background:#fff; border-radius:6px; padding:4px 6px; box-sizing:border-box; cursor:zoom-in; }
  .ic .sk{ font-size:12px; font-weight:700; } .ic .sk small{ font-weight:400; color:var(--dim); }
  .ic .b{ padding:8px 10px; border:none; border-radius:9px; font-weight:700; font-size:12px; cursor:pointer; background:linear-gradient(135deg,#6b4226,#4a2c18); color:#fff; font-family:inherit; }
  .ic .b.alt{ background:#fff; color:#4a2c18; border:1px solid var(--line); }
  .ic .paste{ display:none; border:1.5px dashed var(--line); border-radius:9px; padding:7px 6px; text-align:center; font-size:11px; color:var(--dim); cursor:pointer; outline:none; }
  .ic .paste:focus{ border-color:#c9506b; color:#9e2f4a; background:#fdf1f0; }
  @media (hover:hover) and (pointer:fine){ .ic .paste{ display:block; } }
  #pr{ display:none; }
  @media print{ body *{ visibility:hidden !important; } #pr, #pr *{ visibility:visible !important; } #pr{ display:grid !important; position:absolute; top:0; left:0; width:100%; gap:8px; } #pr .pc{ border:1px solid #999; border-radius:8px; padding:6px; text-align:center; break-inside:avoid; font-family:Arial,sans-serif; } #pr img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; } #pr .n{ font-weight:700; font-size:12px; margin-top:4px; } #pr .c{ font-size:10px; font-family:monospace; } #pr svg{ width:100%; height:34px; } @page{ size:A4; margin:10mm; } }
  /* Nov 21 2026 (Bench): clean café look — same as the Stock Room */
  :root{ --ink:#2a2420; --dim:#8c8279; --line:#ece7df; --soft:#f6f3ee; --acc:#5f8b97; --esp:#2b211b; }
  body{ background:transparent; }
  .wrap{ max-width:1180px; padding:22px 22px 90px; position:relative; z-index:2; }
  @media(min-width:1100px){ .wrap{ margin-left:max(clamp(150px, 13vw, 260px), calc((100vw - 1180px) / 2)); } }
  header{ display:inline-block; padding:10px 18px 11px; border-radius:16px; margin-left:46px; }
  header .eye{ font-size:10.5px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--acc); }
  h1{ font-weight:600; font-size:30px; color:var(--esp); letter-spacing:-.015em; margin-top:2px; }
  .sub{ margin-top:4px; }
  .bar{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:10px; box-shadow:0 8px 24px rgba(42,36,32,.05); margin:12px 0 16px; }
  .bar input,.bar select,.btn{ border:1px solid transparent; background:var(--soft); border-radius:11px; padding:9px 12px; }
  .bar input:focus,.bar select:focus{ outline:none; border-color:var(--acc); background:#fff; }
  .btn{ background:#fff; border-color:var(--line); font-weight:600; color:var(--esp); }
  .btn.go{ background:var(--esp); color:#fff; border-color:var(--esp); font-weight:600; }
  .cards{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .ic{ background:#fff; border:1px solid var(--line); border-radius:20px; padding:12px; gap:6px; box-shadow:0 1px 2px rgba(42,36,32,.04), 0 14px 30px rgba(42,36,32,.05); transition:transform .15s, box-shadow .15s; }
  .ic:hover{ transform:translateY(-2px); box-shadow:0 1px 2px rgba(42,36,32,.04), 0 18px 36px rgba(42,36,32,.09); }
  .ic .ph{ border:0; background:var(--soft); border-radius:14px; font-size:28px; }
  .ic .nm{ font-weight:600; font-size:13.5px; margin-top:4px; }
  .ic .ct{ color:var(--dim); }
  .ic .cd{ color:var(--acc); font-weight:600; letter-spacing:.04em; }
  .ic svg.bc{ background:#fff; border:1px solid var(--line); border-radius:10px; height:54px; }
  .ic .sk{ font-weight:600; }
  .ic .acts{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px; gap:5px; margin-top:4px; }
  .ic .acts .b{ min-width:0; overflow:hidden; text-overflow:ellipsis; padding:8px 2px; font-size:11px; }
  .ic .b{ background:var(--esp); border-radius:10px; font-weight:600; font-size:11.5px; padding:8px 4px; white-space:nowrap; }
  .ic .b.alt{ background:#fff; color:var(--esp); border:1px solid var(--line); }
  .ic .b:hover{ filter:brightness(1.08); } .ic .b.alt:hover{ border-color:var(--acc); }
  .ic .paste{ border:1px dashed var(--line); border-radius:10px; }
  .ic .paste:focus{ border-color:var(--acc); color:#3d6773; background:#eaf2f4; }
  .cf-tabs a{ background:rgba(255,255,255,.8); border-color:var(--line); color:var(--esp); font-weight:600; }
  /* barcode label sheet picker */
  .lb-ed{ width:min(620px,100%) !important; }
  .lb-list{ max-height:42vh; overflow-y:auto; border:1px solid #ece7df; border-radius:12px; margin-top:8px; }
  .lb-row{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-top:1px solid #f1ece4; font-size:13px; }
  .lb-row:first-child{ border-top:0; } .lb-row.on{ background:#f3f8f9; }
  .lb-row input[type=checkbox]{ width:18px !important; height:18px; flex:none; accent-color:#2b211b; }
  .lb-row .n{ flex:1; min-width:0; } .lb-row .n small{ display:block; color:#8c8279; font-size:11px; }
  .lb-row input[type=number]{ width:64px !important; text-align:center; padding:6px !important; }
  .lb-tot{ margin-top:10px; font-size:12.5px; color:#5f8b97; font-weight:600; }
  .lb-mini{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; } .lb-mini .cf-btn{ padding:6px 10px; font-size:12px; }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<script src="shared/cafe-common.js"></script>
<div class="wrap" data-lb-look-skip>
  <header class="cf-glass"><div class="eye">Lalabella Café</div><h1>Café Items</h1><div class="sub">The café list with pictures and barcodes — stock = last count + received after it.</div></header>
  <div id="tabs"></div>
  <div class="bar cf-glass">
    <input id="q" placeholder="Search name, group or code…" style="flex:1;min-width:160px">
    <select id="grp"><option value="">All groups</option></select>
    <select id="per"><option value="3">Print: 3 per row</option><option value="4">Print: 4 per row</option><option value="5">Print: 5 per row</option></select>
    <button id="print" class="btn">🖨️ Print</button>
    <button id="labels" class="btn">🏷️ Barcode labels</button>
    <button id="add" class="btn go" style="display:none">＋ Add item</button>
    <span class="msg" id="cnt"></span>
  </div>
  <div class="cards" id="list"><div class="empty" style="grid-column:1/-1">Loading…</div></div>
</div>
<input type="file" id="fCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fGal" accept="image/*" style="display:none">
<div id="pr"></div>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
(function(){
  var C = window.LBCafe, esc = C.esc, $ = function(id){ return document.getElementById(id); }, D = null, target = null;
  $('tabs').innerHTML = C.tabs('cafe-inventory.html');
  function groups(){ var g = []; (D ? D.items : []).forEach(function(i){ if(i.category && g.indexOf(i.category) === -1) g.push(i.category); }); return g; }
  function load(){ C.api({ action:'items' }).then(function(d){
    if(!d || !d.success){ $('list').innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
    D = d; $('add').style.display = d.admin ? '' : 'none';
    var cur = $('grp').value; $('grp').innerHTML = '<option value="">All groups</option>' + groups().map(function(g){ return '<option' + (g === cur ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('');
    draw(); }).catch(function(){ $('list').innerHTML = '<div class="empty" style="grid-column:1/-1">Connection problem.</div>'; }); }
  function shown(){ var t = $('q').value.trim().toLowerCase(), g = $('grp').value; return D.items.filter(function(i){ return (!g || i.category === g) && (!t || (i.name + ' ' + i.category + ' ' + i.code).toLowerCase().indexOf(t) !== -1); }); }
  function draw(){
    var L = shown(), A = D.admin;
    $('cnt').textContent = D.items.filter(function(i){ return i.photo; }).length + ' of ' + D.items.length + ' with picture · ' + L.length + ' shown';
    $('list').innerHTML = L.length ? L.map(function(i){
      return '<div class="ic cf-glass" data-id="' + i.id + '"><div class="ph">' + (i.photo ? '<img src="' + esc(i.photo) + '" alt="" data-a="zoom">' + (A ? '<button class="xrm" data-a="rm" title="Remove picture">✕</button>' : '') : '☕') + '</div>' +
        '<div><div class="nm">' + esc(i.name) + '</div><div class="ct">' + esc(i.category || 'Other') + ' · ' + esc(i.unit) + '</div>' + (i.code ? '<div class="cd">' + esc(i.code) + '</div><svg class="bc" data-a="bc" title="Tap to make bigger" data-code="' + esc(i.code) + '"></svg>' : '') +
        '<div class="sk"' + (i.stock > 0 ? '' : ' style="color:var(--bad)"') + '>Stock ' + C.n3(i.stock) + ' ' + esc(i.unit) + ' <small>' + (i.countDate ? '· counted ' + C.fd(i.countDate) : '· not counted yet') + (i.nextExpiry ? ' · exp ' + C.fd(i.nextExpiry) : '') + '</small></div></div>' +
        (A ? '<div class="acts"><button class="b" data-a="cam">📷 Camera</button><button class="b alt" data-a="gal">🖼️ ' + (i.photo ? 'Change' : 'Gallery') + '</button><button class="b alt" data-a="edit" title="Edit item" aria-label="Edit item">✏️</button></div><div class="paste" tabindex="0" data-a="paste">📋 Click here, then Ctrl+V (snip paste)</div>' : '') + '</div>';
    }).join('') : '<div class="empty" style="grid-column:1/-1">No items' + ($('q').value || $('grp').value ? ' for this search' : ' yet') + '.</div>';
    if(window.JsBarcode) document.querySelectorAll('#list svg.bc').forEach(function(sv){ try{ JsBarcode(sv, sv.getAttribute('data-code'), { format:'CODE128', width:2, height:44, margin:0, displayValue:false }); sv.setAttribute('preserveAspectRatio', 'xMidYMid meet'); }catch(e){} });
  }
  function item(el){ var c = el.closest('[data-id]'); return c && D.items.find(function(x){ return String(x.id) === c.getAttribute('data-id'); }); }
  function setPhoto(it, file){ if(!file || !it) return; var card = document.querySelector('.ic[data-id="' + it.id + '"] .ph'); if(card) card.style.opacity = '.4';
    (function(f){ return new Promise(function(res){ var fr = new FileReader(); fr.onload = function(){ var im = new Image(); im.onload = function(){ var k = Math.min(1, 1000 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .82)); }; im.onerror = function(){ res(''); }; im.src = fr.result; }; fr.readAsDataURL(f); }); })(file)
      .then(function(d){ if(!d){ alert('That is not a picture.'); return null; } return C.api({ action:'setPhoto', id:it.id, photo:d }); })
      .then(function(r){ if(r && !r.success) alert(r.error || 'Not saved.'); load(); }).catch(function(){ alert('Connection problem.'); load(); }); }
  $('fCam').onchange = function(){ setPhoto(target, this.files[0]); this.value = ''; };
  $('fGal').onchange = function(){ setPhoto(target, this.files[0]); this.value = ''; };
  function bigCode(it){ var bg = document.createElement('div'); bg.className = 'cf-bg';
    bg.innerHTML = '<div class="cf-ed" style="text-align:center;max-width:520px"><h3>' + C.esc(it.name) + '</h3><svg id="bigBc" style="width:100%;height:auto;background:#fff"></svg><div class="cf-row"><button class="cf-btn" data-x>Close</button></div></div>';
    document.body.appendChild(bg);
    try{ JsBarcode(bg.querySelector('#bigBc'), it.code, { format:'CODE128', width:3, height:110, margin:12, displayValue:true, fontSize:22 }); }catch(e){}
    bg.addEventListener('click', function(e){ if(e.target === bg || e.target.closest('[data-x]')) bg.remove(); }); }
  $('list').addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if(!b) return; var it = item(b), a = b.getAttribute('data-a'); if(!it) return;
    if(a === 'zoom') C.zoom(it.photo);
    if(a === 'bc') bigCode(it);
    if(a === 'cam'){ target = it; $('fCam').click(); }
    if(a === 'gal'){ target = it; $('fGal').click(); }
    if(a === 'edit') C.itemForm(it, groups(), load);
    if(a === 'rm'){ if(!confirm('Remove the picture of ' + it.name + '?')) return; C.api({ action:'setPhoto', id:it.id, photo:'' }).then(function(){ load(); }); }
  });
  document.addEventListener('paste', function(e){ var box = document.activeElement && document.activeElement.closest && document.activeElement.closest('.paste'); if(!box) return;
    var f = [].slice.call((e.clipboardData || {}).items || []).map(function(x){ return x.kind === 'file' ? x.getAsFile() : null; }).filter(Boolean)[0]; if(f){ e.preventDefault(); setPhoto(item(box), f); } });
  $('q').oninput = function(){ if(D) draw(); }; $('grp').onchange = function(){ if(D) draw(); };
  $('add').onclick = function(){ C.itemForm(null, groups(), load); };
  $('print').onclick = function(){ if(!D) return; var n = Number($('per').value) || 3;
    $('pr').style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
    $('pr').innerHTML = shown().map(function(i){ return '<div class="pc">' + (i.photo ? '<img src="' + esc(i.photo) + '">' : '') + '<div class="n">' + esc(i.name) + '</div>' + (i.code ? '<svg data-code="' + esc(i.code) + '"></svg><div class="c">' + esc(i.code) + '</div>' : '') + '</div>'; }).join('');
    if(window.JsBarcode) $('pr').querySelectorAll('svg').forEach(function(sv){ try{ JsBarcode(sv, sv.getAttribute('data-code'), { format:'CODE128', width:2, height:50, margin:4, displayValue:true, fontSize:14 }); }catch(e){} });
    var imgs = [].slice.call($('pr').querySelectorAll('img')); Promise.all(imgs.map(function(im){ return im.complete ? 1 : new Promise(function(r){ im.onload = im.onerror = r; }); })).then(function(){ window.print(); }); };

  /* ---------- Barcode labels: pick the items + how many labels on one sheet (Nov 21 2026, Bench) ---------- */
  var SHEETS = {
    a21: { t:'A4 · 21 labels (3 × 7) · 70 × 42 mm', cols:3, rows:7, w:70, h:42.3, gx:0, gy:0 },
    a24: { t:'A4 · 24 labels (3 × 8) · 70 × 37 mm', cols:3, rows:8, w:70, h:37, gx:0, gy:0 },
    a40: { t:'A4 · 40 labels (4 × 10) · 48.5 × 25.4 mm', cols:4, rows:10, w:48.5, h:25.4, gx:0, gy:0 },
    a65: { t:'A4 · 65 labels (5 × 13) · 38 × 21 mm', cols:5, rows:13, w:38.1, h:21.2, gx:2.5, gy:0 },
    a12: { t:'A4 · 12 big labels (2 × 6) · 99 × 46 mm', cols:2, rows:6, w:99.1, h:46.6, gx:2.5, gy:0 },
    t50: { t:'Label printer · 50 × 30 mm (1 per label)', cols:1, rows:1, w:50, h:30, gx:0, gy:0, roll:true },
    t40: { t:'Label printer · 40 × 25 mm (1 per label)', cols:1, rows:1, w:40, h:25, gx:0, gy:0, roll:true }
  };
  function lsGet(k, d){ try{ return localStorage.getItem(k) || d; }catch(e){ return d; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  $('labels').onclick = function(){
    if(!D) return;
    var pick = {};   // id -> copies
    var bg = document.createElement('div'); bg.className = 'cf-bg';
    bg.innerHTML = '<div class="cf-ed lb-ed"><h3>🏷️ Print barcode labels</h3>' +
      '<label>Label sheet</label><select data-k="sheet">' + Object.keys(SHEETS).map(function(k){ return '<option value="' + k + '">' + SHEETS[k].t + '</option>'; }).join('') + '</select>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Start at label no. <span style="font-weight:400">(used sheet)</span></label><input type="number" data-k="start" min="1" value="1"></div>' +
      '<div><label>Show on label</label><select data-k="show"><option value="nc">Name + barcode + code</option><option value="c">Barcode + code only</option></select></div></div>' +
      '<label>Items <span style="font-weight:400">— tick the items, type how many labels each</span></label><input data-k="q" placeholder="Search item or code…">' +
      '<div class="lb-mini"><button class="cf-btn" data-k="all">✓ Tick all shown</button><button class="cf-btn" data-k="none">✕ Clear</button><button class="cf-btn" data-k="fill">Fill 1 sheet with each ticked item</button></div>' +
      '<div class="lb-list" data-k="list"></div><div class="lb-tot" data-k="tot"></div>' +
      '<div class="cf-row"><button class="cf-btn" data-k="x">Cancel</button><button class="cf-btn ok" data-k="go">🖨️ Print labels</button></div></div>';
    document.body.appendChild(bg);
    var q = function(k){ return bg.querySelector('[data-k="' + k + '"]'); };
    q('sheet').value = SHEETS[lsGet('cafeLabelSheet', 'a21')] ? lsGet('cafeLabelSheet', 'a21') : 'a21';
    function list(){ var t = q('q').value.trim().toLowerCase(); return D.items.filter(function(i){ return i.code && (!t || (i.name + ' ' + i.code + ' ' + i.category).toLowerCase().indexOf(t) !== -1); }); }
    function paint(){
      q('list').innerHTML = list().map(function(i){ var on = pick[i.id] > 0;
        return '<div class="lb-row' + (on ? ' on' : '') + '" data-id="' + i.id + '"><input type="checkbox"' + (on ? ' checked' : '') + '><div class="n">' + esc(i.name) + '<small>' + esc(i.code) + ' · ' + esc(i.category || '') + '</small></div><input type="number" min="0" max="999" value="' + (pick[i.id] || '') + '" placeholder="0"></div>'; }).join('') || '<div class="empty">No items with a code.</div>';
      tot();
    }
    function tot(){ var S = SHEETS[q('sheet').value], per = S.cols * S.rows, n = 0; Object.keys(pick).forEach(function(k){ n += pick[k] || 0; });
      var start = Math.max(1, Math.min(per, Number(q('start').value) || 1)); var all = n + (S.roll ? 0 : start - 1);
      q('tot').textContent = n ? n + ' label(s) · ' + (S.roll ? n + ' on the label printer' : Math.ceil(all / per) + ' sheet(s) of ' + per) : 'Tick at least one item.'; }
    q('list').addEventListener('change', function(e){ var r = e.target.closest('[data-id]'); if(!r) return; var id = r.getAttribute('data-id'), num = r.querySelector('input[type=number]');
      if(e.target.type === 'checkbox'){ pick[id] = e.target.checked ? Math.max(1, Number(num.value) || 1) : 0; num.value = pick[id] || ''; r.classList.toggle('on', e.target.checked); }
      tot(); });
    q('list').addEventListener('input', function(e){ if(e.target.type !== 'number') return; var r = e.target.closest('[data-id]'), id = r.getAttribute('data-id'), v = Math.max(0, Math.min(999, Math.floor(Number(e.target.value) || 0)));
      pick[id] = v; r.querySelector('input[type=checkbox]').checked = v > 0; r.classList.toggle('on', v > 0); tot(); });
    q('q').oninput = paint; q('sheet').onchange = tot; q('start').oninput = tot;
    q('all').onclick = function(){ list().forEach(function(i){ if(!(pick[i.id] > 0)) pick[i.id] = 1; }); paint(); };
    q('none').onclick = function(){ pick = {}; paint(); };
    q('fill').onclick = function(){ var S = SHEETS[q('sheet').value], per = S.cols * S.rows; var ids = Object.keys(pick).filter(function(k){ return pick[k] > 0; });
      if(!ids.length){ alert('Tick the items first.'); return; } ids.forEach(function(k){ pick[k] = per; }); paint(); };
    bg.addEventListener('click', function(e){ if(e.target === bg || e.target === q('x')) bg.remove(); });
    q('go').onclick = function(){
      var S = SHEETS[q('sheet').value], per = S.cols * S.rows, labels = [];
      D.items.forEach(function(i){ for(var k = 0; k < (pick[i.id] || 0); k++) labels.push(i); });
      if(!labels.length){ alert('Tick at least one item.'); return; }
      if(!window.JsBarcode){ alert('The barcode maker did not load (internet?). Please refresh and try again.'); return; }
      lsSet('cafeLabelSheet', q('sheet').value);
      var start = S.roll ? 1 : Math.max(1, Math.min(per, Number(q('start').value) || 1));
      for(var k = 1; k < start; k++) labels.unshift(null);   // skip labels already used on the sheet
      printLabels(S, labels, q('show').value === 'nc'); bg.remove();
    };
    paint();
  };
  function printLabels(S, labels, withName){
    var per = S.cols * S.rows, pages = [], pw = S.roll ? S.w : 210, ph = S.roll ? S.h : 297;
    for(var i = 0; i < labels.length; i += per) pages.push(labels.slice(i, i + per));
    var padL = Math.max(0, (pw - S.cols * S.w - (S.cols - 1) * S.gx) / 2), padT = Math.max(0, (ph - S.rows * S.h - (S.rows - 1) * S.gy) / 2);
    var fs = Math.max(5.5, Math.min(10, S.h * .2)), bh = withName ? S.h * .42 : S.h * .58;
    var st = document.getElementById('lbPrintCss') || document.createElement('style'); st.id = 'lbPrintCss';
    st.textContent = '@media print{ @page{ size:' + pw + 'mm ' + ph + 'mm; margin:0; } #pr{ display:block !important; } #pr .lpg{ width:' + pw + 'mm; height:' + ph + 'mm; box-sizing:border-box; padding:' + padT + 'mm ' + padL + 'mm; display:grid; grid-template-columns:repeat(' + S.cols + ',' + S.w + 'mm); grid-auto-rows:' + S.h + 'mm; column-gap:' + S.gx + 'mm; row-gap:' + S.gy + 'mm; page-break-after:always; break-after:page; overflow:hidden; }' +
      ' #pr .lb{ box-sizing:border-box; padding:1.2mm 2mm; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; text-align:center; font-family:Arial,sans-serif; color:#000; }' +
      ' #pr .lb .n{ font-weight:700; font-size:' + fs + 'pt; line-height:1.1; max-height:2.3em; overflow:hidden; width:100%; }' +
      ' #pr .lb svg{ width:100%; height:' + bh + 'mm; display:block; margin-top:.6mm; }' +
      ' #pr .lb .c{ font-family:monospace; font-size:' + Math.max(5.5, fs * .85) + 'pt; margin-top:.3mm; } }';
    document.head.appendChild(st);
    $('pr').style.gridTemplateColumns = '';
    $('pr').innerHTML = pages.map(function(pg){ return '<div class="lpg">' + pg.map(function(i){ return i ? '<div class="lb">' + (withName ? '<div class="n">' + esc(i.name) + '</div>' : '') + '<svg data-code="' + esc(i.code) + '" preserveAspectRatio="none"></svg><div class="c">' + esc(i.code) + '</div></div>' : '<div class="lb"></div>'; }).join('') + '</div>'; }).join('');
    $('pr').querySelectorAll('svg').forEach(function(sv){ try{ JsBarcode(sv, sv.getAttribute('data-code'), { format:'CODE128', width:2, height:60, margin:0, displayValue:false }); }catch(e){} });
    var done = function(){ st.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(function(){ window.print(); }, 100);
  }
  load();
})();
</script>
