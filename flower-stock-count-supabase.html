<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella · Flower Stock Count</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>:root{--bg:#fff9fb;--card:#fff;--ink:#3d2932;--muted:#8d747d;--rose:#c84f72;--rose2:#e47d9a;--line:#eadbe1;--green:#5c8c64}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#f9dce5,transparent 30%),linear-gradient(180deg,#fff9fb,#fff);color:var(--ink);font:14px Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:bold 24px Georgia}.muted{color:var(--muted);font-size:12px}h1{font:600 40px Georgia;margin:16px 0 5px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 28px #58374312;margin-top:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}button{border:0;border-radius:11px;padding:11px 14px;font-weight:bold;cursor:pointer}.primary{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff}.soft{background:#fff0f4;color:var(--rose)}.bar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.bar .field{min-width:180px;flex:1}.flower{display:grid;grid-template-columns:1fr 85px 85px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #f1e5e9}.flower:first-child{border-top:0}.name b{display:block}.name span{font-size:10px;color:var(--muted)}.num{text-align:center}.summary{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1e5e9}.history{max-height:500px;overflow:auto}.hist{padding:9px 0;border-bottom:1px solid #f1e5e9;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}@media(max-width:520px){.flower{grid-template-columns:1fr 70px 70px}.wrap{padding:16px 10px}h1{font-size:32px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">🌹 Lalabella</div><div class="muted">Supabase Flower Stock Count</div></div><a href="index.html">← Tools</a></div><h1>Flower Stock Count</h1><div class="muted">Physical count and wastage are stored in PostgreSQL. No Google Sheets / Apps Script.</div><div class="grid"><main><section class="card"><div class="bar"><div class="field"><label>Branch</label><select id="branch"></select></div><div class="field"><label>Count date</label><input id="date" type="date"></div><button class="primary" id="load">Load</button><button class="soft" id="recall">Recall Saved</button></div></section><section class="card"><div class="two"><div><label>Search flower</label><input id="search" placeholder="Type flower name…"></div><div><label>Counted by</label><input id="countedBy" placeholder="Name"></div></div><div id="list" style="margin-top:14px"><div class="muted">Load a date to begin.</div></div><button class="primary" id="save" style="width:100%;margin-top:15px">💾 Save Count</button><div id="msg" class="muted" style="margin-top:10px"></div></section></main><aside><section class="card"><div class="summary"><span>Inventory value</span><b id="value">0.000 BD</b></div><div class="summary"><span>Wastage value</span><b id="waste">0.000 BD</b></div><div class="summary"><span>Items counted</span><b id="counted">0</b></div></section><section class="card"><b>Recent counts</b><div id="history" class="history" style="margin-top:10px">Loading…</div></section></aside></div></div><script>let sb,profile,catalog=[],rows=[];const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),money=n=>(Number(n)||0).toFixed(3);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}function say(t,bad=false){$('msg').textContent=t;$('msg').style.color=bad?'#a13a50':'var(--muted)'}async function boot(){await LalabellaSupabase.ready();sb=LalabellaSupabase.client;profile=await LalabellaAuth.getProfile();if(!profile){location.href='index.html';return}let {data,error}=await sb.from('branch_config').select('name').order('name');if(error)throw error;$('branch').innerHTML=data.map(x=>`<option>${esc(x.name)}</option>`).join('');if(profile.branch)$('branch').value=profile.branch;$('date').value=today();await loadHistory()}async function loadCatalog(){let {data,error}=await sb.from('flower_item').select('id,flower_name,rate,item_code,origin,status').eq('status','Active').order('flower_name').order('id');if(error)throw error;catalog=data||[]}function render(){let q=$('search').value.trim().toLowerCase(),v=rows.filter(x=>!q||x.flower_name.toLowerCase().includes(q));$('list').innerHTML=v.map((x,i)=>`<div class="flower"><div class="name"><b>${esc(x.flower_name)}</b><span>${esc(x.item_code||'')} · ${esc(x.origin||'')} · Rate ${money(x.rate)}</span></div><input class="num" type="number" min="0" step="0.001" data-i="${rows.indexOf(x)}" data-f="physical_count" value="${x.physical_count??''}" placeholder="Count"><input class="num" type="number" min="0" step="0.001" data-i="${rows.indexOf(x)}" data-f="wastage" value="${x.wastage??''}" placeholder="Waste"></div>`).join('')||'<div class="muted">No matching flowers.</div>';document.querySelectorAll('[data-i]').forEach(el=>el.oninput=e=>{rows[Number(e.target.dataset.i)][e.target.dataset.f]=e.target.value;summary()});summary()}function summary(){let value=0,waste=0,c=0;rows.forEach(x=>{let n=Number(x.physical_count);let w=Number(x.wastage);if(x.physical_count!==''&&!isNaN(n)){value+=n*Number(x.rate);c++}if(x.wastage!==''&&!isNaN(w))waste+=w*Number(x.rate)});$('value').textContent=money(value)+' BD';$('waste').textContent=money(waste)+' BD';$('counted').textContent=c}async function fresh(){await loadCatalog();rows=catalog.map(x=>({flower_name:x.flower_name,item_code:x.item_code,origin:x.origin,rate:Number(x.rate)||0,physical_count:'',wastage:''}));render()}async function recall(){let d=$('date').value,b=$('branch').value;let {data,error}=await sb.from('flower_stock_history').select('flower_name,item_code,origin,rate_at_count,physical_count,wastage,contributing_item_codes,counted_by').eq('branch',b).gte('count_date',d+'T00:00:00').lt('count_date',d+'T23:59:59.999').order('id');if(error)throw error;if(!data?.length)return say('No saved count found for this branch/date.',true);rows=data.map(x=>({flower_name:x.flower_name,item_code:x.item_code,origin:x.origin,rate:Number(x.rate_at_count)||0,physical_count:x.physical_count??'',wastage:x.wastage??''}));$('countedBy').value=data.find(x=>x.counted_by)?.counted_by||'';render();say('Saved count recalled.')}async function save(){let d=$('date').value,b=$('branch').value,n=$('countedBy').value.trim(),items=rows.filter(x=>x.physical_count!==''||Number(x.wastage)>0);if(!d||!items.length)return say('Enter a date and at least one count.',true);let payload=items.map(x=>({count_date:d,branch:b,flower_name:x.flower_name,physical_count:Number(x.physical_count)||0,wastage:Number(x.wastage)||0,stock_value:(Number(x.physical_count)||0)*x.rate,count_type:'Weekly',item_code:x.item_code,origin:x.origin,rate_at_count:x.rate,contributing_item_codes:x.item_code,counted_by:n||null}));let {error}=await sb.from('flower_stock_history').insert(payload);if(error)return say(error.message,true);say('Saved '+payload.length+' flower count(s).');await loadHistory()}async function loadHistory(){let b=$('branch').value;if(!b)return;let {data,error}=await sb.from('flower_stock_history').select('count_date,flower_name,physical_count,wastage,counted_by').eq('branch',b).order('id',{ascending:false}).limit(30);if(error){$('history').textContent=error.message;return}$('history').innerHTML=(data||[]).map(x=>`<div class="hist"><b>${esc(x.flower_name)}</b> · Count ${money(x.physical_count)} · Waste ${money(x.wastage)}<br><span class="muted">${esc(x.count_date)} · ${esc(x.counted_by||'')}</span></div>`).join('')||'<div class="muted">No history.</div>'}$('load').onclick=()=>fresh().catch(e=>say(e.message,true));$('recall').onclick=()=>recall().catch(e=>say(e.message,true));$('save').onclick=()=>save().catch(e=>say(e.message,true));$('search').oninput=render;$('branch').onchange=()=>loadHistory();boot().catch(e=>say(e.message,true));</script></body></html>
