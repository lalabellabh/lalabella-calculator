<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="lb-theme-keep" content="#app">
<title>Chocolate Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; }
  *{ box-sizing:border-box; }

  /* ===== Glass dashboard. Light + Dark are both defined here (the page opts out of the
     automatic colour-flipper, so each mode is designed on purpose). ===== */
  #app{
    --bg1:#f7ece6; --bg2:#efe3f2; --blob1:rgba(201,80,107,.30); --blob2:rgba(198,138,31,.28); --blob3:rgba(122,76,138,.26);
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-brd:rgba(255,255,255,.85);
    --shadow:0 10px 34px rgba(80,40,50,.14);
    --ink:#2a1d24; --dim:#7a6770; --line:rgba(80,40,50,.12);
    --rose:#c9506b; --gold:#c68a1f; --teal:#2f8a82; --plum:#7a4c8a; --sky:#3d7ab0; --amber:#d68f2e; --ok:#3d8a57; --bad:#c5483a;
    --track:rgba(80,40,50,.10); --chip:rgba(80,40,50,.07);
    --warn-bg:rgba(214,143,46,.18); --bad-bg:rgba(197,72,58,.16); --ok-bg:rgba(61,138,87,.16);
  }
  #app[data-mode="dark"]{
    --bg1:#130f12; --bg2:#1c1222; --blob1:rgba(201,80,107,.32); --blob2:rgba(198,138,31,.22); --blob3:rgba(122,76,138,.34);
    --glass:rgba(255,255,255,.055); --glass-strong:rgba(255,255,255,.10); --glass-brd:rgba(255,255,255,.13);
    --shadow:0 12px 38px rgba(0,0,0,.45);
    --ink:#f5ece8; --dim:#a8979f; --line:rgba(255,255,255,.10);
    --rose:#ee7690; --gold:#e8b04a; --teal:#4cc0b6; --plum:#b98ad0; --sky:#6aa8dc; --amber:#f0aa55; --ok:#5cc383; --bad:#f0705f;
    --track:rgba(255,255,255,.10); --chip:rgba(255,255,255,.08);
    --warn-bg:rgba(240,170,85,.18); --bad-bg:rgba(240,112,95,.18); --ok-bg:rgba(92,195,131,.16);
  }

  #app{
    position:fixed; inset:0; overflow:hidden; color:var(--ink);
    font-family:'Space Grotesk',sans-serif; font-size:13px;
    background:
      radial-gradient(520px 420px at 8% 0%, var(--blob1), transparent 70%),
      radial-gradient(560px 460px at 96% 12%, var(--blob2), transparent 70%),
      radial-gradient(620px 520px at 60% 108%, var(--blob3), transparent 70%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:12px; padding:12px 16px 14px;
  }
  #app .glass{
    background:var(--glass); border:1px solid var(--glass-brd); border-radius:18px; box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%);
  }

  /* ---- top bar ---- */
  #app .topbar{ display:flex; align-items:center; gap:12px; padding:8px 14px 8px 64px; min-height:60px; flex-wrap:wrap; }
  #app .ttl{ min-width:0; }
  #app .ttl h1{ margin:0; font-family:'Fraunces',serif; font-weight:900; font-size:21px; line-height:1.1; }
  #app .ttl .sub{ font-size:11px; color:var(--dim); margin-top:2px; }
  #app .ttl .sub a{ color:var(--dim); text-decoration:none; }
  #app .ttl .sub a:hover{ color:var(--rose); }
  #app .spacer{ flex:1; }
  #app .seg{ display:flex; gap:4px; background:var(--chip); padding:4px; border-radius:13px; }
  #app .seg button{
    border:0; background:transparent; color:var(--dim); font:600 12px 'Space Grotesk',sans-serif;
    padding:8px 14px; border-radius:10px; cursor:pointer; transition:.18s;
  }
  #app .seg button.on{ background:linear-gradient(135deg,var(--rose),var(--plum)); color:#fff; box-shadow:0 4px 12px rgba(201,80,107,.35); }
  #app .btn{
    border:1px solid var(--glass-brd); background:var(--glass-strong); color:var(--ink); font:600 12px 'Space Grotesk',sans-serif;
    padding:9px 14px; border-radius:12px; cursor:pointer;
  }
  #app .btn:hover{ border-color:var(--gold); color:var(--gold); }
  #app .note{ font-size:10.5px; color:var(--dim); text-align:right; max-width:260px; line-height:1.3; }

  /* ---- KPI row ---- */
  #app .kpis{ display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:10px; }
  #app .kpi{
    padding:12px 13px; position:relative; overflow:hidden; cursor:default; min-width:0;
  }
  #app .kpi.click{ cursor:pointer; }
  #app .kpi::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--rose)); }
  #app .kpi .k-ic{
    width:28px; height:28px; border-radius:9px; display:grid; place-items:center; font-size:14px;
    background:color-mix(in srgb, var(--accent,var(--rose)) 22%, transparent);
  }
  #app .kpi .k-lb{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #app .kpi .k-v{ font:700 18px 'Space Mono',monospace; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #app .kpi .k-s{ font-size:10px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:12px; }
  #app .kpi.warn{ background:var(--warn-bg); }
  #app .kpi.danger{ background:var(--bad-bg); }

  /* ---- main grid ---- */
  #app .main{
    display:grid; gap:12px; min-height:0;
    grid-template-columns:1.05fr 1fr 1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"cat ov al" "cat mv st";
  }
  #app .main.has-odoo{ grid-template-columns:1.05fr 1fr 1fr 1fr; grid-template-areas:"cat ov al od" "cat mv st od"; }
  #app .panel.p-od{ grid-area:od; display:none; } #app .main.has-odoo .panel.p-od{ display:flex; }
  #app .od-kv{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  #app .od-kv div{ background:var(--chip); border-radius:10px; padding:6px 9px; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  #app .od-kv b{ display:block; font:700 14px 'Space Mono',monospace; color:var(--ink); text-transform:none; letter-spacing:0; margin-top:2px; }
  #app .p-cat{ grid-area:cat; } #app .p-ov{ grid-area:ov; } #app .p-al{ grid-area:al; } #app .p-mv{ grid-area:mv; } #app .p-st{ grid-area:st; }
  #app .panel{ display:flex; flex-direction:column; min-height:0; min-width:0; padding:14px 14px 10px; }
  #app .ph{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  #app .ph h2{ margin:0; font:600 15px 'Fraunces',serif; }
  #app .ph .cnt{ font:700 11px 'Space Mono',monospace; color:var(--gold); background:var(--chip); padding:2px 8px; border-radius:10px; }
  #app .tabs{ display:flex; flex-wrap:wrap; gap:4px; background:var(--chip); padding:3px; border-radius:11px; }
  #app .tabs button{
    border:0; background:transparent; color:var(--dim); font:600 11px 'Space Grotesk',sans-serif;
    padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  #app .tabs button.on{ background:var(--glass-strong); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.12); }
  #app .tabs button .b{ font-family:'Space Mono',monospace; font-size:10px; margin-left:4px; opacity:.8; }
  /* every long box scrolls by itself; the page never does */
  #app .scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding-right:4px; overscroll-behavior:contain; scrollbar-gutter:stable; }
  #app .scroll::-webkit-scrollbar{ width:6px; }
  #app .scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  #app .scroll::-webkit-scrollbar-thumb:hover{ background:var(--gold); }

  #app .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:9px 2px; border-top:1px solid var(--line); }
  #app .row:first-child{ border-top:0; }
  #app .row .nm{ min-width:0; overflow-wrap:anywhere; font-weight:600; }
  #app .row .mt{ color:var(--dim); font-size:11px; font-weight:400; }
  #app .row .rt{ text-align:right; white-space:nowrap; flex-shrink:0; }
  #app .empty{ color:var(--dim); text-align:center; padding:22px 0; font-size:12.5px; }
  #app .pill{ font-size:10px; padding:2px 8px; border-radius:9px; font-weight:700; }
  #app .pill.bad{ background:var(--bad-bg); color:var(--bad); }
  #app .pill.warn{ background:var(--warn-bg); color:var(--amber); }
  #app .pill.ok{ background:var(--ok-bg); color:var(--ok); }

  #app .bar{ height:8px; border-radius:6px; background:var(--track); overflow:hidden; }
  #app .bar > i{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--rose),var(--gold)); }
  #app .bar.teal > i{ background:linear-gradient(90deg,var(--teal),var(--sky)); }
  #app .bar.ok > i{ background:linear-gradient(90deg,var(--ok),var(--teal)); }

  /* category panel */
  #app .ring-row{ display:flex; align-items:center; gap:14px; padding:4px 2px 12px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  #app .ring{ width:68px; height:68px; flex-shrink:0; }
  #app .ring text{ font:700 14px 'Space Mono',monospace; fill:var(--ink); }
  #app .cat-t{ display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; background:none; border:0; padding:9px 2px 4px; color:var(--ink); font:600 13px 'Space Grotesk',sans-serif; cursor:pointer; text-align:left; }
  #app .cat-row{ border-top:1px solid var(--line); }
  #app .cat-row:first-child{ border-top:0; }
  #app .cat-bar{ padding:0 2px 9px; }
  #app .cat-d{ padding:0 2px 10px 12px; display:none; }
  #app .cat-d.open{ display:block; }
  #app .cat-d div{ font-size:12px; padding:2px 0; }
  #app .cat-d .a{ color:var(--ok); } #app .cat-d .m{ color:var(--dim); }

  /* weekly + activity */
  #app .wk{ display:grid; gap:10px; margin-bottom:10px; }
  #app .wk .t{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
  #app .wk .t b{ font-family:'Space Mono',monospace; }
  #app .sect{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:6px 0 2px; }

  #app .search{
    width:100%; padding:9px 12px; border:1px solid var(--glass-brd); border-radius:11px; background:var(--glass-strong);
    color:var(--ink); font:13px 'Space Grotesk',sans-serif; outline:none; margin-bottom:8px;
  }
  #app .search::placeholder{ color:var(--dim); }
  #app .search:focus{ border-color:var(--gold); }
  #app .loading{ position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); pointer-events:none; }

  /* ---- phone / small screens: stacked and scrollable like before ---- */
  @media (max-width:899px){
    #app{ position:relative; inset:auto; min-height:100dvh; overflow:visible; display:block; padding:10px 12px 24px; }
    #app > *{ margin-bottom:12px; }
    #app .topbar{ padding:8px 12px 8px 62px; }
    #app .note{ text-align:left; max-width:none; }
    #app .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    #app .main{ display:flex; flex-direction:column; }
    #app .panel{ max-height:440px; }
    #app .p-cat{ max-height:520px; }
  }
  @media (min-width:900px) and (max-width:1250px){
    #app .kpis{ grid-template-columns:repeat(4,minmax(0,1fr)); }
    #app .kpi{ padding:9px 11px; } #app .kpi .k-ic{ display:none; } #app .kpi .k-lb{ margin-top:0; }
    #app .main{ grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); grid-template-areas:"cat ov" "cat al" "mv st"; }
    #app .main.has-odoo{ grid-template-columns:1fr 1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); grid-template-areas:"cat ov od" "cat al od" "mv st od"; }
  }
</style>

<style id="chocoSharedNavStyles">
.choco-nav-toggle{
  position:fixed; top:16px; left:20px; z-index:9210;
  width:44px; height:44px; border-radius:12px; border:1px solid rgba(158,47,74,0.16);
  background:rgba(255,255,255,0.92); color:#9e2f4a; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  box-shadow:0 5px 16px rgba(158,47,74,.14);
}
.choco-nav-backdrop{
  position:fixed; inset:0; z-index:9205; background:rgba(60,30,40,0.28); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.choco-nav-backdrop.show{ opacity:1; pointer-events:auto; }
.choco-drawer{
  position:fixed; top:0; left:0; bottom:0; width:min(270px,80vw); z-index:9206;
  background:rgba(255,255,255,.96);
  border-right:1px solid #f0dede; box-shadow:12px 0 40px rgba(158,47,74,.14);
  transform:translateX(-100%); transition:transform .25s ease;
  padding:70px 16px 20px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  font-family:Arial,sans-serif;
}
.choco-drawer.show{ transform:translateX(0); }
.choco-drawer a{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
  color:#3a2530; text-decoration:none; font-size:14px; font-weight:600;
}
.choco-drawer a:hover{ background:rgba(201,80,107,.08); }
.choco-drawer .choco-drawer-title{
  color:#9e2f4a; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  padding:0 12px 8px; opacity:0.8;
}
.choco-hub-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
.choco-hub-grid a{
  flex-direction:column; text-align:center; gap:4px; padding:12px 4px;
  font-size:10.5px; background:rgba(201,80,107,.05); border:1px solid #f0dede;
  min-height:76px; justify-content:center; white-space:nowrap;
}
.choco-hub-grid a span.hub-icon{ font-size:20px; }
</style>
</head>
<body>

<button class="choco-nav-toggle" id="chocoNavToggle" aria-label="Open menu">☰</button>
<div class="choco-nav-backdrop" id="chocoNavBackdrop"></div>
<nav class="choco-drawer" id="chocoDrawer">
  <div data-lb-menu></div>
</nav>
<script src="shared/nav.js"></script>

<div id="app" data-lb-theme-skip data-mode="light">

  <div class="topbar glass">
    <div class="ttl">
      <h1>🍫 Chocolate Dashboard</h1>
      <div class="sub"><a href="index.html">&larr; Back to Tools</a> · Live overview across all branches</div>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="branchTabs">
      <button class="on" data-branch="All">All</button>
      <button data-branch="ModaMall">ModaMall</button>
      <button data-branch="Hamala">Hamala</button>
      <button data-branch="Galali">Galali</button>
    </div>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
    <div class="note" id="lastRefreshedNote"></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="main">
    <section class="panel glass p-cat">
      <div class="ph"><h2>🍬 Variants Available</h2><span class="cnt" id="catCnt">0</span></div>
      <div class="scroll" id="catScroll"></div>
    </section>

    <section class="panel glass p-ov">
      <div class="ph"><h2>📅 This Week &amp; Activity</h2></div>
      <div class="scroll" id="ovScroll"></div>
    </section>

    <section class="panel glass p-al">
      <div class="ph"><h2>🚨 Alerts</h2>
        <div class="tabs" id="alTabs">
          <button data-t="low" class="on">Low<span class="b" id="alLowN">0</span></button>
          <button data-t="near">Near expiry<span class="b" id="alNearN">0</span></button>
          <button data-t="exp">Expired<span class="b" id="alExpN">0</span></button>
          <button data-t="apr">Approvals<span class="b" id="alAprN">0</span></button>
          <button data-t="chk" title="Missing or wrong data (expiry, price, names, starting stock)">⚠ Check<span class="b" id="alChkN">0</span></button>
        </div>
      </div>
      <div class="scroll" id="alScroll"></div>
    </section>

    <section class="panel glass p-mv">
      <div class="ph"><h2>🔥 Movement</h2>
        <div class="tabs" id="mvTabs">
          <button data-t="top" class="on">Top moving</button>
          <button data-t="tr">Transfers</button>
          <button data-t="br" id="mvBranchTab">Branches</button>
        </div>
      </div>
      <div class="scroll" id="mvScroll"></div>
    </section>

    <section class="panel glass p-st">
      <div class="ph"><h2>🔎 Live Stock Levels</h2><span class="cnt" id="stCnt">0</span></div>
      <input type="text" class="search" id="stSearch" placeholder="Type a chocolate name (e.g. Rocher)…" autocomplete="off">
      <div class="scroll" id="stScroll"></div>
    </section>

    <section class="panel glass p-od" id="odPanel">
      <div class="ph"><h2>🔗 Odoo Today</h2><span class="cnt" id="odCnt">ModaMall</span>
        <div class="tabs" id="odTabs">
          <button data-t="sales" class="on">Sales</button>
          <button data-t="used">Used</button>
          <button data-t="cmp">vs Ours</button>
        </div>
      </div>
      <div class="od-kv" id="odKv"></div>
      <div class="scroll" id="odScroll"></div>
    </section>
  </div>

  <div class="loading" id="loadingMsg">Loading dashboard...</div>
</div>

<script>
(function(){
  const API_URL = LB_CONFIG.CHOCOLATE_FAST_API;
  const app = document.getElementById('app');

  /* ---------- light / dark (own design for both) ---------- */
  function applyMode(){
    const dark = !!(window.LBTheme && LBTheme.isDark && LBTheme.isDark());
    app.setAttribute('data-mode', dark ? 'dark' : 'light');
  }
  window.addEventListener('lb:theme-changed', applyMode);
  document.addEventListener('DOMContentLoaded', applyMode);
  applyMode(); setTimeout(applyMode, 300);

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtBD  = n => Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' BD';
  const fmtNum = n => Number(n || 0).toLocaleString('en-US');
  const fmtKg  = n => Number(n || 0).toLocaleString('en-US',{maximumFractionDigits:2}) + ' kg';
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    return isNaN(dt) ? esc(d) : dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }
  const empty = t => `<div class="empty">${t}</div>`;
  const rows = (list, fn, emptyText) => (!list || !list.length) ? empty(emptyText) : list.map(fn).join('');

  /* ---------- UI state that must survive every refresh ---------- */
  const ui = { branch:'All', alTab:'low', mvTab:'top', q:'', openCats:new Set() };
  let data = null, lastJson = '';

  // Re-rendering never moves what you are looking at: scroll positions are put back.
  function keepScroll(ids, fn){
    const pos = {};
    ids.forEach(id => { const el = document.getElementById(id); if(el) pos[id] = el.scrollTop; });
    fn();
    ids.forEach(id => { const el = document.getElementById(id); if(el && pos[id]) el.scrollTop = pos[id]; });
  }

  /* ---------- fast loading (saved copy first, auto refresh each minute) ---------- */
  const CACHE_PREFIX = 'lbDash:choc2:';
  const REFRESH_MS = 60000;
  let loadSeq = 0, inFlight = false, lastLoadedAt = 0;
  function readCache(b){ try{ const c = JSON.parse(localStorage.getItem(CACHE_PREFIX + b) || 'null'); return c && c.data ? c : null; }catch(e){ return null; } }
  function writeCache(b, d){ try{ localStorage.setItem(CACHE_PREFIX + b, JSON.stringify({ t:Date.now(), data:d })); }catch(e){} }
  const setNote = t => { document.getElementById('lastRefreshedNote').textContent = t; };
  const timeStr = ms => new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const loadingEl = document.getElementById('loadingMsg');

  async function fetchData(showSaved){
    const seq = ++loadSeq, branch = ui.branch;
    let cached = showSaved ? readCache(branch) : null;
    if(cached){
      try{ data = cached.data; render(true); setNote('Showing saved data from ' + timeStr(cached.t) + ' · updating…'); loadingEl.style.display = 'none'; }
      catch(e){ cached = null; data = null; }
    }
    if(!cached && showSaved){ loadingEl.style.display = ''; loadingEl.textContent = 'Loading dashboard...'; }
    inFlight = true;
    try{
      const fresh = await (await fetch(
        API_URL + '?action=getDashboardData&branch=' + encodeURIComponent(branch) +
          '&token=' + encodeURIComponent(window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || '') +
          '&_ts=' + Date.now(),
        { headers: { apikey: LB_CONFIG.SUPABASE_PUBLISHABLE_KEY } }
      )).json();
      if(seq !== loadSeq) return;
      if(fresh && fresh.error) throw new Error(fresh.error);
      data = fresh; loadingEl.style.display = 'none';
      loadPending(branch); loadCheck(branch);
      render(false);
      writeCache(branch, fresh);
      lastLoadedAt = Date.now();
      setNote('Auto-updating every minute · last refreshed ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    }catch(e){
      if(seq !== loadSeq) return;
      console.error(e);
      if(!showSaved) return;
      if(cached) setNote('Could not refresh — showing saved data from ' + timeStr(cached.t) + '. Tap Refresh to try again.');
      else { loadingEl.style.display = ''; loadingEl.textContent = 'Could not load dashboard data.'; }
    }finally{ if(seq === loadSeq) inFlight = false; }
  }
  let pendingList = [];
  async function loadPending(branch){
    try{
      const r = await (await fetch(API_URL + '?action=getPendingApprovals&token=' + encodeURIComponent(window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || '') + '&_ts=' + Date.now(), { headers: { apikey: LB_CONFIG.SUPABASE_PUBLISHABLE_KEY } })).json();
      if(!Array.isArray(r)) return;
      pendingList = r.filter(x => branch === 'All' || String(x['Branch']).trim() === branch);
      if(data){ document.getElementById('alAprN').textContent = fmtNum(pendingList.length); if(ui.alTab === 'apr') renderAlerts(); }
    }catch(e){ console.error(e); }
  }
  // ---------- Data check: missing / wrong data (datacheck-fast) ----------
  let chk = null, chkToastDone = false;
  async function loadCheck(branch){
    try{
      const r = await (await fetch(LB_CONFIG.SUPABASE_URL + '/functions/v1/datacheck-fast', { method:'POST', body: new URLSearchParams({ branch, token: window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '' }) })).json();
      if(!r || !r.success || branch !== ui.branch) return;
      r.issues = (r.issues || []).filter(i => i.module === 'chocolate');   // flower problems show on the Flower Dashboard
      r.bad = r.issues.filter(i => i.level === 'bad').length; r.warn = r.issues.length - r.bad;
      chk = r;
      const n = document.getElementById('alChkN'); n.textContent = fmtNum(r.issues.length);
      n.style.cssText = r.bad ? 'background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;opacity:1' : '';
      if(ui.alTab === 'chk') renderAlerts();
      if(r.bad && !chkToastDone){ chkToastDone = true; chkToast(r); }
    }catch(e){ console.error(e); }
  }
  function chkToast(r){
    try{ if(sessionStorage.getItem('lbChkToastChoc') === String(r.bad + '/' + r.warn)) return; sessionStorage.setItem('lbChkToastChoc', String(r.bad + '/' + r.warn)); }catch(e){}
    const t = document.createElement('button');
    t.type = 'button';
    t.setAttribute('style', 'position:fixed;right:16px;bottom:16px;z-index:9999;max-width:330px;text-align:left;border:0;border-radius:14px;padding:12px 14px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18);font:inherit;color:inherit;cursor:pointer;border-left:5px solid #c0392b');
    t.innerHTML = '<b>⚠ ' + r.bad + ' problem' + (r.bad === 1 ? '' : 's') + (r.warn ? ' + ' + r.warn + ' to check' : '') + '</b><div style="font-size:12px;opacity:.8;margin-top:3px">' + esc(r.issues[0].branch + ' · ' + r.issues[0].issue).slice(0, 120) + '</div><div style="font-size:11.5px;margin-top:5px;font-weight:600">Tap to see the list →</div>';
    t.onclick = () => { t.remove(); ui.alTab = 'chk'; renderAlerts(); syncTabs(); document.querySelector('.p-al').scrollIntoView({ behavior:'smooth', block:'center' }); };
    document.body.appendChild(t); setTimeout(() => t.remove(), 15000);
  }
  function chkHtml(){
    if(!chk) return '<div class="row"><div class="nm" style="color:var(--dim)">Checking…</div></div>';
    const icon = { chocolate:'🍫', flower:'🌸' };
    return rows(chk.issues, it => `<div class="row"><div class="nm">${icon[it.module] || ''} ${esc(it.item)}<div class="mt">${esc(it.branch)} · ${esc(it.issue)}</div><div class="mt" style="color:var(--dim)">→ ${esc(it.fix)} <a href="${esc(it.link || it.page)}">Open →</a></div></div>
      <div class="rt"><span class="pill ${it.level === 'bad' ? 'bad' : 'warn'}">${it.level === 'bad' ? 'Fix' : 'Check'}</span></div></div>`, 'Nothing missing 👍');
  }
  const loadData = () => fetchData(true);
  function silentRefresh(){ if(document.hidden || inFlight) return; return fetchData(false); }
  setInterval(silentRefresh, REFRESH_MS);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now() - lastLoadedAt > REFRESH_MS) silentRefresh(); });

  /* ---------- controls ---------- */
  document.getElementById('branchTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    ui.branch = b.dataset.branch; ui.openCats.clear();
    document.querySelectorAll('#branchTabs button').forEach(x => x.classList.toggle('on', x === b));
    if(ui.branch !== 'All' && ui.mvTab === 'br') ui.mvTab = 'top';
    lastJson = ''; loadData();
  });
  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn'); btn.textContent = 'Refreshing...';
    await loadData(); btn.textContent = '↻ Refresh';
  });
  document.getElementById('alTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return; ui.alTab = b.dataset.t; renderAlerts(); syncTabs();
  });
  document.getElementById('mvTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return; ui.mvTab = b.dataset.t; renderMove(); syncTabs();
  });
  document.getElementById('stSearch').addEventListener('input', function(){ ui.q = this.value.trim().toLowerCase(); renderStock(); });
  document.getElementById('catScroll').addEventListener('click', e=>{
    const t = e.target.closest('.cat-t'); if(!t) return;
    const i = t.dataset.i, d = document.getElementById('catD' + i);
    if(!d) return;
    const open = d.classList.toggle('open');
    if(open) ui.openCats.add(i); else ui.openCats.delete(i);
  });
  document.getElementById('kpis').addEventListener('click', e=>{
    const h = e.target.closest('[data-href]'); if(h){ location.href = h.dataset.href; return; }
    const k = e.target.closest('[data-goto]'); if(!k) return;
    ui.alTab = k.dataset.goto; renderAlerts(); syncTabs();
    document.getElementById('alScroll').scrollTop = 0;
  });
  function syncTabs(){
    document.querySelectorAll('#alTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === ui.alTab));
    document.querySelectorAll('#mvTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === ui.mvTab));
    document.getElementById('mvBranchTab').style.display = ui.branch === 'All' ? '' : 'none';
  }

  /* ---------- rendering ---------- */
  function render(force){
    if(!data) return;
    const j = JSON.stringify(data) + '|' + ui.branch;
    if(!force && j === lastJson) return;          // nothing changed: do not touch the screen
    lastJson = j;
    keepScroll(['catScroll','ovScroll','alScroll','mvScroll','stScroll'], ()=>{
      renderKpis(); renderCats(); renderOverview(); renderAlerts(); renderMove(); renderStock(); syncTabs();
    });
  }

  function kpi(ic, label, value, sub, accent, cls, goto){
    return `<div class="kpi glass ${cls||''} ${goto?'click':''}" style="--accent:${accent}" ${goto?`data-goto="${goto}"`:''}>
      <div class="k-ic">${ic}</div><div class="k-lb">${label}</div><div class="k-v">${value}</div><div class="k-s">${sub||''}</div></div>`;
  }
  function renderKpis(){
    const d = data;
    const pcs = Number(d.totalPieces) || 0, noW = Number(d.piecesNoWeight) || 0;
    const stockSub = pcs > 0 ? (fmtNum(pcs) + ' pcs' + (noW > 0 ? ' · incl. ' + fmtNum(noW) + ' pcs counted by piece (cans), not in kg' : '')) : 'all branches in view';
    const expCls = d.expiredCount > 0 ? 'danger' : (d.nearExpiryCount > 0 ? 'warn' : '');
    document.getElementById('kpis').innerHTML =
      kpi('📦','Stock', fmtKg(d.totalAvailable), stockSub, 'var(--rose)') +
      kpi('💰','Inventory value', fmtBD(d.totalValue), 'at batch prices', 'var(--plum)') +
      kpi('📥',"Today's receiving", fmtBD(d.todayReceiving), 'this week ' + fmtBD(d.weekReceiving), 'var(--teal)') +
      kpi('📤',"Today's releases", fmtBD(d.todayReleases), 'this week ' + fmtBD(d.weekReleases), 'var(--sky)') +
      kpi('🔁',"Today's transfers", fmtNum(d.todayTransfers), 'this week ' + fmtNum(d.weekTransfers), 'var(--amber)') +
      kpi('⏳','Pending approvals', fmtNum(d.pendingApprovalsCount), 'tap to view', 'var(--plum)', d.pendingApprovalsCount > 0 ? 'warn' : '', 'apr') +
      kpi('⚠️','Near expiry / expired', fmtNum(d.nearExpiryCount) + ' / ' + fmtNum(d.expiredCount), 'tap to view', 'var(--bad)', expCls, d.expiredCount > 0 ? 'exp' : 'near') +
      kpi('📉','Low stock items', fmtNum(d.lowStockCount), 'tap to view', 'var(--gold)', d.lowStockCount > 0 ? 'warn' : '', 'low');
  }

  function ringSvg(avail, total){
    const r = 28, c = 2 * Math.PI * r, p = total > 0 ? Math.min(1, avail / total) : 0;
    return `<svg class="ring" viewBox="0 0 68 68"><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/>
      <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--rose)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 34 34)"/>
      <text x="34" y="39" text-anchor="middle">${Math.round(p * 100)}%</text></svg>`;
  }
  function renderCats(){
    const list = data.categoryBreakdown || [];
    const avail = list.reduce((s,c) => s + (c.availableCount||0), 0), total = list.reduce((s,c) => s + (c.totalInCatalog||0), 0);
    document.getElementById('catCnt').textContent = fmtNum(data.distinctVariantsAvailable);
    let h = '';
    if(list.length) h += `<div class="ring-row">${ringSvg(avail,total)}<div><div style="font-weight:700;font-size:14px;">${fmtNum(avail)} of ${fmtNum(total)} in stock</div><div style="color:var(--dim);font-size:11px;margin-top:2px;">${fmtNum(data.distinctVariantsAvailable)} distinct variants available now</div></div></div>`;
    h += list.length ? list.map((cat,i) => {
      const complete = cat.availableCount === cat.totalInCatalog, pct = cat.totalInCatalog ? Math.round(cat.availableCount / cat.totalInCatalog * 100) : 0;
      return `<div class="cat-row">
        <button class="cat-t" data-i="${i}"><span>${esc(cat.category)}</span><span class="pill ${complete?'ok':'warn'}">${cat.availableCount} / ${cat.totalInCatalog}</span></button>
        <div class="cat-bar"><div class="bar ${complete?'ok':''}"><i style="width:${pct}%"></i></div></div>
        <div class="cat-d ${ui.openCats.has(String(i))?'open':''}" id="catD${i}">
          ${(cat.availableItems||[]).map(n => `<div class="a">✓ ${esc(n)}</div>`).join('')}
          ${(cat.missingItems||[]).map(n => `<div class="m">— ${esc(n)}</div>`).join('')}
        </div></div>`;
    }).join('') : empty('No category data yet.');
    document.getElementById('catScroll').innerHTML = h;
  }

  function actRow(label, info){
    return `<div class="row"><div class="nm">${label}</div><div class="rt">${info ? esc(info.chocolateName || '—') + ' · ' + fmtDate(info.date) : '<span style="color:var(--dim)">No activity yet</span>'}</div></div>`;
  }
  function renderOverview(){
    const d = data, mx = Math.max(Number(d.weekReceiving)||0, Number(d.weekReleases)||0, 1);
    const w = (lbl, val, cls) => `<div><div class="t"><span>${lbl}</span><b>${fmtBD(val)}</b></div><div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,(Number(val)||0)/mx*100))}%"></i></div></div>`;
    let h = `<div class="sect" style="margin-top:0">This week (Sun–Sat)</div><div class="wk">${w('Received', d.weekReceiving, 'teal')}${w('Released', d.weekReleases, '')}
      <div class="t"><span>Transferred</span><b>${fmtNum(d.weekTransfers)} transfer${d.weekTransfers == 1 ? '' : 's'}</b></div></div>
      <div class="sect">Last activity</div>${actRow('Last receiving', d.lastReceiving)}${actRow('Last release', d.lastRelease)}${actRow('Last transfer', d.lastTransfer)}`;
    const inv = d.lastInventoryCount;
    if(!inv){
      h += `<div class="row"><div class="nm">Last inventory count</div><div class="rt"><span style="color:var(--dim)">No activity yet</span></div></div>`;
    } else {
      const hv = inv.itemsWithVariance > 0, col = hv ? 'var(--bad)' : 'var(--ok)', sign = inv.totalVarianceValue > 0 ? '+' : '';
      h += `<div class="row"><div class="nm">Last inventory count</div><div class="rt">${esc(inv.branch)} · ${fmtDate(inv.date)}</div></div>
        <div class="row"><div class="nm mt">Items counted</div><div class="rt">${fmtNum(inv.itemsCounted)}</div></div>
        <div class="row"><div class="nm mt">Items with variance</div><div class="rt" style="color:${col}">${fmtNum(inv.itemsWithVariance)}</div></div>
        <div class="row"><div class="nm mt">Total variance value</div><div class="rt" style="color:${col}">${sign}${fmtBD(inv.totalVarianceValue)}</div></div>`;
    }
    document.getElementById('ovScroll').innerHTML = h;
  }

  function renderAlerts(){
    const d = data;
    document.getElementById('alLowN').textContent = fmtNum(d.lowStockCount);
    document.getElementById('alNearN').textContent = fmtNum(d.nearExpiryCount);
    document.getElementById('alExpN').textContent = fmtNum(d.expiredCount);
    document.getElementById('alAprN').textContent = fmtNum(pendingList.length || d.pendingApprovalsCount || 0);
    let h;
    if(ui.alTab === 'chk'){
      h = chkHtml();
    } else if(ui.alTab === 'apr'){
      h = rows(pendingList, it => {
        const v = Number(it['Variance']) || 0;
        return `<div class="row"><div class="nm">${esc(it['Chocolate Name'])}<div class="mt">${esc(it['Branch'])} · counted by ${esc(it['Counted By'] || '—')} · ${fmtDate(it['Count Date'])}</div></div>
        <div class="rt"><span class="pill ${v < 0 ? 'bad' : 'warn'}">${v > 0 ? '+' : ''}${esc(v)}</span><div class="mt">${esc(it['System Stock'])} → ${esc(it['Physical Count'])}</div></div></div>`;
      }, 'Nothing waiting for approval.') + '<a href="stock-approval.html" style="display:block;text-align:center;padding:10px;font-weight:600">Open Stock Approval →</a>';
    } else if(ui.alTab === 'low'){
      h = rows(d.lowStockList, it => `<div class="row"><div class="nm">${esc(it.name)}<div class="mt">${esc(it.branch)}</div></div>
        <div class="rt">${esc(it.available)} / ${esc(it.min)}<div class="mt">need ${esc(it.deficit)} more</div></div></div>`, 'No low stock items right now.');
    } else if(ui.alTab === 'near'){
      h = rows(d.nearExpiryList, it => `<div class="row"><div class="nm">${esc(it.name)}<div class="mt">${esc(it.branch)}</div></div>
        <div class="rt"><span class="pill warn">${esc(it.daysLeft)}d left</span><div class="mt">${fmtDate(it.expiryDate)}</div></div></div>`, 'No items nearing expiry.');
    } else {
      h = rows(d.expiredList, it => `<div class="row"><div class="nm">${esc(it.name)}<div class="mt">${esc(it.branch)}</div></div>
        <div class="rt"><span class="pill bad">${Math.abs(it.daysLeft)}d ago</span><div class="mt">${fmtDate(it.expiryDate)}</div></div></div>`, 'No expired items.');
    }
    document.getElementById('alScroll').innerHTML = h;
  }

  function renderMove(){
    const d = data; let h;
    if(ui.mvTab === 'tr'){
      const bsel = ui.branch;
      h = rows(d.recentTransfers, it => {
        const incoming = bsel !== 'All' && it.toBranch === bsel, outgoing = bsel !== 'All' && it.fromBranch === bsel;
        const dir = incoming ? `⬇ Received from ${esc(it.fromBranch)}` : outgoing ? `⬆ Sent to ${esc(it.toBranch)}` : `${esc(it.fromBranch)} → ${esc(it.toBranch)}`;
        return `<div class="row"><div class="nm">${esc(it.chocolateName)}<div class="mt">${dir} · by ${esc(it.by || '—')}</div></div>
        <div class="rt">${incoming ? '+' : outgoing ? '−' : ''}${esc(it.qty)}<div class="mt">${fmtDate(it.date)}</div></div></div>`;
      }, 'No transfers yet.');
    } else if(ui.mvTab === 'br' && ui.branch === 'All'){
      const bs = d.branchSummary || [], mxV = Math.max(...bs.map(b => Number(b.value)||0), 1);
      h = rows(bs, b => `<div style="padding:9px 2px;border-top:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(b.branch)}</b><span class="pill ${b.locked?'ok':'warn'}">${b.locked?'Locked':'Open'}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin:5px 0 4px"><span>${fmtKg(b.available)}</span><span>${fmtBD(b.value)}</span></div>
        <div class="bar teal"><i style="width:${Math.max(0,Math.min(100,(Number(b.value)||0)/mxV*100))}%"></i></div>
        <div class="mt" style="color:var(--dim);font-size:11px;margin-top:4px">Low ${fmtNum(b.lowStock)} · Near expiry ${fmtNum(b.nearExpiry)} · Expired ${fmtNum(b.expired)}</div></div>`, 'No branch data.');
    } else {
      const top = d.topMovingList || [], mx = Math.max(...top.map(t => Number(t.used)||0), 1);
      h = rows(top, (it,i) => `<div style="padding:8px 2px;border-top:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;gap:10px"><span style="font-weight:600;overflow-wrap:anywhere">${i+1}. ${esc(it.name)}</span><span style="white-space:nowrap">${fmtNum(it.used)} used</span></div>
        <div class="bar" style="margin-top:5px"><i style="width:${Math.max(2,(Number(it.used)||0)/mx*100)}%"></i></div></div>`, 'No movement data yet.');
    }
    document.getElementById('mvScroll').innerHTML = h;
  }

  function renderStock(){
    const all = data ? (data.itemStockLevels || []) : [];
    const list = ui.q ? all.filter(i => String(i.name||'').toLowerCase().includes(ui.q)) : all;
    document.getElementById('stCnt').textContent = ui.q ? list.length + ' / ' + all.length : String(all.length);
    document.getElementById('stScroll').innerHTML = rows(list, it => `<div class="row"><div class="nm">${esc(it.name)}</div>
      <div class="rt">${esc(Math.round((Number(it.stock)||0) * 1000) / 1000)} ${esc(it.unit||'')}</div></div>`, ui.q ? 'No match.' : 'No stock data yet.');
  }

  loadData();

  /* ---------- Odoo Today (trial, read-only) — hidden when Odoo is not connected ---------- */
  const OD_API = 'https://zoratiahjeldgsognfsj.supabase.co/functions/v1/odoo-fast';
  const od = { tab:'sales', d:null, busy:false };
  const odKind = { chocolate:'🍫', flower:'🌸', other:'📦' };
  const odPlain = n => String(n || '').replace(/^\[[^\]]*\]\s*/, '');
  function odRender(){
    const d = od.d; if(!d) return;
    const tot = d.orders.reduce((a, o) => a + Number(o.total || 0), 0);
    document.getElementById('odKv').innerHTML = `<div>Orders<b>${d.orders.length}</b></div><div>Sales<b>${fmtBD(tot)}</b></div>`;
    document.querySelectorAll('#odTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === od.tab));
    let h;
    const qty = x => `<b style="font-family:'Space Mono',monospace;font-size:12px">${esc(x.amount)}</b>${x.pcs ? ` <span class="mt">≈ ${x.pcs} pcs</span>` : ''}`;
    if(od.tab === 'sales'){
      h = rows(d.orders, o => {
        const t = o.at ? new Date(o.at.replace(' ', 'T') + 'Z').toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Bahrain' }) : '';
        const it = o.items.map(i => i.kind === 'kit'
          ? `🎁 ${esc(odPlain(i.name))} × ${i.qty}` + i.inside.map(c => `<div class="mt" style="padding-left:14px">↳ ${odKind[c.kind] || ''} ${esc(c.name)} — ${qty(c)}</div>`).join('')
          : `${odKind[i.kind] || ''} ${esc(odPlain(i.name))} — ${qty(i)}`).join('<br>');
        return `<div class="row"><div class="nm">${it || esc(o.name)}<div class="mt">${t} · ${esc(o.name)}${o.pay.length ? ' · ' + o.pay.map(esc).join(', ') : ''}</div></div><div class="rt">${fmtBD(o.total)}</div></div>`;
      }, 'No Odoo sales yet today.');
    } else if(od.tab === 'used'){
      h = rows(d.used, x => `<div class="row"><div class="nm">${odKind[x.kind] || ''} ${esc(odPlain(x.name))}</div><div class="rt">${qty(x)}</div></div>`, 'Nothing used yet today.');
    } else {
      h = rows(d.compare, x => {
        const c = x.same ? 'ok' : (x.diff == null ? '' : (x.less ? 'bad' : 'warn'));
        return `<div class="row"><div class="nm">${odKind[x.kind] || ''} ${esc(x.name)}<div class="mt">Used today <b>${esc(x.used)}</b> · Odoo stock ${esc(x.odoo)} · Our stock ${esc(x.ours)}</div></div><div class="rt">${x.diff == null ? '<span class="mt">not in our list</span>' : `<span class="pill ${c}">${x.same ? 'Same' : (x.less ? '−' : '+') + esc(x.diff)}</span>`}</div></div>`;
      }, 'Nothing used yet today.');
      if(d.compare.length) h += `<div class="mt" style="font-size:11px;color:var(--dim);padding:6px 2px">− = Odoo has less than our system (sold in Odoo, not yet deducted here).${d.movesFound ? '' : ' Odoo stock usually goes down only after Close Register.'}</div>`;
    }
    const sc = document.getElementById('odScroll'), top = sc.scrollTop; sc.innerHTML = h; sc.scrollTop = top;
  }
  async function odLoad(){
    if(od.busy || document.hidden) return; od.busy = true;
    try{
      const tk = window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';
      const r = await fetch(OD_API, { method:'POST', body:new URLSearchParams({ action:'today', token:tk }) });
      const d = await r.json();
      const main = document.querySelector('#app .main');
      if(!d || !d.success){ if(!od.d) main.classList.remove('has-odoo'); return; }   // not connected / no access: keep the panel hidden
      od.d = d; main.classList.add('has-odoo'); odRender();
    }catch(e){ /* offline: keep what is shown */ }
    finally{ od.busy = false; }
  }
  document.getElementById('odTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return; od.tab = b.dataset.t; document.getElementById('odScroll').scrollTop = 0; odRender();
  });
  document.getElementById('refreshBtn').addEventListener('click', odLoad);
  setTimeout(odLoad, 800); setInterval(odLoad, 120000);
})();
</script>

<script>
(function(){
  const btn=document.getElementById('chocoNavToggle');
  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');
  if(!btn||!backdrop||!drawer) return;
  function openDrawer(){ drawer.classList.add('show'); backdrop.classList.add('show'); }
  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);
})();
</script>
