<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Flower Catalog</title><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;font-family:system-ui;background:linear-gradient(145deg,#fdf1f0,#eaf3ec);color:#3a2530}.wrap{max-width:900px;margin:auto;padding:32px 18px 100px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}a{color:#9e2f4a;text-decoration:none}.card{background:#fff;border:1px solid #f0d9d9;border-radius:16px;padding:20px;box-shadow:0 8px 25px #9e2f4a12}h1{margin:0 0 5px}input{width:100%;padding:11px;border:1px solid #f0d9d9;border-radius:10px;box-sizing:border-box}.list{max-height:65vh;overflow:auto;margin-top:12px}.row{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f6e0da}.name{font-weight:700}.meta{font-size:12px;color:#8a7078}.num{text-align:center}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0d9d9;padding:12px 18px;display:flex;gap:12px;align-items:center}.bar span{flex:1;color:#8a7078;font-size:13px}button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:#3d7a4f;color:#fff}button:disabled{opacity:.45}.msg{margin-top:12px;font-size:13px}</style></head><body><div class="wrap"><div class="top"><a href="flower-tools.html">← Flower Tools</a><a href="flower-dashboard.html">Dashboard →</a></div><div class="card"><h1>Flower Catalog</h1><div class="meta">Manage minimum stock thresholds. Admin/Manager only for saving.</div><p><input id="search" placeholder="Search flower…"></p><div id="list" class="list">Loading…</div><div id="msg" class="msg"></div></div></div><div class="bar"><span id="count">No changes.</span><button id="save" disabled>Save Changes</button></div><script>
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return;}const {data:profile}=await sb.from('profiles').select('role,branch').eq('id',session.user.id).single();if(!profile){document.body.innerHTML='<p style="padding:30px">Profile unavailable.</p>';return;}const can=profile.role==='Admin'||profile.role==='Manager';let rows=[],changes={};const list=document.getElementById('list'),search=document.getElementById('search'),save=document.getElementById('save'),count=document.getElementById('count'),msg=document.getElementById('msg');async function load(){const {data,error}=await sb.from('flower_item').select('id,flower_name,rate,min_stock,origin,status').order('flower_name');if(error){list.textContent=error.message;return;}rows=data||[];render();}function render(){const q=search.value.trim().toLowerCase();const filtered=rows.filter(x=>!q||x.flower_name.toLowerCase().includes(q));list.innerHTML=filtered.map(x=>{const v=Object.prototype.hasOwnProperty.call(changes,x.id)?changes[x.id]:x.min_stock;return `<div class="row"><div><div class="name">${esc(x.flower_name)}</div><div class="meta">${esc(x.origin||'')} · Rate ${(Number(x.rate)||0).toFixed(3)} BD</div></div><input class="num" type="number" min="0" step="1" data-id="${x.id}" value="${v==null?'':v}" ${can?'':'disabled'}></div>`}).join('')||'<div class="meta">No flowers found.</div>';count.textContent=Object.keys(changes).length?`${Object.keys(changes).length} change(s) pending.`:'No changes.';save.disabled=!can||!Object.keys(changes).length;}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}search.oninput=render;list.oninput=e=>{if(e.target.dataset.id){changes[e.target.dataset.id]=e.target.value===''?null:Number(e.target.value);render();}};save.onclick=async()=>{save.disabled=true;msg.textContent='Saving…';for(const [id,v] of Object.entries(changes)){const {error}=await sb.from('flower_item').update({min_stock:v}).eq('id',id);if(error){msg.textContent='Save stopped: '+error.message;save.disabled=false;return;}}changes={};msg.textContent='Saved successfully.';await load();};await load();})();</script></body></html>
