<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<script src="shared/admin-gate.js" data-title="Chocolate Photos"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chocolate Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f6e0da; --mint:#eaf3ec;
    --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9; --ok:#3d7a4f; --bad:#b3261e;
    --choc:#6b4226; --choc-deep:#4a2c18;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:linear-gradient(160deg, var(--blush) 0%, var(--mint) 100%); color:var(--ink); font-family:'Space Grotesk',sans-serif; min-height:100vh; }
  .wrap{ max-width:720px; margin:0 auto; padding:26px 18px 80px; }
  header{ text-align:center; margin-bottom:18px; padding:22px 18px; background:linear-gradient(135deg,#fff 0%,var(--blush) 60%,var(--blush-2) 100%); border-radius:18px; border:1px solid var(--line); }
  .eyebrow{ font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; font-weight:600; }
  h1{ font-family:'Great Vibes',cursive; font-weight:400; color:var(--rose-deep); font-size:clamp(2rem,7vw,2.6rem); margin:0; line-height:1; }
  .sub{ font-size:12px; color:var(--ink-dim); margin-top:8px; }
  .bar{ display:flex; gap:8px; margin-bottom:12px; }
  .bar input{ flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; outline:none; background:#fff; }
  .bar select{ border:1px solid var(--line); border-radius:10px; padding:10px; font-size:13px; font-family:inherit; background:#fff; }
  .count{ font-size:12px; color:var(--ink-dim); margin:0 2px 10px; }
  .row{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; }
  .pic{ width:64px; height:64px; border-radius:10px; background:var(--blush); border:1px dashed var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:11px; overflow:hidden; }
  .pic img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .meta{ flex:1; min-width:0; }
  .nm{ font-weight:700; font-size:14px; word-break:break-word; }
  .ct{ font-size:11px; color:var(--ink-dim); }
  .st{ font-size:11px; margin-top:2px; min-height:14px; }
  .st.ok{ color:var(--ok); } .st.bad{ color:var(--bad); }
  .acts{ display:flex; flex-direction:column; gap:6px; }
  .btn{ padding:8px 12px; border:none; border-radius:9px; font-weight:700; font-size:12px; cursor:pointer; background:linear-gradient(135deg,var(--choc),var(--choc-deep)); color:#fff; white-space:nowrap; font-family:inherit; }
  .btn.alt{ background:#fff; color:var(--choc-deep); border:1px solid var(--line); }
  .btn.ghost{ background:#fff; color:var(--bad); border:1px solid var(--line); }
  .btn[disabled]{ opacity:.5; cursor:default; }
  .empty{ text-align:center; color:var(--ink-dim); padding:30px 0; font-size:13px; }
  input[type=file]{ display:none; }
</style>
</head>
<body>
<div class="wrap" id="photoPage" data-lbchoc-skip>
  <header>
    <div class="eyebrow">Admin</div>
    <h1>Chocolate Photos</h1>
    <div class="sub">I-upload ang litrato ng bawat chocolate. Lalabas ito sa lahat ng chocolate pages.</div>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Search chocolate…" autocomplete="off">
    <select id="flt"><option value="all">Lahat</option><option value="none">Walang picture</option><option value="has">May picture</option></select>
  </div>
  <div class="count" id="count">Loading…</div>
  <div id="list"></div>
</div>
<script>
(function () {
  var API = (window.LB_CONFIG || {}).CHOC_PHOTO_FAST_API;
  var CACHE_KEY = 'lbChocPhotosV1';
  var items = [];
  function token() { try { return sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; } catch (e) { return ''; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function call(body) {
    body.token = token();
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var f = document.getElementById('flt').value;
    var rows = items.filter(function (it) {
      if (q && (it.name + ' ' + it.category).toLowerCase().indexOf(q) === -1) return false;
      if (f === 'none' && it.photo) return false;
      if (f === 'has' && !it.photo) return false;
      return true;
    });
    var have = items.filter(function (i) { return i.photo; }).length;
    document.getElementById('count').textContent = have + ' of ' + items.length + ' may picture · ' + rows.length + ' shown';
    var el = document.getElementById('list');
    if (!rows.length) { el.innerHTML = '<div class="empty">Walang nakita.</div>'; return; }
    el.innerHTML = rows.map(function (it) {
      return '<div class="row" data-id="' + it.id + '">' +
        '<div class="pic">' + (it.photo ? '<img src="' + esc(it.photo) + '" alt="" loading="lazy">' : 'No photo') + '</div>' +
        '<div class="meta"><div class="nm">' + esc(it.name) + '</div><div class="ct">' + esc(it.category) + '</div><div class="st"></div></div>' +
        '<div class="acts"><button class="btn" data-a="cam">📷 Camera</button>' +
        '<button class="btn alt" data-a="up">🖼️ ' + (it.photo ? 'Change' : 'Gallery') + '</button>' +
        (it.photo ? '<button class="btn ghost" data-a="rm">Remove</button>' : '') + '</div></div>';
    }).join('');
  }

  function load() {
    call({ action: 'list' }).then(function (d) {
      if (!d || !d.success) { document.getElementById('count').textContent = (d && d.error) || 'Could not load.'; return; }
      items = d.items || []; render();
    }).catch(function () { document.getElementById('count').textContent = 'Could not load. Check internet.'; });
  }

  function status(id, msg, cls) {
    var r = document.querySelector('.row[data-id="' + id + '"] .st');
    if (r) { r.textContent = msg; r.className = 'st ' + (cls || ''); }
  }
  function busy(id, on) {
    document.querySelectorAll('.row[data-id="' + id + '"] .btn').forEach(function (b) { b.disabled = on; });
  }

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 640, w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { URL.revokeObjectURL(url); return reject(new Error('bad')); }
        var s = Math.min(1, max / Math.max(w, h));
        var cw = Math.round(w * s), ch = Math.round(h * s);
        var c = document.createElement('canvas'); c.width = cw; c.height = ch;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cw, ch); x.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        var out = c.toDataURL('image/jpeg', 0.8);
        if (out.length > 520000) out = c.toDataURL('image/jpeg', 0.6);
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('bad')); };
      img.src = url;
    });
  }

  var pickId = null;
  var fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*';
  var camInput = document.createElement('input');
  camInput.type = 'file'; camInput.accept = 'image/*'; camInput.setAttribute('capture', 'environment');
  document.body.appendChild(fileInput); document.body.appendChild(camInput);
  function onPicked(inp) {
    var file = inp.files && inp.files[0]; var id = pickId;
    inp.value = '';
    if (!file || !id) return;
    busy(id, true); status(id, 'Uploading…');
    shrink(file).then(function (data) {
      return call({ action: 'upload', itemId: id, image: data });
    }).then(function (d) {
      if (!d || !d.success) { busy(id, false); status(id, (d && d.error) || 'Failed.', 'bad'); return; }
      clearCache();
      items.forEach(function (it) { if (it.id === id) it.photo = d.photo; });
      render(); status(id, 'Saved ✓', 'ok');
    }).catch(function () { busy(id, false); status(id, 'Failed. Try another photo.', 'bad'); });
  }
  fileInput.addEventListener('change', function () { onPicked(fileInput); });
  camInput.addEventListener('change', function () { onPicked(camInput); });

  document.getElementById('list').addEventListener('click', function (e) {
    var b = e.target.closest('.btn'); if (!b) return;
    var row = b.closest('.row'); var id = Number(row.getAttribute('data-id'));
    if (b.getAttribute('data-a') === 'up') { pickId = id; fileInput.click(); }
    else if (b.getAttribute('data-a') === 'cam') { pickId = id; camInput.click(); }
    else if (b.getAttribute('data-a') === 'rm') {
      if (!confirm('Remove the picture?')) return;
      busy(id, true); status(id, 'Removing…');
      call({ action: 'remove', itemId: id }).then(function (d) {
        if (!d || !d.success) { busy(id, false); status(id, (d && d.error) || 'Failed.', 'bad'); return; }
        clearCache(); items.forEach(function (it) { if (it.id === id) it.photo = ''; }); render();
      }).catch(function () { busy(id, false); status(id, 'Failed.', 'bad'); });
    }
  });
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('flt').addEventListener('change', render);
  load();
})();
</script>
<script src="shared/nav.js"></script>
</body>
</html>
