<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<script src="shared/admin-gate.js" data-title="Chocolate Photos"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chocolate Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f6e0da; --mint:#eaf3ec;
    --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9; --ok:#3d7a4f; --bad:#b3261e;
    --choc:#6b4226; --choc-deep:#4a2c18;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:linear-gradient(160deg, var(--blush) 0%, var(--mint) 100%); color:var(--ink); font-family:'Space Grotesk',sans-serif; min-height:100vh; }
  html,body{ height:100%; }
  body{ overflow:hidden; }
  .wrap{ max-width:1280px; margin:0 auto; padding:14px 18px 10px 74px; height:100vh; height:100dvh; display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px; padding:10px 16px; background:linear-gradient(135deg,#fff 0%,var(--blush) 60%,var(--blush-2) 100%); border-radius:16px; border:1px solid var(--line); flex:none; }
  .eyebrow{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  h1{ font-family:'Great Vibes',cursive; font-weight:400; color:var(--rose-deep); font-size:2rem; margin:0; line-height:1; }
  .sub{ font-size:12px; color:var(--ink-dim); flex:1; min-width:180px; }
  .bar{ display:flex; gap:8px; margin-bottom:8px; flex:none; align-items:center; }
  .bar input{ flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; outline:none; background:#fff; }
  .bar select{ border:1px solid var(--line); border-radius:10px; padding:10px; font-size:13px; font-family:inherit; background:#fff; }
  .count{ font-size:12px; color:var(--ink-dim); white-space:nowrap; }
  #list{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; align-content:start; padding:2px 2px 14px; }
  .row{ display:flex; flex-direction:column; align-items:stretch; gap:8px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; }
  .pic{ position:relative; width:100%; aspect-ratio:1/1; border-radius:10px; background:var(--blush); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:12px; overflow:hidden; }
  .xrm{ position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; border:0; background:rgba(255,255,255,.92); color:var(--bad); font-size:14px; font-weight:700; line-height:1; cursor:pointer; box-shadow:0 1px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; padding:0; }
  .xrm:hover{ background:var(--bad); color:#fff; }
  .xrm[disabled]{ opacity:.5; }
  .pic img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .meta{ min-width:0; }
  .nm{ font-weight:700; font-size:13px; word-break:break-word; line-height:1.25; }
  .ct{ font-size:11px; color:var(--ink-dim); }
  .cd{ font-size:11px; color:var(--choc); font-weight:700; font-family:'Space Mono',monospace; margin-top:1px; }
  .bc{ display:block; height:24px; max-width:100%; margin-top:3px; cursor:zoom-in; }
  .bigbc{ background:#fff; border-radius:14px; padding:16px 14px 12px; text-align:center; max-width:min(94vw,640px); cursor:default; }
  .bigbc svg{ display:block; width:100%; height:auto; }
  .bigbc .c{ font-family:'Space Mono',monospace; font-weight:700; font-size:18px; color:#000; margin-top:6px; letter-spacing:.04em; }
  .bigbc .n{ font-size:13px; color:#555; margin-top:2px; }
  .fv{ font-size:12px; color:var(--ink); margin-top:4px; line-height:1.3; cursor:pointer; word-break:break-word; }
  .fv.none{ color:var(--ink-dim); font-size:11px; font-style:italic; }
  .st{ font-size:11px; margin-top:2px; min-height:14px; }
  .st.ok{ color:var(--ok); } .st.bad{ color:var(--bad); }
  .acts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
  .acts .btn{ flex:1; }
  .btn{ padding:8px 10px; border:none; border-radius:9px; font-weight:700; font-size:12px; cursor:pointer; background:linear-gradient(135deg,var(--choc),var(--choc-deep)); color:#fff; white-space:nowrap; font-family:inherit; }
  .btn.alt{ background:#fff; color:var(--choc-deep); border:1px solid var(--line); }
  .btn.ghost{ background:#fff; color:var(--bad); border:1px solid var(--line); }
  .btn[disabled]{ opacity:.5; cursor:default; }
  .empty{ grid-column:1/-1; text-align:center; color:var(--ink-dim); padding:30px 0; font-size:13px; }
  .lb{ position:fixed; inset:0; z-index:100000; background:rgba(30,15,22,.82); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; cursor:zoom-out; }
  .lb img{ max-width:min(94vw,900px); max-height:82vh; border-radius:14px; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .lb div{ white-space:pre-line; max-width:min(94vw,600px); color:#fff; font-weight:700; font-size:15px; text-align:center; }
  .ed{ position:fixed; inset:0; z-index:100001; background:rgba(30,15,22,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:14px; }
  .ed .ttl{ color:#fff; font-weight:700; font-size:14px; text-align:center; }
  .ed .hint{ color:#e9d5d8; font-size:12px; text-align:center; }
  .ed .vp{ position:relative; width:min(88vw,62vh,520px); height:min(88vw,62vh,520px); overflow:hidden; border-radius:14px; background:#222; touch-action:none; cursor:grab; box-shadow:0 0 0 2px rgba(255,255,255,.7); user-select:none; -webkit-user-select:none; }
  .ed .vp img{ position:absolute; max-width:none; max-height:none; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .ed .vp::after{ content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 33.33% 0/1px 100% no-repeat, linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 66.66% 0/1px 100% no-repeat, linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 0 33.33%/100% 1px no-repeat, linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 0 66.66%/100% 1px no-repeat; }
  .ed .btns{ display:flex; gap:10px; width:min(88vw,520px); }
  .ed .btns .btn{ flex:1; padding:12px; font-size:14px; }
  .dlg{ position:fixed; inset:0; z-index:100001; background:rgba(30,15,22,.7); display:flex; align-items:center; justify-content:center; padding:16px; }
  .dlg .box{ background:#fff; border-radius:16px; padding:18px; width:min(100%,460px); display:flex; flex-direction:column; gap:10px; }
  .dlg h3{ margin:0; font-size:16px; color:var(--choc-deep); }
  .dlg label{ font-size:11px; color:var(--ink-dim); font-weight:600; }
  .dlg textarea{ border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; font-family:inherit; resize:vertical; min-height:84px; outline:none; }
  .dlg textarea:focus{ border-color:var(--rose); }
  .dlg .cnt{ font-size:11px; color:var(--ink-dim); text-align:right; }
  .dlg .row2{ display:flex; gap:8px; }
  .dlg .row2 .btn{ flex:1; padding:11px; font-size:13px; }
  input[type=file]{ display:none; }
</style>
</head>
<body>
<div class="wrap" id="photoPage" data-lbchoc-skip>
  <header>
    <div class="eyebrow">Admin</div>
    <h1>Chocolate Photos</h1>
    <div class="sub">I-upload ang litrato ng bawat chocolate. Lalabas ito sa lahat ng chocolate pages.</div>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Search name, category or code…" autocomplete="off">
    <select id="flt"><option value="all">Lahat</option><option value="none">Walang picture</option><option value="has">May picture</option></select>
    <div class="count" id="count">Loading…</div>
  </div>
  <div id="list"></div>
</div>
<script>
(function () {
  var API = (window.LB_CONFIG || {}).CHOC_PHOTO_FAST_API;
  var CACHE_KEY = 'lbChocPhotosV1';
  var items = [];
  function token() { try { return sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; } catch (e) { return ''; } }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function call(body) {
    body.token = token();
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var f = document.getElementById('flt').value;
    var rows = items.filter(function (it) {
      if (q && (it.name + ' ' + it.category + ' ' + (it.code || '') + ' ' + (it.flavor || '')).toLowerCase().indexOf(q) === -1) return false;
      if (f === 'none' && it.photo) return false;
      if (f === 'has' && !it.photo) return false;
      return true;
    });
    var have = items.filter(function (i) { return i.photo; }).length;
    document.getElementById('count').textContent = have + ' of ' + items.length + ' may picture · ' + rows.length + ' shown';
    var el = document.getElementById('list');
    if (!rows.length) { el.innerHTML = '<div class="empty">Walang nakita.</div>'; return; }
    el.innerHTML = rows.map(function (it) {
      return '<div class="row" data-id="' + it.id + '">' +
        '<div class="pic">' + (it.photo ? '<img src="' + esc(it.photo) + '" alt="" loading="lazy"><button type="button" class="xrm" data-a="rm" aria-label="Remove picture">✕</button>' : 'No photo') + '</div>' +
        '<div class="meta"><div class="nm">' + esc(it.name) + '</div><div class="ct">' + esc(it.category) + '</div>' + (it.code ? '<div class="cd">' + esc(it.code) + '</div><svg class="bc" data-code="' + esc(it.code) + '" aria-label="Barcode - tap to enlarge"></svg>' : '') + '<div class="fv' + (it.flavor ? '' : ' none') + '" data-a="edit">' + (it.flavor ? esc(it.flavor) : '＋ Add flavor / description') + '</div><div class="st"></div></div>' +
        '<div class="acts"><button class="btn" data-a="cam">📷 Camera</button>' +
        '<button class="btn alt" data-a="up">🖼️ ' + (it.photo ? 'Change' : 'Gallery') + '</button>' +
        '<button class="btn alt" data-a="edit">✏️ Edit</button>' + '</div></div>';
    }).join('');
    drawBarcodes();
  }

  function fitSvg(svg) {
    if (!svg.getAttribute('viewBox')) {
      var w = parseFloat(svg.getAttribute('width')), h = parseFloat(svg.getAttribute('height'));
      if (w && h) svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    }
  }
  function drawBarcodes() {
    if (!window.JsBarcode) return;
    Array.prototype.forEach.call(document.querySelectorAll('#list svg.bc'), function (svg) {
      try { JsBarcode(svg, svg.getAttribute('data-code'), { format: 'CODE128', width: 1, height: 24, margin: 0, displayValue: false }); fitSvg(svg); svg.setAttribute('preserveAspectRatio', 'xMinYMid meet'); }
      catch (e) { svg.remove(); }
    });
  }

  function load() {
    call({ action: 'list' }).then(function (d) {
      if (!d || !d.success) { document.getElementById('count').textContent = (d && d.error) || 'Could not load.'; return; }
      items = d.items || []; render();
    }).catch(function () { document.getElementById('count').textContent = 'Could not load. Check internet.'; });
  }

  function status(id, msg, cls) {
    var r = document.querySelector('.row[data-id="' + id + '"] .st');
    if (r) { r.textContent = msg; r.className = 'st ' + (cls || ''); }
  }
  function busy(id, on) {
    document.querySelectorAll('.row[data-id="' + id + '"] .btn, .row[data-id="' + id + '"] .xrm').forEach(function (b) { b.disabled = on; });
  }

  var pickId = null;
  var fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*';
  var camInput = document.createElement('input');
  camInput.type = 'file'; camInput.accept = 'image/*'; camInput.setAttribute('capture', 'environment');
  document.body.appendChild(fileInput); document.body.appendChild(camInput);
  function openEditor(src, title, cross) {
    return new Promise(function (resolve) {
      var o = document.createElement('div'); o.className = 'ed';
      o.innerHTML = '<div class="ttl"></div><div class="vp"><img alt=""></div><div class="hint">I-drag para i-center · dalawang daliri / scroll para mag-zoom</div>' +
        '<div class="btns"><button type="button" class="btn alt" data-x="c">Cancel</button><button type="button" class="btn" data-x="s">Save</button></div>';
      o.querySelector('.ttl').textContent = title || '';
      var vp = o.querySelector('.vp'), im = o.querySelector('img');
      var W = 0, H = 0, V = 0, sc = 1, cover = 1, tx = 0, ty = 0, ready = false;
      function clamp() {
        sc = Math.min(Math.max(sc, cover), cover * 6);
        tx = Math.min(0, Math.max(V - W * sc, tx)); ty = Math.min(0, Math.max(V - H * sc, ty));
      }
      function draw() { im.style.width = (W * sc) + 'px'; im.style.height = (H * sc) + 'px'; im.style.left = tx + 'px'; im.style.top = ty + 'px'; }
      function zoomAt(f, cx, cy) { var ns = Math.min(Math.max(sc * f, cover), cover * 6); f = ns / sc; tx = cx - (cx - tx) * f; ty = cy - (cy - ty) * f; sc = ns; clamp(); draw(); }
      function finish(v) { document.removeEventListener('keydown', key); o.remove(); resolve(v); }
      function key(e) { if (e.key === 'Escape') finish(null); }
      document.addEventListener('keydown', key);
      var pts = {};
      function dist() { var k = Object.keys(pts); if (k.length < 2) return 0; var a = pts[k[0]], b = pts[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }
      function mid() { var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]]; var r = vp.getBoundingClientRect(); return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }; }
      vp.addEventListener('pointerdown', function (e) { if (!ready) return; try { vp.setPointerCapture(e.pointerId); } catch (x) {} pts[e.pointerId] = { x: e.clientX, y: e.clientY }; vp.style.cursor = 'grabbing'; });
      vp.addEventListener('pointermove', function (e) {
        var p = pts[e.pointerId]; if (!p || !ready) return;
        var n = Object.keys(pts).length;
        if (n === 1) { tx += e.clientX - p.x; ty += e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; clamp(); draw(); }
        else {
          var d0 = dist(), m0 = mid(); p.x = e.clientX; p.y = e.clientY;
          var d1 = dist(), m1 = mid();
          if (d0 > 0 && d1 > 0) { tx += m1.x - m0.x; ty += m1.y - m0.y; zoomAt(d1 / d0, m1.x, m1.y); }
        }
      });
      function up(e) { delete pts[e.pointerId]; if (!Object.keys(pts).length) vp.style.cursor = 'grab'; }
      vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
      vp.addEventListener('wheel', function (e) { if (!ready) return; e.preventDefault(); var r = vp.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
      o.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.getAttribute('data-x') === 'c') return finish(null);
        if (!ready) return;
        var c = document.createElement('canvas'); c.width = 640; c.height = 640;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 640, 640);
        try {
          x.drawImage(im, -tx / sc, -ty / sc, V / sc, V / sc, 0, 0, 640, 640);
          var out = c.toDataURL('image/jpeg', 0.8);
          if (out.length > 520000) out = c.toDataURL('image/jpeg', 0.6);
          finish(out);
        } catch (err) { alert('Hindi ma-edit ang picture na ito. Subukan ang Camera/Gallery.'); finish(null); }
      });
      document.body.appendChild(o);
      if (cross) im.crossOrigin = 'anonymous';
      im.onload = function () {
        W = im.naturalWidth; H = im.naturalHeight; V = vp.clientWidth;
        if (!W || !H) return finish(null);
        cover = V / Math.min(W, H); sc = cover; tx = (V - W * sc) / 2; ty = (V - H * sc) / 2; ready = true; clamp(); draw();
      };
      im.onerror = function () { alert('Hindi ma-load ang picture.'); finish(null); };
      im.src = src;
    });
  }

  function saveCropped(id, data) {
    busy(id, true); status(id, 'Uploading…');
    call({ action: 'upload', itemId: id, image: data }).then(function (d) {
      if (!d || !d.success) { busy(id, false); status(id, (d && d.error) || 'Failed.', 'bad'); return; }
      clearCache();
      items.forEach(function (it) { if (it.id === id) it.photo = d.photo; });
      render(); status(id, 'Saved ✓', 'ok');
    }).catch(function () { busy(id, false); status(id, 'Failed. Try another photo.', 'bad'); });
  }
  function itemName(id) { var r = items.filter(function (i) { return i.id === id; })[0]; return r ? r.name : ''; }

  function onPicked(inp) {
    var file = inp.files && inp.files[0]; var id = pickId;
    inp.value = '';
    if (!file || !id) return;
    var url = URL.createObjectURL(file);
    openEditor(url, itemName(id), false).then(function (data) {
      URL.revokeObjectURL(url);
      if (data) saveCropped(id, data);
    });
  }
  fileInput.addEventListener('change', function () { onPicked(fileInput); });
  camInput.addEventListener('change', function () { onPicked(camInput); });

  function openEdit(id) {
    var cur = items.filter(function (i) { return i.id === id; })[0]; if (!cur) return;
    var o = document.createElement('div'); o.className = 'dlg';
    o.innerHTML = '<div class="box"><h3></h3><label>Flavor / description (lalabas kasama ng picture)</label>' +
      '<textarea maxlength="200" placeholder="hal. White caramel (caramel with crushed almond with chocolate)"></textarea><div class="cnt"></div>' +
      '<div class="row2">' + (cur.photo ? '<button type="button" class="btn alt" data-x="crop">✂️ Crop photo</button>' : '') + '</div>' +
      '<div class="row2"><button type="button" class="btn alt" data-x="c">Cancel</button><button type="button" class="btn" data-x="s">Save</button></div></div>';
    o.querySelector('h3').textContent = cur.name;
    var ta = o.querySelector('textarea'), cnt = o.querySelector('.cnt');
    ta.value = cur.flavor || '';
    function upd() { cnt.textContent = ta.value.length + ' / 200'; } upd(); ta.addEventListener('input', upd);
    function close() { document.removeEventListener('keydown', key); o.remove(); }
    function key(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', key);
    o.addEventListener('mousedown', function (e) { if (e.target === o) close(); });
    o.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var x = b.getAttribute('data-x');
      if (x === 'c') return close();
      if (x === 'crop') { close(); openEditor(cur.photo, cur.name, true).then(function (data) { if (data) saveCropped(id, data); }); return; }
      if (x === 's') {
        b.disabled = true; b.textContent = 'Saving…';
        call({ action: 'setFlavor', itemId: id, flavor: ta.value }).then(function (d) {
          if (!d || !d.success) { b.disabled = false; b.textContent = 'Save'; alert((d && d.error) || 'Failed.'); return; }
          clearCache(); items.forEach(function (it) { if (it.id === id) it.flavor = d.flavor; });
          close(); render(); status(id, 'Saved ✓', 'ok');
        }).catch(function () { b.disabled = false; b.textContent = 'Save'; alert('Failed. Check internet.'); });
      }
    });
    document.body.appendChild(o); ta.focus();
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var bc = e.target.closest('svg.bc');
    if (bc) {
      var rw = bc.closest('.row'), nm0 = rw && rw.querySelector('.nm');
      var ov = document.createElement('div'); ov.className = 'lb';
      var card = document.createElement('div'); card.className = 'bigbc';
      var sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      card.appendChild(sv);
      try { JsBarcode(sv, bc.getAttribute('data-code'), { format: 'CODE128', width: 3, height: 130, margin: 10, displayValue: false }); fitSvg(sv); sv.removeAttribute('width'); sv.removeAttribute('height'); } catch (x) { return; }
      var c = document.createElement('div'); c.className = 'c'; c.textContent = bc.getAttribute('data-code');
      var n = document.createElement('div'); n.className = 'n'; n.textContent = nm0 ? nm0.textContent : '';
      card.appendChild(c); card.appendChild(n); ov.appendChild(card);
      var closeBc = function () { ov.remove(); document.removeEventListener('keydown', kb); };
      var kb = function (ev) { if (ev.key === 'Escape') closeBc(); };
      ov.addEventListener('click', closeBc); document.addEventListener('keydown', kb);
      document.body.appendChild(ov); return;
    }
    var fv = e.target.closest('.fv'); if (fv) { openEdit(Number(fv.closest('.row').getAttribute('data-id'))); return; }
    var b = e.target.closest('.btn, .xrm'); if (!b) return;
    var row = b.closest('.row'); var id = Number(row.getAttribute('data-id'));
    if (b.getAttribute('data-a') === 'up') { pickId = id; fileInput.click(); }
    else if (b.getAttribute('data-a') === 'cam') { pickId = id; camInput.click(); }
    else if (b.getAttribute('data-a') === 'edit') openEdit(id);
    else if (b.getAttribute('data-a') === 'rm') {
      if (!confirm('Remove the picture?')) return;
      busy(id, true); status(id, 'Removing…');
      call({ action: 'remove', itemId: id }).then(function (d) {
        if (!d || !d.success) { busy(id, false); status(id, (d && d.error) || 'Failed.', 'bad'); return; }
        clearCache(); items.forEach(function (it) { if (it.id === id) it.photo = ''; }); render();
      }).catch(function () { busy(id, false); status(id, 'Failed.', 'bad'); });
    }
  });
  function openBig(src, title) {
    var o = document.createElement('div'); o.className = 'lb';
    var im = document.createElement('img'); im.src = src; im.alt = '';
    var t = document.createElement('div'); t.textContent = title || '';
    o.appendChild(im); o.appendChild(t);
    function close() { o.remove(); document.removeEventListener('keydown', key); }
    function key(e) { if (e.key === 'Escape') close(); }
    o.addEventListener('click', close); document.addEventListener('keydown', key);
    document.body.appendChild(o);
  }
  document.getElementById('list').addEventListener('click', function (e) {
    var im = e.target.closest('.pic img'); if (!im) return;
    var row = im.closest('.row'); var nm = row && row.querySelector('.nm');
    var it2 = items.filter(function (i) { return i.id === Number(row.getAttribute('data-id')); })[0];
    openBig(im.src, (nm ? nm.textContent : '') + (it2 && it2.flavor ? '\n' + it2.flavor : ''));
  });
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('flt').addEventListener('change', render);
  load();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
