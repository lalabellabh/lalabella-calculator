<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA — Lalabella Intelligence</title>
<style>
:root{
  --bg:#07080b;--panel:#0d1016;--line:#252a34;--text:#f5f1e9;--muted:#8f96a5;
  --gold:#1677ff;--gold2:#8fd8ff;--green:#63e6a2;--red:#ff6b6b;--blue:#1687ff;--cyan:#2ee8ff;
}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow:hidden}
button{font:inherit}
.app{height:100dvh;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);background:
radial-gradient(circle at 50% 45%,rgba(22,135,255,.16),transparent 38%),radial-gradient(circle at 50% 65%,rgba(46,232,255,.06),transparent 45%),#020711}
.side{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;background:rgba(10,12,16,.86);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#111;background:linear-gradient(135deg,var(--gold2),var(--gold));font-weight:900}
.brand b{letter-spacing:.14em;font-size:13px}.brand small{display:block;color:var(--muted);margin-top:3px;font-size:10px;letter-spacing:.12em}
.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aab0bc;text-align:left;padding:12px;border-radius:11px;cursor:pointer}.nav button.active,.nav button:hover{background:#171a21;color:#fff}
.status{margin-top:auto;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0a0d12}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:8px}.status small{color:var(--muted)}
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line)}
.top .title{font-size:12px;letter-spacing:.2em;color:#b6bbc5}.clock{color:#737a88;font-size:11px}
.stage{flex:1;min-height:0;min-width:0;display:grid;place-items:center;position:relative;overflow:hidden}
.assembly{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ring{position:absolute;border:1px solid rgba(22,135,255,.25);border-radius:50%;animation:spin 20s linear infinite;box-shadow:0 0 18px rgba(22,135,255,.08)}.r1{width:470px;height:470px}.r2{width:610px;height:610px;animation-direction:reverse;animation-duration:30s;border-style:dashed}.r3{width:760px;height:760px;animation-duration:42s;border-color:rgba(46,232,255,.10)}
@keyframes spin{to{transform:rotate(360deg)}}
.matrix{position:absolute;inset:0;overflow:hidden;opacity:.34;pointer-events:none;mask-image:radial-gradient(circle at center,transparent 5%,#000 48%,#000 100%)}.matrix i{position:absolute;top:-20%;font-style:normal;font-family:monospace;font-size:11px;line-height:1.8;color:#1485ff;text-shadow:0 0 8px #1687ff;white-space:pre;animation:matrixFall linear infinite}.matrix i:nth-child(3n){color:#2ee8ff}.matrix i:nth-child(5n){opacity:.55}
@keyframes matrixFall{to{transform:translateY(140vh)}}
.core{width:330px;height:330px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#eafaff 0,#42c9ff 4%,#1677ff 13%,#071a39 34%,#030811 67%,#02040a 78%);border:1px solid rgba(70,190,255,.75);box-shadow:0 0 45px rgba(22,135,255,.55),0 0 110px rgba(22,135,255,.28),inset 0 0 70px #000;animation:blueBreath 3s ease-in-out infinite;z-index:2}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;inset:16px;border:1px solid rgba(88,207,255,.62);box-shadow:0 0 20px rgba(46,232,255,.16)}.core:after{inset:34px;border-style:dashed;border-color:rgba(46,232,255,.42);animation:spin 8s linear infinite}
@keyframes blueBreath{0%,100%{transform:scale(1);box-shadow:0 0 45px rgba(22,135,255,.5),0 0 100px rgba(22,135,255,.24),inset 0 0 70px #000}50%{transform:scale(1.035);box-shadow:0 0 75px rgba(22,135,255,.82),0 0 170px rgba(22,135,255,.38),inset 0 0 85px #000}}
.coreText{text-align:center;z-index:8;text-shadow:0 0 18px rgba(46,232,255,.75)}.coreText strong{display:block;font-size:43px;letter-spacing:.18em}.coreText span{font-size:10px;letter-spacing:.3em;color:#8fd8ff}
.wave{position:absolute;inset:50% -115px auto -115px;transform:translateY(-50%);display:flex;gap:5px;height:110px;align-items:center;justify-content:center;z-index:7;pointer-events:none;filter:drop-shadow(0 0 8px rgba(46,232,255,.7))}.wave i{display:block;width:3px;height:8px;background:linear-gradient(to top,#1677ff,#2ee8ff);border-radius:4px;transition:.2s;opacity:.9}.listening .wave i,.thinking .wave i,.speaking .wave i{animation:waveBig .72s ease-in-out infinite}.listening .wave i:nth-child(2n){animation-delay:.08s}.listening .wave i:nth-child(3n){animation-delay:.16s}.thinking .wave i:nth-child(2n){animation-delay:.12s}.speaking .wave i:nth-child(4n){animation-delay:.22s}
@keyframes waveBig{0%,100%{height:7px;opacity:.55}50%{height:88px;opacity:1}}
.bolt{position:absolute;width:390px;height:390px;border-radius:50%;z-index:5;pointer-events:none;filter:drop-shadow(0 0 7px #1687ff);opacity:.15}.bolt:before,.bolt:after{content:"";position:absolute;inset:3px;border:2px solid transparent;border-top-color:#2ee8ff;border-right-color:#1687ff;border-radius:48% 52% 45% 55%;transform:rotate(14deg);clip-path:polygon(0 0,100% 0,82% 18%,100% 24%,64% 42%,78% 58%,38% 68%,54% 82%,0 100%,14% 77%,0 64%,29% 48%,8% 35%,34% 22%)}.bolt:after{transform:rotate(192deg) scale(.94);border-top-color:#1687ff;border-right-color:#2ee8ff;animation:boltPulse 1.1s steps(2,end) infinite}.bolt.one{animation:boltSpin 4s linear infinite}.bolt.two{transform:rotate(120deg);animation:boltSpin 5s linear infinite reverse}.listening .bolt,.thinking .bolt,.speaking .bolt{opacity:.9}.speaking .bolt{animation-duration:1.2s}.speaking .core{animation:blueBreath .8s ease-in-out infinite}.thinking .core{animation:blueBreath 1.15s ease-in-out infinite}@keyframes boltSpin{to{transform:rotate(360deg)}}@keyframes boltPulse{50%{opacity:.2;transform:rotate(188deg) scale(1.08)}}
.state{position:absolute;top:30px;text-align:center;color:#777f8e;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.state b{color:#ddd}
.hello{position:absolute;bottom:34px;text-align:center;color:#555d6b;font-size:11px}.hello strong{color:#a7aeb9}
.right{border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:13px;background:rgba(10,12,16,.86);min-height:0;overflow:hidden}
.card{border:1px solid var(--line);background:#0c0f14;border-radius:14px;padding:15px;min-width:0;overflow:hidden}.card h3{font-size:10px;letter-spacing:.18em;color:#888f9d;margin:0 0 12px;text-transform:uppercase}
.card:first-child{flex:1;min-height:0;display:flex;flex-direction:column}.activity{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-width:thin}.event{padding:10px 0;word-break:break-word;overflow-wrap:anywhere;border-bottom:1px solid #181c24;font-size:12px}.event span{display:block;color:#656d7a;font-size:9px;margin-bottom:3px}.event b{font-weight:500}
.quick{display:grid;gap:7px}.quick button{background:#11151c;border:1px solid #222832;color:#b7bdc8;padding:10px;border-radius:9px;text-align:left;cursor:pointer}.quick button:hover{border-color:#725c30;color:#fff}
.mic{position:absolute;bottom:28px;right:28px;width:48px;height:48px;border-radius:50%;border:1px solid #4b3d21;background:#111;color:var(--gold2);cursor:pointer;box-shadow:0 0 20px rgba(217,168,74,.08)}
.transcript{position:absolute;left:25px;bottom:27px;max-width:390px;display:none;background:#0d1016;border:1px solid var(--line);padding:11px 13px;border-radius:11px;font-size:12px;color:#c6cbd4}.transcript.show{display:block}
.assembled .core{box-shadow:0 0 110px rgba(22,135,255,.7),0 0 190px rgba(46,232,255,.25),inset 0 0 65px #000}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.side,.right{display:none}.top{height:58px;padding:0 16px}.stage{min-height:0}.r1{width:300px;height:300px}.r2{width:395px;height:395px}.r3{width:520px;height:520px}.core{width:210px;height:210px}.coreText strong{font-size:27px}.wave{inset:50% -72px auto -72px;height:82px}.wave i{width:2px}.bolt{width:255px;height:255px}.mic{right:18px;bottom:18px}.transcript{left:16px;bottom:18px;right:76px;max-width:none}.state{top:22px}.hello{bottom:25px;font-size:10px}}

/* Keep the center core locked in place even when Live Activity grows. */
.right .activity::-webkit-scrollbar{width:6px}
.right .activity::-webkit-scrollbar-track{background:transparent}
.right .activity::-webkit-scrollbar-thumb{background:rgba(46,232,255,.28);border-radius:10px}
.right .activity::-webkit-scrollbar-thumb:hover{background:rgba(46,232,255,.5)}
.event b{display:block;line-height:1.45;white-space:normal}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="logo">N</div><div><b>NOVA</b><small>LALABELLA INTELLIGENCE</small></div></div>
    <div class="nav">
      <button class="active">◉ Intelligence</button>
      <button>▣ Inventory</button>
      <button>◌ Dashboard</button>
      <button>⌁ Purchases</button>
      <button>⚙ System</button>
    </div>
    <div class="status"><span class="dot"></span><b style="font-size:11px">SYSTEM ONLINE</b><br><small>Listening only when addressed</small></div>
  </aside>

  <main class="main">
    <header class="top"><div class="title">COMMAND CENTER / NOVA CORE</div><div class="clock" id="clock"></div></header>
    <section class="stage" id="stage">
      <div class="matrix" id="matrix" aria-hidden="true"></div>
      <div class="assembly" aria-hidden="true"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="bolt one"></div><div class="bolt two"></div></div>
      <div class="state" id="state">CORE <b>STANDBY</b></div>
      <div class="core" id="core">
        <div class="coreText"><strong>NOVA</strong><span>INTELLIGENCE CORE</span></div>
        <div class="wave" id="wave"></div>
      </div>
      <div class="hello">Say <strong>“Hey Nova”</strong> to activate</div>
      <div class="transcript" id="transcript"></div>
      <button class="mic" id="mic" title="Manual voice input">◉</button>
    </section>
  </main>

  <aside class="right">
    <div class="card"><h3>Live Activity</h3><div class="activity" id="activity"><div class="event"><span>NOW</span><b>Core initialized. Awaiting greeting.</b></div></div></div>
    <div class="card"><h3>Quick Access</h3><div class="quick">
      <button data-say="open inventory">Open Inventory</button>
      <button data-say="show dashboard">Show Dashboard</button>
      <button data-say="start inventory">Start Inventory</button>
    </div></div>
  </aside>
</div>

<script>
/*
  NOVA UI behavior:
  - Silent on page load.
  - Wake phrase: "Hey Nova" / "Hello Nova" / "Nova".
  - After activation, normal conversation can be sent to your NOVA API.
  - Replace NOVA_API_URL after deploying nova-api.gs.
*/
const NOVA_API_URL = 'https://script.google.com/macros/s/AKfycbxiET8LZ9VplRo13KR7-pn74Gu_gYkZmGsEwJD50qm7NVYDK9NfXBxIcNeDP_lSBkeC/exec';
const app=document.getElementById('app'), core=document.getElementById('core'), state=document.getElementById('state');
const transcript=document.getElementById('transcript'), activity=document.getElementById('activity'), wave=document.getElementById('wave');
let listening=false, awake=false, recognition=null, wakeRecognition=null, session={};

const matrix=document.getElementById('matrix');
const glyphs='01NOVA<>[]{}/*\\+-=|AI';
for(let i=0;i<46;i++){const col=document.createElement('i'); col.textContent=Array.from({length:Math.floor(7+Math.random()*18)},()=>glyphs[Math.floor(Math.random()*glyphs.length)]).join('\n'); col.style.left=(Math.random()*100)+'%'; col.style.animationDuration=(5+Math.random()*9)+'s'; col.style.animationDelay=(-Math.random()*12)+'s'; col.style.fontSize=(8+Math.random()*6)+'px'; matrix.appendChild(col)}
for(let i=0;i<36;i++){const x=document.createElement('i');wave.appendChild(x)}
function setState(s,label){app.className='app '+s;state.innerHTML='CORE <b>'+label+'</b>'}
function log(text,type='SYSTEM'){const d=document.createElement('div');d.className='event';d.innerHTML='<span>'+type+' · NOW</span><b>'+escapeHtml(text)+'</b>';activity.prepend(d)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showTranscript(t){transcript.textContent=t;transcript.classList.add('show');clearTimeout(showTranscript.t);showTranscript.t=setTimeout(()=>transcript.classList.remove('show'),6000)}
function speak(text){
  if(!text)return;
  setState('speaking','SPEAKING');
  log(text,'NOVA');
  // Prevent the wake listener from hearing NOVA's own voice.
  try{ if(wakeRecognition) wakeRecognition.stop(); }catch(e){}
  try{ if(recognition) recognition.stop(); }catch(e){}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang='en-US';
  u.rate=.96;
  u.pitch=.92;
  u.volume=1;
  u.onend=()=>{setState(awake?'awake':'','AWAKE'); setTimeout(startWake,350)};
  u.onerror=()=>{setState(awake?'awake':'','AWAKE'); setTimeout(startWake,350)};
  // Some browsers need the voice list to be loaded before speaking.
  const voices=speechSynthesis.getVoices();
  if(voices.length) u.voice=voices.find(v=>/^en(-|_)/i.test(v.lang))||voices[0];
  speechSynthesis.speak(u);
}
function heard(text){showTranscript(text);log(text,'YOU')}
function isWake(t){return /\b(hey\s+nova|hello\s+nova|nova)\b/i.test(t)}
// ------------------------------------------------------------
// LOCAL / FREE COMMAND LAYER
// These commands run entirely in the browser: no OpenAI API call.
// AI is reserved for questions that actually need reasoning/live data.
// ------------------------------------------------------------
const LOCAL_ROUTES = {
  home: ['index.html', 'flower-tools.html', 'home.html'],
  inventory: ['item-inventory.html', 'inventory.html'],
  dashboard: ['flower-dashboard.html', 'dashboard.html'],
  purchases: ['purchase.html', 'purchases.html', 'supplier-invoice.html'],
  reports: ['reports.html', 'flower-reports.html'],
  cards: ['card-print.html', 'card-tools.html', 'card-printing.html'],
  settings: ['settings.html'],
};

function localNavigate(target){
  const candidates = LOCAL_ROUTES[target] || [];
  const existing = candidates.find(u => u && u !== location.pathname.split('/').pop());
  if(!existing) return false;
  log('Local navigation → ' + target.toUpperCase(), 'SYSTEM');
  setTimeout(()=>{ window.location.href = existing; }, 450);
  return true;
}

function normalizeCommand(t){
  return t.toLowerCase()
    .replace(/[!?.,]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function localCommand(raw){
  const t = normalizeCommand(raw);

  // Basic conversation — completely local.
  if (/^(hi|hello|hey|good morning|good afternoon|good evening)( nova)?$/.test(t))
    return {text:'Hello Boss. NOVA is ready.', handled:true};

  if (/^(thanks|thank you|salamat|salamat nova)$/.test(t))
    return {text:'You’re welcome, Boss.', handled:true};

  if (/^(who are you|what are you|introduce yourself)$/.test(t))
    return {text:'I’m NOVA, the intelligence interface for your Flower Tools system.', handled:true};

  if (/^(help|what can you do|show commands)$/.test(t))
    return {text:'I can open system pages, tell the time and date, control the interface, and handle simple local commands without using the AI API. Live inventory and business questions can use the API when it is connected.', handled:true};

  // Time / date — browser only.
  if (/^(what time is it|time|current time|tell me the time)$/.test(t))
    return {text:'It is ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) + '.', handled:true};

  if (/^(what date is it|date|today|what day is it)$/.test(t))
    return {text:'Today is ' + new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'}) + '.', handled:true};

  // UI controls.
  if (/^(stop|stop talking|be quiet|silence|cancel speech)$/.test(t)){
    speechSynthesis.cancel();
    setState(awake?'awake':'','STANDBY');
    log('Speech stopped.', 'SYSTEM');
    return {text:'', handled:true};
  }

  if (/^(clear activity|clear log|clear activity log)$/.test(t)){
    activity.innerHTML='';
    return {text:'Activity log cleared.', handled:true};
  }

  // Navigation — no API.
  const navPatterns = [
    ['inventory', /^(open|go to|show|take me to)\s+(the\s+)?(item\s+)?inventory$/],
    ['dashboard', /^(open|go to|show|take me to)\s+(the\s+)?dashboard$/],
    ['purchases', /^(open|go to|show|take me to)\s+(the\s+)?(purchases?|purchase)$/],
    ['reports', /^(open|go to|show|take me to)\s+(the\s+)?reports?$/],
    ['cards', /^(open|go to|show|take me to)\s+(the\s+)?(card tools?|card printing|cards?)$/],
    ['settings', /^(open|go to|show|take me to)\s+(the\s+)?settings?$/],
    ['home', /^(open|go to|show|take me to)\s+(home|flower tools)$/],
  ];

  for (const [target, rx] of navPatterns){
    if (rx.test(t)){
      if (localNavigate(target))
        return {text:'Opening ' + target + '.', handled:true};
      return {text:'I know that local command, Boss, but I need the correct page file for ' + target + '.', handled:true};
    }
  }

  // Local inventory start UI only. Actual stock data still comes from the backend.
  if (/^(start|begin)\s+(the\s+)?inventory$/.test(t))
    return {text:'Okay Boss. Inventory mode is ready. I can start the live count when the Flower Tools API is connected.', handled:true};

  // Not a local command -> caller may use API.
  return {handled:false};
}

async function askNova(message){
  const local = localCommand(message);
  if(local.handled) return local.text;

  if(!NOVA_API_URL || NOVA_API_URL.includes('PASTE_')) {
    return 'I can handle that when the NOVA API is connected, Boss.';
  }

  setState('thinking','THINKING');
  try{
    const r=await fetch(NOVA_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message,session,context:{page:'NOVA Command Center',app:'Flower Tools'}})});
    const data=await r.json(); if(!data.ok) throw new Error(data.error||'API error');
    session=data.session||session;
    if(data.navigateTo){
      log('Opening ' + data.navigateTo, 'SYSTEM');
      setTimeout(()=>{ window.location.href = data.navigateTo; }, 1800);
    }
    return data.text;
  }catch(e){
    log('API connection unavailable — local command mode remains active.','SYSTEM');
    return 'The AI connection is unavailable right now, Boss. Local commands are still working.';
  }
}
async function handle(t){
  heard(t);
  if(!awake && !isWake(t)) return; // IMPORTANT: silent unless greeted
  if(isWake(t)){
    awake=true; setState('awake','AWAKE'); speak('Yes, Boss?'); 
    const rest=t.replace(/\b(hey\s+nova|hello\s+nova|nova)\b/i,'').trim();
    if(rest) setTimeout(()=>handle(rest),350);
    return;
  }
  const answer=await askNova(t); speak(answer);
}
function startWake(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){log('Speech recognition is not supported in this browser.','SYSTEM');return}
  if(wakeRecognition) { try{wakeRecognition.stop()}catch(e){} }
  wakeRecognition=new SR();
  wakeRecognition.continuous=true;
  wakeRecognition.interimResults=false;
  wakeRecognition.lang='en-US';
  wakeRecognition.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) handle(e.results[i][0].transcript);
    }
  };
  wakeRecognition.onend=()=>{
    if(wakeRecognition && !document.hidden && !speechSynthesis.speaking && !listening)
      setTimeout(()=>{try{wakeRecognition.start()}catch(e){}},350);
  };
  try{wakeRecognition.start();}catch(e){}
}
function manual(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  if(listening){recognition?.stop();return}
  try{if(wakeRecognition)wakeRecognition.stop()}catch(e){}
  recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.lang='en-US';listening=true;setState('listening','LISTENING');
  recognition.onresult=e=>handle(e.results[0][0].transcript);
  recognition.onerror=()=>{listening=false;setState(awake?'awake':'','STANDBY');};
  recognition.onend=()=>{listening=false;if(!awake)setState('','STANDBY');if(!speechSynthesis.speaking)setTimeout(startWake,350)};
  try{recognition.start()}catch(e){listening=false;setState(awake?'awake':'','STANDBY');startWake()}
}
speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
document.getElementById('mic').onclick=manual;
document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{awake=true;handle(b.dataset.say)});
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);
setState('','STANDBY');
startWake();

// Silent standby: NOVA does not speak on page load.
// It wakes only after the user says "Hey Nova", "Hello Nova", or "Nova".
setState('','STANDBY');
</script>
</body>
</html>
