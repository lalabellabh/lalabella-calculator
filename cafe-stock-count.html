<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Café Stock Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".wrap, .card">
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#f6efe6,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 80px; }
  header{ padding-left:56px; margin:6px 0 6px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar input,.bar select,.btn{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .btn.go{ background:linear-gradient(135deg,#c9506b,#9e2f4a); color:#fff; border:0; font-weight:700; }
  .btn.ok{ background:var(--ok); color:#fff; border:0; font-weight:700; }
  .card{ background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .card h2{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 10px; }
  .card label{ display:block; font-size:11.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
  .card input,.card select{ width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .g3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
  @media(max-width:620px){ .g2,.g3{ grid-template-columns:1fr; } }
  .pic{ width:44px; height:44px; flex:none; border-radius:10px; background:#f3ece6 center/cover no-repeat; border:1px dashed #d9c7bd; display:flex; align-items:center; justify-content:center; font-size:17px; color:#b9a49a; }
  .pic.has{ border-style:solid; border-color:#eadbd4; cursor:zoom-in; } .pic.can{ cursor:pointer; }
  .row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .nm{ flex:1; min-width:0; font-weight:700; font-size:14px; } .nm small{ display:block; font-weight:400; color:var(--dim); font-size:11.5px; }
  .grp{ font-size:12px; font-weight:800; color:#7a5a20; background:#faf5ef; padding:6px 10px; border-radius:8px; margin:10px 0 2px; }
  .zero{ color:var(--bad); } .soon{ color:#a8560b; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
  .msg{ font-size:12.5px; color:var(--dim); }
  .wrap{ max-width:1250px; }
  .cols{ display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:14px; align-items:start; }
  @media(max-width:860px){ .cols{ grid-template-columns:1fr; } }
  .side{ position:sticky; top:10px; }
  .bigbtn{ width:100%; border:0; border-radius:12px; padding:12px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; margin-top:8px; }
  .bigbtn.rose{ background:linear-gradient(135deg,#c9506b,#9e2f4a); color:#fff; } .bigbtn.light{ background:#fdf1f0; color:#9e2f4a; border:1px solid var(--line); }
  .bigbtn.green{ background:linear-gradient(135deg,#5d8b5f,#3f6a44); color:#fff; } .bigbtn.wa{ background:#fff; color:#9e2f4a; border:1px solid #9e2f4a; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip{ display:inline-block; margin-top:10px; font-size:11px; font-weight:700; color:#2f7a4f; background:#e5f3e9; border-radius:999px; padding:3px 10px; text-transform:uppercase; letter-spacing:.03em; }
  .chip.ro{ color:#8a6400; background:#fff4d6; }
  #rows{ max-height:60vh; overflow-y:auto; }
  .ln{ display:flex; gap:10px; align-items:center; padding:8px 2px; border-top:1px solid var(--line); }
  .ln:first-child{ border-top:0; } .ln.chg{ background:#fff7e0; } .ln.hit{ box-shadow:0 0 0 2px #c9506b inset; border-radius:10px; }
  .ln .pic{ width:38px; height:38px; }
  .ln .nm small{ font-size:11px; }
  .ln input{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:999px; padding:7px 10px; background:#fff; color:var(--ink); text-align:center; }
  .ln .cnt{ width:86px; } .ln .exp{ width:140px; border-radius:10px; }
  .ln .pl{ width:32px; height:32px; border-radius:50%; border:1px solid #e0b75a; background:#fffaf0; color:#a8560b; font-weight:800; cursor:pointer; }
  .ln .sys{ font-size:11px; color:var(--dim); min-width:70px; text-align:right; }
  .sumrow{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--line); } .sumrow:first-of-type{ border-top:0; }
  .grp{ margin:8px 0 2px; }
  @media(max-width:620px){ .ln{ flex-wrap:wrap; } .ln .nm{ flex-basis:calc(100% - 50px); } .ln .sys{ text-align:left; } }
  #pr{ display:none; }
  @media print{ body *{ visibility:hidden !important; } #pr,#pr *{ visibility:visible !important; } #pr{ display:block !important; position:absolute; top:0; left:0; width:100%; font-family:Arial,sans-serif; color:#000; }
    #pr table{ width:100%; border-collapse:collapse; font-size:12px; } #pr th,#pr td{ border:1px solid #000; padding:4px 6px; } #pr th{ background:#eee; } @page{ size:A4; margin:12mm; } }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<script src="shared/cafe-common.js"></script>
<div class="wrap">
  <header><h1>📋 Café Stock Count</h1><div class="sub">Monthly / any-day count of the café. The first count is the starting stock; each count becomes the new stock.</div></header>
  <div id="tabs"></div>
  <div class="cols">
    <div>
      <div class="card">
        <h2>📅 Count Session</h2>
        <label>Count date</label><input type="date" id="date">
        <div class="two"><button class="bigbtn rose" id="loadBtn">Load Items</button><button class="bigbtn light" id="recallBtn">Recall Count</button></div>
        <button class="bigbtn light" id="histBtn">🔍 Search History (Read-only)</button>
        <span class="chip" id="chip" style="display:none"></span>
      </div>
      <div class="card" id="countCard" style="display:none">
        <h2>☕ Physical Count <span id="nCount" style="font-family:'Space Grotesk';font-size:12px;font-weight:400;color:var(--dim)"></span></h2>
        <input id="q" placeholder="Search item or code…">
        <div style="display:flex;gap:8px;margin-top:8px"><input id="code" placeholder="Item code (e.g. CAF-0007) - type or scan"></div>
        <div id="rows" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="side">
      <div class="card"><h2>📊 Live Summary</h2><div id="sum"><div class="sumrow"><span>Items counted</span><b>0</b></div></div></div>
      <div class="card">
        <label>Counted by</label><input id="by" maxlength="60" placeholder="Name…">
        <button class="bigbtn rose" id="save">💾 Save Count</button>
        <button class="bigbtn green" id="print">🖨️ Print Sheet</button>
        <button class="bigbtn green" id="excel">📊 Excel</button>
        <button class="bigbtn wa" id="wa">📤 Send to WhatsApp</button>
        <div class="msg" id="msg" style="margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>
<div id="pr"></div>
<script>
(function(){
  var C = window.LBCafe, esc = C.esc, $ = function(id){ return document.getElementById(id); }, D = null, S = null, dirty = {}, RO = false;
  $('tabs').innerHTML = C.tabs('cafe-stock-count.html'); $('date').value = C.today();
  var u = C.me(); $('by').value = u.fullName || u.full_name || u.username || '';
  function chip(t, ro){ $('chip').textContent = t; $('chip').className = 'chip' + (ro ? ' ro' : ''); $('chip').style.display = ''; }
  function open(date, ro, label){
    if(Object.keys(dirty).length && !confirm('You have counts not saved. Load another anyway?')) return;
    dirty = {}; RO = !!ro; $('date').value = date;
    Promise.all([C.api({ action:'items' }), C.api({ action:'countSheet', date:date })]).then(function(r){
      if(!r[0] || !r[0].success || !r[1] || !r[1].success){ alert((r[0] && r[0].error) || (r[1] && r[1].error) || 'Could not load.'); return; }
      D = r[0]; S = r[1].rows; $('countCard').style.display = '';
      var n = D.items.filter(function(i){ return S[i.id] && S[i.id].counted != null; }).length;
      chip(label || (n ? 'Saved count — ' + n + ' items (you can change it)' : 'Fresh load — ' + D.items.length + ' items'), RO);
      $('save').disabled = RO; draw();
    }).catch(function(){ alert('Connection problem.'); });
  }
  function val(i){ return dirty[i.id] || { qty: S[i.id] && S[i.id].counted != null ? S[i.id].counted : '', expiry: S[i.id] ? S[i.id].expiry || '' : '', note: S[i.id] ? S[i.id].note || '' : '' }; }
  function expCls(e){ if(!e) return ''; var d = (new Date(e + 'T00:00:00') - new Date(C.today() + 'T00:00:00')) / 86400000; return d < 0 ? 'zero' : d <= 60 ? 'soon' : ''; }
  function draw(){
    var t = $('q').value.trim().toLowerCase(), last = null;
    var L = D.items.filter(function(i){ return !t || (i.name + ' ' + i.category + ' ' + i.code).toLowerCase().indexOf(t) !== -1; });
    $('rows').innerHTML = L.map(function(i){
      var head = i.category !== last ? '<div class="grp">' + esc(i.category || 'Other') + '</div>' : ''; last = i.category;
      var v = val(i), s = S[i.id] || {};
      return head + '<div class="ln' + (dirty[i.id] ? ' chg' : '') + '" data-id="' + i.id + '"><div class="pic' + (i.photo ? ' has' : '') + '"' + (i.photo ? ' data-z="' + esc(i.photo) + '" style="background-image:url(\'' + esc(i.photo) + '\')"' : '') + '>' + (i.photo ? '' : '☕') + '</div>' +
        '<div class="nm">' + esc(i.name) + '<small>' + esc(i.unit) + (i.code ? ' · ' + esc(i.code) : '') + '</small></div>' +
        '<div class="sys" title="What the system expects">system ' + C.n3(s.system || 0) + '</div>' +
        '<input class="cnt" type="number" min="0" step="any" inputmode="decimal" data-f="qty" placeholder="Count" value="' + esc(C.n3(v.qty)) + '"' + (RO ? ' disabled' : '') + '>' +
        '<button class="pl" data-plus title="Add to the count"' + (RO ? ' disabled' : '') + '>+</button>' +
        '<input class="exp ' + expCls(v.expiry) + '" type="date" data-f="expiry" title="Expiry" value="' + esc(String(v.expiry || '').slice(0, 10)) + '"' + (RO ? ' disabled' : '') + '></div>';
    }).join('') || '<div class="empty">No items' + (t ? ' for this search' : '') + '.</div>';
    summary();
  }
  function summary(){
    var n = 0, soon = 0, gone = 0, zero = 0;
    D.items.forEach(function(i){ var v = val(i); if(v.qty !== '' && v.qty != null){ n++; if(Number(v.qty) === 0) zero++; } var c = expCls(v.expiry); if(c === 'soon') soon++; if(c === 'zero') gone++; });
    $('nCount').textContent = '(' + n + ' counted)';
    $('sum').innerHTML = '<div class="sumrow"><span>Items counted</span><b>' + n + ' / ' + D.items.length + '</b></div><div class="sumrow"><span>Out of stock (0)</span><b' + (zero ? ' class="zero"' : '') + '>' + zero + '</b></div>' +
      '<div class="sumrow"><span>Expiring in 60 days</span><b' + (soon ? ' class="soon"' : '') + '>' + soon + '</b></div><div class="sumrow"><span>Already expired</span><b' + (gone ? ' class="zero"' : '') + '>' + gone + '</b></div>' +
      (Object.keys(dirty).length ? '<div class="sumrow"><span>Changed, not saved</span><b class="soon">' + Object.keys(dirty).length + '</b></div>' : '');
  }
  function touch(id){ var it = D.items.find(function(x){ return x.id === id; }); return dirty[id] || (dirty[id] = Object.assign({ id:id }, val(it))); }
  $('rows').addEventListener('input', function(e){ var f = e.target.getAttribute('data-f'); if(!f) return; var ln = e.target.closest('.ln'), id = Number(ln.getAttribute('data-id')); touch(id)[f] = e.target.value; ln.classList.add('chg'); if(f === 'expiry') e.target.className = 'exp ' + expCls(e.target.value); summary(); });
  $('rows').addEventListener('click', function(e){
    var z = e.target.closest('[data-z]'); if(z){ C.zoom(z.getAttribute('data-z')); return; }
    var p = e.target.closest('[data-plus]'); if(!p) return; var ln = p.closest('.ln'), id = Number(ln.getAttribute('data-id'));
    var add = prompt('Add how many to the count?'); if(add == null) return; var n = Number(add); if(!(n > 0)){ alert('Type a number.'); return; }
    var v = touch(id); v.qty = Math.round(((Number(v.qty) || 0) + n) * 1000) / 1000; ln.querySelector('.cnt').value = v.qty; ln.classList.add('chg'); summary();
  });
  $('q').oninput = function(){ if(D) draw(); };
  $('code').addEventListener('keydown', function(e){ if(e.key !== 'Enter' || !D) return; var c = this.value.trim().toUpperCase(); var it = D.items.find(function(i){ return String(i.code).toUpperCase() === c; });
    if(!it){ alert('No café item with code ' + c); return; } this.value = ''; $('q').value = ''; draw(); var ln = document.querySelector('.ln[data-id="' + it.id + '"]'); if(ln){ ln.scrollIntoView({ block:'center', behavior:'smooth' }); ln.classList.add('hit'); setTimeout(function(){ ln.classList.remove('hit'); }, 1800); ln.querySelector('.cnt').focus(); } });
  $('loadBtn').onclick = function(){ open($('date').value || C.today(), false); };
  $('date').onchange = function(){ if(D) open(this.value, false); };
  function pickDate(ro){ C.api({ action:'countDates' }).then(function(d){ var L = (d && d.dates) || []; if(!L.length){ alert('No saved counts yet.'); return; }
    var bg = document.createElement('div'); bg.className = 'cf-bg';
    bg.innerHTML = '<div class="cf-ed"><h3>' + (ro ? '🔍 Search history (read-only)' : '↺ Recall a count') + '</h3>' + L.map(function(x){ return '<button class="cf-btn" data-d="' + x.date + '" style="display:block;width:100%;text-align:left;margin-top:6px">' + C.fd(x.date) + ' · ' + x.items + ' items' + (x.by ? ' · ' + esc(x.by) : '') + '</button>'; }).join('') + '<div class="cf-row"><button class="cf-btn" data-x>Close</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ var b = e.target.closest('[data-d]'); if(b){ bg.remove(); open(b.getAttribute('data-d'), ro, ro ? 'History ' + C.fd(b.getAttribute('data-d')) + ' — read-only' : null); return; } if(e.target === bg || e.target.closest('[data-x]')) bg.remove(); }); }); }
  $('recallBtn').onclick = function(){ pickDate(false); };
  $('histBtn').onclick = function(){ pickDate(true); };
  $('save').onclick = function(){
    if(!D){ alert('Press Load Items first.'); return; }
    var rows = Object.keys(dirty).map(function(k){ var v = dirty[k]; return { id:v.id, qty: v.qty === '' ? '' : Number(v.qty), expiry:v.expiry || '', note:v.note || '' }; });
    if(!rows.length){ $('msg').textContent = 'Nothing changed.'; return; }
    if(!$('by').value.trim()){ alert('Type your name in "Counted by".'); $('by').focus(); return; }
    var b = this; b.disabled = true; b.textContent = 'Saving…';
    C.api({ action:'saveCount', date:$('date').value, countedBy:$('by').value.trim(), rows:JSON.stringify(rows) }).then(function(d){
      if(!d || !d.success){ alert((d && d.error) || 'Not saved.'); return; }
      dirty = {}; $('msg').textContent = '✓ Saved ' + d.saved + ' count(s) for ' + C.fd($('date').value) + '.'; open($('date').value, false);
    }).catch(function(){ alert('Connection problem. Please try again.'); }).then(function(){ b.disabled = false; b.textContent = '💾 Save Count'; });
  };
  function lines(){ return D.items.map(function(i){ var v = val(i), s = S[i.id] || {}; return { name:i.name, group:i.category, code:i.code, unit:i.unit, system:s.system || 0, count:v.qty, expiry:v.expiry }; }); }
  $('print').onclick = function(){ if(!D){ alert('Press Load Items first.'); return; } var no = 0;
    $('pr').innerHTML = '<h2 style="margin:0 0 8px">Café stock count — ' + C.fd($('date').value) + '</h2><div style="font-size:12px;margin-bottom:8px">Counted by: ' + esc($('by').value) + '</div><table><thead><tr><th>#</th><th>Item</th><th>Code</th><th>Unit</th><th>System</th><th>Count</th><th>Expiry</th></tr></thead><tbody>' +
      lines().map(function(l){ no++; return '<tr><td>' + no + '</td><td>' + esc(l.name) + '</td><td>' + esc(l.code) + '</td><td>' + esc(l.unit) + '</td><td>' + C.n3(l.system) + '</td><td>' + esc(C.n3(l.count)) + '</td><td>' + esc(C.fd(l.expiry)) + '</td></tr>'; }).join('') + '</tbody></table>';
    window.print(); };
  $('excel').onclick = function(){ if(!D){ alert('Press Load Items first.'); return; }
    var q = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = ['Group,Item,Code,Unit,System,Count,Expiry'].concat(lines().map(function(l){ return [l.group, l.name, l.code, l.unit, C.n3(l.system), C.n3(l.count), l.expiry].map(q).join(','); })).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv' })); a.download = 'cafe-count-' + $('date').value + '.csv'; a.click(); };
  $('wa').onclick = function(){ if(!D){ alert('Press Load Items first.'); return; }
    var L = lines().filter(function(l){ return l.count !== '' && l.count != null; });
    var txt = '☕ *Café stock count* — ' + C.fd($('date').value) + '\nCounted by: ' + $('by').value + '\n\n' + L.map(function(l){ return '• ' + l.name + ': ' + C.n3(l.count) + ' ' + l.unit + (l.expiry ? ' (exp ' + C.fd(l.expiry) + ')' : ''); }).join('\n');
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank'); };
  window.addEventListener('beforeunload', function(e){ if(Object.keys(dirty).length){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
