<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="shared/history-tools.js"></script>
<script src="auth-guard.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Initial Stock Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ede0;
    --paper-2:#e9e0c8;
    --ink:#1c2b45;
    --ink-dim:#5c6a83;
    --rust:#b0442e;
    --gold:#c68a1f;
    --line:#c9bfa0;
    --ok:#3d7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
    transition:color .12s ease;
  }
  .back-link:hover{ color:var(--rust); }

  header{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900;
    font-size:clamp(1.8rem,7vw,2.6rem); margin:0 0 6px; line-height:1;
  }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
    margin-bottom:20px; background:var(--paper-2); padding:5px; border-radius:3px;
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-dim); cursor:pointer; border-radius:2px; position:relative;
  }
  .branch-tab.active{ background:var(--ink); color:var(--paper); }
  .branch-tab .lock-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--rust); margin-left:4px; vertical-align:middle;
  }

  .lock-banner{
    display:none; align-items:center; gap:10px;
    background:#fbeae6; border:1px solid var(--rust); color:var(--rust);
    padding:12px 14px; border-radius:3px; font-size:12.5px; font-weight:600;
    margin-bottom:18px;
  }
  .lock-banner.show{ display:flex; }
  .lock-banner .stamp{
    font-family:'Space Mono',monospace; border:2px solid var(--rust);
    padding:2px 6px; font-size:10px; letter-spacing:0.05em;
    transform:rotate(-4deg); white-space:nowrap;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:20px; margin-bottom:18px;
  }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;
  }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-dim); margin-bottom:5px; margin-top:14px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%; background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:14px;
    color:var(--ink); outline:none;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--ink); }
  input:disabled, select:disabled{ background:var(--paper-2); color:var(--ink-dim); cursor:not-allowed; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .inline-add-row input{ width:100%; }
  .grid-2 > div{ min-width:0; }

  .submit-btn{
    width:100%; margin-top:18px; padding:14px 0; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .submit-btn:hover{ background:#14213a; }
  .submit-btn:disabled{ background:var(--line); cursor:not-allowed; }

  .lock-actions{ display:flex; gap:8px; margin-top:18px; }
  .lock-btn{
    flex:1; padding:12px 0; border-radius:3px; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em;
    cursor:pointer; border:1px solid;
  }
  .lock-btn.lock{ background:transparent; border-color:var(--rust); color:var(--rust); }
  .lock-btn.unlock{ background:transparent; border-color:var(--ok); color:var(--ok); }

  .refresh-link{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer; margin-bottom:14px;
  }

  .hist-row{ border-top:1px solid var(--line); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .hist-remarks{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; font-style:italic; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:20px 0; }
  .btn-row{ display:flex; gap:8px; margin-top:18px; }
  .btn-row .submit-btn{ margin-top:0; flex:1; }
  .add-btn{ flex:1; padding:14px 0; background:transparent; color:var(--ink); border:1px dashed var(--ink); border-radius:3px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; }
  .add-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .queue{ margin-top:16px; border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:none; }
  .queue.show{ display:block; }
  #queueList{ max-height:300px; overflow-y:auto; overscroll-behavior:contain; padding-right:4px; }
  .queue-head{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; margin-bottom:6px; }
  .queue-head button{ background:none; border:none; color:var(--ink-dim); font-size:11.5px; cursor:pointer; text-decoration:underline; }
  .q-row{ display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); padding:8px 0; font-size:12.5px; }
  .q-row:first-of-type{ border-top:none; }
  .q-row .q-main{ flex:1; min-width:0; }
  .q-row .q-name{ font-weight:600; }
  .q-row .q-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:2px; }
  .q-row .q-st{ font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .q-row .q-st.ok{ color:var(--ok); } .q-row .q-st.bad{ color:var(--rust); }
  .q-x{ background:none; border:1px solid var(--line); border-radius:50%; width:26px; height:26px; cursor:pointer; color:var(--ink-dim); flex:none; }
  .q-x:hover{ color:var(--rust); border-color:var(--rust); }
  .q-ed{ background:none; border:1px solid var(--line); border-radius:50%; width:26px; height:26px; cursor:pointer; color:var(--ink-dim); flex:none; font-size:13px; }
  .q-ed:hover{ color:var(--ink); border-color:var(--ink); }
  .q-row.editing{ background:rgba(200,120,140,.10); border-radius:6px; }
  .search-wrap{ position:relative; }
  .cancel-edit{ display:none; width:100%; margin-top:8px; padding:10px 0; background:transparent; border:1px solid var(--line); border-radius:3px; color:var(--ink-dim);
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; }
  .cancel-edit.on{ display:block; }
  .cancel-edit:hover{ color:var(--rust); border-color:var(--rust); }
  .search-x{ position:absolute; right:52px; top:50%; transform:translateY(-50%); width:28px; height:28px; border:0; border-radius:50%; background:rgba(200,120,140,.18); color:var(--ink); font-size:14px; line-height:1; cursor:pointer; display:none; z-index:2; }
  .search-x.on{ display:block; }
</style>

<meta name="lb-theme-keep" content=".wrap, .modal-overlay, .gbg">
<link rel="stylesheet" href="shared/glass-skin.css">
<script src="shared/glass-skin.js"></script>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>


<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Initial Stock</h1>
    <p class="sub">Set the opening balance for a branch — once per branch</p>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>

  <button class="refresh-link" id="refreshBtn">↻ Refresh Data</button>

  <div class="lock-banner" id="lockBanner">
    <span class="stamp">LOCKED</span>
    <span>Initial stock for this branch is locked. Unlock below to make changes.</span>
  </div>

  <div class="card">
    <div class="card-title">Opening Balance Entry</div>

    <label>Chocolate Name</label>
    <div class="search-wrap"><input type="text" id="fSearch" list="itemList" placeholder="Type or pick a chocolate" autocomplete="off" /><button type="button" class="search-x" id="searchClear" aria-label="Clear" title="Clear">✕</button></div>
    <datalist id="itemList"></datalist>

    <div class="grid-2">
      <div>
        <label>Category</label>
        <select id="fCategory">
          <option value="">Select category...</option>
          <option value="__add_new__">+ New category</option>
        </select>
        <div class="inline-add-row" id="newCategoryRow" style="display:none; margin-top:8px;">
          <input type="text" id="fNewCategory" placeholder="New category name" />
        </div>
      </div>
      <div>
        <label>Internal Code</label>
        <input type="text" id="fInternalCode" placeholder="Optional" />
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Batch No.</label>
        <input type="text" id="fBatch" placeholder="Leave blank to auto-generate" />
      </div>
      <div>
        <label>Expiry Date</label>
        <input type="date" id="fExpiryDate" />
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Qty</label>
        <input type="number" id="fQty" min="0" step="0.01" placeholder="0" />
      </div>
      <div>
        <label>Unit</label>
        <select id="fUnit"></select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Price / Kg (BD)</label>
        <input type="number" id="fPrice" min="0" step="0.001" placeholder="0.000" />
      </div>
      <div>
        <label>Storage Location</label>
        <select id="fStorageLocation"></select>
      </div>
    </div>

    <label>Entered By</label>
    <input type="text" id="fEnteredBy" list="enteredByList" placeholder="Type or pick a name" autocomplete="off" />
    <datalist id="enteredByList"></datalist>

    <div class="btn-row">
      <button class="add-btn" id="addListBtn" title="Add this chocolate to the list, then fill the next one">+ Add to List</button>
      <button class="submit-btn" id="saveBtn">Save Opening Balance</button>
    </div>

    <button type="button" class="cancel-edit" id="cancelEdit">✕ Cancel edit</button>

    <div class="queue" id="queueBox">
      <div class="queue-head"><span id="queueTitle">List (0)</span><button type="button" id="queueClear">Clear list</button></div>
      <div id="queueList"></div>
    </div>

    <div class="lock-actions">
      <button class="lock-btn lock" id="lockBtn">Lock This Branch</button>
      <button class="lock-btn unlock" id="unlockBtn" style="display:none;">Unlock This Branch</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Opening Balances Logged (This Branch)</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const API_URL = LB_CONFIG.CHOCOLATE_FAST_API;
  const BRANCHES = ['ModaMall','Hamala','Galali'];
  let currentBranch = 'ModaMall';

  let items = [];
  let categories = [];
  let enteredByNames = [];
  let storageLocations = [];
  let units = [];
  let entries = [];
  let lockStatus = { ModaMall:false, Hamala:false, Galali:false };

  function fmtBD(n){
    return Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD';
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  async function loadData(){
    const t = Date.now();
    const results = await Promise.all([
      fetch(API_URL + '?action=getItems&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getCategories&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getReceivedBy&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getStorageLocations&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getUnits&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getEntries&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      ...BRANCHES.map(b => fetch(API_URL + '?action=getLockStatus&branch=' + b + '&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return {locked:false}; }))
    ]);

    [items, categories, enteredByNames, storageLocations, units, entries] = results;
    BRANCHES.forEach((b, i) => { lockStatus[b] = !!results[6 + i].locked; });

    populateItemList(null);
    populateCategoryDropdown();
    document.getElementById('enteredByList').innerHTML =
      enteredByNames.map(n => `<option value="${n}"></option>`).join('');
    document.getElementById('fUnit').innerHTML =
      units.map(v => `<option value="${v}">${v}</option>`).join('');
    document.getElementById('fStorageLocation').innerHTML =
      storageLocations.map(v => `<option value="${v}">${v}</option>`).join('');

    renderBranchTabs();
    applyLockState();
    renderHistory();
  }

  function populateItemList(filterCategory){
    const filtered = filterCategory ? items.filter(it => it['Category'] === filterCategory) : items;
    document.getElementById('itemList').innerHTML =
      filtered.map(it => `<option value="${it['Chocolate Name']}"></option>`).join('');
  }

  function populateCategoryDropdown(){
    const sel = document.getElementById('fCategory');
    const currentVal = sel.value;
    sel.innerHTML = '<option value="">Select category...</option>' +
      categories.map(c => `<option value="${c}">${c}</option>`).join('') +
      '<option value="__add_new__">+ New category</option>';
    if(categories.includes(currentVal)) sel.value = currentVal;
  }

  function renderBranchTabs(){
    document.querySelectorAll('.branch-tab').forEach(tab=>{
      const b = tab.dataset.branch;
      tab.innerHTML = b + (lockStatus[b] ? ' <span class="lock-dot"></span>' : '');
    });
  }

  function applyLockState(){
    const locked = lockStatus[currentBranch];
    document.getElementById('lockBanner').classList.toggle('show', locked);
    document.getElementById('lockBtn').style.display = locked ? 'none' : 'block';
    document.getElementById('unlockBtn').style.display = locked ? 'block' : 'none';
    document.getElementById('saveBtn').disabled = locked;
    document.getElementById('addListBtn').disabled = locked;
    ['fSearch','fCategory','fInternalCode','fBatch','fExpiryDate','fQty','fUnit','fPrice','fStorageLocation','fEnteredBy'].forEach(id=>{
      document.getElementById(id).disabled = locked;
    });
  }

  document.getElementById('fCategory').addEventListener('change', function(){
    document.getElementById('newCategoryRow').style.display = (this.value === '__add_new__') ? 'block' : 'none';
    if(this.value && this.value !== '__add_new__'){
      populateItemList(this.value);
    } else {
      populateItemList(null);
    }
  });

  document.getElementById('fSearch').addEventListener('input', function(){
    const match = items.find(it => it['Chocolate Name'] === this.value);
    if(match){
      if(!document.getElementById('fPrice').value && match['Standard Price / Kg']){
        const p = String(match['Standard Price / Kg']).replace(/[^0-9.]/g,'');
        if(p) document.getElementById('fPrice').value = p;
      }
      if(match['Category'] && categories.includes(match['Category'])){
        document.getElementById('fCategory').value = match['Category'];
        document.getElementById('newCategoryRow').style.display = 'none';
      }
      if(!document.getElementById('fInternalCode').value && match['Product Code']){
        document.getElementById('fInternalCode').value = match['Product Code'];
      }
    }
  });

  const BRANCH_PREFIX = { ModaMall:'MM', Hamala:'HM', Galali:'GL' };

  function generateInitBatchNo(branch, dateStr){
    const prefix = BRANCH_PREFIX[branch] || 'XX';
    const d = dateStr ? new Date(dateStr) : new Date();
    const datePart = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const searchPrefix = `${prefix}-INITBATCH-${datePart}-`;
    let maxSeq = 0;
    entries.forEach(e=>{
      const val = String(e['Batch No.'] || '');
      if(val.startsWith(searchPrefix)){
        const seq = parseInt(val.slice(searchPrefix.length), 10);
        if(!isNaN(seq) && seq > maxSeq) maxSeq = seq;
      }
    });
    return searchPrefix + String(maxSeq + 1).padStart(2,'0');
  }

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    applyLockState();
    renderHistory();
    editIdx = -1; document.getElementById('addListBtn').textContent = '+ Add to List'; document.getElementById('cancelEdit').classList.remove('on');
    loadQueue(); renderQueue();
  });

  let _ht = null;
  function getHT(){
    if(_ht) return _ht;
    _ht = HistoryTools.create({
      listEl: document.getElementById('historyList'),
      title: 'Initial Stock (Opening Balance)',
      placeholder: 'item, batch…',
      getDate: e => e['Receive Date'],
      getText: e => [e['Chocolate Name'], e.ID, e['Batch No.'], e['Created By']].join(' '),
      subtitle: () => currentBranch,
      columns: [
        {h:'Date', v:e => fmtDate(e['Receive Date'])},
        {h:'ID', v:e => e.ID},
        {h:'Item', v:e => e['Chocolate Name']},
        {h:'Qty', v:e => (e['Qty Received'] ?? 0) + ' ' + (e.Unit || ''), right:true},
        {h:'Price/Kg', v:e => e['Price / Kg'] != null && e['Price / Kg'] !== '' ? Number(e['Price / Kg']).toFixed(3) : '', right:true},
        {h:'Batch', v:e => e['Batch No.']},
        {h:'By', v:e => e['Created By']}
      ],
      onChange: () => renderHistory()
    });
    return _ht;
  }
  function renderHistory(){
    const base = entries.filter(e => e.Branch === currentBranch && e['Delivery Note No'] === 'INITIAL STOCK');
    const el = document.getElementById('historyList');
    if(base.length === 0){
      el.innerHTML = '<div class="empty-note">No opening balance logged yet for ' + currentBranch + '.</div>';
      return;
    }
    const list = getHT().apply(base);
    if(list.length === 0){
      el.innerHTML = '<div class="empty-note">No entries match this filter.</div>';
      return;
    }
    el.innerHTML = list.map(e => `
      <div class="hist-row">
        <div class="hist-top">
          <span>${e['Chocolate Name'] || '—'} <span style="color:var(--ink-dim); font-weight:400;">(${e.ID || '—'})</span></span>
          <span>${fmtBD(e['Price / Kg'])}/kg</span>
        </div>
        <div class="hist-meta">${fmtDate(e['Receive Date'])} · ${e['Qty Received'] ?? 0} ${e.Unit || ''} · Batch: ${e['Batch No.'] || '—'}</div>
        <div class="hist-meta">Entered by: ${e['Created By'] || '—'}</div>
      </div>
    `).join('');
  }

  document.getElementById('lockBtn').addEventListener('click', async ()=>{
    if(!confirm(`Lock Initial Stock entry for ${currentBranch}? You won't be able to add more opening balances until it's unlocked.`)) return;
    try{
      await fetch(`${API_URL}?action=setLock&branch=${currentBranch}&value=Yes`);
      lockStatus[currentBranch] = true;
      renderBranchTabs();
      applyLockState();
    }catch(e){ alert('Could not lock this branch. Check your connection.'); }
  });

  document.getElementById('unlockBtn').addEventListener('click', async ()=>{
    if(!confirm(`Unlock Initial Stock entry for ${currentBranch}?`)) return;
    try{
      await fetch(`${API_URL}?action=setLock&branch=${currentBranch}&value=No`);
      lockStatus[currentBranch] = false;
      renderBranchTabs();
      applyLockState();
    }catch(e){ alert('Could not unlock this branch. Check your connection.'); }
  });

  // ---------- form -> one entry ----------
  function readForm(){
    const categorySel = document.getElementById('fCategory').value;
    const o = {
      chocolateName: document.getElementById('fSearch').value.trim(),
      category: (categorySel === '__add_new__') ? document.getElementById('fNewCategory').value.trim() : categorySel,
      internalCode: document.getElementById('fInternalCode').value.trim(),
      batch: document.getElementById('fBatch').value.trim(),
      expiryDate: document.getElementById('fExpiryDate').value,
      qty: parseFloat(document.getElementById('fQty').value),
      unit: document.getElementById('fUnit').value,
      price: parseFloat(document.getElementById('fPrice').value),
      storageLocation: document.getElementById('fStorageLocation').value,
      enteredBy: document.getElementById('fEnteredBy').value.trim()
    };
    if(!o.chocolateName || isNaN(o.qty) || o.qty <= 0){ alert('Chocolate name and a valid quantity are required.'); return null; }
    if(isNaN(o.price)) o.price = 0;
    return o;
  }
  function clearForm(){   // keeps Unit, Storage Location and Entered By for the next chocolate
    ['fSearch','fNewCategory','fInternalCode','fBatch','fExpiryDate','fQty','fPrice'].forEach(id => { document.getElementById(id).value = ''; });
    document.getElementById('fCategory').value = '';
    document.getElementById('newCategoryRow').style.display = 'none';
    populateItemList(null);
    document.getElementById('searchClear').classList.remove('on');
    document.getElementById('fSearch').focus();
  }
  document.getElementById('fSearch').addEventListener('input', function(){ document.getElementById('searchClear').classList.toggle('on', !!this.value); });
  document.getElementById('searchClear').addEventListener('click', () => {
    const f = document.getElementById('fSearch'); f.value = '';
    document.getElementById('searchClear').classList.remove('on');
    f.dispatchEvent(new Event('input')); f.focus();
  });
  // saves one entry; returns true when saved
  async function saveOne(o, askDup){
    const entryDateForBatch = new Date().toISOString().slice(0,10);
    let batch = o.batch || generateInitBatchNo(currentBranch, entryDateForBatch);
    if(o.batch){
      try{
        const dupRes = await (await fetch(`${API_URL}?action=checkDuplicateBatch&chocolateName=${encodeURIComponent(o.chocolateName)}&batch=${encodeURIComponent(batch)}&branch=${currentBranch}`)).json();
        if(dupRes.exists){
          if(!askDup) throw new Error('batch already saved');
          if(!confirm(`${o.chocolateName} with batch "${batch}" already has a record for ${currentBranch}. Save anyway?`)) return false;
        }
      }catch(e){ if(e && e.message === 'batch already saved') throw e; /* if the check fails, continue anyway */ }
    }
    const params = new URLSearchParams({
      action: 'addInitialStock', branch: currentBranch,
      chocolateName: o.chocolateName, category: o.category, internalCode: o.internalCode, batch, expiryDate: o.expiryDate,
      qty: o.qty, unit: o.unit, price: o.price, storageLocation: o.storageLocation,
      enteredBy: o.enteredBy, entryDate: entryDateForBatch
    });
    const res = await fetch(`${API_URL}?${params.toString()}`);
    const data = await res.json();
    if(!res.ok || (data && data.error)) throw new Error((data && data.error) || 'save failed');
    entries.push({
      ID: data.id, 'Receive Date': entryDateForBatch, 'Delivery Note No': 'INITIAL STOCK',
      'Chocolate Name': o.chocolateName, 'Batch No.': batch,
      'Qty Received': o.qty, Unit: o.unit, 'Price / Kg': o.price, Branch: currentBranch, 'Created By': o.enteredBy
    });
    if(o.enteredBy && !enteredByNames.includes(o.enteredBy)){
      enteredByNames.push(o.enteredBy);
      document.getElementById('enteredByList').innerHTML = enteredByNames.map(n => `<option value="${n}"></option>`).join('');
      fetch(`${API_URL}?action=addReceivedBy&name=${encodeURIComponent(o.enteredBy)}`).catch(()=>{});
    }
    if(o.category && !categories.includes(o.category)){ categories.push(o.category); populateCategoryDropdown(); }
    return true;
  }

  // ---------- list (add many, save all at once) ----------
  const QKEY = () => 'lbInitQueue:' + currentBranch;
  let queue = [];
  function loadQueue(){ try{ queue = JSON.parse(localStorage.getItem(QKEY()) || '[]') || []; }catch(e){ queue = []; } }
  function keepQueue(){ try{ localStorage.setItem(QKEY(), JSON.stringify(queue.filter(q => q.st !== 'ok'))); }catch(e){} }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function renderQueue(){
    const box = document.getElementById('queueBox'), waiting = queue.filter(q => q.st !== 'ok').length;
    box.classList.toggle('show', queue.length > 0);
    document.getElementById('queueTitle').textContent = 'List (' + queue.length + ')';
    document.getElementById('queueList').innerHTML = queue.map((q, i) => `
      <div class="q-row${i === editIdx ? ' editing' : ''}">
        <div class="q-main">
          <div class="q-name">${esc(q.chocolateName)}</div>
          <div class="q-meta">${q.qty} ${esc(q.unit)} · ${Number(q.price||0).toFixed(3)} BD/kg${q.batch ? ' · Batch ' + esc(q.batch) : ''}${q.expiryDate ? ' · Exp ' + esc(fmtDate(q.expiryDate)) : ''}${q.storageLocation ? ' · ' + esc(q.storageLocation) : ''}</div>
        </div>
        <span class="q-st ${q.st === 'ok' ? 'ok' : q.st === 'err' ? 'bad' : ''}">${q.st === 'ok' ? '✓ Saved' : q.st === 'err' ? '✕ ' + esc(q.msg || 'Not saved') : q.st === 'saving' ? 'Saving…' : ''}</span>
        ${q.st === 'ok' || q.st === 'saving' ? '' : `<button class="q-ed" data-e="${i}" title="Edit">✎</button><button class="q-x" data-i="${i}" title="Remove">✕</button>`}
      </div>`).join('');
    document.getElementById('saveBtn').textContent = waiting ? `Save All (${waiting})` : 'Save Opening Balance';
  }
  let editIdx = -1;
  function setEditMode(i){
    editIdx = i;
    document.getElementById('addListBtn').textContent = i >= 0 ? '✓ Update in List' : '+ Add to List';
    document.getElementById('cancelEdit').classList.toggle('on', i >= 0);
    renderQueue();
  }
  document.getElementById('cancelEdit').addEventListener('click', () => { setEditMode(-1); clearForm(); });
  function fillForm(q){
    document.getElementById('fSearch').value = q.chocolateName || '';
    if(q.category && !categories.includes(q.category)){ categories.push(q.category); populateCategoryDropdown(); }
    document.getElementById('fCategory').value = q.category || '';
    document.getElementById('newCategoryRow').style.display = 'none';
    document.getElementById('fInternalCode').value = q.internalCode || '';
    document.getElementById('fBatch').value = q.batch || '';
    document.getElementById('fExpiryDate').value = q.expiryDate || '';
    document.getElementById('fQty').value = q.qty;
    if(q.unit) document.getElementById('fUnit').value = q.unit;
    document.getElementById('fPrice').value = q.price || '';
    if(q.storageLocation) document.getElementById('fStorageLocation').value = q.storageLocation;
    document.getElementById('fEnteredBy').value = q.enteredBy || '';
    document.getElementById('fSearch').dispatchEvent(new Event('input'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('fQty').focus();
  }
  document.getElementById('queueList').addEventListener('click', e => {
    const ed = e.target.closest('.q-ed');
    if(ed){ const i = Number(ed.dataset.e); fillForm(queue[i]); setEditMode(i); return; }
    const b = e.target.closest('.q-x'); if(!b) return;
    const i = Number(b.dataset.i);
    queue.splice(i, 1); if(editIdx === i){ editIdx = -1; clearForm(); } else if(editIdx > i) editIdx--;
    setEditMode(editIdx); keepQueue(); renderQueue();
  });
  document.getElementById('queueClear').addEventListener('click', () => {
    if(queue.some(q => q.st !== 'ok') && !confirm('Remove all chocolates from the list?')) return;
    queue = []; editIdx = -1; setEditMode(-1); keepQueue(); renderQueue();
  });
  document.getElementById('addListBtn').addEventListener('click', () => {
    if(lockStatus[currentBranch]) return;
    const o = readForm(); if(!o) return;
    if(editIdx >= 0 && queue[editIdx]){ queue[editIdx] = o; setEditMode(-1); keepQueue(); renderQueue(); clearForm(); return; }
    queue = queue.filter(q => q.st !== 'ok');   // saved rows leave the list once you start a new one
    queue.push(o); keepQueue(); renderQueue(); clearForm();
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    if(lockStatus[currentBranch]) return;
    const saveBtn = document.getElementById('saveBtn');
    if(editIdx >= 0 && queue[editIdx] && document.getElementById('fSearch').value.trim()){ const o = readForm(); if(!o) return; queue[editIdx] = o; setEditMode(-1); clearForm(); keepQueue(); }
    const todo = queue.filter(q => q.st !== 'ok');
    // the form is filled too: add it to the list first so nothing is lost
    if(todo.length && document.getElementById('fSearch').value.trim()){
      const o = readForm(); if(!o) return; queue.push(o); todo.push(o); clearForm();
    }
    if(!todo.length){   // single entry, as before
      const o = readForm(); if(!o) return;
      saveBtn.disabled = true; saveBtn.textContent = 'Saving...';
      try{ if(await saveOne(o, true)){ clearForm(); renderHistory(); } }
      catch(e){ alert('Could not save this entry. Check your connection and try again.'); }
      saveBtn.disabled = false; renderQueue();
      return;
    }
    if(!confirm(`Save ${todo.length} opening balance(s) for ${currentBranch}?`)) return;
    saveBtn.disabled = true; document.getElementById('addListBtn').disabled = true;
    let ok = 0, bad = 0;
    for(const q of todo){
      q.st = 'saving'; renderQueue(); saveBtn.textContent = `Saving ${ok + bad + 1} of ${todo.length}...`;
      try{ await saveOne(q, false); q.st = 'ok'; ok++; }
      catch(e){ q.st = 'err'; q.msg = (e && e.message === 'batch already saved') ? 'Batch already saved' : 'Not saved'; bad++; }
      keepQueue(); renderQueue();
    }
    renderHistory();
    saveBtn.disabled = false; document.getElementById('addListBtn').disabled = lockStatus[currentBranch];
    renderQueue();
    alert(bad ? `${ok} saved, ${bad} not saved (still in the list, press Save All to try again).` : `${ok} saved.`);
  });

  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn');
    btn.textContent = 'Refreshing...';
    await loadData();
    btn.textContent = '↻ Refresh Data';
  });

  loadQueue(); renderQueue();
  loadData();
</script>

<script src="joyboy-bubble.js"></script>
