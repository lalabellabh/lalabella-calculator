<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Initial Stock Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ede0;
    --paper-2:#e9e0c8;
    --ink:#1c2b45;
    --ink-dim:#5c6a83;
    --rust:#b0442e;
    --gold:#c68a1f;
    --line:#c9bfa0;
    --ok:#3d7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 60px; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-dim); text-decoration:none; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:18px;
    transition:color .12s ease;
  }
  .back-link:hover{ color:var(--rust); }

  header{ text-align:center; margin-bottom:24px; }
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; color:var(--gold); margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:900;
    font-size:clamp(1.8rem,7vw,2.6rem); margin:0 0 6px; line-height:1;
  }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .branch-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;
    margin-bottom:20px; background:var(--paper-2); padding:5px; border-radius:3px;
  }
  .branch-tab{
    padding:11px 0; text-align:center; background:transparent; border:none;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    color:var(--ink-dim); cursor:pointer; border-radius:2px; position:relative;
  }
  .branch-tab.active{ background:var(--ink); color:var(--paper); }
  .branch-tab .lock-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--rust); margin-left:4px; vertical-align:middle;
  }

  .lock-banner{
    display:none; align-items:center; gap:10px;
    background:#fbeae6; border:1px solid var(--rust); color:var(--rust);
    padding:12px 14px; border-radius:3px; font-size:12.5px; font-weight:600;
    margin-bottom:18px;
  }
  .lock-banner.show{ display:flex; }
  .lock-banner .stamp{
    font-family:'Space Mono',monospace; border:2px solid var(--rust);
    padding:2px 6px; font-size:10px; letter-spacing:0.05em;
    transform:rotate(-4deg); white-space:nowrap;
  }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:4px;
    padding:20px; margin-bottom:18px;
  }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;
  }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-dim); margin-bottom:5px; margin-top:14px;
  }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%; background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:14px;
    color:var(--ink); outline:none;
  }
  input:focus, textarea:focus, select:focus{ border-color:var(--ink); }
  input:disabled, select:disabled{ background:var(--paper-2); color:var(--ink-dim); cursor:not-allowed; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .inline-add-row input{ width:100%; }
  .grid-2 > div{ min-width:0; }

  .submit-btn{
    width:100%; margin-top:18px; padding:14px 0; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:14px; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer;
  }
  .submit-btn:hover{ background:#14213a; }
  .submit-btn:disabled{ background:var(--line); cursor:not-allowed; }

  .lock-actions{ display:flex; gap:8px; margin-top:18px; }
  .lock-btn{
    flex:1; padding:12px 0; border-radius:3px; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em;
    cursor:pointer; border:1px solid;
  }
  .lock-btn.lock{ background:transparent; border-color:var(--rust); color:var(--rust); }
  .lock-btn.unlock{ background:transparent; border-color:var(--ok); color:var(--ok); }

  .refresh-link{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer; margin-bottom:14px;
  }

  .hist-row{ border-top:1px solid var(--line); padding:12px 0; font-size:13px; }
  .hist-row:first-child{ border-top:none; }
  .hist-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:600; }
  .hist-meta{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; }
  .hist-remarks{ color:var(--ink-dim); font-size:11.5px; margin-top:3px; font-style:italic; }
  .empty-note{ color:var(--ink-dim); font-size:13px; text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to Tools</a>
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Initial Stock</h1>
    <p class="sub">Set the opening balance for a branch — once per branch</p>
  </header>

  <div class="branch-tabs" id="branchTabs">
    <button class="branch-tab active" data-branch="ModaMall">ModaMall</button>
    <button class="branch-tab" data-branch="Hamala">Hamala</button>
    <button class="branch-tab" data-branch="Galali">Galali</button>
  </div>

  <button class="refresh-link" id="refreshBtn">↻ Refresh Data</button>

  <div class="lock-banner" id="lockBanner">
    <span class="stamp">LOCKED</span>
    <span>Initial stock for this branch is locked. Unlock below to make changes.</span>
  </div>

  <div class="card">
    <div class="card-title">Opening Balance Entry</div>

    <label>Chocolate Name</label>
    <input type="text" id="fSearch" list="itemList" placeholder="Type or pick a chocolate" autocomplete="off" />
    <datalist id="itemList"></datalist>

    <div class="grid-2">
      <div>
        <label>Category</label>
        <select id="fCategory">
          <option value="">Select category...</option>
          <option value="__add_new__">+ New category</option>
        </select>
        <div class="inline-add-row" id="newCategoryRow" style="display:none; margin-top:8px;">
          <input type="text" id="fNewCategory" placeholder="New category name" />
        </div>
      </div>
      <div>
        <label>Internal Code</label>
        <input type="text" id="fInternalCode" placeholder="Optional" />
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Batch No.</label>
        <input type="text" id="fBatch" placeholder="Leave blank to auto-generate" />
      </div>
      <div>
        <label>Expiry Date</label>
        <input type="date" id="fExpiryDate" />
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Qty</label>
        <input type="number" id="fQty" min="0" step="0.01" placeholder="0" />
      </div>
      <div>
        <label>Unit</label>
        <select id="fUnit"></select>
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Price / Kg (BD)</label>
        <input type="number" id="fPrice" min="0" step="0.001" placeholder="0.000" />
      </div>
      <div>
        <label>Storage Location</label>
        <select id="fStorageLocation"></select>
      </div>
    </div>

    <label>Entered By</label>
    <input type="text" id="fEnteredBy" list="enteredByList" placeholder="Type or pick a name" autocomplete="off" />
    <datalist id="enteredByList"></datalist>

    <button class="submit-btn" id="saveBtn">Save Opening Balance</button>

    <div class="lock-actions">
      <button class="lock-btn lock" id="lockBtn">Lock This Branch</button>
      <button class="lock-btn unlock" id="unlockBtn" style="display:none;">Unlock This Branch</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Opening Balances Logged (This Branch)</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbznLqWonLj9K1NR0kb3KfzZcSTxbxCMEJJS9CQFYd6GYcGPv9Alwk2dO4mpjwxGVg/exec';
  const BRANCHES = ['ModaMall','Hamala','Galali'];
  let currentBranch = 'ModaMall';

  let items = [];
  let categories = [];
  let enteredByNames = [];
  let storageLocations = [];
  let units = [];
  let entries = [];
  let lockStatus = { ModaMall:false, Hamala:false, Galali:false };

  function fmtBD(n){
    return Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD';
  }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  async function loadData(){
    const t = Date.now();
    const results = await Promise.all([
      fetch(API_URL + '?action=getItems&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getCategories&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getReceivedBy&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getStorageLocations&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getUnits&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      fetch(API_URL + '?action=getEntries&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return []; }),
      ...BRANCHES.map(b => fetch(API_URL + '?action=getLockStatus&branch=' + b + '&_ts=' + t).then(r=>r.json()).catch(e=>{ console.error(e); return {locked:false}; }))
    ]);

    [items, categories, enteredByNames, storageLocations, units, entries] = results;
    BRANCHES.forEach((b, i) => { lockStatus[b] = !!results[6 + i].locked; });

    populateItemList(null);
    populateCategoryDropdown();
    document.getElementById('enteredByList').innerHTML =
      enteredByNames.map(n => `<option value="${n}"></option>`).join('');
    document.getElementById('fUnit').innerHTML =
      units.map(v => `<option value="${v}">${v}</option>`).join('');
    document.getElementById('fStorageLocation').innerHTML =
      storageLocations.map(v => `<option value="${v}">${v}</option>`).join('');

    renderBranchTabs();
    applyLockState();
    renderHistory();
  }

  function populateItemList(filterCategory){
    const filtered = filterCategory ? items.filter(it => it['Category'] === filterCategory) : items;
    document.getElementById('itemList').innerHTML =
      filtered.map(it => `<option value="${it['Chocolate Name']}"></option>`).join('');
  }

  function populateCategoryDropdown(){
    const sel = document.getElementById('fCategory');
    const currentVal = sel.value;
    sel.innerHTML = '<option value="">Select category...</option>' +
      categories.map(c => `<option value="${c}">${c}</option>`).join('') +
      '<option value="__add_new__">+ New category</option>';
    if(categories.includes(currentVal)) sel.value = currentVal;
  }

  function renderBranchTabs(){
    document.querySelectorAll('.branch-tab').forEach(tab=>{
      const b = tab.dataset.branch;
      tab.innerHTML = b + (lockStatus[b] ? ' <span class="lock-dot"></span>' : '');
    });
  }

  function applyLockState(){
    const locked = lockStatus[currentBranch];
    document.getElementById('lockBanner').classList.toggle('show', locked);
    document.getElementById('lockBtn').style.display = locked ? 'none' : 'block';
    document.getElementById('unlockBtn').style.display = locked ? 'block' : 'none';
    document.getElementById('saveBtn').disabled = locked;
    ['fSearch','fCategory','fInternalCode','fBatch','fExpiryDate','fQty','fUnit','fPrice','fStorageLocation','fEnteredBy'].forEach(id=>{
      document.getElementById(id).disabled = locked;
    });
  }

  document.getElementById('fCategory').addEventListener('change', function(){
    document.getElementById('newCategoryRow').style.display = (this.value === '__add_new__') ? 'block' : 'none';
    if(this.value && this.value !== '__add_new__'){
      populateItemList(this.value);
    } else {
      populateItemList(null);
    }
  });

  document.getElementById('fSearch').addEventListener('input', function(){
    const match = items.find(it => it['Chocolate Name'] === this.value);
    if(match){
      if(!document.getElementById('fPrice').value && match['Standard Price / Kg']){
        const p = String(match['Standard Price / Kg']).replace(/[^0-9.]/g,'');
        if(p) document.getElementById('fPrice').value = p;
      }
      if(match['Category'] && categories.includes(match['Category'])){
        document.getElementById('fCategory').value = match['Category'];
        document.getElementById('newCategoryRow').style.display = 'none';
      }
      if(!document.getElementById('fInternalCode').value && match['Product Code']){
        document.getElementById('fInternalCode').value = match['Product Code'];
      }
    }
  });

  const BRANCH_PREFIX = { ModaMall:'MM', Hamala:'HM', Galali:'GL' };

  function generateInitBatchNo(branch, dateStr){
    const prefix = BRANCH_PREFIX[branch] || 'XX';
    const d = dateStr ? new Date(dateStr) : new Date();
    const datePart = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const searchPrefix = `${prefix}-INITBATCH-${datePart}-`;
    let maxSeq = 0;
    entries.forEach(e=>{
      const val = String(e['Batch No.'] || '');
      if(val.startsWith(searchPrefix)){
        const seq = parseInt(val.slice(searchPrefix.length), 10);
        if(!isNaN(seq) && seq > maxSeq) maxSeq = seq;
      }
    });
    return searchPrefix + String(maxSeq + 1).padStart(2,'0');
  }

  document.getElementById('branchTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.branch-tab');
    if(!btn) return;
    currentBranch = btn.dataset.branch;
    document.querySelectorAll('.branch-tab').forEach(b => b.classList.toggle('active', b === btn));
    applyLockState();
    renderHistory();
  });

  function renderHistory(){
    const list = entries
      .filter(e => e.Branch === currentBranch && e['Delivery Note No'] === 'INITIAL STOCK')
      .sort((a,b) => new Date(b['Receive Date']) - new Date(a['Receive Date']));
    const el = document.getElementById('historyList');
    if(list.length === 0){
      el.innerHTML = '<div class="empty-note">No opening balance logged yet for ' + currentBranch + '.</div>';
      return;
    }
    el.innerHTML = list.map(e => `
      <div class="hist-row">
        <div class="hist-top">
          <span>${e['Chocolate Name'] || '—'} <span style="color:var(--ink-dim); font-weight:400;">(${e.ID || '—'})</span></span>
          <span>${fmtBD(e['Price / Kg'])}/kg</span>
        </div>
        <div class="hist-meta">${fmtDate(e['Receive Date'])} · ${e['Qty Received'] ?? 0} ${e.Unit || ''} · Batch: ${e['Batch No.'] || '—'}</div>
        <div class="hist-meta">Entered by: ${e['Created By'] || '—'}</div>
      </div>
    `).join('');
  }

  document.getElementById('lockBtn').addEventListener('click', async ()=>{
    if(!confirm(`Lock Initial Stock entry for ${currentBranch}? You won't be able to add more opening balances until it's unlocked.`)) return;
    try{
      await fetch(`${API_URL}?action=setLock&branch=${currentBranch}&value=Yes`);
      lockStatus[currentBranch] = true;
      renderBranchTabs();
      applyLockState();
    }catch(e){ alert('Could not lock this branch. Check your connection.'); }
  });

  document.getElementById('unlockBtn').addEventListener('click', async ()=>{
    if(!confirm(`Unlock Initial Stock entry for ${currentBranch}?`)) return;
    try{
      await fetch(`${API_URL}?action=setLock&branch=${currentBranch}&value=No`);
      lockStatus[currentBranch] = false;
      renderBranchTabs();
      applyLockState();
    }catch(e){ alert('Could not unlock this branch. Check your connection.'); }
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    if(lockStatus[currentBranch]) return;

    const chocolateName = document.getElementById('fSearch').value.trim();
    const categorySel = document.getElementById('fCategory').value;
    const category = (categorySel === '__add_new__')
      ? document.getElementById('fNewCategory').value.trim()
      : categorySel;
    const internalCode = document.getElementById('fInternalCode').value.trim();
    let batch = document.getElementById('fBatch').value.trim();
    const expiryDate = document.getElementById('fExpiryDate').value;
    const qty = parseFloat(document.getElementById('fQty').value);
    const unit = document.getElementById('fUnit').value;
    const price = parseFloat(document.getElementById('fPrice').value);
    const storageLocation = document.getElementById('fStorageLocation').value;
    const enteredBy = document.getElementById('fEnteredBy').value.trim();

    if(!chocolateName || isNaN(qty) || qty <= 0){
      alert('Chocolate name and a valid quantity are required.');
      return;
    }

    const entryDateForBatch = new Date().toISOString().slice(0,10);
    if(!batch) batch = generateInitBatchNo(currentBranch, entryDateForBatch);

    if(batch){
      try{
        const dupRes = await (await fetch(`${API_URL}?action=checkDuplicateBatch&chocolateName=${encodeURIComponent(chocolateName)}&batch=${encodeURIComponent(batch)}&branch=${currentBranch}`)).json();
        if(dupRes.exists){
          if(!confirm(`${chocolateName} with batch "${batch}" already has a record for ${currentBranch}. Save anyway?`)) return;
        }
      }catch(e){ /* if the check fails, continue anyway */ }
    }

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving...';

    const params = new URLSearchParams({
      action: 'addInitialStock',
      branch: currentBranch,
      chocolateName, category, internalCode, batch, expiryDate,
      qty, unit, price: isNaN(price) ? 0 : price, storageLocation,
      enteredBy, entryDate: entryDateForBatch
    });

    try{
      const res = await fetch(`${API_URL}?${params.toString()}`);
      const data = await res.json();

      entries.push({
        ID: data.id, 'Receive Date': entryDateForBatch, 'Delivery Note No': 'INITIAL STOCK',
        'Chocolate Name': chocolateName, 'Batch No.': batch,
        'Qty Received': qty, Unit: unit, 'Price / Kg': price, Branch: currentBranch,
        'Created By': enteredBy
      });

      if(enteredBy && !enteredByNames.includes(enteredBy)){
        enteredByNames.push(enteredBy);
        document.getElementById('enteredByList').innerHTML =
          enteredByNames.map(n => `<option value="${n}"></option>`).join('');
        fetch(`${API_URL}?action=addReceivedBy&name=${encodeURIComponent(enteredBy)}`).catch(()=>{});
      }
      if(category && !categories.includes(category)){
        categories.push(category);
        populateCategoryDropdown();
      }

      document.getElementById('fSearch').value = '';
      document.getElementById('fCategory').value = '';
      document.getElementById('fNewCategory').value = '';
      document.getElementById('newCategoryRow').style.display = 'none';
      document.getElementById('fInternalCode').value = '';
      document.getElementById('fBatch').value = '';
      document.getElementById('fExpiryDate').value = '';
      document.getElementById('fQty').value = '';
      document.getElementById('fPrice').value = '';

      renderHistory();
    }catch(e){
      alert('Could not save this entry. Check your connection and try again.');
    }
    saveBtn.disabled = false; saveBtn.textContent = 'Save Opening Balance';
  });

  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn');
    btn.textContent = 'Refreshing...';
    await loadData();
    btn.textContent = '↻ Refresh Data';
  });

  loadData();
</script>
</body>
</html>
