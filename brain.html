<script type="text/plain" class="seed" data-title="System map" data-tags="core,system">
# System map

Static pages on GitHub Pages + Supabase (project `zoratiahjeldgsognfsj`). Pages call Edge Functions; the functions use the service role and check our own session token against the `users` table (`verify_jwt` is off).

## Edge Functions
- `auth-fast` — login, session, profile, User Management, password unlock
- `schedule-fast` — duty schedule (view, my schedule, save a day or week, admin upload, cleanup)
- `brain-fast` — reminders, auto rules, this vault
- `chat` — staff chat (text, voice, pictures, GIF/stickers, avatars)
- `chocolate-fast`, `flower-fast`, `item-fast`, `orderassign-fast`, `orderform-fast`, `notes-fast`, `pettycash-fast`, `nova-fast`

## Important tables
- `users` · `staff_positions` · `admin_unlock` · `auth_settings`
- `duty_schedule` (+ `duty_schedule_archive`, kept 90 days) — one row per person per day, `week_of` = the Sunday
- `reminders`, `reminder_acks`, `brain_notes`

## Shared browser files (shared/)
- `config.js` — every backend URL (change a URL here only)
- `nav.js` — the menu; also loads the chat bubble and the brain
- `brain.js` — banner reminders; `LBBrain.notify(...)` and `LBBrain.register(...)`
- `admin-gate.js` — password lock for admin pages
- `schedule-pdf.js` — reads a duty-schedule PDF

## Rules of thumb
- A schedule week belongs to the month of its **Thursday**.
- A new auto-check for the brain = add one entry to `RULES` in `brain-fast`.
- Daily job: [[Monthly schedule cleanup (SQL)]] · routine: [[Monthly routine]]
</script>
<script type="text/plain" class="seed" data-title="Monthly routine" data-tags="schedule,monthly">
# Monthly routine

1. From the **20th**, the brain reminds the admin if next month's schedule is not uploaded yet.
2. Open `schedule-admin.html` → pick the first week → **Upload PDF** → check the table → **Save the whole month**.
3. From the **25th**, staff who have no schedule for next month are reminded to add theirs (My Schedule → ✏️ Edit my schedule).
4. Gaps? `schedule-admin.html` → More tools → **Check missing days**. Admin and staff can also tap a day on the calendar to edit it.
5. On the 1st, the old month is cleaned up automatically — see [[Monthly schedule cleanup (SQL)]].

Related: [[System map]].
</script>
<script type="text/plain" class="seed" data-title="Monthly schedule cleanup (SQL)" data-tags="sql,schedule,monthly">
# Monthly schedule cleanup (SQL)

This **already runs by itself** every day at 12:10 AM (Bahrain time) — job `duty-schedule-monthly-cleanup`. When a new month starts, the old month is copied to `duty_schedule_archive` (kept 90 days) and removed from `duty_schedule`. Nothing to run each month — this note is only your copy-paste backup.

Rule used: a week belongs to the month of its **Thursday**. See [[System map]] and [[Monthly routine]].

## 1. Check the job is active
```sql
select jobname, schedule, active from cron.job;
```
It should show `duty-schedule-monthly-cleanup` with `active = true`.

## 2. Full setup code (only if it ever has to be created again)
```sql
create extension if not exists pg_cron;

create table if not exists public.duty_schedule_archive (
  id bigint, employee text, role text, home_branch text, day text,
  schedule_detail text, week_of date, created_at timestamptz,
  archived_at timestamptz not null default now()
);
alter table public.duty_schedule_archive enable row level security;

create or replace function public.duty_schedule_monthly_cleanup()
returns integer language plpgsql set search_path = public as $$
declare
  cutoff date := date_trunc('month', (now() at time zone 'Asia/Bahrain'))::date;
  n integer;
begin
  insert into public.duty_schedule_archive (id, employee, role, home_branch, day, schedule_detail, week_of, created_at)
    select id, employee, role, home_branch, day, schedule_detail, week_of, created_at
    from public.duty_schedule where week_of + 4 < cutoff;
  delete from public.duty_schedule where week_of + 4 < cutoff;
  get diagnostics n = row_count;
  delete from public.duty_schedule_archive where archived_at < now() - interval '90 days';
  return n;
end; $$;
revoke all on function public.duty_schedule_monthly_cleanup() from public, anon, authenticated;

select cron.schedule('duty-schedule-monthly-cleanup', '10 21 * * *',
  $$select public.duty_schedule_monthly_cleanup();$$);
```

## 3. Run the cleanup by hand (optional)
```sql
select public.duty_schedule_monthly_cleanup();
```

## 4. See / bring back archived weeks
```sql
select week_of, count(*) from public.duty_schedule_archive group by week_of order by week_of;
```
```sql
insert into public.duty_schedule (employee, role, home_branch, day, schedule_detail, week_of)
select employee, role, home_branch, day, schedule_detail, week_of
from public.duty_schedule_archive
where week_of >= date '2026-10-01';
```
</script>
<script type="text/plain" class="seed" data-title="Usage limits & storage" data-tags="supabase,limits,chat">
# Usage limits & storage

Supabase **free plan**: 1 GB file storage, 500 MB database, 5 GB bandwidth a month. The system protects itself — see [[System map]].

## What is already automatic
- **Chat photos/voice:** max **30 per person per day**; each file max 1.5 MB; voice max 60 s.
- Chat media is **deleted after 30 days** (shows as "expired").
- **Storage guard:** when storage reaches **850 MB**, photo/voice sending pauses for everyone (text and GIFs still work).
- **Banner for you** (admin/IT) when storage or database reaches **70%**.
- Staff see a banner when they have 5 or fewer photo/voice sends left for the day.
- Old duty schedule is archived/cleaned monthly — [[Monthly schedule cleanup (SQL)]].

## To change a limit
Edit the numbers at the top of the `chat` function: `MEDIA_PER_DAY`, `MAX_MEDIA_BYTES`, `RETENTION_DAYS`, `STORAGE_STOP_BYTES`.

## 1. Check how full we are
```sql
select pg_size_pretty((public.lb_usage()->>'db_bytes')::bigint) as database,
       pg_size_pretty((public.lb_usage()->>'storage_bytes')::bigint) as storage,
       pg_size_pretty((public.lb_usage()->>'chat_bytes')::bigint) as chat_media;
```

## 2. What is the biggest table?
```sql
select relname, pg_size_pretty(pg_total_relation_size(oid)) as size
from pg_class where relkind = 'r' and relnamespace = 'public'::regnamespace
order by pg_total_relation_size(oid) desc limit 10;
```

## 3. Emergency: free chat storage now
Marks every chat photo/voice older than 7 days as expired. Then delete the files in Supabase → Storage → `chat-media` (select all → Delete).
```sql
update public.chat_messages
set media_expired = true, media_path = null
where media_path is not null and created_at < now() - interval '7 days';
```

<script>
(function(){
  const $ = id => document.getElementById(id);
  let notes = [], curId = null, editing = false, tagFilter = '';

  function token(){ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }
  async function api(params){
    const body = new URLSearchParams(Object.assign({}, params, { token: token() }));
    const res = await fetch(LB_CONFIG.BRAIN_API, { method: 'POST', body });
    const d = await res.json();
    if(d && d.reauth) location.reload();      // unlock expired → the admin gate asks for the password again
    return d;
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const byTitle = t => notes.find(n => n.title.toLowerCase() === String(t).trim().toLowerCase());
  const fmt = v => { const d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); };

  // ---------- tiny markdown ----------
  function inline(s){
    let t = esc(s);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    t = t.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
      const n = byTitle(name.replace(/&amp;/g,'&').replace(/&#39;/g,"'"));
      return n ? '<a class="wl" href="#n' + n.id + '">' + name + '</a>' : '<a class="wl miss" href="#new:' + encodeURIComponent(name) + '" title="No such note yet — click to create">' + name + '</a>';
    });
    return t;
  }
  function md(src){
    const lines = String(src || '').replace(/\r/g, '').split('\n');
    let out = '', i = 0, para = [], list = null;
    const flushP = () => { if(para.length){ out += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
    const flushL = () => { if(list){ out += '<' + list.t + '>' + list.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'; list = null; } };
    while(i < lines.length){
      const ln = lines[i];
      const f = /^```\s*(\w*)\s*$/.exec(ln);
      if(f){
        flushP(); flushL();
        const code = []; i++;
        while(i < lines.length && !/^```\s*$/.test(lines[i])){ code.push(lines[i]); i++; }
        i++;
        const raw = code.join('\n');
        out += '<div class="codebox"><div class="ch"><span>' + esc(f[1] || 'code') + '</span><button class="copy" type="button">Copy</button></div><pre><code>' + esc(raw) + '</code></pre></div>';
        continue;
      }
      const h = /^(#{1,3})\s+(.*)$/.exec(ln);
      if(h){ flushP(); flushL(); out += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; i++; continue; }
      const ul = /^\s*[-*]\s+(.*)$/.exec(ln), ol = /^\s*\d+[.)]\s+(.*)$/.exec(ln);
      if(ul || ol){ flushP(); const t = ul ? 'ul' : 'ol'; if(!list || list.t !== t){ flushL(); list = { t, items: [] }; } list.items.push((ul || ol)[1]); i++; continue; }
      if(!ln.trim()){ flushP(); flushL(); i++; continue; }
      flushL(); para.push(ln.trim()); i++;
    }
    flushP(); flushL();
    return out;
  }

  // ---------- list ----------
  function allTags(){ const s = new Set(); notes.forEach(n => (n.tags || []).forEach(t => s.add(t))); return [...s].sort(); }
  function renderList(){
    const q = $('q').value.trim().toLowerCase();
    $('tagBar').innerHTML = allTags().map(t => '<span class="tag' + (t === tagFilter ? ' on' : '') + '" data-t="' + esc(t) + '">#' + esc(t) + '</span>').join('');
    $('tagBar').querySelectorAll('.tag').forEach(el => el.addEventListener('click', () => { tagFilter = tagFilter === el.dataset.t ? '' : el.dataset.t; renderList(); }));
    const list = notes.filter(n => (!tagFilter || (n.tags || []).includes(tagFilter)) && (!q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q)));
    $('nlist').innerHTML = list.length ? list.map(n => '<a class="nitem' + (n.id === curId ? ' cur' : '') + '" href="#n' + n.id + '"><b>' + esc(n.title) + '</b><small>' + esc(fmt(n.updatedAt)) + ((n.tags || []).length ? ' · ' + (n.tags || []).map(t => '#' + esc(t)).join(' ') : '') + '</small></a>').join('') : '<div class="empty">No notes found.</div>';
  }

  // ---------- main pane ----------
  function showNote(n){
    editing = false; curId = n.id;
    const back = notes.filter(x => x.id !== n.id && new RegExp('\\[\\[\\s*' + n.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\]\\]', 'i').test(x.body));
    $('main').innerHTML =
      '<div class="note-head"><h1>' + esc(n.title) + '</h1><div style="display:flex;gap:8px"><button class="btn ghost" id="editBtn">✏️ Edit</button><button class="btn ghost" id="copyAll">Copy note</button></div></div>' +
      '<div class="meta">' + (n.tags || []).map(t => '<span class="tg">#' + esc(t) + '</span>').join('') + 'Updated ' + esc(fmt(n.updatedAt)) + (n.updatedBy && n.updatedBy !== 'seed' ? ' by ' + esc(n.updatedBy) : '') + '</div>' +
      '<div class="md" id="mdBox">' + md(n.body) + '</div>' +
      (back.length ? '<div class="back">Linked from: ' + back.map(b => '<a href="#n' + b.id + '">' + esc(b.title) + '</a>').join('') + '</div>' : '');
    $('editBtn').addEventListener('click', () => showEdit(n));
    $('copyAll').addEventListener('click', ev => copyText(n.body, ev.target));
    renderList();
  }
  function showEdit(n){
    editing = true; curId = n ? n.id : null;
    const isNew = !n || !n.id;
    $('main').innerHTML =
      '<div class="edit-grid">' +
      '<input id="eTitle" placeholder="Title" maxlength="120" value="' + esc(n ? n.title : '') + '">' +
      '<input id="eTags" placeholder="Tags, separated by commas (e.g. sql, schedule)" value="' + esc(n ? (n.tags || []).join(', ') : '') + '">' +
      '<textarea class="body" id="eBody" placeholder="Write here…">' + esc(n ? n.body : '') + '</textarea>' +
      '<div class="hint">Link notes with <code>[[Note title]]</code>. Code goes between lines of three backticks (```) — it gets a Copy button. Use # for headings and - for lists.</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="saveBtn">Save</button><button class="btn ghost" id="cancelBtn">Cancel</button>' + (isNew ? '' : '<button class="btn danger" id="delBtn" style="margin-left:auto">Delete</button>') + '</div>' +
      '<div class="msg" id="eMsg"></div></div>';
    $('cancelBtn').addEventListener('click', () => { const x = notes.find(m => m.id === (n && n.id)); if(x) showNote(x); else showHome(); });
    $('saveBtn').addEventListener('click', async () => {
      const btn = $('saveBtn'); btn.disabled = true; $('eMsg').className = 'msg'; $('eMsg').textContent = 'Saving…';
      const d = await api({ action: 'noteSave', id: n && n.id ? n.id : '', title: $('eTitle').value, tags: $('eTags').value, body: $('eBody').value });
      btn.disabled = false;
      if(!d.success){ $('eMsg').className = 'msg err'; $('eMsg').textContent = d.error || 'Could not save.'; return; }
      await load(); location.hash = '#n' + d.id; route();
    });
    const del = $('delBtn');
    if(del) del.addEventListener('click', async () => {
      if(!confirm('Delete this note? This cannot be undone.')) return;
      const d = await api({ action: 'noteDelete', id: n.id });
      if(d.success){ await load(); location.hash = ''; showHome(); } else { $('eMsg').className = 'msg err'; $('eMsg').textContent = d.error || 'Could not delete.'; }
    });
    renderList();
  }
  function showHome(){
    curId = null; editing = false; renderList();
    if(!notes.length){
      $('main').innerHTML = '<h1 style="font-family:Fraunces,serif;margin:0 0 6px">Your vault is empty</h1><p class="hint" style="font-size:13px">Notes live here: system rules, SQL you want to copy, monthly routines. Link them with [[double brackets]] like Obsidian.</p><button class="btn primary" id="seedBtn">Add starter notes</button><div class="msg" id="seedMsg"></div>';
      $('seedBtn').addEventListener('click', seed);
    } else {
      $('main').innerHTML = '<h1 style="font-family:Fraunces,serif;margin:0 0 6px">Brain Vault</h1><p class="hint" style="font-size:13px;line-height:1.7">Pick a note on the left, or press <b>+ New</b>.<br>Tip: put long SQL or code between three backticks and it gets a <b>Copy</b> button. Reminders can open a note straight from the banner (User Management → Reminders → Link).</p>' + (missingSeeds() ? '<button class="btn primary" id="seedBtn">Add ' + missingSeeds() + ' new starter note' + (missingSeeds() > 1 ? 's' : '') + '</button><div class="msg" id="seedMsg"></div>' : '');
      if($('seedBtn')) $('seedBtn').addEventListener('click', seed);
    }
  }
  async function copyText(text, btn){
    try{ await navigator.clipboard.writeText(text); }
    catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }
    if(btn){ const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = o; }, 1400); }
  }
  document.addEventListener('click', ev => {
    const b = ev.target.closest && ev.target.closest('.codebox .copy');
    if(!b) return;
    copyText(b.closest('.codebox').querySelector('code').textContent, b);
  });

  // ---------- starter notes ----------
  function missingSeeds(){ let c = 0; document.querySelectorAll('script.seed').forEach(el => { if(!notes.some(n => n.title.toLowerCase() === el.dataset.title.toLowerCase())) c++; }); return c; }
  async function seed(){
    const btn = $('seedBtn'); btn.disabled = true; $('seedMsg').textContent = 'Adding…';
    let firstId = '', cleanupId = '';
    for(const el of document.querySelectorAll('script.seed')){
      if(notes.some(n => n.title.toLowerCase() === el.dataset.title.toLowerCase())) continue;
      const d = await api({ action: 'noteSave', title: el.dataset.title, tags: el.dataset.tags, body: el.textContent.replace(/^\n/, '') });
      if(d.success && !firstId) firstId = d.id;
      if(d.success && el.dataset.title.indexOf('cleanup') !== -1) cleanupId = d.id;
    }
    // A monthly reminder for you that opens the SQL note
    try{
      const u = JSON.parse(sessionStorage.getItem('lalabellaUser') || localStorage.getItem('lalabellaUser') || '{}');
      const first = String(u.fullName || '').trim().split(/\s+/)[0];
      if(cleanupId && first && !notes.length) await api({ action: 'adminSave', message: 'Monthly: upload next month’s schedule. The old-month cleanup runs by itself — the SQL code is in this note if you ever need to copy it.', audience: 'user:' + first, kind: 'monthly', dayOfMonth: 25, link: 'brain.html#n' + cleanupId });
    }catch(e){}
    await load(); location.hash = firstId ? '#n' + firstId : ''; route();
  }

  // ---------- routing ----------
  function route(){
    const h = location.hash || '';
    const m = /^#n(\d+)$/.exec(h), nw = /^#new(?::(.*))?$/.exec(h);
    if(m){ const n = notes.find(x => x.id === +m[1]); if(n) return showNote(n); }
    if(nw){ return showEdit({ id: '', title: nw[1] ? decodeURIComponent(nw[1]) : '', tags: [], body: '' }); }
    showHome();
  }
  async function load(){
    const d = await api({ action: 'noteList' });
    if(!d.success){ $('main').innerHTML = '<div class="empty">' + esc(d.error || 'Could not load the vault.') + '</div>'; return false; }
    notes = d.notes || []; renderList(); return true;
  }
  $('q').addEventListener('input', renderList);
  $('newBtn').addEventListener('click', () => { location.hash = '#new'; });
  window.addEventListener('hashchange', () => { if(!editing || confirm('Leave without saving?')) route(); });
  load().then(ok => { if(ok) route(); });
})();
</script>
</body>
</html>
