<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Chocolate Calculator</title><script src="../../supabase-config.js"></script><script src="../../supabase-client.js"></script><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--c:#0d0806;--c2:#1a100c;--g:#e8c46a;--gh:#ffdd7a;--t:#f5ecdf;--d:#8a7568;--l:#332218}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24140d,var(--c) 55%);color:var(--t);font-family:'Space Grotesk',sans-serif;min-height:100vh}.r{height:10px;background:repeating-linear-gradient(-45deg,var(--g),var(--g) 18px,var(--gh) 18px,var(--gh) 36px)}main{max-width:720px;margin:auto;padding:40px 18px 70px}.back{color:var(--d);text-decoration:none;font-size:12px;text-transform:uppercase}header{text-align:center;margin:28px 0}.ey{color:var(--g);font-size:11px;letter-spacing:.35em;font-weight:700}h1{font:900 clamp(2.4rem,8vw,4rem)/.95 'Fraunces',serif;margin:12px 0}h1 em{color:var(--g)}.sub,.status,.meta{color:var(--d);font-size:12px}.search{display:flex;gap:8px}.search input,.extra input{width:100%;background:var(--c2);border:2px solid var(--l);padding:15px;color:var(--t);outline:0;font-size:15px}.search input:focus,.extra input:focus{border-color:var(--g)}button{font:inherit;cursor:pointer}.clear{background:transparent;border:1px solid var(--l);color:var(--d);padding:0 15px}.cats{display:flex;gap:7px;overflow:auto;padding:12px 0}.cat{border:1px solid var(--l);background:transparent;color:var(--d);border-radius:20px;padding:8px 13px;white-space:nowrap}.cat.active,.cat:hover{background:var(--g);color:var(--c);border-color:var(--g)}.results{display:none;border:1px solid var(--l);max-height:300px;overflow:auto}.item,.row{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--l)}.item:hover{background:var(--c2)}.name{font-weight:700}.price{color:var(--g);font-weight:700;white-space:nowrap}.card{display:none;margin-top:18px;border:2px solid var(--g);background:var(--c2);padding:22px}.head,.total,.grand{display:flex;justify-content:space-between;align-items:center;gap:12px}.head{border-bottom:1px solid var(--l);padding-bottom:15px}.change,.rm{background:transparent;border:1px solid var(--l);color:var(--d);padding:7px 10px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.mode{padding:12px;border:1px solid var(--l);background:transparent;color:var(--d)}.mode.active{background:var(--g);color:var(--c)}#amount{width:100%;background:var(--c);border:2px solid var(--l);padding:15px;color:var(--t);font-size:18px}.total,.grand{padding:18px;margin-top:14px;background:var(--c);border:1px solid var(--l)}.big{font:900 32px 'Fraunces',serif;color:var(--gh)}.add,.print,.share,.extra button{width:100%;padding:14px;margin-top:10px;border:0;background:var(--g);color:var(--c);font-weight:700}.add:disabled{opacity:.35}.list{display:none;margin-top:24px}.extra{margin-top:16px;padding:15px;border:1px solid var(--l)}.extra h2{font:600 18px 'Fraunces',serif;margin:0 0 10px}.extra form{display:grid;grid-template-columns:1fr 130px 130px;gap:7px}.extra button{margin:0}.status{text-align:center;margin-top:15px}@media(max-width:600px){.search{display:block}.clear{width:100%;padding:10px;margin-top:7px}.extra form{display:block}.extra button{margin-top:7px}}
</style></head><body><div class="r"></div><main><a class="back" href="../../index.html">← Back to Tools</a><header><div class="ey">LALABELLA</div><h1>Chocolate <em>Calculator</em></h1><p class="sub">Supabase-powered catalog · Pieces · Grams · Kg</p></header><div class="search"><input id="q" placeholder="Type chocolate name, code or category…" autocomplete="off"><button class="clear" id="clear">Clear</button></div><div class="cats" id="cats"></div><div class="results" id="results"></div><section class="card" id="card"><div class="head"><div><div class="name" id="selName"></div><div class="meta" id="selMeta"></div></div><button class="change" id="change">Change</button></div><div class="modes"><button class="mode active" data-mode="pieces">Pieces</button><button class="mode" data-mode="grams">Grams</button><button class="mode" data-mode="kg">Kg</button></div><input id="amount" type="number" min="0" step=".001" placeholder="How many pieces?"><div class="total"><div><div class="meta">CURRENT TOTAL</div><div class="meta" id="kg">—</div></div><div class="big" id="total">0.000 BD</div></div><button class="add" id="add" disabled>Add to List</button></section><section class="list" id="list"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font:600 20px 'Fraunces',serif">Order List</h2><button id="clearList" class="change">Clear All</button></div><div id="rows"></div><div class="extra"><h2>Extras</h2><form id="extraForm"><input id="extraName" placeholder="e.g. Vase"><input id="extraAmount" type="number" min="0" step=".001" placeholder="0.000 BD"><button>Add Extra</button></form><div id="extras"></div></div><div class="grand"><div><div class="meta">GRAND TOTAL</div><div class="meta" id="count">0 items</div></div><div class="big" id="grand">0.000 BD</div></div><button class="print" id="print">Print / Save as PDF</button><button class="share" id="share" style="display:none">📤 Send to WhatsApp</button></section><div class="status" id="status">Checking Supabase session…</div></main><script>(async()=>{const $=id=>document.getElementById(id),fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' BD',esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let sb,data=[],selected=null,mode='pieces',cart=[],extras=[],cat=null;try{sb=await window.LalabellaSupabase.ready();const{data:{user},error:ue}=await sb.auth.getUser();if(ue||!user){location.href='../../index.html';return}const{data:d,error}=await sb.from('chocolate_item_list').select('id,chocolate_name,product_code,brand,category,standard_price_per_kg,grams').order('chocolate_name');if(error)throw error;data=(d||[]).map(x=>({id:x.id,name:x.chocolate_name,code:x.product_code||'N/A',brand:x.brand||'',category:x.category||'Uncategorized',price:Number(x.standard_price_per_kg)||0,grams:Number(x.grams)||0}));$('status').textContent=data.length+' chocolate items loaded from Supabase';renderCats()}catch(e){$('status').textContent='Could not load catalog: '+(e.message||'connection error');return}function renderCats(){const cs=[...new Set(data.map(x=>x.category))].filter(Boolean);$('cats').innerHTML=cs.map(c=>`<button class="cat ${cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');$('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=cat===b.dataset.cat?null:b.dataset.cat;renderCats();renderResults(cat?data.filter(x=>x.category===cat):data)})}function renderResults(a){const r=$('results');r.innerHTML=a.slice(0,30).map(x=>`<div class="item" data-id="${x.id}"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category)} · ${esc(x.code)} · ${x.grams}g/pc</div></div><div class="price">${fmt(x.price)}/kg</div></div>`).join('')||'<div class="meta" style="padding:15px">No chocolates found.</div>';r.style.display='block';r.querySelectorAll('.item').forEach(el=>el.onclick=()=>select(data.find(x=>String(x.id)===el.dataset.id)))}$('q').oninput=e=>{cat=null;renderCats();const q=e.target.value.toLowerCase().trim();if(!q){$('results').style.display='none';return}renderResults(data.filter(x=>[x.name,x.code,x.category,x.brand].some(v=>String(v).toLowerCase().includes(q))))};$('clear').onclick=()=>{$('q').value='';$('results').style.display='none';$('card').style.display='none';selected=null};$('change').onclick=()=>{$('clear').click();$('q').focus()};function select(x){if(!x)return;selected=x;$('selName').textContent=x.name;$('selMeta').textContent=`${x.code} · ${x.grams}g per piece · ${fmt(x.price)}/kg`;$('card').style.display='block';$('results').style.display='none';$('q').value=x.name;setMode('pieces');$('amount').focus()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('amount').placeholder=m==='pieces'?'How many pieces?':m==='grams'?'How many grams?':'How many kg?';$('amount').value='';calc()}$('amount').oninput=calc;function calc(){const n=Number($('amount').value);if(!selected||n<=0){$('kg').textContent='—';$('total').textContent='0.000 BD';$('add').disabled=true;return}const kg=mode==='pieces'?n*selected.grams/1000:mode==='grams'?n/1000:n;$('kg').textContent=kg.toFixed(3)+' kg';$('total').textContent=fmt(kg*selected.price);$('add').disabled=false}function render(){if(!cart.length&&!extras.length){$('list').style.display='none';return}$('list').style.display='block';$('rows').innerHTML=cart.map((x,i)=>`<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${x.amount} ${x.mode} · ${x.kg.toFixed(3)} kg</div></div><div>${fmt(x.total)} <button class="rm" data-i="${i}">×</button></div></div>`).join('');$('rows').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.i,1);render()});$('extras').innerHTML=extras.map((x,i)=>`<div class="row"><div>${esc(x.name)}</div><div>${fmt(x.amount)} <button class="rm" data-e="${i}">×</button></div></div>`).join('');$('extras').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{extras.splice(+b.dataset.e,1);render()});const t=cart.reduce((s,x)=>s+x.total,0)+extras.reduce((s,x)=>s+x.amount,0);$('grand').textContent=fmt(t);$('count').textContent=cart.length+(cart.length===1?' item':' items');$('share').style.display=navigator.share?'block':'none')}$('add').onclick=()=>{const n=Number($('amount').value),kg=mode==='pieces'?n*selected.grams/1000:mode==='grams'?n/1000:n;cart.push({name:selected.name,amount:n,mode,kg,total:kg*selected.price});$('clear').click();render()};$('clearList').onclick=()=>{cart=[];extras=[];render()};$('extraForm').onsubmit=e=>{e.preventDefault();const n=$('extraName').value.trim(),a=Number($('extraAmount').value);if(!n||a<=0)return;extras.push({name:n,amount:a});$('extraName').value='';$('extraAmount').value='';render()};$('print').onclick=()=>window.print();$('share').onclick=()=>{const text=['Lalabella Chocolate Order',...cart.map(x=>`${x.name} — ${x.amount} ${x.mode} — ${fmt(x.total)}`),...extras.map(x=>`${x.name} — ${fmt(x.amount)}`),'Grand Total: '+$('grand').textContent].join('\n');navigator.share?.({text}).catch(()=>{})}})();</script></body></html>
