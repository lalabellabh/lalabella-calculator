<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Chocolate Stock Count</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;background:#f3ede0;color:#1c2b45;font-family:system-ui}.wrap{max-width:1180px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9bfa0;border-radius:10px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;font-size:11px;text-transform:uppercase;color:#5c6a83;margin:10px 0 5px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9bfa0;border-radius:6px;background:#f8f2e7;color:#1c2b45}button{padding:10px 14px;border:0;border-radius:6px;background:#1c2b45;color:#fff;font-weight:700;cursor:pointer}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button.active{background:#b0442e}.row{border-top:1px solid #e5dcc6;padding:12px 0;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.4fr;gap:8px;align-items:center;font-size:12px}.head{font-weight:700;border-top:0;color:#5c6a83}@media(max-width:800px){.row{min-width:760px}.scroll{overflow:auto}}.scroll{overflow:auto}.msg{margin:10px 0;font-size:13px}.badge{font-size:10px;padding:4px 7px;border-radius:10px;background:#fbf1de}.ok{background:#e3f0e6;color:#3d7a4f}.warn{background:#fbe6d9;color:#a84c1f}.garden{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.flower{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff 0 7%,#e66567 8% 30%,#a92e39 31% 55%,#365b32 56%);display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px;box-shadow:0 0 30px #b0442e55}.stat{min-width:100px}.stat b{display:block;font-size:25px}</style></head><body><div class="wrap"><a href="index.html">← Back to Tools</a><div class="card"><h1>Chocolate Stock Count</h1><p>Supabase-native stock count. No Google Sheets or Apps Script.</p><div class="tabs" id="tabs"><button data-b="ModaMall" class="active">ModaMall</button><button data-b="Hamala">Hamala</button><button data-b="Galali">Galali</button></div><div class="grid"><div><label>Count Date</label><input id="date" type="date"></div><div><label>Counted By</label><input id="by" placeholder="Name"></div><div><label>Search</label><input id="search" placeholder="Chocolate name"></div></div></div><div class="card"><div class="garden"><div class="flower" id="pulse">0</div><div class="stat"><small>Items</small><b id="items">0</b></div><div class="stat"><small>Counted</small><b id="counted">0</b></div><div class="stat"><small>Total Variance</small><b id="variance">0</b></div><button id="save">Save Count Session</button><button id="refresh">Refresh</button></div><div class="msg" id="msg"></div></div><div class="card"><h2>Items</h2><div class="scroll"><div id="list"></div></div></div><div class="card"><h2>Recent History</h2><div class="scroll"><div id="history"></div></div></div></div><script>(async()=>{const auth=window.LalabellaAuth;const u=await auth.getUser();if(!u){location.replace('login.html');return}const p=await auth.getProfile();if(!p){document.body.innerHTML='<div class="wrap"><div class="card">Profile unavailable.</div></div>';return}let branch=p.branch||'ModaMall';let data=[],inputs=new Map();const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);$('by').value=p.full_name||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=sb.from('chocolate_database').select('id,chocolate_name,batch_no,expiry_date,current_stock,unit,category').eq('branch',branch).order('chocolate_name').limit(500);const r=await q;if(r.error){$('msg').textContent=r.error.message;return}data=r.data||[];render();loadHistory()}function render(){const s=$('search').value.trim().toLowerCase();const v=data.filter(x=>!s||String(x.chocolate_name||'').toLowerCase().includes(s));$('items').textContent=data.length;$('list').innerHTML='<div class="row head"><div>Chocolate</div><div>Batch</div><div>System</div><div>Physical</div><div>Variance</div><div>Reason</div></div>'+v.map(x=>{const old=inputs.get(x.id)||{};return '<div class="row" data-id="'+x.id+'"><div><b>'+esc(x.chocolate_name)+'</b><br><small>'+esc(x.category||'')+' · '+esc(x.unit||'')+'</small></div><div>'+esc(x.batch_no||'—')+'</div><div>'+Number(x.current_stock||0)+'</div><div><input class="physical" data-id="'+x.id+'" type="number" min="0" step="0.01" value="'+(old.physical??'')+'"></div><div class="v">—</div><div><select class="reason" data-id="'+x.id+'"><option value="">Select</option><option>Damaged</option><option>Expired</option><option>Miscount</option><option>Theft/Loss</option><option>Found Extra</option><option>Other</option></select></div></div>'}).join('');v.forEach(x=>{const r=document.querySelector('[data-id="'+x.id+'"].reason');if(r&&inputs.get(x.id)?.reason)r.value=inputs.get(x.id).reason});document.querySelectorAll('.physical').forEach(i=>i.oninput=()=>{const x=data.find(a=>a.id==i.dataset.id);inputs.set(x.id,{...(inputs.get(x.id)||{}),physical:i.value});updateStats()});document.querySelectorAll('.reason').forEach(i=>i.onchange=()=>{const x=data.find(a=>a.id==i.dataset.id);inputs.set(x.id,{...(inputs.get(x.id)||{}),reason:i.value});});updateStats()}function updateStats(){let n=0,v=0;for(const x of data){const q=Number(inputs.get(x.id)?.physical);if(Number.isFinite(q)){n++;v+=q-Number(x.current_stock||0)}}$('counted').textContent=n;$('variance').textContent=v;$('pulse').textContent=n}async function loadHistory(){let q=sb.from('chocolate_stock_count_history').select('count_date,chocolate_name,system_stock,physical_count,variance,status,counted_by').eq('branch',branch).order('count_date',{ascending:false}).order('id',{ascending:false}).limit(60);const r=await q;if(r.error){$('history').textContent=r.error.message;return}$('history').innerHTML=(r.data||[]).map(x=>'<div class="row"><div><b>'+esc(x.chocolate_name)+'</b><br><small>'+esc(x.counted_by||'')+'</small></div><div>'+esc(x.count_date)+'</div><div>'+x.system_stock+'</div><div>'+x.physical_count+'</div><div>'+x.variance+'</div><div><span class="badge '+(x.status==='Confirmed'?'ok':'warn')+'">'+esc(x.status)+'</span></div></div>').join('')||'<p>No history.</p>'}$('save').onclick=async()=>{const lines=data.map(x=>{const q=inputs.get(x.id);if(!q||q.physical==='')return null;return {databaseId:String(x.id),chocolateName:x.chocolate_name,batch:x.batch_no,expiryDate:x.expiry_date,systemStock:Number(x.current_stock||0),physicalCount:Number(q.physical),reason:q.reason||''}}).filter(Boolean);if(!lines.length){$('msg').textContent='Enter at least one physical count.';return}$('save').disabled=true;$('msg').textContent='Saving…';const r=await sb.rpc('record_chocolate_stock_count',{p_count_date:$('date').value,p_branch:branch,p_counted_by:$('by').value.trim()||p.full_name,p_lines:lines});$('save').disabled=false;if(r.error){$('msg').textContent='Save failed: '+r.error.message;return}inputs.clear();$('msg').textContent='Saved. Variances are marked Pending Approval.';await load()};$('refresh').onclick=load;$('search').oninput=render;$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(p.role==='Staff'&&b.dataset.b!==p.branch){$('msg').textContent='Staff can only count the assigned branch.';return}branch=b.dataset.b;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));inputs.clear();load()};if(p.role==='Staff'){document.querySelectorAll('#tabs button').forEach(b=>b.disabled=b.dataset.b!==p.branch)}load()})();</script></body></html>
