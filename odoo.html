<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<script src="shared/admin-gate.js" data-title="Odoo connection" data-strict></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lalabella — Odoo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--rose:#c9506b;--rose-dark:#9e2f4a;--ink:#2f2024;--muted:#8a7078;--line:#efdfde;--ok:#3d7a4f;--bad:#c0392b}
  *{box-sizing:border-box}
  html,body{margin:0;background:linear-gradient(160deg,#fdf1f0 0%,#f6e0da 45%,#eaf3ec 100%);font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink)}
  body{min-height:100vh}
  .stage{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
  .head{display:flex;align-items:center;gap:12px;padding-left:54px;min-height:44px;margin-bottom:10px}
  .head h1{font-family:'Fraunces',serif;font-size:21px;margin:0}
  .card{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(80,30,40,.07)}
  .card h2{margin:0 0 10px;font-size:15px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{border:0;border-radius:10px;padding:9px 14px;font:700 13px 'Space Grotesk',sans-serif;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--rose-dark);border:1px solid var(--line)}
  input[type=date]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .pill.ok{background:rgba(61,122,79,.14);color:var(--ok)} .pill.bad{background:rgba(192,57,43,.12);color:var(--bad)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
  .kv div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:11.5px;color:var(--muted)}
  .kv b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)} th{font-size:11px;color:var(--muted)}
  td.n,th.n{text-align:right}
  .muted{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="stage">
  <div class="head"><h1>🔗 Odoo (trial)</h1></div>
  <div class="card">
    <h2>Connection</h2>
    <div class="row"><span id="st" class="pill">Checking…</span><span class="muted" id="stInfo"></span><span style="flex:1"></span><button class="btn ghost" id="reStatus">↻ Check again</button></div>
    <div class="kv" id="stKv"></div>
    <p class="muted" style="margin:10px 0 0">Read-only for now: the system only <b>reads</b> from Odoo. Nothing is changed in Odoo.</p>
  </div>
  <div class="card">
    <h2>🛒 Odoo POS sales</h2>
    <div class="row"><input type="date" id="day"><button class="btn" id="load">Load</button></div>
    <div class="kv" id="sKv"></div>
    <div id="sTop"></div>
  </div>
</div>
<script>
(function(){
  var API = 'https://zoratiahjeldgsognfsj.supabase.co/functions/v1/odoo-fast';
  function token(){ return window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || ''; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function bd(n){ return Number(n || 0).toFixed(3) + ' BD'; }
  async function call(p){ var r = await fetch(API, { method:'POST', body:new URLSearchParams(Object.assign({ token: token() }, p)) }); return r.json(); }
  var st = document.getElementById('st'), info = document.getElementById('stInfo');
  async function status(){
    st.className = 'pill'; st.textContent = 'Checking…'; info.textContent = ''; document.getElementById('stKv').innerHTML = '';
    try{
      var d = await call({ action:'status' });
      if(!d.success){ st.className = 'pill bad'; st.textContent = d.setup ? 'Not connected yet' : 'Not connected'; info.textContent = d.error || ''; return; }
      st.className = 'pill ok'; st.textContent = '✓ Connected'; info.textContent = d.url + ' · ' + d.db;
      document.getElementById('stKv').innerHTML = '<div>Products for sale<b>' + d.products + '</b></div>' + (d.posProducts != null ? '<div>In Point of Sale<b>' + d.posProducts + '</b></div>' : '') + '<div>Odoo time zone<b>' + esc(d.tz || '—') + '</b></div>';
    }catch(e){ st.className = 'pill bad'; st.textContent = 'Error'; info.textContent = 'Connection error.'; }
  }
  async function sales(){
    var box = document.getElementById('sTop'), kv = document.getElementById('sKv');
    box.innerHTML = '<p class="muted">Loading…</p>'; kv.innerHTML = '';
    try{
      var d = await call({ action:'sales', day: document.getElementById('day').value });
      if(!d.success){ box.innerHTML = '<p class="muted">' + esc(d.error || 'Failed') + '</p>'; return; }
      kv.innerHTML = '<div>Orders<b>' + d.orders + '</b></div><div>Total<b>' + bd(d.total) + '</b></div>' + Object.keys(d.byMethod).map(function(k){ return '<div>' + esc(k) + '<b>' + bd(d.byMethod[k]) + '</b></div>'; }).join('');
      box.innerHTML = d.top.length ? '<table><thead><tr><th>Product sold</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead><tbody>' + d.top.map(function(t){ return '<tr><td>' + esc(t.name) + '</td><td class="n">' + t.qty + '</td><td class="n">' + bd(t.amount) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="muted">No POS sales on this day.</p>';
    }catch(e){ box.innerHTML = '<p class="muted">Connection error.</p>'; }
  }
  document.getElementById('day').value = new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10);
  document.getElementById('reStatus').addEventListener('click', status);
  document.getElementById('load').addEventListener('click', sales);
  function go(){ status(); sales(); }
  var ran = false; function once(){ if(!ran){ ran = true; go(); } }
  window.addEventListener('lbadminunlocked', once); setTimeout(once, 1200);
})();
</script>
<script src="shared/nav.js" data-standalone data-shift=".head"></script>
</body>
</html>
