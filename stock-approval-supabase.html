<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Stock Approval</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;font-family:system-ui;background:#f3ede0;color:#1c2b45}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.card{background:#fff;border:1px solid #c9bfa0;border-radius:10px;padding:20px;margin-bottom:18px}h1{margin:0 0 5px}.muted{color:#5c6a83;font-size:13px}.row{border-top:1px solid #e9e0c8;padding:14px 0}.row:first-child{border-top:0}.meta{font-size:12px;color:#5c6a83;margin-top:3px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button{padding:9px 13px;border-radius:6px;border:1px solid #1c2b45;background:#fff;color:#1c2b45;font-weight:700;cursor:pointer}.approve{border-color:#3d7a4f;color:#3d7a4f}.reject{border-color:#b0442e;color:#b0442e}.recount{border-color:#c68a1f;color:#9a6700}.msg{margin-top:12px;font-size:13px}.type{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8a6f3d}</style></head><body><div class="wrap"><a href="index.html">← Back to Tools</a><div class="card"><h1>Stock Approval</h1><div class="muted">Review adjustment requests. Approved chocolate counts update the exact batch only, with conflict protection and an audit trail.</div><div id="pending">Loading…</div><div id="msg" class="msg"></div></div><div class="card"><h2>Approval History</h2><div id="history">Loading…</div></div></div><script>(async()=>{const auth=window.LalabellaAuth;const sessionResult=await auth.getSession();const session=sessionResult;if(!session){location.href='login.html';return;}const p=await auth.getProfile();if(!p||!['Admin','Manager'].includes(p.role)){document.body.innerHTML='<div class="wrap"><div class="card">Admin/Manager access required.</div></div>';return;}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let q=sb.from('stock_adjustment_approvals').select('*').order('requested_at',{ascending:false});if(p.branch)q=q.eq('branch',p.branch);const {data,error}=await q;if(error){$('pending').textContent=error.message;return;}const all=data||[];const pend=all.filter(x=>x.status==='Pending');$('pending').innerHTML=pend.length?pend.map(x=>`<div class="row"><b>${esc(x.item_name)}</b><div class="type">${esc(x.source_type||'general')}</div><div class="meta">${esc(x.branch)} · System ${x.previous_qty} · Counted ${x.counted_qty} · Variance ${x.variance}</div><div class="meta">Reason: ${esc(x.reason||'—')} · Counted by: ${esc(x.counted_by||'—')}</div><div class="actions"><button class="approve" data-id="${x.id}" data-status="Approved">Approve</button><button class="reject" data-id="${x.id}" data-status="Rejected">Reject</button><button class="recount" data-id="${x.id}" data-status="Recount">Recount</button></div></div>`).join(''):'<div class="muted">No pending approvals.</div>';$('history').innerHTML=all.map(x=>`<div class="row"><b>${esc(x.item_name)}</b><div class="type">${esc(x.source_type||'general')}</div><div class="meta">${esc(x.branch)} · ${esc(x.status)} · variance ${x.variance}</div><div class="meta">Requested ${x.requested_at?new Date(x.requested_at).toLocaleString():'—'} · Reviewed ${x.reviewed_at?new Date(x.reviewed_at).toLocaleString():'—'} · ${esc(x.review_note||'')}</div></div>`).join('')||'<div class="muted">No approval history.</div>';document.querySelectorAll('#pending [data-id]').forEach(b=>b.onclick=async()=>{b.disabled=true;$('msg').textContent='Processing…';const r=await sb.rpc('review_stock_adjustment',{p_approval_id:Number(b.dataset.id),p_status:b.dataset.status,p_review_note:b.dataset.status+' from Stock Approval'});if(r.error){$('msg').textContent='Action failed: '+r.error.message;b.disabled=false;return;}$('msg').textContent='Action completed.';await load();});}await load();})();</script></body></html>
