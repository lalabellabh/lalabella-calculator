<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="shared/history-tools.js"></script>
<script src="auth-guard.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="lb-theme-keep" content="#app">
<title>Item Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="shared/glass-dash.css">
<style>
  /* Item layout: tall stock list on the left, overview + low stock on the right, history across the bottom */
  #app .main.f4{ grid-template-columns:1.05fr 1fr 1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"cat ov al" "cat mv mv"; }
  @media (min-width:900px) and (max-width:1250px){
    #app .main.f4{ grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); grid-template-areas:"cat ov" "cat al" "mv mv"; }
  }
  @media (max-width:899px){ #app .main.f4{ display:flex; flex-direction:column; } #app .p-mv{ max-height:620px; } }
  #app .kpis.k8{ grid-template-columns:repeat(8,minmax(0,1fr)); }
  @media (max-width:1250px){ #app .kpis.k8{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  @media (max-width:899px){ #app .kpis.k8{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  #app .hb{ font-size:9px; font-weight:700; padding:2px 8px; border-radius:8px; text-transform:uppercase; margin-right:6px; }
  #app .hb.receive{ background:var(--ok-bg); color:var(--ok); }
  #app .hb.release{ background:var(--bad-bg); color:var(--bad); }
  #app .hb.transfer{ background:rgba(80,130,200,.18); color:var(--sky); }
  #app .hact{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  #app .hact button{ font:600 11px 'Space Grotesk',sans-serif; padding:5px 10px; border-radius:8px; border:1px solid var(--glass-brd); background:var(--glass-strong); color:var(--ink); cursor:pointer; }
  #app .ht-bar{ margin-bottom:8px; }
  /* history-tools names its button 'main', which must not pick up the page's .main grid */
  #app .ht-btn.main{ display:inline-block; grid-template-columns:none; grid-template-rows:none; grid-template-areas:none; min-height:0; flex:none; }
  #app .ht-bar{ flex:none; }
  @media (max-width:899px){ #app .seg{ flex-wrap:wrap; } }
  #app .tbl{ width:100%; border-collapse:collapse; font-size:12px; }
  #app .tbl th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); padding:4px 2px; }
  #app .tbl td{ padding:6px 2px; border-top:1px solid var(--line); }
  #app .tbl .r{ text-align:right; font-family:'Space Mono',monospace; }
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block !important; position:absolute; top:0; left:0; width:100%; padding:24px; text-align:center; color:#000; background:#fff; }
  }
</style>

<style id="chocoSharedNavStyles">
.choco-nav-toggle{
  position:fixed; top:16px; left:20px; z-index:9210;
  width:44px; height:44px; border-radius:12px; border:1px solid rgba(158,47,74,0.16);
  background:rgba(255,255,255,0.92); color:#9e2f4a; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  box-shadow:0 5px 16px rgba(158,47,74,.14);
}
.choco-nav-backdrop{
  position:fixed; inset:0; z-index:9205; background:rgba(60,30,40,0.28); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.choco-nav-backdrop.show{ opacity:1; pointer-events:auto; }
.choco-drawer{
  position:fixed; top:0; left:0; bottom:0; width:min(270px,80vw); z-index:9206;
  background:rgba(255,255,255,.96);
  border-right:1px solid #f0dede; box-shadow:12px 0 40px rgba(158,47,74,.14);
  transform:translateX(-100%); transition:transform .25s ease;
  padding:70px 16px 20px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  font-family:Arial,sans-serif;
}
.choco-drawer.show{ transform:translateX(0); }
.choco-drawer a{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
  color:#3a2530; text-decoration:none; font-size:14px; font-weight:600;
}
.choco-drawer a:hover{ background:rgba(201,80,107,.08); }
.choco-drawer .choco-drawer-title{
  color:#9e2f4a; font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
  padding:0 12px 8px; opacity:0.8;
}
.choco-hub-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px; }
.choco-hub-grid a{
  flex-direction:column; text-align:center; gap:4px; padding:12px 4px;
  font-size:10.5px; background:rgba(201,80,107,.05); border:1px solid #f0dede;
  min-height:76px; justify-content:center; white-space:nowrap;
}
.choco-hub-grid a span.hub-icon{ font-size:20px; }
</style>
</head>
<body>

<button class="choco-nav-toggle" id="chocoNavToggle" aria-label="Open menu">☰</button>
<div class="choco-nav-backdrop" id="chocoNavBackdrop"></div>
<nav class="choco-drawer" id="chocoDrawer">
  <div data-lb-menu></div>
</nav>
<script src="shared/nav.js"></script>

<div id="app" data-lb-theme-skip data-mode="light">

  <div class="topbar glass">
    <div class="ttl">
      <h1>📦 Item Dashboard</h1>
      <div class="sub">Ribbon, Vase, Supplies &amp; Fixed Assets — overview</div>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="branchTabs">
      <button class="on" data-branch="All">All</button>
      <button data-branch="ModaMall">ModaMall</button>
      <button data-branch="Hamala">Hamala</button>
      <button data-branch="Galali">Galali</button>
      <button data-branch="Saudi">Saudi</button>
    </div>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
    <div class="note" id="lastRefreshedNote"></div>
  </div>

  <div class="kpis k8" id="kpis"></div>

  <div class="main f4">
    <section class="panel glass p-cat">
      <div class="ph"><h2>🔎 Live Stock Levels</h2><span class="cnt" id="stCnt">0</span></div>
      <input type="text" class="search" id="stSearch" placeholder="Type an item name…" autocomplete="off">
      <div class="scroll" id="stScroll"></div>
    </section>

    <section class="panel glass p-ov">
      <div class="ph"><h2>🌿 Overview</h2></div>
      <div class="scroll" id="ovScroll"></div>
    </section>

    <section class="panel glass p-al">
      <div class="ph"><h2>📉 Low Stock</h2><span class="cnt" id="lowCnt">0</span><select class="search" id="lowCat" style="width:auto;margin:0 0 0 auto;padding:5px 10px;font-size:12px" title="Filter by category"><option value="">All categories</option></select></div>
      <div class="scroll" id="alScroll"></div>
    </section>

    <section class="panel glass p-mv">
      <div class="ph"><h2>📋 History</h2><span class="sub" style="color:var(--dim);font-size:11px">Receiving, Release &amp; Transfer</span></div>
      <div class="scroll" id="historyList"></div>
    </section>
  </div>

  <div class="overlay" id="editModal">
    <div class="modal glass">
      <h3 id="editModalTitle">Edit Entry</h3>
      <label>Qty</label><input class="field" type="number" id="editQty" min="0" step="1">
      <label>Date</label><input class="field" type="date" id="editDate">
      <div id="editReasonWrap" style="display:none;"><label>Reason / Event</label><input class="field" type="text" id="editReason"></div>
      <label id="editByLabel">By</label><input class="field" type="text" id="editBy">
      <div class="acts"><button class="btn" id="editCancelBtn">Cancel</button><button class="btn primary" id="editSaveBtn">Save</button></div>
    </div>
  </div>

  <div class="loading" id="loadingMsg">Loading…</div>
</div>

<div id="printArea">
  <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:900;">Lalabella Item Inventory</div>
  <div id="printBody" style="margin-top:14px;font-size:14px;line-height:1.8;"></div>
</div>

<script>
(function(){
  const API_URL = LB_CONFIG.ITEM_FAST_API;
  const app = document.getElementById('app');

  /* ---------- light / dark follows the Settings choice ---------- */
  function applyMode(){ app.setAttribute('data-mode', (window.LBTheme && LBTheme.isDark && LBTheme.isDark()) ? 'dark' : 'light'); }
  window.addEventListener('lb:theme-changed', applyMode);
  document.addEventListener('DOMContentLoaded', applyMode);
  applyMode(); setTimeout(applyMode, 300);

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtBD  = n => Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD';
  const fmtNum = n => Number(n || 0).toLocaleString('en-US',{maximumFractionDigits:3});
  const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? String(d) : dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
  const toDateInputValue = d => { if(!d) return ''; const dt = new Date(d); return isNaN(dt) ? '' : dt.toISOString().slice(0,10); };
  // Bahrain (UTC+3) calendar day of a timestamp / date
  const bhDay = v => { if(v == null || v === '') return ''; if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v; const t = new Date(v).getTime(); return isNaN(t) ? '' : new Date(t + 3*3600*1000).toISOString().slice(0,10); };
  const empty = t => `<div class="empty">${t}</div>`;

  /* ---------- state that survives re-renders ---------- */
  const ui = { branch:'All', q:'', cat:'' };
  let dash = null, ALL_HISTORY = [];

  function keepScroll(ids, fn){
    const pos = {};
    ids.forEach(id => { const el = document.getElementById(id); if(el) pos[id] = el.scrollTop; });
    fn();
    ids.forEach(id => { const el = document.getElementById(id); if(el && pos[id]) el.scrollTop = pos[id]; });
  }

  /* ---------- loading: saved copy first, then fresh data; unchanged data is not re-drawn ---------- */
  const CACHE_PREFIX = 'lbDash:item2:';
  let loadSeq = 0, lastSig = '';
  const readCache = k => { try{ const c = JSON.parse(localStorage.getItem(CACHE_PREFIX + k) || 'null'); return c && c.v ? c : null; }catch(e){ return null; } };
  const writeCache = (k, v) => { try{ localStorage.setItem(CACHE_PREFIX + k, JSON.stringify({ t:Date.now(), v })); }catch(e){} };
  const setNote = t => { document.getElementById('lastRefreshedNote').textContent = t; };
  const timeStr = ms => new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const loadingEl = document.getElementById('loadingMsg');

  async function loadDashboard(){
    const seq = ++loadSeq, branch = ui.branch;
    const cached = readCache(branch);
    if(cached){ dash = cached.v.dash; ALL_HISTORY = cached.v.hist; lastSig = ''; loadingEl.style.display = 'none'; render(); setNote('Showing saved data from ' + timeStr(cached.t) + ' · updating…'); }
    else { loadingEl.style.display = ''; loadingEl.textContent = 'Loading…'; setNote(''); }
    try{
      const t = Date.now();
      const [d, h] = await Promise.all([
        fetch(API_URL + '?action=getItemDashboard&branch=' + encodeURIComponent(branch) + '&_ts=' + t).then(r=>r.json()),
        fetch(API_URL + '?action=getItemHistory&branch=' + encodeURIComponent(branch) + '&_ts=' + t).then(r=>r.json())
      ]);
      if(seq !== loadSeq) return;
      if(d && d.error) throw new Error(d.error);
      const hist = Array.isArray(h) ? h : [];
      const sig = JSON.stringify([d, hist]);
      dash = d; ALL_HISTORY = hist; loadingEl.style.display = 'none';
      if(sig !== lastSig){ lastSig = sig; render(); }
      writeCache(branch, { dash:d, hist });
      setNote('Updated ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    }catch(e){
      if(seq !== loadSeq) return;
      console.error(e);
      if(cached) setNote('Could not refresh — showing saved data from ' + timeStr(cached.t) + '. Tap Refresh to try again.');
      else { loadingEl.style.display = ''; loadingEl.textContent = 'Could not load dashboard data.'; }
    }
  }

  /* ---------- controls ---------- */
  document.getElementById('branchTabs').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    ui.branch = b.dataset.branch;
    document.querySelectorAll('#branchTabs button').forEach(x => x.classList.toggle('on', x === b));
    loadDashboard();
  });
  document.getElementById('refreshBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('refreshBtn'); btn.disabled = true; btn.textContent = 'Refreshing...';
    lastSig = '';
    try{ await loadDashboard(); } finally { btn.disabled = false; btn.textContent = '↻ Refresh'; }
  });
  document.getElementById('stSearch').addEventListener('input', function(){ ui.q = this.value.trim().toLowerCase(); renderStock(); });
  document.getElementById('kpis').addEventListener('click', e=>{
    const k = e.target.closest('[data-goto]'); if(!k) return;
    const el = document.getElementById('alScroll'); el.scrollIntoView({block:'nearest'}); el.scrollTop = 0;
  });

  /* ---------- rendering ---------- */
  function render(){
    if(!dash) return;
    keepScroll(['stScroll','ovScroll','alScroll','historyList'], ()=>{ renderKpis(); renderStock(); renderOverview(); renderLow(); renderHistory(); });
  }

  function kpi(ic, label, value, sub, accent, cls, goto){
    return `<div class="kpi glass ${cls||''} ${goto?'click':''}" style="--accent:${accent}" ${goto?`data-goto="${goto}"`:''}>
      <div class="k-ic">${ic}</div><div class="k-lb">${label}</div><div class="k-v">${value}</div><div class="k-s">${sub||''}</div></div>`;
  }
  function todayCounts(){
    const today = bhDay(Date.now()); let r = 0, o = 0, t = 0;
    ALL_HISTORY.forEach(h => { if(bhDay(h['Date']) !== today) return; if(h._type === 'receive') r++; else if(h._type === 'release') o++; else if(h._type === 'transfer') t++; });
    return { r, o, t };
  }
  function renderKpis(){
    const low = (dash.lowStockList || []).length, c = todayCounts();
    document.getElementById('kpis').innerHTML =
      kpi('📦','Total items', fmtNum(dash.totalItems), 'distinct item names', 'var(--rose)') +
      kpi('🎀','Consumables', fmtNum(dash.consumableCount), 'ribbon, vase, supplies', 'var(--teal)') +
      kpi('🏷️','Fixed assets', fmtNum(dash.fixedAssetCount), 'not consumed', 'var(--plum)') +
      kpi('💰','Inventory value', fmtBD(dash.totalInventoryValue), 'qty x price', 'var(--gold)') +
      kpi('📉','Low stock', fmtNum(low), low ? 'tap to view' : 'all good', 'var(--bad)', low ? 'warn' : '', low ? 'low' : '') +
      kpi('📥','Received today', fmtNum(c.r), 'entries', 'var(--ok)') +
      kpi('📤','Released today', fmtNum(c.o), 'entries', 'var(--amber)') +
      kpi('🔁','Transfers today', fmtNum(c.t), 'entries', 'var(--sky)');
  }

  function renderStock(){
    const all = dash ? (dash.allItemsList || []) : [];
    const list = ui.q ? all.filter(i => String(i.name||'').toLowerCase().includes(ui.q) || String(i.code||'').toLowerCase().includes(ui.q)) : all;
    document.getElementById('stCnt').textContent = ui.q ? list.length + ' / ' + all.length : String(all.length);
    document.getElementById('stScroll').innerHTML = list.length ? list.map(it => `<div class="row"><div class="nm">${esc(it.name)}<div class="mt">${esc(it.type||'')}${it.category ? ' · ' + esc(it.category) : ''} · ${esc(it.code||'')}</div></div>
      <div class="rt ${Number(it.qty) < 0 ? 'neg' : ''}">${fmtNum(it.qty)} ${esc(it.unit||'')}</div></div>`).join('') : empty(ui.q ? 'No match.' : 'No items found.');
  }

  function renderOverview(){
    const items = dash.allItemsList || [];
    let consVal = 0, fixVal = 0;
    items.forEach(it => { const v = (Number(it.qty)||0) * (Number(it.price)||0); if(it.type === 'Fixed Asset') fixVal += v; else consVal += v; });
    const tot = consVal + fixVal || 1, bs = dash.branchSummary || [];
    const mx = Math.max(...bs.map(b => Number(b.value)||0), 1);
    const lastIn = ALL_HISTORY.find(h => h._type === 'receive'), lastOut = ALL_HISTORY.find(h => h._type === 'release'), lastTr = ALL_HISTORY.find(h => h._type === 'transfer');
    const lastRow = (lb, h, fn) => `<div class="row"><div class="nm">${lb}</div><div class="rt">${h ? fn(h) : '<span style="color:var(--dim)">None yet</span>'}</div></div>`;
    let h = `<div class="sect">Value by type</div>
      <div class="kv"><span>Consumables</span><b>${fmtBD(consVal)}</b></div><div class="bar"><i style="width:${consVal/tot*100}%"></i></div>
      <div class="kv"><span>Fixed assets</span><b>${fmtBD(fixVal)}</b></div><div class="bar teal"><i style="width:${fixVal/tot*100}%"></i></div>`;
    if(ui.branch === 'All' && bs.length){
      h += `<div class="sect" style="margin-top:12px">Branches</div><table class="tbl"><tr><th>Branch</th><th class="r">Items</th><th class="r">Low</th><th class="r">Value</th></tr>` +
        bs.map(b => `<tr><td>${esc(b.branch)}</td><td class="r">${fmtNum(b.items)}</td><td class="r" style="${b.low ? 'color:var(--bad)' : ''}">${fmtNum(b.low)}</td><td class="r">${fmtBD(b.value)}</td></tr>`).join('') + `</table>`;
    }
    h += `<div class="sect" style="margin-top:12px">Last activity</div>` +
      lastRow('Last receiving', lastIn, x => esc(x['Item Name']) + ' · +' + esc(x['Qty Received']) + ' · ' + esc(x['Branch']||'') + ' · ' + fmtDate(x['Date'])) +
      lastRow('Last release', lastOut, x => esc(x['Item Name']) + ' · -' + esc(x['Qty Released']) + ' · ' + esc(x['Branch']||'') + ' · ' + fmtDate(x['Date'])) +
      lastRow('Last transfer', lastTr, x => esc(x['Item Name']) + ' · ' + esc(x['Qty']) + ' · ' + esc(x['From Branch']) + ' → ' + esc(x['To Branch']) + ' · ' + fmtDate(x['Date']));
    document.getElementById('ovScroll').innerHTML = h;
  }

  function renderLow(){
    const all = dash.lowStockList || [];
    // category picker is built from the low-stock items themselves; keeps the chosen one across refreshes
    const cats = [...new Set(all.map(it => it.category || 'No category'))].sort((a,b)=>a.localeCompare(b));
    if(ui.cat && cats.indexOf(ui.cat) === -1) ui.cat = '';
    const sel = document.getElementById('lowCat');
    sel.innerHTML = '<option value="">All categories (' + all.length + ')</option>' + cats.map(c => `<option value="${esc(c)}"${c === ui.cat ? ' selected' : ''}>${esc(c)} (${all.filter(it => (it.category || 'No category') === c).length})</option>`).join('');
    const low = ui.cat ? all.filter(it => (it.category || 'No category') === ui.cat) : all;
    document.getElementById('lowCnt').textContent = ui.cat ? low.length + ' / ' + all.length : String(all.length);
    document.getElementById('alScroll').innerHTML = low.length ? low.map(it => `<div class="row"><div class="nm">${esc(it.name)}<div class="mt">${it.category ? '<b>' + esc(it.category) + '</b> · ' : ''}${esc(it.code||'')}${it.branch ? ' · ' + esc(it.branch) : ''}</div></div>
      <div class="rt neg">${fmtNum(it.qty)} / ${fmtNum(it.minStock)} ${esc(it.unit||'')}</div></div>`).join('') : empty(ui.cat ? 'Nothing low in this category.' : 'No low stock items right now.');
  }
  document.getElementById('lowCat').addEventListener('change', function(){ ui.cat = this.value; keepScroll(['alScroll'], renderLow); });

  /* ---------- history (filter / print bar from shared/history-tools.js) ---------- */
  const HIST_TYPE = { receive:'In', release:'Out', transfer:'Transfer' };
  let _ht = null;
  function getHT(){
    if(_ht) return _ht;
    _ht = HistoryTools.create({
      listEl: document.getElementById('historyList'),
      title: 'Item Movement History',
      placeholder: 'item name, code, name of person…',
      getDate: h => h['Date'],
      getText: h => [h['Item Name'], h['Item Code'], h['Branch'], h['From Branch'], h['To Branch'], h['Reason/Event'], h['Received By'], h['Released By'], h['Transferred By']].join(' '),
      selects: [
        {label:'Type', get:h => HIST_TYPE[h._type]},
        {label:'Branch', get:h => h._type === 'transfer' ? null : h['Branch']}
      ],
      subtitle: () => ui.branch === 'All' ? 'All branches' : ui.branch,
      columns: [
        {h:'Date', v:h => fmtDate(h['Date'])},
        {h:'Type', v:h => HIST_TYPE[h._type]},
        {h:'Item', v:h => h['Item Name']},
        {h:'Code', v:h => h['Item Code']},
        {h:'Branch', v:h => h._type === 'transfer' ? (h['From Branch'] + ' → ' + h['To Branch']) : h['Branch']},
        {h:'Qty', v:h => h._type === 'receive' ? '+' + h['Qty Received'] : h._type === 'release' ? '-' + h['Qty Released'] : h['Qty'], right:true},
        {h:'By', v:h => h['Received By'] || h['Released By'] || h['Transferred By']},
        {h:'Reason', v:h => h['Reason/Event']}
      ],
      onChange: () => keepScroll(['historyList'], renderHistory)
    });
    return _ht;
  }
  function renderHistory(){
    const el = document.getElementById('historyList');
    if(!ALL_HISTORY.length){ el.innerHTML = empty('No history yet.'); return; }
    const shown = getHT().apply(ALL_HISTORY);
    if(!shown.length){ el.innerHTML = empty('No entries match this filter.'); return; }
    el.innerHTML = shown.map(h => {
      const i = ALL_HISTORY.indexOf(h), isReceive = h._type === 'receive', isTransfer = h._type === 'transfer';
      let badge, qty, meta, editable;
      if(isTransfer){
        badge = 'Transfer'; qty = h['Qty']; editable = false; // transfers aren't edited here — do a reverse transfer instead
        const sel = ui.branch, inc = sel !== 'All' && h['To Branch'] === sel, outg = sel !== 'All' && h['From Branch'] === sel;
        const dirTxt = inc ? '⬇ Received from ' + h['From Branch'] : outg ? '⬆ Sent to ' + h['To Branch'] : h['From Branch'] + ' → ' + h['To Branch'];
        meta = fmtDate(h['Date']) + ' · ' + dirTxt + (h['Transferred By'] ? ' · by ' + h['Transferred By'] : '');
        if(inc) badge = 'Transfer in'; else if(outg) badge = 'Transfer out';
      } else {
        badge = isReceive ? 'In' : 'Out'; qty = isReceive ? h['Qty Received'] : h['Qty Released']; editable = true;
        const by = isReceive ? h['Received By'] : h['Released By'];
        meta = (h['Branch'] ? h['Branch'] + ' · ' : '') + fmtDate(h['Date']) + (!isReceive && h['Reason/Event'] ? ' · ' + h['Reason/Event'] : '') + (by ? ' · ' + by : '');
      }
      return `<div class="row" style="flex-direction:column;gap:0"><div style="display:flex;justify-content:space-between;gap:10px;width:100%">
          <div class="nm"><span class="hb ${h._type}">${badge}</span>${esc(h['Item Name'])}<div class="mt">${esc(meta)}</div></div>
          <div class="rt ${(!isReceive && !isTransfer) ? 'neg' : ''}">${isTransfer ? ((ui.branch !== 'All' && h['To Branch'] === ui.branch) ? '+' : (ui.branch !== 'All' && h['From Branch'] === ui.branch) ? '-' : '') : (isReceive ? '+' : '-')}${esc(qty)}</div></div>
          <div class="hact">${editable ? `<button data-a="edit" data-i="${i}">✏️ Edit</button>` : ''}<button data-a="print" data-i="${i}">🖨️ Print</button><button data-a="wa" data-i="${i}">📤 WhatsApp</button></div></div>`;
    }).join('');
  }
  document.getElementById('historyList').addEventListener('click', e=>{
    const b = e.target.closest('button[data-a]'); if(!b) return;
    const entry = ALL_HISTORY[Number(b.dataset.i)]; if(!entry) return;
    if(b.dataset.a === 'edit') openEditModal(entry); else if(b.dataset.a === 'print') printEntry(entry); else shareEntry(entry);
  });

  /* ---------- edit ---------- */
  let editingEntry = null;
  const editModal = document.getElementById('editModal');
  function openEditModal(entry){
    editingEntry = entry;
    const isReceive = entry._type === 'receive';
    document.getElementById('editModalTitle').textContent = (isReceive ? 'Edit Receiving — ' : 'Edit Release — ') + entry['Item Name'];
    document.getElementById('editQty').value = isReceive ? entry['Qty Received'] : entry['Qty Released'];
    document.getElementById('editDate').value = toDateInputValue(entry['Date']);
    document.getElementById('editReasonWrap').style.display = isReceive ? 'none' : 'block';
    document.getElementById('editReason').value = isReceive ? '' : (entry['Reason/Event'] || '');
    document.getElementById('editByLabel').textContent = isReceive ? 'Received By' : 'Released By';
    document.getElementById('editBy').value = isReceive ? (entry['Received By']||'') : (entry['Released By']||'');
    editModal.classList.add('show');
  }
  document.getElementById('editCancelBtn').addEventListener('click', ()=> editModal.classList.remove('show'));
  document.getElementById('editSaveBtn').addEventListener('click', async ()=>{
    if(!editingEntry) return;
    const isReceive = editingEntry._type === 'receive';
    const btn = document.getElementById('editSaveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const params = new URLSearchParams({
      action: isReceive ? 'editReceivingEntry' : 'editReleaseEntry',
      row: editingEntry._row,
      qty: document.getElementById('editQty').value,
      date: document.getElementById('editDate').value,
      [isReceive ? 'receivedBy' : 'releasedBy']: document.getElementById('editBy').value
    });
    if(!isReceive) params.set('reason', document.getElementById('editReason').value);
    try{
      const res = await (await fetch(API_URL + '?' + params.toString())).json();
      btn.disabled = false; btn.textContent = 'Save';
      if(res.error){ alert(res.error); return; }
      editModal.classList.remove('show');
      lastSig = ''; await loadDashboard();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Save';
      alert('Could not save. Check your connection.');
    }
  });

  /* ---------- print & WhatsApp ---------- */
  function buildEntryText(entry){
    if(entry._type === 'transfer'){
      const lines = ['TRANSFER RECEIPT', 'Item: ' + entry['Item Name'], 'Qty: ' + entry['Qty'], 'From: ' + entry['From Branch'], 'To: ' + entry['To Branch'], 'Date: ' + fmtDate(entry['Date'])];
      if(entry['Transferred By']) lines.push('Transferred By: ' + entry['Transferred By']);
      return lines;
    }
    const isReceive = entry._type === 'receive';
    const qty = isReceive ? entry['Qty Received'] : entry['Qty Released'];
    const by = isReceive ? entry['Received By'] : entry['Released By'];
    const lines = [(isReceive ? 'RECEIVING' : 'RELEASE') + ' RECEIPT', 'Item: ' + entry['Item Name'], 'Branch: ' + (entry['Branch'] || '—'), 'Qty: ' + (isReceive ? '+' : '-') + qty, 'Date: ' + fmtDate(entry['Date'])];
    if(!isReceive && entry['Reason/Event']) lines.push('Reason: ' + entry['Reason/Event']);
    if(by) lines.push((isReceive ? 'Received By: ' : 'Released By: ') + by);
    return lines;
  }
  const fillPrint = entry => { document.getElementById('printBody').innerHTML = buildEntryText(entry).map(l => `<div>${esc(l)}</div>`).join(''); };
  function printEntry(entry){
    fillPrint(entry);
    document.getElementById('printArea').style.display = 'block';
    window.print();
    setTimeout(()=> document.getElementById('printArea').style.display = 'none', 400);
  }
  async function shareEntry(entry){
    if(!navigator.share){ alert('Sharing is not supported on this browser.'); return; }
    fillPrint(entry);
    const el = document.getElementById('printArea');
    el.style.display = 'block';
    try{
      const canvas = await html2canvas(el, { backgroundColor:'#ffffff', scale:2 });
      el.style.display = 'none';
      canvas.toBlob(async blob=>{
        const file = new File([blob], 'lalabella-item-receipt.png', { type:'image/png' });
        try{ await navigator.share({ files:[file], title:'Lalabella Item Receipt' }); }catch(e){}
      }, 'image/png');
    }catch(e){ el.style.display = 'none'; alert('Could not generate the image.'); }
  }

  loadDashboard();
})();
</script>
<script>
(function(){
  const btn=document.getElementById('chocoNavToggle');
  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');
  if(!btn||!backdrop||!drawer) return;
  function openDrawer(){ drawer.classList.add('show'); backdrop.classList.add('show'); }
  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);
})();
</script>
