<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Item Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fdf1f0; --blush-2:#f6e0da; --mint:#eaf3ec;
    --rose:#c9506b; --rose-deep:#9e2f4a; --gold:#d9a441; --leaf:#5f8f63;
    --ink:#3a2530; --ink-dim:#8a7078; --line:#f0d9d9; --ok:#3d7a4f; --rust:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 18%, rgba(255,190,210,.22), transparent 22%),
      radial-gradient(circle at 92% 28%, rgba(217,164,65,.16), transparent 22%),
      linear-gradient(145deg, #fdf1f0 0%, #f6e0da 60%, #eaf3ec 100%);
    color:var(--ink); font-family:'Space Grotesk',sans-serif; min-height:100vh;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:76px 18px 60px; }
  header{
    text-align:center; margin-bottom:22px; padding:26px 18px;
    background:linear-gradient(135deg, #fff 0%, var(--blush) 60%, var(--blush-2) 100%);
    border-radius:18px; border:1px solid var(--line);
    box-shadow:0 8px 26px rgba(158,47,74,0.08);
    position:relative; overflow:hidden;
  }
  header::before{ content:'📦'; position:absolute; font-size:60px; opacity:0.09; left:-10px; top:-14px; transform:rotate(-16deg); }
  .eyebrow{ font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; font-weight:600; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:clamp(1.8rem,6vw,2.4rem); margin:0 0 4px; }
  .sub{ color:var(--ink-dim); font-size:13px; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 4px 14px rgba(158,47,74,0.05); }
  .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin-bottom:6px; }
  .kpi-value{ font-family:'Space Mono',monospace; font-size:22px; font-weight:700; }
  @media(max-width:700px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }

  .layout{ display:flex; gap:18px; align-items:flex-start; }
  .col{ flex:1; display:flex; flex-direction:column; gap:18px; min-width:0; }
  @media(max-width:800px){ .layout{ flex-direction:column; } }

  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 4px 16px rgba(158,47,74,0.05); }
  .card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 14px; }
  input[type=text]{ width:100%; background:var(--blush); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; color:var(--ink); outline:none; margin-bottom:10px; box-sizing:border-box; }

  .row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--blush-2); }
  .row:first-child{ border-top:none; }
  .row-name{ font-weight:600; font-size:13px; min-width:0; overflow-wrap:break-word; }
  .row-meta{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .row-val{ font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .row-val.low{ color:var(--rust); }
  .scroll-list{ max-height:280px; overflow-y:auto; }
  .empty{ color:var(--ink-dim); font-size:12.5px; text-align:center; padding:16px 0; }

  .choco-nav-toggle{
    position:fixed; top:16px; left:16px; z-index:9210;
    width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
    background:rgba(255,255,255,.9); color:var(--rose-deep); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
    box-shadow:0 6px 16px rgba(158,47,74,.12);
  }
  .choco-nav-backdrop{
    position:fixed; inset:0; z-index:9205; background:rgba(58,37,48,.35); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .choco-nav-backdrop.show{ opacity:1; pointer-events:auto; }
  .choco-drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(260px,80vw); z-index:9206;
    background:linear-gradient(160deg,#fff,var(--blush));
    border-right:1px solid var(--line); box-shadow:12px 0 40px rgba(158,47,74,.18);
    transform:translateX(-100%); transition:transform .25s ease;
    padding:70px 16px 20px; display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  }
  .choco-drawer.show{ transform:translateX(0); }
  .choco-drawer a{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; }
  .choco-drawer a:hover{ background:var(--blush-2); }
  .choco-drawer .choco-drawer-title{ color:var(--rose-deep); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; padding:0 12px 8px; opacity:0.8; }
</style>
</head>
<body>

<button class="choco-nav-toggle" id="chocoNavToggle" aria-label="Open menu">☰</button>
<div class="choco-nav-backdrop" id="chocoNavBackdrop"></div>
<nav class="choco-drawer" id="chocoDrawer">
  <div class="choco-drawer-title">Quick Menu</div>
  <a href="index.html">🍫 Chocolate Home</a>
  <a href="flower-tools.html">🌸 Flower Tools</a>
  <a href="item-dashboard.html">📊 Item Dashboard</a>
  <a href="item-inventory.html">📦 Item Inventory</a>
</nav>

<div class="wrap">
  <header>
    <div class="eyebrow">Lalabella</div>
    <h1>Item Dashboard</h1>
    <p class="sub">Ribbon, Vase, Supplies &amp; Fixed Assets — overview</p>
  </header>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Total Items</div><div class="kpi-value" id="kpiTotal">—</div></div>
    <div class="kpi"><div class="kpi-label">Consumables</div><div class="kpi-value" id="kpiConsumable">—</div></div>
    <div class="kpi"><div class="kpi-label">Fixed Assets</div><div class="kpi-value" id="kpiFixed">—</div></div>
    <div class="kpi"><div class="kpi-label">Inventory Value</div><div class="kpi-value" id="kpiValue">—</div></div>
  </div>

  <div class="layout">
    <div class="col">
      <div class="card">
        <div class="card-title">🔎 Live Stock Levels</div>
        <input type="text" id="stockSearch" placeholder="Type an item name…">
        <div class="scroll-list" id="stockList"></div>
      </div>

      <div class="card">
        <div class="card-title">📉 Low Stock</div>
        <div class="scroll-list" id="lowStockList"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <div class="card-title">📤 Recent Releases</div>
        <div class="scroll-list" id="releaseList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwvypHTqixncjrdw1RUdUZEQ7u8xDZOhPCKtYK3w3BboXkBCNaxqFwfiaD7o7ZHsMY/exec';

  function fmtBD(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}) + ' BD'; }
  function fmtDate(d){
    if(!d) return '—';
    const dt = new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  let ALL_ITEMS = [];

  async function loadDashboard(){
    try{
      const data = await (await fetch(API_URL + '?action=getItemDashboard&_ts=' + Date.now())).json();
      if(data.error){ console.error(data.error); return; }

      document.getElementById('kpiTotal').textContent = data.totalItems;
      document.getElementById('kpiConsumable').textContent = data.consumableCount;
      document.getElementById('kpiFixed').textContent = data.fixedAssetCount;
      document.getElementById('kpiValue').textContent = fmtBD(data.totalInventoryValue);

      ALL_ITEMS = data.allItemsList || [];
      renderStockList(ALL_ITEMS);

      const lowEl = document.getElementById('lowStockList');
      lowEl.innerHTML = (data.lowStockList && data.lowStockList.length)
        ? data.lowStockList.map(it => `
            <div class="row">
              <div><div class="row-name">${it.name}</div><div class="row-meta">${it.code||''}</div></div>
              <div class="row-val low">${it.qty} / ${it.minStock} ${it.unit||''}</div>
            </div>
          `).join('')
        : '<div class="empty">No low stock items right now.</div>';

      const relEl = document.getElementById('releaseList');
      relEl.innerHTML = (data.recentReleases && data.recentReleases.length)
        ? data.recentReleases.map(r => `
            <div class="row">
              <div><div class="row-name">${r['Item Name']}</div><div class="row-meta">${fmtDate(r['Date'])} · ${r['Reason/Event']||'—'}</div></div>
              <div class="row-val">-${r['Qty Released']}</div>
            </div>
          `).join('')
        : '<div class="empty">No releases yet.</div>';
    }catch(e){
      console.error(e);
    }
  }

  function renderStockList(items){
    const el = document.getElementById('stockList');
    if(!items.length){ el.innerHTML = '<div class="empty">No items found.</div>'; return; }
    el.innerHTML = items.map(it => `
      <div class="row" data-name="${(it.name||'').toLowerCase()}">
        <div><div class="row-name">${it.name}</div><div class="row-meta">${it.type||''} · ${it.code||''}</div></div>
        <div class="row-val">${it.qty} ${it.unit||''}</div>
      </div>
    `).join('');
  }

  document.getElementById('stockSearch').addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    const filtered = ALL_ITEMS.filter(it => String(it.name||'').toLowerCase().includes(q));
    renderStockList(filtered);
  });

  loadDashboard();
</script>
<script>
(function(){
  const btn=document.getElementById('chocoNavToggle');
  const backdrop=document.getElementById('chocoNavBackdrop');
  const drawer=document.getElementById('chocoDrawer');
  if(!btn||!backdrop||!drawer) return;
  function openDrawer(){ drawer.classList.add('show'); backdrop.classList.add('show'); }
  function closeDrawer(){ drawer.classList.remove('show'); backdrop.classList.remove('show'); }
  btn.addEventListener('click', ()=> drawer.classList.contains('show') ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);
})();
</script>

</body>
</html>
