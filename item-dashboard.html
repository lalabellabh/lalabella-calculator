<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lalabella — Item Dashboard</title>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script>
<style>
body{margin:0;background:linear-gradient(145deg,#fdf1f0,#f6e0da 55%,#eaf3ec);color:#3a2530;font:14px system-ui,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}header,.card,.kpi{background:#fff;border:1px solid #f0d9d9;border-radius:16px;box-shadow:0 6px 22px rgba(80,30,50,.06)}header{padding:24px;text-align:center;margin-bottom:14px}h1{margin:4px 0;font-family:Georgia,serif;font-size:32px}.muted{color:#8a7078;font-size:12px}.tabs,.branches{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button,.branches button,.actions button{border:1px solid #f0d9d9;background:#fff;color:#3a2530;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}.tabs button.active,.branches button.active{background:#9e2f4a;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.kpi{padding:16px}.kpi small{display:block;color:#8a7078;text-transform:uppercase;letter-spacing:.08em;font-size:10px}.kpi strong{display:block;font-size:22px;margin-top:5px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:18px;margin-bottom:14px}.card h2{font:700 18px Georgia,serif;margin:0 0 12px}input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #f0d9d9;border-radius:10px;background:#fdf1f0;margin-bottom:10px}.list{max-height:420px;overflow:auto}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #f6e0da}.row:first-child{border-top:0}.name{font-weight:700}.meta{color:#8a7078;font-size:11px;margin-top:2px}.qty{font-weight:800;white-space:nowrap}.low{color:#c0392b}.badge{display:inline-block;padding:3px 7px;border-radius:7px;font-size:9px;font-weight:800;text-transform:uppercase}.in{background:#eaf3ec;color:#3d7a4f}.out{background:#fbeae7;color:#c0392b}.transfer{background:#eaf1fb;color:#2f5e9e}.msg{margin:10px 0;padding:9px;border-radius:9px;background:#eaf3ec}.bad{background:#fbeae7;color:#9e2f4a}.actions{display:flex;gap:7px;margin-top:8px}.actions button{padding:6px 9px;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="wrap">
<header><div class="muted">LALABELLA SYSTEM • SUPABASE</div><h1>📦 Item Dashboard</h1><div id="who" class="muted">Checking session…</div></header>
<div class="card"><div id="branches" class="branches"></div><div id="msg"></div></div>
<div class="grid"><div class="kpi"><small>Total Items</small><strong id="total">—</strong></div><div class="kpi"><small>Consumables</small><strong id="consumable">—</strong></div><div class="kpi"><small>Fixed Assets</small><strong id="fixed">—</strong></div><div class="kpi"><small>Inventory Value</small><strong id="value">—</strong></div></div>
<div class="layout"><section class="card"><h2>🔎 Live Stock Levels</h2><input id="search" placeholder="Search item name, code or category…"><div id="stock" class="list"></div></section><section class="card"><h2>📉 Low Stock</h2><div id="low" class="list"></div></section></div>
<section class="card"><h2>📋 Recent Item History</h2><div id="history" class="list"></div></section>
<div class="card actions"><button id="inventory">📦 Open Item Inventory</button><button id="signout">Sign out</button></div>
</main>
<script>
let user,profile,branches=[],branch='',items=[],historyRows=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' BD';
const date=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
async function boot(){user=await sbAuth.getUser();if(!user)return location='login.html';profile=await sbAuth.getProfile();if(!profile)return location='login.html';$('who').textContent=`${profile.full_name||user.email} • ${profile.role} • ${profile.branch||'No branch assigned'}`;let r=await sb.from('branch_config').select('id,name').order('name');if(r.error)throw r.error;branches=r.data||[];branch=profile.branch||branches[0]?.name||'';drawBranches();await load()}
function drawBranches(){$('branches').innerHTML=branches.map(b=>`<button class="${b.name===branch?'active':''}" data-b="${esc(b.name)}">${esc(b.name)}</button>`).join('');$('branches').querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(profile.role!=='Admin'&&profile.role!=='Manager')return;branch=b.dataset.b;drawBranches();await load()})}
async function load(){setMsg('Loading…');let r=await sb.from('item_inventory').select('id,item_code,item_name,item_type,category,branch,qty,unit,price_bhd,min_stock').eq('branch',branch).order('item_name');if(r.error)throw r.error;items=r.data||[];render();await loadHistory();setMsg(`${items.length} inventory items loaded.`)}
function render(){let q=$('search').value.trim().toLowerCase(),a=items.filter(x=>`${x.item_name} ${x.item_code} ${x.category}`.toLowerCase().includes(q));$('stock').innerHTML=a.map(x=>`<div class="row"><div><div class="name">${esc(x.item_name)}</div><div class="meta">${esc(x.item_code||'')} • ${esc(x.item_type||'')} • ${esc(x.category||'')}</div></div><div class="qty ${x.min_stock!=null&&Number(x.qty||0)<=Number(x.min_stock)?'low':''}">${Number(x.qty||0).toFixed(2)} ${esc(x.unit||'')}</div></div>`).join('')||'<div class="muted">No items.</div>';
let low=items.filter(x=>x.min_stock!=null&&Number(x.qty||0)<=Number(x.min_stock));$('low').innerHTML=low.map(x=>`<div class="row"><div><div class="name">${esc(x.item_name)}</div><div class="meta">Minimum ${Number(x.min_stock).toFixed(2)} ${esc(x.unit||'')}</div></div><div class="qty low">${Number(x.qty||0).toFixed(2)} ${esc(x.unit||'')}</div></div>`).join('')||'<div class="muted">No low stock items.</div>';
$('total').textContent=items.length;$('consumable').textContent=items.filter(x=>String(x.item_type||'').toLowerCase()==='consumable').length;$('fixed').textContent=items.filter(x=>String(x.item_type||'').toLowerCase().includes('fixed')).length;$('value').textContent=fmt(items.reduce((s,x)=>s+Number(x.qty||0)*Number(x.price_bhd||0),0));}
async function loadHistory(){let all=[];let defs=[['item_receiving_history','received_at','receive'],['item_release_history','released_at','release'],['item_transfer_history','transferred_at','transfer'],['item_count_history','counted_at','count']];for(const [table,stamp,type] of defs){let q=sb.from(table).select('*').order(stamp,{ascending:false}).limit(20);if(table==='item_transfer_history')q=q.or(`from_branch.eq.${branch},to_branch.eq.${branch}`);else q=q.eq('branch',branch);let r=await q;if(r.error)continue;(r.data||[]).forEach(x=>all.push({...x,_type:type,_stamp:x[stamp]}))}historyRows=all.sort((a,b)=>new Date(b._stamp||0)-new Date(a._stamp||0)).slice(0,40);$('history').innerHTML=historyRows.map(x=>{let name=x.item_name||'Item';let qty=x.qty_received??x.qty_released??x.qty??x.counted_qty??'';let meta=x._type==='transfer'?`${x.from_branch||''} → ${x.to_branch||''}`:`${x.branch||branch}${x.reason_event?' • '+x.reason_event:''}`;return `<div class="row"><div><span class="badge ${x._type==='receive'?'in':x._type==='release'?'out':x._type==='transfer'?'transfer':''}">${esc(x._type)}</span><div class="name" style="display:inline;margin-left:7px">${esc(name)}</div><div class="meta">${esc(meta)} • ${date(x._stamp)}${x.received_by?' • '+esc(x.received_by):''}${x.released_by?' • '+esc(x.released_by):''}${x.transferred_by?' • '+esc(x.transferred_by):''}</div></div><div class="qty">${esc(qty)}</div></div>`}).join('')||'<div class="muted">No history.</div>'}
function setMsg(s,bad=false){$('msg').textContent=s;$('msg').className=s?'msg'+(bad?' bad':''):''}
$('search').oninput=render;$('inventory').onclick=()=>location='item-inventory.html';$('signout').onclick=async()=>{await sbAuth.signOut();location='login.html'};boot().catch(e=>{console.error(e);setMsg(e.message||String(e),true)});
</script></body></html>
