<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Flower Odoo Import</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;font:14px Arial;background:linear-gradient(145deg,#fdf1f0,#eaf3ec);color:#3a2530}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between}.top a{color:#9e2f4a;text-decoration:none;font-weight:700}.card{background:#fff;border:1px solid #f0d9d9;border-radius:16px;padding:20px;margin:14px 0}h1{margin:0 0 5px}.muted{color:#8a7078;font-size:12px}input{padding:10px;border:1px solid #f0d9d9;border-radius:9px;box-sizing:border-box}button{padding:11px 16px;border:0;border-radius:10px;background:#9e2f4a;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.drop{border:2px dashed #f0d9d9;padding:28px;text-align:center;border-radius:12px;background:#fdf1f0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}th,td{padding:8px;border-bottom:1px solid #f0d9d9;text-align:left}.diff{background:#fff8e8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.msg{margin-top:12px;padding:10px;border-radius:9px}.ok{background:#eaf5ec}.bad{background:#fbeaea}@media(max-width:700px){.top{flex-direction:column;gap:8px}}</style></head><body><div class="wrap"><div class="top"><a href="flower-tools.html">← Flower Tools</a><a href="flower-admin.html">Flower Admin →</a></div><div class="card"><h1>📦 Flower Odoo Price Import</h1><div class="muted">Supabase only • Google Sheets / Apps Script is not used.</div></div><div class="card"><div class="drop" id="drop">📄 Choose Odoo CSV or drag it here<input id="file" type="file" accept=".csv" hidden></div></div><div class="card" id="compare" style="display:none"><div class="muted" id="summary"></div><table><thead><tr><th></th><th>Item Code</th><th>Flower</th><th>Current</th><th>Odoo</th></tr></thead><tbody id="body"></tbody></table><div class="actions"><button id="all">Select All Changes</button><button id="apply">💾 Apply Selected Prices</button></div><div id="msg"></div></div></div><script>(async()=>{const $=id=>document.getElementById(id);let sb,items=[],rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function csv(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!=='')){a.push(r)}r=[]}else f+=c}if(f||r.length){r.push(f);a.push(r)}return a}async function init(){sb=await window.LalabellaSupabase.createClient();const u=await window.LalabellaAuth.getUser();if(!u){location.href='login.html';return}const p=await window.LalabellaAuth.getProfile();if(!['Admin','Manager'].includes(p?.role)){document.body.innerHTML='<div class="wrap"><div class="card"><b>Access denied.</b><p class="muted">Admin or Manager role required.</p></div></div>';return}const r=await sb.from('flower_item').select('id,flower_name,item_code,rate').order('flower_name');if(r.error)throw r.error;items=r.data||[];$('drop').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&read(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault()};$('drop').ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&read(e.dataTransfer.files[0])}}function read(file){const rd=new FileReader();rd.onload=e=>build(csv(e.target.result));rd.readAsText(file)}function build(data){const h=data[0]||[];const bi=h.findIndex(x=>/barcode|item\s*code/i.test(x));const pi=h.findIndex(x=>/sales\s*price|price/i.test(x));if(bi<0||pi<0){alert('Could not detect Barcode/Item Code and Sales Price columns.');return}const map={};data.slice(1).forEach(r=>{const code=String(r[bi]||'').trim();const price=Number(String(r[pi]||'').replace(/[^0-9.-]/g,''));if(code&&Number.isFinite(price))map[code]=price});rows=items.filter(x=>x.item_code&&Object.prototype.hasOwnProperty.call(map,x.item_code)).map(x=>({...x,odoo:map[x.item_code],diff:Math.abs(Number(x.rate||0)-map[x.item_code])>.0001}));$('compare').style.display='block';$('summary').textContent=`${rows.length} matched items • ${rows.filter(x=>x.diff).length} price changes`;$('body').innerHTML=rows.map((x,i)=>`<tr class="${x.diff?'diff':''}"><td>${x.diff?`<input type="checkbox" data-i="${i}">`:''}</td><td>${esc(x.item_code)}</td><td>${esc(x.flower_name)}</td><td>${Number(x.rate||0).toFixed(3)}</td><td>${Number(x.odoo).toFixed(3)}</td></tr>`).join('')}$('all').onclick=()=>document.querySelectorAll('#body input[type=checkbox]').forEach(x=>x.checked=true);$('apply').onclick=async()=>{const selected=[...document.querySelectorAll('#body input:checked')].map(x=>rows[Number(x.dataset.i)]);if(!selected.length){alert('Select at least one changed item.');return}if(!confirm(`Apply ${selected.length} flower price changes?`))return;$('apply').disabled=true;try{for(const x of selected){const r=await sb.from('flower_item').update({rate:Number(x.odoo),last_updated_date:new Date().toISOString().slice(0,10)}).eq('id',x.id);if(r.error)throw r.error}$('msg').className='msg ok';$('msg').textContent=`Saved ${selected.length} price changes.`;build([["item_code","sales price"],...items.map(x=>[x.item_code,x.rate])])}catch(e){$('msg').className='msg bad';$('msg').textContent=e.message||'Save failed'}finally{$('apply').disabled=false}}}try{await init()}catch(e){console.error(e)}})();</script></body></html>
