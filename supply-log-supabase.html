<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Supply Log</title><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;font-family:system-ui;background:#f3ede0;color:#1c2b45}.wrap{max-width:1000px;margin:auto;padding:28px 18px 70px}.card{background:#fff;border:1px solid #c9bfa0;border-radius:10px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-size:11px;text-transform:uppercase;color:#5c6a83;margin:8px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9bfa0;border-radius:6px;background:#f3ede0;color:#1c2b45}button{padding:11px 16px;border:0;border-radius:6px;background:#1c2b45;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.table{overflow:auto}.row{min-width:760px;display:grid;grid-template-columns:100px 110px 150px 100px 90px 110px 1fr;gap:8px;padding:10px 0;border-top:1px solid #e9e0c8;font-size:12px}.head{font-weight:700;color:#5c6a83;border-top:0}.msg{margin-top:10px;font-size:13px}</style></head><body><div class="wrap"><a href="index.html">← Back to Tools</a><div class="card"><h1>Supply Receiving Log</h1><p>Branch-scoped receiving records. New entries are appended to Supabase.</p><div class="grid"><div><label>Date Received</label><input id="date" type="date"></div><div><label>Invoice No.</label><input id="invoice"></div><div><label>Supplier</label><input id="supplier" list="suppliers"><datalist id="suppliers"></datalist></div><div><label>Order By</label><input id="orderBy" list="orderBys"><datalist id="orderBys"></datalist></div><div><label>Qty</label><input id="qty" type="number" min="0" step="0.01"></div><div><label>Subtotal (BD)</label><input id="subtotal" type="number" min="0" step="0.001"></div><div><label>Remarks</label><textarea id="remarks"></textarea></div></div><button id="save">Add Supply Entry</button><div id="msg" class="msg"></div></div><div class="card"><h2>Supply History</h2><div id="list" class="table">Loading…</div></div></div><script>(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html');return;}const {data:p,error:pe}=await sb.from('profiles').select('role,branch').eq('id',session.user.id).single();if(pe||!p){document.body.innerHTML='<div class="wrap"><div class="card">Profile unavailable.</div></div>';return;}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('date').value=new Date().toISOString().slice(0,10);async function refs(){const [s,o]=await Promise.all([sb.from('supply_log_suppliers').select('name').order('name'),sb.from('supply_log_order_by').select('name').order('name')]);$('suppliers').innerHTML=(s.data||[]).map(x=>`<option value="${esc(x.name)}">`).join('');$('orderBys').innerHTML=(o.data||[]).map(x=>`<option value="${esc(x.name)}">`).join('');}async function load(){let q=sb.from('supply_log_entries').select('id,branch,date_received,invoice_no,supplier,subtotal,qty,order_by,remarks,created_at').order('date_received',{ascending:false}).order('id',{ascending:false}).limit(200);if(p.role==='Staff')q=q.eq('branch',p.branch);const {data,error}=await q;if(error){$('list').textContent=error.message;return;}$('list').innerHTML='<div class="row head"><div>Date</div><div>Branch</div><div>Supplier</div><div>Invoice</div><div>Qty</div><div>Subtotal</div><div>Order By / Remarks</div></div>'+(data||[]).map(x=>`<div class="row"><div>${esc(x.date_received)}</div><div>${esc(x.branch)}</div><div>${esc(x.supplier)}</div><div>${esc(x.invoice_no)}</div><div>${x.qty??''}</div><div>${Number(x.subtotal||0).toFixed(3)}</div><div>${esc(x.order_by||'')}${x.remarks?' · '+esc(x.remarks):''}</div></div>`).join('')||'<div class="muted">No supply records.</div>';}$('save').onclick=async()=>{const qty=Number($('qty').value),subtotal=Number($('subtotal').value);if(!p.branch){$('msg').textContent='Your profile has no branch assigned.';return;}if(!Number.isFinite(qty)||qty<0||!Number.isFinite(subtotal)||subtotal<0){$('msg').textContent='Qty and subtotal must be valid non-negative numbers.';return;}if(!$('supplier').value.trim()){$('msg').textContent='Supplier is required.';return;}$('save').disabled=true;$('msg').textContent='Saving…';const {error}=await sb.from('supply_log_entries').insert({branch:p.branch,date_received:$('date').value,invoice_no:$('invoice').value.trim()||null,supplier:$('supplier').value.trim(),subtotal,qty,order_by:$('orderBy').value.trim()||null,remarks:$('remarks').value.trim()||null,created_at:new Date().toISOString()});$('save').disabled=false;if(error){$('msg').textContent='Save failed: '+error.message;return;}$('msg').textContent='Supply entry added.';['invoice','supplier','orderBy','remarks','qty','subtotal'].forEach(id=>$(id).value='');await load();};await refs();await load();})();</script></body></html>
