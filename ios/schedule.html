<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fbe9e6">
<title>My Schedule · Lalabella</title>
<link rel="apple-touch-icon" href="/icons/ios-schedule.png">
<link rel="icon" type="image/png" href="/icons/ios-schedule.png">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fbe9e6;color:#3a1624;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:24px;box-sizing:border-box}
.c{max-width:380px;text-align:center}
img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(143,42,69,.25)}
h1{font-size:24px;margin:14px 0 4px} p{margin:6px 0;color:#7d5a62}
ol{text-align:left;background:#fff;border-radius:16px;padding:14px 14px 14px 36px;box-shadow:0 4px 16px rgba(143,42,69,.12);color:#3a1624}
li{margin:6px 0} a{color:#c9506b;font-weight:600}
</style>
</head>
<body>
<div class="c" id="c">
  <img src="/icons/ios-schedule.png" alt="">
  <h1>My Schedule</h1>
  <p>Duty schedule and reminders</p>
  <ol>
    <li>Tap <b>Share</b> (the square with the arrow) at the bottom of Safari.</li>
    <li>Scroll and tap <b>Add to Home Screen</b>.</li>
    <li>Tap <b>Add</b>. Open it from the new icon and log in once.</li>
  </ol>
  <p><a href="/schedule.html">Open My Schedule now</a> · <a href="/iphone.html">All iPhone shortcuts</a></p>
</div>
<script>
// Opened from the Home Screen icon: go straight to the page. This icon keeps its own login (iPhone keeps each icon separate),
// and it does not ask for notifications: the main Lalabella icon does that, so alerts are not doubled.
(function(){
  if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
    try { localStorage.setItem('lbNoPush', '1'); } catch (e) {}
    location.replace('/schedule.html');
  }
})();
</script>
</body>
</html>
