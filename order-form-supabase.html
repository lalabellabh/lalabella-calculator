<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Order Form</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>:root{--rose:#c9506b;--deep:#9e2f4a;--blush:#fdf1f0;--mint:#eaf3ec;--ink:#3a2530;--muted:#8a7078;--line:#ead9dc}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Space Grotesk',sans-serif;background:linear-gradient(145deg,var(--blush),var(--mint));min-height:100vh}.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:var(--muted);text-decoration:none;font-size:12px}.brand{text-align:center}.brand small{display:block;font-size:9px;letter-spacing:.3em;color:var(--muted)}h1{font-family:Fraunces,serif;margin:4px 0 0;color:var(--deep)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px #6b35400d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;outline:none}textarea{min-height:80px;resize:vertical}.section-title{font-family:Fraunces,serif;color:var(--deep);font-size:19px;margin:0 0 14px}.items{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr 80px 100px 38px;gap:8px;align-items:center}.money{font-family:'Space Mono',monospace;text-align:right}.remove{border:0;border-radius:9px;background:var(--blush);color:#b33a4f;height:38px;cursor:pointer}.add{border:1px dashed var(--rose);background:#fff;color:var(--deep);padding:9px 13px;border-radius:10px;font-weight:700;cursor:pointer}.summary{background:var(--blush);padding:14px;border-radius:12px}.sum{display:flex;justify-content:space-between;padding:4px 0}.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:18px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff}.outline{background:#fff;border:1px solid var(--deep);color:var(--deep)}#msg{font-size:12px;margin-top:10px}.ok{color:#39734a}.err{color:#b3261e}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:1fr 70px 90px 34px}.wrap{width:min(100% - 20px,600px)}}@media print{.top,.card:not(.print-card){display:none!important}.print-card{display:block!important}}
.print-card{display:none;background:#fff}.receipt{line-height:1.5}.receipt h2{font-family:Fraunces,serif;color:var(--deep)}.receipt table{width:100%;border-collapse:collapse}.receipt th,.receipt td{text-align:left;padding:6px;border-bottom:1px solid #ddd}</style></head><body><div class="wrap"><div class="top"><a href="index.html">← Dashboard</a><div class="brand"><small>LALABELLA • BAHRAIN</small><h1>Order Form</h1></div><a href="flower-tools.html">Flower Tools →</a></div><div class="card"><div class="grid"><div><label>OR Number</label><input id="or" placeholder="e.g. OR-20260913-001"></div><div><label>Status</label><select id="status"><option>Pending</option><option>Confirmed</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select></div></div></div><div class="card"><h2 class="section-title">Arrangement / Items</h2><div id="items" class="items"></div><button class="add" id="addItem">＋ Add Item</button></div><div class="card"><h2 class="section-title">Customer</h2><div class="grid"><div><label>Sender / Customer</label><input id="sender"></div><div><label>Sender Phone</label><input id="senderPhone"></div><div><label>Receiver</label><input id="receiver"></div><div><label>Receiver Phone</label><input id="receiverPhone"></div></div></div><div class="card"><h2 class="section-title">Delivery</h2><div class="grid"><div><label>Method</label><select id="method"><option>Delivery</option><option>Pick-up</option><option>Walk-in</option></select></div><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" placeholder="e.g. 4:00 PM"></div><div class="full"><label>Address</label><textarea id="address"></textarea></div></div></div><div class="card"><h2 class="section-title">Additional</h2><div class="grid"><div><label>Additional Charge</label><input id="additional" type="number" min="0" step="0.001" value="0"></div><div><label>Notes</label><input id="notes"></div></div><div class="summary" style="margin-top:14px"><div class="sum"><span>Subtotal</span><b id="subtotal">0.000 BD</b></div><div class="sum"><span>Additional</span><b id="addTotal">0.000 BD</b></div><div class="sum total"><span>Total</span><b id="total">0.000 BD</b></div></div><div class="actions"><button class="btn primary" id="save">Save Order</button><button class="btn outline" id="print">Print</button><button class="btn outline" id="wa">WhatsApp</button></div><div id="msg"></div></div><div class="card print-card"><div id="receipt" class="receipt"></div></div></div><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><script>
const $=id=>document.getElementById(id);const money=n=>(Number(n)||0).toFixed(3)+' BD';let rows=[];
function makeOr(){const d=new Date();return 'OR-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0')}
$('or').value=makeOr();$('date').value=new Date().toISOString().slice(0,10);
function addRow(){rows.push({name:'',qty:1,rate:0});render()}
function render(){const el=$('items');el.innerHTML=rows.map((r,i)=>`<div class="item"><input data-i="${i}" data-k="name" value="${esc(r.name)}" placeholder="Item / arrangement"><input data-i="${i}" data-k="qty" type="number" min="0" step="1" value="${r.qty}"><input data-i="${i}" data-k="rate" type="number" min="0" step="0.001" value="${r.rate}"><button class="remove" data-r="${i}">×</button></div>`).join('');el.querySelectorAll('input').forEach(x=>x.oninput=()=>{rows[+x.dataset.i][x.dataset.k]=x.dataset.k==='name'?x.value:Number(x.value)||0;calc()});el.querySelectorAll('.remove').forEach(x=>x.onclick=()=>{rows.splice(+x.dataset.r,1);render();calc()});calc()}
function esc(s){return String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function calc(){const sub=rows.reduce((a,r)=>a+(Number(r.qty)||0)*(Number(r.rate)||0),0),add=Math.max(0,Number($('additional').value)||0),tot=sub+add;$('subtotal').textContent=money(sub);$('addTotal').textContent=money(add);$('total').textContent=money(tot);return{sub,add,tot}}
$('addItem').onclick=addRow;$('additional').oninput=calc;addRow();
async function auth(){const u=await sbAuth.getUser();if(!u)location.replace('login.html');return u}
async function saveOrder(){const u=await auth();if(!u)return;const c=calc();if(!$('or').value.trim()){setMsg('OR number required',true);return}const payload={p_or_number:$('or').value.trim(),p_arrangements:rows,p_sender_name:$('sender').value.trim(),p_sender_phone:$('senderPhone').value.trim(),p_receiver_name:$('receiver').value.trim(),p_receiver_phone:$('receiverPhone').value.trim(),p_delivery_method:$('method').value,p_delivery_date:$('date').value||null,p_delivery_time:$('time').value.trim(),p_address:$('address').value.trim(),p_items:rows,p_subtotal:c.sub,p_additional:c.add,p_total_amount:c.tot,p_received_by:u.email||'',p_status:$('status').value,p_notes:$('notes').value.trim()};const {data,error}=await sb.rpc('create_order',payload);if(error){setMsg(error.message,true);return}setMsg('✓ Order saved to Supabase. '+(data?.or_number||payload.p_or_number));fillReceipt();}
function setMsg(t,bad=false){$('msg').textContent=t;$('msg').className=bad?'err':'ok'}
function fillReceipt(){const c=calc();$('receipt').innerHTML=`<h2>Lalabella Order</h2><p><b>OR:</b> ${esc($('or').value)}<br><b>Status:</b> ${esc($('status').value)}<br><b>Branch:</b> current assigned branch</p><p><b>Sender:</b> ${esc($('sender').value)}<br><b>Receiver:</b> ${esc($('receiver').value)}<br><b>Delivery:</b> ${esc($('method').value)} ${esc($('date').value)} ${esc($('time').value)}<br><b>Address:</b> ${esc($('address').value)}</p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.qty}</td><td>${money(r.rate)}</td><td>${money(r.qty*r.rate)}</td></tr>`).join('')}</table><p><b>Subtotal:</b> ${money(c.sub)}<br><b>Additional:</b> ${money(c.add)}<br><b>Total:</b> ${money(c.tot)}</p><p>${esc($('notes').value)}</p>`}
$('save').onclick=saveOrder;$('print').onclick=()=>{fillReceipt();window.print()};$('wa').onclick=()=>{fillReceipt();const text='Lalabella Order '+$('or').value+'\nSender: '+$('sender').value+'\nReceiver: '+$('receiver').value+'\nDelivery: '+$('method').value+' '+$('date').value+' '+$('time').value+'\nTotal: '+$('total').textContent;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')};auth();
</script></body></html>
