<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lalabella — Chocolate Receiving</title>
<script src="supabase-config.js"></script><script src="supabase-client.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2b45;--dim:#66728a;--gold:#c68a1f;--paper:#f3ede0;--paper2:#e9e0c8;--line:#c9bfa0;--ok:#3d7a4f;--bad:#8a2424}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff,#f0e8d6 65%);color:var(--ink);font-family:'Space Grotesk',sans-serif}.bar{height:9px;background:repeating-linear-gradient(-45deg,#c68a1f,#c68a1f 18px,#e8c46a 18px,#e8c46a 36px)}main{max-width:980px;margin:auto;padding:30px 18px 70px}.back{color:var(--dim);text-decoration:none;font-size:12px;text-transform:uppercase}.head{text-align:center;margin:25px 0}.ey{font-size:11px;letter-spacing:.35em;color:var(--gold);font-weight:700}.head h1{font:900 clamp(2rem,6vw,3.2rem)/1 'Fraunces',serif;margin:10px 0}.head p{color:var(--dim);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--paper2);padding:5px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:12px;color:var(--dim);font-weight:700;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);padding:20px;margin-bottom:18px;border-radius:5px}.card h2{font:600 19px 'Fraunces',serif;margin:0 0 16px}.field{margin:11px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;border-radius:3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:0;padding:12px 15px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;border-radius:3px}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}.search{display:flex;gap:8px}.search input{flex:1}.results{max-height:230px;overflow:auto;border:1px solid var(--line);margin-top:7px;display:none}.result{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:var(--paper)}.result b{display:block}.meta{font-size:11px;color:var(--dim)}.history{max-height:500px;overflow:auto}.entry{border-top:1px solid var(--line);padding:12px 0}.entry:first-child{border-top:0}.entrytop{display:flex;justify-content:space-between;gap:8px}.pill{font-size:9px;padding:3px 7px;border-radius:10px;font-weight:700;background:#e3f0e6;color:var(--ok)}.pill.warn{background:#fbf1de;color:#a76b08}.pill.bad{background:#f6e0e0;color:var(--bad)}.status{margin-top:10px;text-align:center;color:var(--dim);font-size:12px}.scan{margin-left:6px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:#fff;padding:18px;max-width:430px;width:100%;border-radius:6px}.modal video{width:100%;border-radius:5px}.modal button{margin-top:10px;width:100%}@media(max-width:720px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head>
<body><div class="bar"></div><main>
<a class="back" href="index.html">← Back to Tools</a><header class="head"><div class="ey">LALABELLA</div><h1>Chocolate Receiving</h1><p>Supabase stock receiving · branch controlled · no Google Apps Script</p></header>
<div class="tabs" id="tabs"><button class="active" data-branch="ModaMall">ModaMall</button><button data-branch="Hamala">Hamala</button><button data-branch="Galali">Galali</button></div>
<div class="grid"><section class="card"><h2>Receive Stock</h2>
<div class="field"><label>Chocolate</label><div class="search"><input id="search" placeholder="Name or product code" autocomplete="off"><button class="btn alt scan" id="scan">📷</button></div><div class="results" id="results"></div><div class="meta" id="selected"></div></div>
<div class="two"><div class="field"><label>Receive Date</label><input id="date" type="date"></div><div class="field"><label>Delivery Note No.</label><input id="delivery" placeholder="Auto if blank"></div></div>
<div class="two"><div class="field"><label>Supplier</label><select id="supplier"></select></div><div class="field"><label>Batch No.</label><input id="batch" placeholder="Auto if blank"></div></div>
<div class="two"><div class="field"><label>Expiry Date</label><input id="expiry" type="date"></div><div class="field"><label>Qty Received</label><input id="qty" type="number" min="0" step=".01"></div></div>
<div class="two"><div class="field"><label>Unit</label><select id="unit"></select></div><div class="field"><label>Packaging</label><select id="pack"><option>Piece</option><option>Box</option><option>Can</option></select></div></div>
<div class="two"><div class="field"><label>Price / Kg (BD)</label><input id="price" type="number" min="0" step=".001"></div><div class="field"><label>Weight / Piece (g)</label><input id="weight" type="number" min="0" step=".01"></div></div>
<div class="two"><div class="field"><label>Storage</label><select id="storage"></select></div><div class="field"><label>Tray / Colour Code</label><input id="tray"></div></div>
<div class="field"><label>Received By</label><select id="receivedBy"></select></div><div class="field"><label>Remarks</label><textarea id="remarks" rows="2"></textarea></div>
<div class="actions"><button class="btn" id="save">Log Receiving</button><button class="btn alt" id="refresh">↻ Refresh</button></div><div class="status" id="status">Checking Supabase…</div></section>
<section class="card"><h2>Recent Stock — <span id="branchTitle">ModaMall</span></h2><div class="history" id="history"></div></section></div></main>
<div class="modal" id="scanModal"><div class="modalbox"><video id="video" autoplay playsinline muted></video><div class="meta">Point the camera at a barcode.</div><button class="btn" id="closeScan">Cancel</button></div></div>
<script>
(async()=>{const $=id=>document.getElementById(id);let sb,items=[],suppliers=[],units=[],storage=[],received=[],entries=[],selected=null,branch='ModaMall',stream=null;
const today=new Date();$('date').value=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
const fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' BD';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function say(t,bad=false){$('status').textContent=t;$('status').style.color=bad?'var(--bad)':'var(--dim')}
function opts(id,arr){$(id).innerHTML=arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function autoNo(prefix,label,date){const d=(date||$('date').value||$('date')).replaceAll('-','');let max=0;entries.forEach(e=>{const v=String(e[label]||'');const p=`${prefix}-${d}-`;if(v.startsWith(p)){const n=parseInt(v.slice(p.length),10);if(n>max)max=n}});return `${prefix}-${d}-${String(max+1).padStart(2,'0')}`}
function expStatus(v){if(!v)return ['—',''];const d=Math.ceil((new Date(v)-new Date(new Date().toDateString()))/86400000);return d<0?['EXPIRED','bad']:d<=30?['NEAR EXPIRY','warn']:['GOOD','']}
async function load(){say('Loading Supabase data…');const [a,b,c,d,e,f]=await Promise.all([
 sb.from('chocolate_item_list').select('id,chocolate_name,product_code,brand,category,standard_price_per_kg,grams,packaging_type').order('chocolate_name'),
 sb.from('chocolate_suppliers').select('name').order('name'),sb.from('chocolate_units').select('name').order('id'),sb.from('chocolate_storage_locations').select('name').order('id'),sb.from('chocolate_received_by').select('name').order('id'),sb.from('chocolate_database').select('*').eq('branch',branch).order('receive_date',{ascending:false}).limit(100)]);
 for(const q of [a,b,c,d,e,f])if(q.error)throw q.error;items=a.data||[];suppliers=(b.data||[]).map(x=>x.name);units=(c.data||[]).map(x=>x.name);storage=(d.data||[]).map(x=>x.name);received=(e.data||[]).map(x=>x.name);entries=f.data||[];opts('supplier',suppliers);opts('unit',units);opts('storage',storage);opts('receivedBy',received);renderHistory();say(`${items.length} chocolate items · ${entries.length} branch entries loaded`)}
function renderResults(list){const r=$('results');r.innerHTML=list.slice(0,30).map(x=>`<div class="result" data-id="${x.id}"><b>${esc(x.chocolate_name)}</b><span class="meta">${esc(x.product_code||'')} · ${esc(x.category||'')} · ${x.grams||0}g/pc · ${fmt(x.standard_price_per_kg)}/kg</span></div>`).join('')||'<div class="meta" style="padding:12px">No chocolates found.</div>';r.style.display='block';r.querySelectorAll('.result').forEach(el=>el.onclick=()=>choose(items.find(x=>String(x.id)===el.dataset.id)))}
function choose(x){selected=x;if(!x)return;$('search').value=x.chocolate_name;$('results').style.display='none';$('selected').textContent=`${x.product_code||'—'} · ${x.brand||'—'} · ${x.category||'—'}`;$('price').value=x.standard_price_per_kg??'';$('weight').value=x.grams??'';$('pack').value=x.packaging_type||'Piece'}
$('search').oninput=e=>{const q=e.target.value.toLowerCase().trim();if(!q){$('results').style.display='none';return}renderResults(items.filter(x=>[x.chocolate_name,x.product_code,x.brand,x.category].some(v=>String(v||'').toLowerCase().includes(q))))};
$('pack').onchange=()=>{const lock=$('pack').value==='Box'||$('pack').value==='Can';if(lock){$('unit').value='Piece';$('unit').disabled=true}else $('unit').disabled=false};
$('tabs').onclick=async e=>{const b=e.target.closest('button');if(!b)return;branch=b.dataset.branch;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));$('branchTitle').textContent=branch;await load()};
$('refresh').onclick=()=>load().catch(e=>say(e.message||'Could not refresh',true));
$('save').onclick=async()=>{if(!selected)return alert('Select a chocolate first.');const qty=Number($('qty').value),price=Number($('price').value)||0;if(!qty||qty<=0)return alert('Enter a valid quantity.');let delivery=$('delivery').value.trim(),batch=$('batch').value.trim();const d=$('date').value;if(!delivery)delivery=autoNo(branch==='ModaMall'?'MM-DN':branch==='Hamala'?'HM-DN':'GL-DN','delivery_note_no',d);if(!batch)batch=autoNo(branch==='ModaMall'?'MM-BATCH':branch==='Hamala'?'HM-BATCH':'GL-BATCH','batch_no',d);const user=await sb.auth.getUser();if(user.error||!user.data.user)return location.href='index.html';const p={receive_date:d,delivery_note_no:delivery,supplier:$('supplier').value,chocolate_name:selected.chocolate_name,product_code:selected.product_code||'',brand:selected.brand||'',category:selected.category||'',batch_no:batch,expiry_date:$('expiry').value||null,qty_received:qty,qty_used:0,current_stock:qty,unit:$('unit').value,price_per_kg:price,total_amount:qty*price,status:'Received',branch,storage_location:$('storage').value,tray_colour_code:$('tray').value.trim(),remarks:$('remarks').value.trim(),created_at:new Date().toISOString(),created_by:$('receivedBy').value,weight_per_piece:Number($('weight').value)||null,price_per_piece:Number($('weight').value)>0?(price*Number($('weight').value)/1000):null};const btn=$('save');btn.disabled=true;btn.textContent='Saving…';try{const q=await sb.from('chocolate_database').insert(p).select().single();if(q.error)throw q.error;entries.unshift(q.data);renderHistory();['search','selected','delivery','batch','expiry','qty','price','weight','tray','remarks'].forEach(id=>{if($(id))$(id).value='';});selected=null;say('Receiving saved to Supabase ✓')}catch(e){console.error(e);alert('Could not save: '+e.message)}finally{btn.disabled=false;btn.textContent='Log Receiving'}};
function renderHistory(){const h=$('history');if(!entries.length){h.innerHTML='<div class="meta" style="padding:20px 0;text-align:center">No stock received for this branch.</div>';return}h.innerHTML=entries.map(e=>{const [lab,cls]=expStatus(e.expiry_date);return `<div class="entry"><div class="entrytop"><b>${esc(e.chocolate_name||'—')}</b><span class="pill ${cls}">${lab}</span></div><div class="meta">${esc(e.receive_date||'—')} · ${e.qty_received??0} ${esc(e.unit||'')} · ${fmt(e.price_per_kg)}/kg</div><div class="meta">Supplier: ${esc(e.supplier||'—')} · Batch: ${esc(e.batch_no||'—')} · By: ${esc(e.created_by||'—')}</div>${e.remarks?`<div class="meta">${esc(e.remarks)}</div>`:''}</div>`}).join('')}
$('scan').onclick=async()=>{if(!('BarcodeDetector'in window)){alert('BarcodeDetector is not supported here.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('video').srcObject=stream;$('scanModal').classList.add('show');const detector=new BarcodeDetector({formats:['code_128','ean_13','ean_8','upc_a','upc_e','qr_code']});const loop=async()=>{if(!stream)return;try{const codes=await detector.detect($('video'));if(codes.length){const code=String(codes[0].rawValue);const x=items.find(i=>String(i.product_code||'').trim()===code.trim());if(x){choose(x);closeScan();}else alert('No chocolate found for code: '+code);return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){alert('Camera access failed.')}};
function closeScan(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('scanModal').classList.remove('show')}$('closeScan').onclick=closeScan;
try{sb=await window.LalabellaSupabase.ready();const u=await sb.auth.getUser();if(u.error||!u.data.user){location.href='index.html';return}await load()}catch(e){console.error(e);say(e.message||'Supabase connection failed',true)}})();
</script></body></html>
