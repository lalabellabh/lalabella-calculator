<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lalabella — Initial Stock</title><script src="supabase-client.js"></script><script src="supabase-auth.js"></script><style>body{margin:0;font-family:system-ui;background:#f3ede0;color:#1c2b45}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.card{background:#fff;border:1px solid #c9bfa0;border-radius:10px;padding:20px;margin-bottom:18px}h1{margin:0 0 5px}.muted{color:#5c6a83;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-size:11px;text-transform:uppercase;color:#5c6a83;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c9bfa0;border-radius:6px;background:#f3ede0;color:#1c2b45}button{padding:12px 16px;border:0;border-radius:6px;background:#1c2b45;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.list{max-height:430px;overflow:auto}.row{padding:11px 0;border-top:1px solid #e9e0c8}.row:first-child{border-top:0}.meta{font-size:12px;color:#5c6a83}.msg{margin-top:12px;font-size:13px}</style></head><body><div class="wrap"><a href="flower-tools.html">← Flower Tools</a><div class="card"><h1>Initial Stock</h1><div class="muted">Chocolate opening balance. Existing stock records are preserved; new entries are added only.</div><div class="grid"><div><label>Chocolate Name</label><input id="name" required></div><div><label>Product Code</label><input id="code"></div><div><label>Category</label><input id="category"></div><div><label>Batch No.</label><input id="batch"></div><div><label>Expiry Date</label><input id="expiry" type="date"></div><div><label>Quantity</label><input id="qty" type="number" min="0.01" step="0.01"></div><div><label>Unit</label><select id="unit"><option>Kg</option><option>Box</option><option>Piece</option><option>Pack</option></select></div><div><label>Price / Kg (BD)</label><input id="price" type="number" min="0" step="0.001"></div><div><label>Storage</label><select id="storage"><option>Display</option><option>Chiller</option><option>Storage</option></select></div><div><label>Entered By</label><input id="by"></div></div><button id="save" style="margin-top:18px">Add Opening Balance</button><div id="msg" class="msg"></div></div><div class="card"><h2>Existing Initial Stock</h2><div class="muted">Read-only history from the current chocolate database.</div><div id="list" class="list">Loading…</div></div></div><script>(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return;}const {data:p}=await sb.from('profiles').select('role,branch').eq('id',session.user.id).single();if(!p||!['Admin','Manager'].includes(p.role)){document.body.innerHTML='<div class="wrap"><div class="card">Admin/Manager access required.</div></div>';return;}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const {data,error}=await sb.from('chocolate_database').select('id,receive_date,chocolate_name,product_code,category,batch_no,expiry_date,qty_received,current_stock,unit,price_per_kg,branch,storage_location,remarks').eq('delivery_note_no','INITIAL STOCK').order('id',{ascending:false});if(error){$('list').textContent=error.message;return;}$('list').innerHTML=(data||[]).map(x=>`<div class="row"><b>${esc(x.chocolate_name)}</b><div class="meta">${esc(x.branch)} · Qty ${x.qty_received} ${esc(x.unit)} · Stock ${x.current_stock} · ${esc(x.batch_no||'No batch')} · ${esc(x.storage_location||'')}</div></div>`).join('')||'<div class="muted">No initial stock records.</div>';}$('save').onclick=async()=>{const q=Number($('qty').value);if(!$('name').value.trim()||!(q>0)){ $('msg').textContent='Chocolate name and positive quantity are required.';return;}$('save').disabled=true;$('msg').textContent='Saving…';const {error}=await sb.rpc('record_initial_chocolate_stock',{p_receive_date:new Date().toISOString().slice(0,10),p_chocolate_name:$('name').value.trim(),p_product_code:$('code').value.trim()||null,p_category:$('category').value.trim()||null,p_batch_no:$('batch').value.trim()||null,p_expiry_date:$('expiry').value||null,p_qty:q,p_unit:$('unit').value,p_price_per_kg:Number($('price').value)||0,p_storage_location:$('storage').value,p_entered_by:$('by').value.trim()||null,p_remarks:'Initial stock entry'});$('save').disabled=false;if(error){$('msg').textContent='Save failed: '+error.message;return;}$('msg').textContent='Opening balance added. Existing records were not changed.';['name','code','category','batch','expiry','qty','price','by'].forEach(id=>$(id).value='');await load();};await load();})();</script></body></html>
