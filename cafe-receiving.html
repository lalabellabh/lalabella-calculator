<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="shared/config.js"></script>
<script>window.lbEsc=window.lbEsc||function(v){return String(v==null?"":v).replace(/[&<>"'`]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c];});};</script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Café Receiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="lb-theme-keep" content=".wrap, .card">
<style>
  :root{ --ink:#2a1c22; --dim:#7a6670; --line:#ecdfe3; --ok:#2f7a4f; --bad:#c5483a; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Space Grotesk',Arial,sans-serif; color:var(--ink); background:linear-gradient(160deg,#f6efe6,#eef6f0); min-height:100vh; }
  .wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 80px; }
  header{ padding-left:56px; margin:6px 0 6px; }
  h1{ font-family:'Fraunces',serif; font-weight:900; font-size:26px; margin:0; }
  .sub{ color:var(--dim); font-size:12.5px; margin-top:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar input,.bar select,.btn{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:#fff; color:var(--ink); cursor:pointer; }
  .btn.go{ background:linear-gradient(135deg,#c9506b,#9e2f4a); color:#fff; border:0; font-weight:700; }
  .btn.ok{ background:var(--ok); color:#fff; border:0; font-weight:700; }
  .card{ background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .card h2{ font-family:'Fraunces',serif; font-size:17px; margin:0 0 10px; }
  .card label{ display:block; font-size:11.5px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
  .card input,.card select{ width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
  .g2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .g3{ display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
  @media(max-width:620px){ .g2,.g3{ grid-template-columns:1fr; } }
  .pic{ width:44px; height:44px; flex:none; border-radius:10px; background:#f3ece6 center/cover no-repeat; border:1px dashed #d9c7bd; display:flex; align-items:center; justify-content:center; font-size:17px; color:#b9a49a; }
  .pic.has{ border-style:solid; border-color:#eadbd4; cursor:zoom-in; } .pic.can{ cursor:pointer; }
  .row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:0; }
  .nm{ flex:1; min-width:0; font-weight:700; font-size:14px; } .nm small{ display:block; font-weight:400; color:var(--dim); font-size:11.5px; }
  .grp{ font-size:12px; font-weight:800; color:#7a5a20; background:#faf5ef; padding:6px 10px; border-radius:8px; margin:10px 0 2px; }
  .zero{ color:var(--bad); } .soon{ color:#a8560b; }
  .empty{ color:var(--dim); text-align:center; padding:18px 0; font-size:13px; }
  .msg{ font-size:12.5px; color:var(--dim); }
</style>
</head>
<body>
<script src="shared/nav.js" data-standalone></script>
<script src="shared/cafe-common.js"></script>
<div class="wrap">
  <header><h1>🛒 Café Receiving</h1><div class="sub">What came in for the café — it adds to the café stock.</div></header>
  <div id="tabs"></div>
  <div class="card">
    <h2>Receive items</h2>
    <div class="g3"><div><label>Supplier</label><input id="sup" list="supList" maxlength="80" placeholder="e.g. White Elephant"><datalist id="supList"></datalist></div>
      <div><label>Date</label><input type="date" id="date"></div><div><label>Invoice no.</label><input id="inv" maxlength="40" placeholder="optional"></div></div>
    <div class="g3" style="margin-top:6px"><div><label>Item</label><input id="item" list="itemList" placeholder="Type or pick a café item"><datalist id="itemList"></datalist></div>
      <div><label>Qty <span id="unit" style="text-transform:none"></span></label><input id="qty" type="number" min="0" step="any" inputmode="decimal"></div><div><label>Expiry (optional)</label><input type="date" id="exp"></div></div>
    <div class="g2" style="margin-top:6px"><div><label>Received by</label><input id="by" maxlength="60"></div><div><label>Note (optional)</label><input id="note" maxlength="200"></div></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" id="addLine">➕ Add to list</button><span class="msg" id="hint" style="align-self:center"></span></div>
    <div id="lines" style="margin-top:10px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" id="clr">↺ Clear</button><button class="btn ok" id="save">💾 Save receiving</button></div>
  </div>
  <div class="card"><h2>Recent receiving</h2><div id="hist"><div class="empty">Loading…</div></div></div>
</div>
<script>
(function(){
  var C = window.LBCafe, esc = C.esc, $ = function(id){ return document.getElementById(id); }, D = null, lines = [], ADMIN = false;
  $('tabs').innerHTML = C.tabs('cafe-receiving.html'); $('date').value = C.today();
  var u = C.me(); $('by').value = u.fullName || u.full_name || u.username || '';
  function pick(){ var v = $('item').value.trim().toLowerCase(); return D ? D.items.find(function(i){ return i.name.toLowerCase() === v; }) : null; }
  $('item').oninput = function(){ var it = pick(); $('unit').textContent = it ? '(' + it.unit + ')' : ''; };
  function load(){
    C.api({ action:'items' }).then(function(d){ if(!d || !d.success) return; D = d; ADMIN = d.admin;
      $('itemList').innerHTML = d.items.map(function(i){ return '<option value="' + esc(i.name) + '">'; }).join(''); });
    C.api({ action:'receivings' }).then(function(d){
      if(!d || !d.success){ $('hist').innerHTML = '<div class="empty">' + esc((d && d.error) || 'Could not load.') + '</div>'; return; }
      var sups = []; d.rows.forEach(function(r){ if(r.supplier && sups.indexOf(r.supplier) === -1) sups.push(r.supplier); });
      $('supList').innerHTML = sups.map(function(s){ return '<option value="' + esc(s) + '">'; }).join('');
      $('hist').innerHTML = d.rows.length ? d.rows.map(function(r){
        return '<div class="row"><div class="nm">' + esc(r.name) + ' <span style="font-weight:800">+' + C.n3(r.qty) + ' ' + esc(r.unit) + '</span><small>' + C.fd(r.date) + (r.supplier ? ' · ' + esc(r.supplier) : '') + (r.invoice ? ' · inv ' + esc(r.invoice) : '') + (r.expiry ? ' · exp ' + C.fd(r.expiry) : '') + (r.by ? ' · by ' + esc(r.by) : '') + (r.note ? ' · ' + esc(r.note) : '') + '</small></div>' +
          (ADMIN ? '<button class="btn" data-del="' + r.id + '" data-n="' + esc(r.name) + '" title="Delete (Admin)" style="padding:6px 9px">🗑️</button>' : '') + '</div>'; }).join('') : '<div class="empty">Nothing received yet.</div>';
    }).catch(function(){ $('hist').innerHTML = '<div class="empty">Connection problem.</div>'; });
  }
  function paint(){
    $('lines').innerHTML = lines.length ? '<div class="grp">In this delivery: ' + lines.length + ' item' + (lines.length > 1 ? 's' : '') + '</div>' + lines.map(function(l, k){
      return '<div class="row"><div class="nm">' + esc(l.name) + '<small>' + C.n3(l.qty) + ' ' + esc(l.unit) + (l.expiry ? ' · exp ' + C.fd(l.expiry) : '') + (l.note ? ' · ' + esc(l.note) : '') + '</small></div><button class="btn" data-rm="' + k + '" style="padding:6px 9px">✕</button></div>'; }).join('') : '';
    $('save').textContent = lines.length ? '💾 Save receiving (' + lines.length + ')' : '💾 Save receiving';
  }
  $('addLine').onclick = function(){
    var it = pick(), q = Number($('qty').value);
    if(!it){ alert('Pick the item from the list.' + (ADMIN ? '\nNew item? Add it first in Café Items & Stock.' : '')); $('item').focus(); return; }
    if(!(q > 0)){ alert('Type the quantity.'); $('qty').focus(); return; }
    lines.push({ id:it.id, name:it.name, unit:it.unit, qty:q, expiry:$('exp').value, note:$('note').value.trim() });
    $('item').value = ''; $('qty').value = ''; $('note').value = ''; $('unit').textContent = '';   // expiry stays for the next item
    paint(); $('item').focus();
  };
  $('lines').addEventListener('click', function(e){ var b = e.target.closest('[data-rm]'); if(b){ lines.splice(Number(b.getAttribute('data-rm')), 1); paint(); } });
  $('clr').onclick = function(){ if(lines.length && !confirm('Clear this delivery?')) return; lines = []; ['sup','inv','item','qty','exp','note'].forEach(function(id){ $(id).value = ''; }); paint(); };
  $('save').onclick = function(){
    if(!lines.length && pick() && Number($('qty').value) > 0) $('addLine').click();
    if(!lines.length){ alert('Add at least one item.'); return; }
    if(!$('date').value){ alert('Pick the date.'); return; }
    if(!confirm('Save ' + lines.length + ' item(s) received on ' + C.fd($('date').value) + ($('sup').value ? ' from ' + $('sup').value : '') + '?\n\n' + lines.map(function(l){ return '• ' + l.name + ' — ' + C.n3(l.qty) + ' ' + l.unit; }).join('\n'))) return;
    var b = this; b.disabled = true; b.textContent = 'Saving…';
    C.api({ action:'receive', date:$('date').value, supplier:$('sup').value.trim(), invoice:$('inv').value.trim(), receivedBy:$('by').value.trim(), lines:JSON.stringify(lines) }).then(function(d){
      if(!d || !d.success){ alert((d && d.error) || 'Not saved.'); return; }
      lines = []; ['inv','exp'].forEach(function(id){ $(id).value = ''; }); paint(); $('hint').textContent = '✓ Saved ' + d.saved + ' item(s).'; load();
    }).catch(function(){ alert('Connection problem. Please try again.'); }).then(function(){ b.disabled = false; paint(); });
  };
  $('hist').addEventListener('click', function(e){ var b = e.target.closest('[data-del]'); if(!b) return;
    if(!confirm('Delete this receiving of ' + b.getAttribute('data-n') + '?\nIt comes off the café stock.')) return;
    C.api({ action:'deleteReceiving', id:b.getAttribute('data-del') }).then(function(d){ if(!d.success){ alert(d.error || 'Not deleted.'); return; } load(); }); });
  window.addEventListener('beforeunload', function(e){ if(lines.length){ e.preventDefault(); e.returnValue = ''; } });
  load(); paint();
})();
</script>
</body>
</html>
