<!doctype html>
<html lang="en">
<head>
<script src="auth-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lalabella — Chocolate Arrangements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --rose:#c9506b; --rose-dark:#9e2f4a; --gold:#d9a441; --gold-light:#f1d38c;
    --cream:#fdf1f0; --ink:#2f2024; --muted:#8a7078; --line:#f0dede;
    --panel:#ffffff; --bg:#fdf1f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fdf1f0 0%,#f6e0da 45%,#eaf3ec 100%);font-family:'Space Grotesk',Arial,sans-serif;color:var(--ink);}
  body{padding:22px 16px 60px;}
  .wrap{max-width:1000px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3a2a1a,#5c1a28);display:grid;place-items:center;font-weight:800;color:var(--gold-light);}
  .brand b{font-family:'Fraunces',serif;font-size:15px;letter-spacing:.02em;}
  .backlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:9px;background:#fff;}

  h1{font-family:'Fraunces',serif;font-size:26px;margin:0 0 4px;}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 22px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:20px;box-shadow:0 6px 18px rgba(158,47,74,.06);}
  .card h2{font-family:'Fraunces',serif;font-size:17px;margin:0 0 14px;}
  label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fdf9f8;color:var(--ink);outline:none;box-sizing:border-box;margin-bottom:14px;}
  input:focus,textarea:focus{border-color:var(--rose);}
  .item-row{display:grid;grid-template-columns:2fr 90px 34px;gap:8px;margin-bottom:8px;align-items:center;}
  .item-row input{margin-bottom:0;}
  .remove-item{background:none;border:none;color:#c0392b;font-size:18px;cursor:pointer;padding:4px;}
  .add-item-btn{font-size:12.5px;color:var(--rose-dark);background:none;border:1px dashed var(--rose);border-radius:9px;padding:8px 14px;cursor:pointer;margin-bottom:16px;}
  .save-btn{padding:12px 20px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .save-btn:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;margin-top:10px;display:none;}
  .msg.error{color:#c0392b;display:block;}
  .msg.success{color:#3d7a4f;display:block;}

  .arr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .arr-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 4px 14px rgba(158,47,74,.06);}
  .arr-card h3{font-family:'Fraunces',serif;font-size:16px;margin:0 0 4px;}
  .arr-card .by{font-size:11px;color:var(--muted);margin-bottom:10px;}
  .arr-card ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.7;}
  .arr-card .notes{margin-top:8px;font-size:11.5px;color:var(--muted);font-style:italic;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">🍫</div><b>Chocolate Arrangements</b></div>
    <a class="backlink" href="index.html">← Back to Lalabella</a>
  </div>

  <h1>Chocolate Arrangement Catalog</h1>
  <p class="sub">Reference recipes for standard boxes/arrangements — composition and who designed them.</p>

  <div class="card">
    <h2>➕ Add New Arrangement</h2>
    <label>Arrangement Name</label>
    <input type="text" id="arrName" placeholder="e.g. Deluxe Box A">
    <label>Made By (Florist/Staff)</label>
    <input type="text" id="arrCreator" placeholder="Your name">

    <label>Chocolates in this Arrangement</label>
    <div id="itemRows"></div>
    <button type="button" class="add-item-btn" id="addItemBtn">+ Add Chocolate</button>

    <label>Notes (optional)</label>
    <textarea id="arrNotes" rows="2" placeholder="Any extra notes..."></textarea>

    <button class="save-btn" id="saveBtn">Save Arrangement</button>
    <div class="msg" id="formMsg"></div>
  </div>

  <div class="card">
    <h2>📋 Existing Arrangements</h2>
    <div id="arrGrid" class="arr-grid"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
const CHOCOLATE_API_URL = 'https://script.google.com/macros/s/AKfycbznLqWonLj9K1NR0kb3KfzZcSTxbxCMEJJS9CQFYd6GYcGPv9Alwk2dO4mpjwxGVg/exec';

function addItemRow(name, qty){
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `<input type="text" class="item-name" placeholder="Chocolate name" value="${name||''}">
    <input type="number" class="item-qty" placeholder="Qty" min="1" value="${qty||''}">
    <button type="button" class="remove-item" aria-label="Remove">✕</button>`;
  row.querySelector('.remove-item').addEventListener('click', ()=> row.remove());
  document.getElementById('itemRows').appendChild(row);
}
document.getElementById('addItemBtn').addEventListener('click', ()=> addItemRow());
addItemRow(); addItemRow();

function showMsg(text, isError){
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'error' : 'success');
}

async function loadArrangements(){
  const grid = document.getElementById('arrGrid');
  const token = window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';
  try{
    const res = await fetch(CHOCOLATE_API_URL + '?action=getArrangements&token=' + encodeURIComponent(token));
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error(data.error || 'Failed to load');
    if(!data.length){ grid.innerHTML = '<div class="empty">Wala pang arrangement na naka-record. Idagdag ang una sa itaas!</div>'; return; }
    grid.innerHTML = data.map(a => `
      <div class="arr-card">
        <h3>${a.arrangementName}</h3>
        <div class="by">👤 ${a.createdBy || 'Unknown'} · ${new Date(a.createdDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div>
        <ul>${a.items.map(it => `<li>${it.qty}x ${it.chocolateName}</li>`).join('')}</ul>
        ${a.notes ? `<div class="notes">${a.notes}</div>` : ''}
      </div>
    `).join('');
  }catch(e){
    grid.innerHTML = '<div class="empty">Could not load arrangements — check your connection.</div>';
  }
}
loadArrangements();

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const arrangementName = document.getElementById('arrName').value.trim();
  const createdBy = document.getElementById('arrCreator').value.trim();
  const notes = document.getElementById('arrNotes').value.trim();
  const items = Array.from(document.querySelectorAll('.item-row')).map(row => ({
    chocolateName: row.querySelector('.item-name').value.trim(),
    qty: Number(row.querySelector('.item-qty').value) || 0
  })).filter(it => it.chocolateName && it.qty > 0);

  if(!arrangementName){ showMsg('Kailangan ng pangalan ng arrangement.', true); return; }
  if(!items.length){ showMsg('Kailangan ng kahit isang chocolate na may quantity.', true); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const token = window.LALABELLA_TOKEN || sessionStorage.getItem('lalabellaToken') || localStorage.getItem('lalabellaToken') || '';

  try{
    const params = new URLSearchParams({
      action: 'addArrangement', arrangementName, createdBy, notes,
      items: JSON.stringify(items), token
    });
    const res = await fetch(CHOCOLATE_API_URL + '?' + params.toString());
    const data = await res.json();
    if(!data.success){ showMsg(data.error || 'Failed to save.', true); btn.disabled=false; btn.textContent='Save Arrangement'; return; }
    showMsg('Naka-save na ang arrangement!', false);
    document.getElementById('arrName').value = '';
    document.getElementById('arrCreator').value = '';
    document.getElementById('arrNotes').value = '';
    document.getElementById('itemRows').innerHTML = '';
    addItemRow(); addItemRow();
    loadArrangements();
  }catch(e){
    showMsg('Connection error — check your connection.', true);
  }
  btn.disabled = false; btn.textContent = 'Save Arrangement';
});
</script>
</body>
</html>
