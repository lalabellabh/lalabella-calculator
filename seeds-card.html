<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seeds of Success Card – Lalabella</title>
<script src="shared/config.js"></script>
<script src="shared/theme.js"></script>
<script src="auth-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#1f8a8a; --teal-dark:#166b6b; --ink:#2a2a2a; --paper:#fbf4e6;
    --line:#e8d9bf; --muted:#7a7266; --bg:#f3efe8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink)}

  /* ---------- controls ---------- */
  .top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e6e0d6;
       padding:10px 14px;display:flex;align-items:center;gap:10px}
  .top a{color:var(--teal);text-decoration:none;font-weight:700;font-size:15px}
  .top h1{font-size:17px;margin:0;font-weight:700}
  .panel{max-width:760px;margin:14px auto;background:#fff;border-radius:14px;padding:16px;
         border:1px solid #e6e0d6}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .field{flex:1 1 220px;display:flex;flex-direction:column;gap:5px}
  .field.small{flex:0 1 130px}
  label{font-size:13px;font-weight:600;color:var(--muted)}
  input[type=text],select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #d8d0c2;
       border-radius:10px;background:#fff;width:100%}
  input[type=text]:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
  .checks{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:14px}
  .checks label{color:var(--ink);font-weight:600;display:flex;gap:6px;align-items:center}
  .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
  .primary{background:var(--teal);color:#fff}
  .primary:hover{background:var(--teal-dark)}
  .ghost{background:#efe9df;color:var(--ink)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .hint{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}


  /* ---------- burger menu (links come from shared/nav.js) ---------- */
  .nav-toggle{width:38px;height:38px;flex:0 0 38px;border-radius:10px;border:1px solid #e6e0d6;background:#fff;color:var(--teal);
       font-size:19px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav-toggle:hover{background:var(--teal);color:#fff}
  .nav-backdrop{position:fixed;inset:0;z-index:9205;background:rgba(22,70,70,.35);backdrop-filter:blur(3px);
       opacity:0;pointer-events:none;transition:opacity .2s ease}
  .nav-backdrop.show{opacity:1;pointer-events:auto}
  .side-drawer{position:fixed;top:0;left:0;bottom:0;width:min(310px,82vw);z-index:9206;background:#fdfbf7;
       border-right:1px solid #e6e0d6;box-shadow:12px 0 40px rgba(22,70,70,.18);transform:translateX(-100%);
       transition:transform .25s ease;padding:18px 14px 24px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .side-drawer.show{transform:translateX(0)}
  .side-drawer .hub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
  .side-drawer .hub-grid a{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:12px 4px;min-height:72px;
       font-size:11px;background:#fff;border:1px solid #e6e0d6}
  .side-drawer .hub-grid .hub-icon{font-size:20px}
  .side-drawer a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;
       font-size:14px;font-weight:700}
  .side-drawer a:hover{background:rgba(31,138,138,.10);color:var(--teal-dark)}
  .side-drawer a.active{background:var(--teal);color:#fff}
  .side-drawer .drawer-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:10px 12px 4px}

  /* ---------- A4 sheet (all sizes in mm) ---------- */
  .stage{padding:0 10px 40px;display:flex;justify-content:center;overflow:hidden}
  .sheet-wrap{transform-origin:top center}
  .sheet{position:relative;width:210mm;height:297mm;background:#fff;
         box-shadow:0 2px 12px rgba(60,40,10,.15)}

  .slot{position:absolute}
  .slot.p{width:50mm;height:77mm}
  .slot.l{width:77mm;height:50mm}

  .card{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* name sits on the ruled line under "from:" */
  .name{position:absolute;left:14.5mm;width:30.5mm;top:50.4mm;height:6.9mm;
        display:flex;align-items:center;justify-content:safe center;
        font-family:'Gochi Hand','Comic Sans MS',cursive;color:#262626;
        font-size:5.5mm;line-height:1;white-space:nowrap;overflow:hidden;
        text-align:center;outline:none;border-radius:1mm}
  /* landscape: same spot on the card, turned with the art */
  .slot.l .name{left:38.65mm;top:16.8mm;transform:rotate(-90deg)}
  .name:empty::before{content:attr(data-ph);color:#c9bba4}
  .editing .name{cursor:text}
  .editing .name:hover,.editing .name:focus{background:rgba(31,138,138,.10)}

  /* ---------- print ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    .top,.panel,.nav-backdrop,.side-drawer{display:none!important}
    .stage{padding:0;overflow:visible;display:block}
    .sheet-wrap{transform:none!important;height:auto!important}
    html,body{width:210mm;height:297mm;overflow:hidden}
    .sheet{box-shadow:none;height:296mm;overflow:hidden}
    /* landscape: same spot on the card, turned with the art */
  .slot.l .name{left:38.65mm;top:16.8mm;transform:rotate(-90deg)}
  .name:empty::before{content:''}
    .editing .name:hover,.editing .name:focus{background:none}

<body>

<div class="top">
  <button class="nav-toggle" id="navToggle" aria-label="Open menu">☰</button>
  <a href="javascript:history.back()" aria-label="Back">‹ Back</a>
  <h1>Seeds of Success card</h1>
</div>
<div class="nav-backdrop" id="navBackdrop"></div>
<nav class="side-drawer" id="sideDrawer">
  <div data-lb-menu data-hub-class="hub-grid" data-title-class="drawer-title"></div>
</nav>
<script src="shared/nav.js"></script>
<script>
(function(){
  var t=document.getElementById('navToggle'),d=document.getElementById('sideDrawer'),b=document.getElementById('navBackdrop');
  function close(){d.classList.remove('show');b.classList.remove('show')}
  t.addEventListener('click',function(){d.classList.toggle('show');b.classList.toggle('show')});
  b.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
})();
</script>

<div class="panel">
  <div class="row">
    <div class="field">
      <label for="allName">Name for all cards</label>
      <input type="text" id="allName" placeholder="e.g. Ms. Sara" maxlength="40" autocomplete="off">
    </div>
    <div class="field small">
      <label for="count">Cards to print</label>
      <select id="count"></select>
    </div>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="perCard"> Different name per card</label>
    <label><input type="checkbox" id="cutLines" checked> Show cut lines</label>
  </div>
  <p class="hint" id="perHint" hidden>Tap a card's name on the sheet below to type a different name for that card.</p>
  <div class="btns">
    <button class="primary" id="printBtn">Print</button>
    <button class="ghost" id="clearBtn">Clear names</button>
  </div>
  <p class="hint">Card size 5 × 7.7 cm, 14 per A4. In the print dialog set paper to A4, scale 100% (Actual size), margins None.</p>
</div>

<div class="stage">
  <div class="sheet-wrap" id="wrap">
    <div class="sheet cut" id="sheet"></div>
  </div>
</div>

<script>
(function(){
  // Layout in mm: 12 portrait (4 x 3) + 2 landscape under them
  var MX = 5, MY = 5, W = 50, H = 77;
  var slots = [];
  for (var r = 0; r < 3; r++)
    for (var c = 0; c < 4; c++)
      slots.push({t:'p', x: MX + c*W, y: MY + r*H});
  var ly = MY + 3*H + 4;                // 240mm
  var lx = (210 - 2*H) / 2;             // centred pair
  slots.push({t:'l', x: lx,     y: ly});
  slots.push({t:'l', x: lx + H, y: ly});

  var sheet = document.getElementById('sheet');
  var allName = document.getElementById('allName');
  var perCard = document.getElementById('perCard');
  var countSel = document.getElementById('count');
  var names = [];

  slots.forEach(function(s, i){
    var slot = document.createElement('div');
    slot.className = 'slot ' + s.t;
    slot.style.left = s.x + 'mm';
    slot.style.top = s.y + 'mm';
    slot.innerHTML = '<div class="card"><div class="name" data-ph="Name" spellcheck="false"></div></div>';
    sheet.appendChild(slot);
    var n = slot.querySelector('.name');
    n.addEventListener('input', function(){ fit(n); });
    n.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); n.blur(); } });
    n.addEventListener('paste', function(e){
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g,' ');
      document.execCommand('insertText', false, t);
    });
    names.push(n);
  });

  for (var k = 14; k >= 1; k--) {
    var o = document.createElement('option'); o.value = k; o.textContent = k; countSel.appendChild(o);
  }

  // shrink long names so they stay on the line
  function fit(el){
    var size = 5.5;                               // mm
    el.style.fontSize = size + 'mm';
    while (el.scrollWidth > el.clientWidth + 1 && size > 2.2) {
      size -= 0.2; el.style.fontSize = size + 'mm';
    }
  }
  function fitAll(){ names.forEach(fit); }

  function applyAll(){
    var v = allName.value.trim();
    names.forEach(function(n){ n.textContent = v; fit(n); });
  }
  allName.addEventListener('input', applyAll);

  perCard.addEventListener('change', function(){
    var on = perCard.checked;
    sheet.classList.toggle('editing', on);
    document.getElementById('perHint').hidden = !on;
    names.forEach(function(n){ n.contentEditable = on ? 'true' : 'false'; });
  });

  document.getElementById('cutLines').addEventListener('change', function(e){
    sheet.classList.toggle('cut', e.target.checked);
  });

  countSel.addEventListener('change', function(){
    var c = +countSel.value;
    sheet.querySelectorAll('.slot').forEach(function(s, i){ s.classList.toggle('off', i >= c); });
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    allName.value = ''; names.forEach(function(n){ n.textContent = ''; fit(n); });
  });

  document.getElementById('printBtn').addEventListener('click', function(){
    document.activeElement && document.activeElement.blur();
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){
      fitAll(); window.print();
    });
  });

  // scale the A4 preview to fit the screen
  var wrap = document.getElementById('wrap');
  function scale(){
    var pxW = sheet.offsetWidth, pxH = sheet.offsetHeight;
    var avail = Math.min(document.documentElement.clientWidth - 20, 900);
    var s = Math.min(1, avail / pxW);
    wrap.style.transform = 'scale(' + s + ')';
    wrap.style.height = (pxH * s) + 'px';
  }
  window.addEventListener('resize', scale);
  scale();
  if (document.fonts) document.fonts.ready.then(fitAll);
})();
</script>
</body>
</html>
